<header class="header">
    <nav class="nav">
        <div class="logo"><a href="{{ "" | absLangURL }}">{{ site.Title }}</a></div>
        <ul id="menu">
            {{- range site.Menus.main }}
            <li><a href="{{ .URL | absLangURL }}"{{ if $.IsMenuCurrent "main" . }} class="active" aria-current="page"{{ end }}>{{ .Name }}</a></li>
            {{- end }}
        </ul>
    </nav>
</header>
