<div class="iframe-container">
    <!-- 操作条 -->
    <div class="iframe-toolbar">
        <div class="toolbar-buttons"><!-- 按钮移到标题后面，通过CSS实现右对齐 -->
            <button class="open-new-tab" data-src="{{ .Get "src" }}">
                新页面打开
            </button>
            <button class="fullscreen-btn" data-src="{{ .Get "src" }}">
                全屏
            </button>
        </div>
        
    </div>
    
    <!-- iframe 内容 -->
    <iframe 
        src="{{ .Get "src" }}" 
        {{ with .Get "width" }}width="{{ . }}"{{ end }} 
        {{ with .Get "height" }}height="{{ . }}"{{ end }} 
        {{ with .Get "class" }}class="{{ . }}"{{ end }} 
        frameborder="0" 
        allowfullscreen 
        loading="lazy"
    ></iframe>
</div>

<!-- 操作脚本 -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.open-new-tab').forEach(button => {
        button.addEventListener('click', function() {
            const url = this.getAttribute('data-src');
            if (url) {
                window.open(url, '_blank');
            }
        });
    });
});
document.addEventListener('DOMContentLoaded', function() {
    // 为所有全屏按钮添加事件监听
    document.querySelectorAll('.fullscreen-btn').forEach(button => {
        const container = button.closest('.iframe-container');
        const iframe = container.querySelector('iframe');
        const icon = button.querySelector('i');
        let originalStyles = null;
        
        // 保存原始样式
        function saveOriginalStyles() {
            return {
                position: container.style.position || '',
                top: container.style.top || '',
                left: container.style.left || '',
                width: container.style.width || '',
                height: container.style.height || '',
                zIndex: container.style.zIndex || '',
                borderRadius: container.style.borderRadius || '',
                margin: container.style.margin || '',
                iframeHeight: iframe.style.height || ''
            };
        }
        
        // 应用全屏样式（视口大小）
        function applyFullscreenStyles() {
            // 保存原始样式
            originalStyles = saveOriginalStyles();
            
            // 获取页面滚动位置，确保全屏时从顶部开始
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            
            // 应用全屏样式（占满视口）
            container.style.position = 'fixed';
            container.style.top = '0';
            container.style.left = '0';
            container.style.width = '100vw';
            container.style.height = '100vh';
            container.style.zIndex = '9999';
            container.style.borderRadius = '0';
            container.style.margin = '0';
            iframe.style.height = '100%';
            
            // 更改图标
            icon.classList.remove('fa-expand');
            icon.classList.add('fa-compress');
            
            // 阻止页面滚动
            document.body.style.overflow = 'hidden';
        }
        
        // 恢复原始样式
        function restoreOriginalStyles() {
            if (!originalStyles) return;
            
            // 恢复容器样式
            container.style.position = originalStyles.position;
            container.style.top = originalStyles.top;
            container.style.left = originalStyles.left;
            container.style.width = originalStyles.width;
            container.style.height = originalStyles.height;
            container.style.zIndex = originalStyles.zIndex;
            container.style.borderRadius = originalStyles.borderRadius;
            container.style.margin = originalStyles.margin;
            
            // 恢复iframe样式
            iframe.style.height = originalStyles.iframeHeight;
            
            // 恢复图标
            icon.classList.remove('fa-compress');
            icon.classList.add('fa-expand');
            
            // 恢复页面滚动
            document.body.style.overflow = '';
            
            originalStyles = null;
        }
        
        // 检查是否处于全屏状态
        function isFullscreen() {
            return container.style.position === 'fixed' && 
                   container.style.width === '100vw' && 
                   container.style.height === '100vh';
        }
        
        // 按钮点击事件
        button.addEventListener('click', () => {
            if (!isFullscreen()) {
                applyFullscreenStyles();
            } else {
                restoreOriginalStyles();
            }
        });
        
        // 监听ESC键，退出全屏
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isFullscreen()) {
                restoreOriginalStyles();
            }
        });
    });
});
</script>

<!-- 样式定义 - 重点修改了.toolbar的布局 -->
<style>
.iframe-container {
    position: relative;
    margin: 1rem 0;
    border: 1px solid #eaeaea;
    border-radius: 4px;
    overflow: hidden;
}

.iframe-toolbar {
    display: flex;
    justify-content: flex-end;
    background-color: #f8f9fa;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid #eaeaea;
}


.open-new-tab,.fullscreen-btn {
    padding: 0.375rem 0.75rem;
    background-color: rgb(30, 30, 30);
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.875rem;
    transition: background-color 0.2s;
}


.iframe-container iframe {
    width: 100%;
    min-height: 400px;
}
</style>
