{{- $id := printf "me_%d" .Ordinal -}}
{{- $height := default "520px" (.Get "height") -}}
{{- $src := .Inner | strings.TrimSpace -}}

<div id="{{ $id }}" class="mindelixir-container" style="height: {{ $height }}; width: 100%;"></div>

<script type="application/json" id="{{ $id }}_src">
{{ $src | jsonify }}
</script>

<script>
(function () {
  // MindElixir 来自 iife 全局变量（MindElixir）
  if (typeof MindElixir === "undefined") {
    console.error("MindElixir not loaded. Check your CDN script tag.");
    return;
  }

  const hostId = "{{ $id }}";
  let raw = JSON.parse(document.getElementById(hostId + "_src").textContent);

  function genId() {
    return "n_" + Math.random().toString(16).slice(2) + Date.now().toString(16);
  }

  // Markdown（缩进列表）-> 树
  // 语法约定：
  // - 用 "-" "*" "+" 开头；缩进用 2 空格或 tab 均可（同一段里尽量一致）
  // - 支持超链接： "标题 -> https://example.com"
  function parseMindMarkdown(md) {
    const lines = md
      .split(/\n/)
      .map(l => l.replace(/\s+$/g, ""))
      .filter(l => l.trim().length > 0);
    console.log(lines)

    const stack = []; // { level, node }
    let root = null;

    for (const line of lines) {
      const m = line.match(/^(\s*)([-*+])\s+(.*)$/);
      if (!m) continue;

      const indent = m[1].replace(/\t/g, "  ").length; // tab 视作 2 空格
      const level = Math.floor(indent / 2);
      let text = m[3].trim();

      let hyperLink = null;
      const linkMatch = text.match(/^(.*?)(?:\s*->\s*)(https?:\/\/\S+)\s*$/);
      if (linkMatch) {
        text = linkMatch[1].trim();
        hyperLink = linkMatch[2].trim();
      }
      const node = { id: genId(), topic: text, children: [] };

      // 解析图片标记：[img:/path/a.png,160,120]
      const imgMatch = text.match(/\!\[\]\(\s*([^,\]]+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)\s*$/i);
      if (imgMatch) {
        const url = imgMatch[1].trim();
        const width = Number(imgMatch[2]);
        const height = Number(imgMatch[3]);
        text = text.replace(imgMatch[0], "").trim();
        node.topic=""
        node.image = { url, width, height }; // Mind Elixir 的 image 字段 :contentReference[oaicite:1]{index=1}
      }

      if (hyperLink) node.hyperLink = hyperLink;

      if (!root) {
        root = node;
        stack.push({ level: 0, node: root });
        continue;
      }

      while (stack.length && stack[stack.length - 1].level >= level) stack.pop();
      const parent = stack.length ? stack[stack.length - 1].node : root;
      parent.children.push(node);
      stack.push({ level, node });
    }

    return root || { id: genId(), topic: "Empty", children: [] };
  }

  raw = JSON.parse(raw)
  console.log(raw)

  const root = parseMindMarkdown(raw);

  console.log(root)


  // Mind Elixir 数据结构：节点核心字段 topic/id/children（更多字段可选）:contentReference[oaicite:3]{index=3}

  // 按官方导出格式构造 data（最小可用集）:contentReference[oaicite:2]{index=2}
  const data = {
    nodeData: {
      id: root.id,
      topic: root.topic,
      root: true,
      children: root.children || [],
    },
    arrows: [],
    summaries: [],
    direction: 2, // 可选：2 通常是双向/左右展开（不填也行）
  };

  console.log(data)

  const ME = window.MindElixir?.default ?? window.MindElixir; // 关键：兼容 default 导出 :contentReference[oaicite:3]{index=3}

  if (typeof ME !== "function") {
    console.error("MindElixir loaded but not a constructor. window.MindElixir =", window.MindElixir);
    return;
  }

  const mind = new ME({ el: "#" + hostId });

  mind.init(data);
})();
</script>
