<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- 暖色像素风背景 -->
  <rect x="2" y="0" width="12" height="1" fill="#F3EDE5"/>
  <rect x="1" y="1" width="14" height="1" fill="#F3EDE5"/>
  <rect x="0" y="2" width="16" height="12" fill="#F3EDE5"/>
  <rect x="1" y="14" width="14" height="1" fill="#F3EDE5"/>
  <rect x="2" y="15" width="12" height="1" fill="#F3EDE5"/>

  <!-- 火箭鼻锥 -->
  <rect x="7" y="1" width="2" height="1" fill="#C4704A"/>
  <rect x="6" y="2" width="4" height="1" fill="#C4704A"/>

  <!-- 火箭机身 -->
  <rect x="5" y="3" width="6" height="2" fill="#FAF9F5"/>

  <!-- 舷窗行 -->
  <rect x="5" y="5" width="2" height="2" fill="#FAF9F5"/>
  <rect x="7" y="5" width="2" height="2" fill="#6B8DA0"/>
  <rect x="9" y="5" width="2" height="2" fill="#FAF9F5"/>

  <!-- 下段机身 -->
  <rect x="5" y="7" width="6" height="2" fill="#FAF9F5"/>

  <!-- 机身条纹装饰 -->
  <rect x="5" y="8" width="6" height="1" fill="#E8E0D8"/>

  <!-- 左侧尾翼 -->
  <rect x="3" y="8" width="2" height="1" fill="#C4704A"/>
  <rect x="2" y="9" width="3" height="1" fill="#C4704A"/>
  <rect x="2" y="10" width="2" height="1" fill="#D4845A"/>

  <!-- 右侧尾翼 -->
  <rect x="11" y="8" width="2" height="1" fill="#C4704A"/>
  <rect x="11" y="9" width="3" height="1" fill="#C4704A"/>
  <rect x="12" y="10" width="2" height="1" fill="#D4845A"/>

  <!-- 底部裙边 -->
  <rect x="5" y="9" width="6" height="1" fill="#E8E0D8"/>

  <!-- 火焰 -->
  <rect x="6" y="10" width="4" height="1" fill="#D4845A"/>
  <rect x="7" y="11" width="2" height="1" fill="#E8A070"/>
  <rect x="6" y="12" width="1" height="1" fill="#E8A070" opacity="0.6"/>
  <rect x="9" y="12" width="1" height="1" fill="#E8A070" opacity="0.6"/>
  <rect x="7" y="12" width="2" height="1" fill="#D4845A"/>
  <rect x="7" y="13" width="1" height="1" fill="#E8A070" opacity="0.4"/>
  <rect x="8" y="13" width="1" height="1" fill="#E8A070" opacity="0.4"/>
</svg>
