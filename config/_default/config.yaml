baseURL: https://blog.ans20xx.com
title: 安橙的博客
theme: PaperMod
pagination:
  pagerSize: 10
enableEmoji: true
enableGitInfo: false
summaryLength: 20

defaultContentLanguage: zh
hasCJKLanguage: true # Set `true` for Chinese/Japanese/Korean.
defaultContentLanguageInSubdir: false

# Uncomment for google analytics
# googleAnalytics: UA-123-45
markup:
  # Do not modify markup.highlight
  highlight:
    style: solarized-light
    codeFences: true
    guessSyntax: true
    lineNos: true
    noClasses: true
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false
  goldmark:
    renderer:
      unsafe: true

# taxonomies:
#   category: categories
#   tag: tags
#   series: series

minify:
  tdewolff:
    css:
      keepCSS2: true
    html:
      keepQuotes: true

build:
  useResourceCacheWhen: always

params:
  assets:
    favicon: /img/ancheng-favicon.svg
    disableHLJS: true
  homeInfoParams:
    Title: "安橙的博客"
    Content: >
      👋 欢迎来到我的博客
  mainSections:
    - posts
  ShowToc: true # 显示目录
  TocOpen: true # 自动展开目录
  ShowCodeCopyButtons: true # 代码块复制按钮
  ShowCodeLang: true # 语言显示
  ShowMacDots: true # Mac色块
  fancybox: true
  fuseOpts:
    isCaseSensitive: false
    includeMatches: true
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 2
    limit: 20
    keys: ["title", "permalink", "summary", "content"]
  hideAuthor: true
  author:
    name: "An"

outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search