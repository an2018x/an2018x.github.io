baseURL: https://blog.ans20xx.com
title: 安橙的博客
theme: PaperMod
pagination:
  pagerSize: 10
enableEmoji: false
enableGitInfo: false
summaryLength: 20

defaultContentLanguage: zh
hasCJKLanguage: true # Set `true` for Chinese/Japanese/Korean.
defaultContentLanguageInSubdir: false

# Uncomment for google analytics
# googleAnalytics: UA-123-45
markup:
  highlight:
    codeFences: false
    guessSyntax: false
    lineNos: false
    noClasses: false
  tableOfContents:
    startLevel: 1
    endLevel: 4
    ordered: false
  goldmark:
    renderer:
      unsafe: true

# taxonomies:
#   category: categories
#   tag: tags
#   series: series

minify:
  tdewolff:
    css:
      version: 2
    html:
      keepQuotes: true

build:
  useResourceCacheWhen: always

# Hugo 0.155+ tightened security: the default `security.allowContent`
# whitelist contains `! ^text/html$`, which DENIES raw HTML files in
# content/. This site keeps many .html pages under content/posts/ that
# carry full front matter (cc-day*.html, vscode-day*.html, day*.html),
# so we override the whitelist to permit every text/* content format
# without the deny rule.
security:
  allowContent:
    - "^application/(javascript|json|octet-stream|toml|yaml|x-pandoc)$"
    - "^text/(asciidoc|html|markdown|org|rst|x-pandoc|yaml)$"

params:
  assets:
    disableHLJS: true
  homeInfoParams:
    Title: "安橙的博客"
    Content: >
      👋 欢迎来到我的博客
  mainSections:
    - posts
  ShowToc: true # 显示目录
  ShowCodeCopyButtons: false
  disableScrollToTop: true
  hideAuthor: true
  author:
    name: "An"

outputs:
  home:
    - HTML
    - RSS
  section:
    - HTML
  taxonomy:
    - HTML
  term:
    - HTML

services:
  rss:
    limit: 20
