baseURL: https://blog.ans20xx.com
title: 安橙的博客
theme: PaperMod
pagination:
  pagerSize: 10
copyright: >
  &copy; 2022 <a href="https://www.ans20xx.com/">安橙</a>
enableEmoji: true
enableGitInfo: false
summaryLength: 75

defaultContentLanguage: zh
hasCJKLanguage: true # Set `true` for Chinese/Japanese/Korean.
defaultContentLanguageInSubdir: false

# Uncomment for google analytics
# googleAnalytics: UA-123-45

markup:
  # Do not modify markup.highlight
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: true
    noClasses: false
    style: monokai
  tableOfContents:
    startLevel: 2
    endLevel: 6
    ordered: false
  goldmark:
    renderer:
      unsafe: true

taxonomies:
  category: categories
  tag: tags
  series: series
  author: authors

build:
  useResourceCacheWhen: always

params:
  assets:
    favicon: /img/icon.png
  homeInfoParams:
    Title: "安橙的博客"
    Content: >
      👋 欢迎来到我的博客
  ShowToc: true # 显示目录
  TocOpen: true # 自动展开目录