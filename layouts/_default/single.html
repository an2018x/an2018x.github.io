{{- define "main" }}
<article class="post-single">
    <header class="post-header">
        <h1 class="post-title">{{ .Title }}</h1>
        {{- with .Description }}<div class="post-description">{{ . }}</div>{{ end }}
        {{- if not .Date.IsZero }}<time class="post-meta" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>{{ end }}
    </header>
    <details class="toc" open><summary>目录</summary>{{ if findRE "<h[1-4]" .Content }}{{ .TableOfContents }}{{ else }}<nav id="TableOfContents"><ul><li><a href="#post-content">正文</a></li></ul></nav>{{ end }}</details>
    <div id="post-content" class="post-content">{{ .Content }}</div>
    {{- with .GetTerms "tags" }}<footer class="post-footer"><ul class="post-tags">{{ range . }}<li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>{{ end }}</ul></footer>{{ end }}
</article>
{{- end }}
