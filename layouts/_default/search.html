{{- define "main" }}
<header class="page-header"><h1>{{ .Title }}</h1><p class="post-description">搜索文章标题或标签。</p></header>
<input id="searchInput" autofocus placeholder="{{ .Params.placeholder }}" aria-label="搜索" type="search" autocomplete="off">
<ul id="searchResults">{{ range where site.RegularPages "Section" "posts" }}{{ $terms := delimit (.Params.tags | default slice) " " }}<li class="post-entry" data-search="{{ lower (printf "%s %s" .Title $terms) }}"><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>{{ end }}</ul>
<script>const q=document.querySelector('#searchInput'),items=document.querySelectorAll('#searchResults li');q.addEventListener('input',()=>{const value=q.value.trim().toLocaleLowerCase();for(const item of items)item.hidden=value&&!item.dataset.search.includes(value)})</script>
{{- end }}
