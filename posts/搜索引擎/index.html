规则，中文依赖分词器）\\n                - Token Filter\\n                    - stopword（停用词）\\n                    - stemming/lemmatization（词干/词形还原）\\n                    - synonym（同义词）\\n                    - ngram（前缀/模糊）\\n        - 倒排索引相关名词\\n            - Term（词项）：token 的规范化结果\\n            - Posting list：某 term 出现在那些 doc 中的列表\\n            - DocID：文档编号\\n            - tf(term frequency)：该词在 doc 内出现的次数\\n            - df(document frequency)：包含该词的 doc 数\\n            - idf(inverse document frequency)：词的区分能力\\n    - 相关性：从 TF-IDF 到 BM25\\n        - TF-IDF 的直觉\\n            - 核心思想\\n                - 一个词在文档里出现的越多（tf 越大）-\\u003e 越相关\\n                - 一个词在整个语料越稀有（df 越小/idf 越大）-\\u003e 越能区分文档\\n            - tf = count(t in d)\\n            - idf = log(N/df)\\n            - TF-IDF 容易出现两类不稳\\n                - tf 线性增长导致刷词得分优势\\n                - 文档长短差异导致长文天然占优势\\n        - BM25：工程默认答案\\n            - 核心思想\\n                - tf 饱和：词出现 1-\\u003e2 词提升很大，20-\\u003e21 词提升小（防刷词）\\n                - 长度归一化：长文不会因为词多天然优势\\n                - 得分计算\\n                    - score(d, q) = Σ[ idf(t) * ( tf*(k1+1) / ( tf + k1*(1 - b + b*|d|/avgdl ))) ]\\n                    - k1：控制 tf 饱和速度\\n                    - b：控制长度归一化强度\\n                    - |d|/avgdl：文档长度与平均长度的比例\\n        - 字段权重\\n            - 现实检索几乎都是多字段：title/body/tags\\n            - 常见做法：对字段分别计算 BM25，再加权组合\\n    - 查询模型\\n        - 布尔检索\\n            - AND/OR/NOT，精准过滤\\n            - 工程上常用于 filter（不参与打分）而非主排序）\\n            - filter 可缓存，query 参与打分不易缓存\\n        - 向量空间模型\\n            - doc/query 看作高维向量，维度是 term，相似度用 cosine\\n            - sim = cos(q,d)\\n        - 概率检索\\n            - BM25 术语概率检索思想的经典落地\""</script><script>(function(){if(typeof MindElixir=="undefined"){console.error("MindElixir not loaded. Check your CDN script tag.");return}const n="me_0";let e=JSON.parse(document.getElementById(n+"_src").textContent);function s(){return"n_"+Math.random().toString(16).slice(2)+Date.now().toString(16)}function a(e){const o=e.split(       - 是什么\\n            - 按 docId 顺序存储某个字段的值（列式）\\n            - price、timestamp、category、keyword 字段\\n        - 排序聚合为什么不用倒排\\n            - 倒排是 term -\\u003e doc，适合检索；排序聚合需要 doc-\\u003efield value\\n            - doc values 提供了高效的按照 doc 读取字段值，同时适合磁盘顺序访问 + OS page cache\\n    - Segment\\n        - Segment 是什么\\n            - 一个 index 由多个 segment 组成\\n            - 每个 segment 内部包含：倒排、doc values、stored fields、norms 等文件\\n            - segment 一旦写出就不可变\\n        - 不可变的好处\\n            - 并发读及其简单：读线程不需要大锁，数据结构稳定\\n            - 缓存友好：文件内容不会变，OS cache 命中更稳定\\n            - 写入快：写在新 segment；避免原地更新导致随机写/锁竞争\\n            - 崩溃恢复快\""</script><script>(function(){if(typeof MindElixir=="undefined"){console.error("MindElixir not loaded. Check your CDN script tag.");return}const n="me_1";let e=JSON.parse(document.getElementById(n+"_src").textContent);function s(){return"n_"+Math.random().toString(16).slice(2)+Date.now().toString(16)}function a(e){const o=e.split(/\n/).map(e=>e.replace(/\s+$/g,"")).filter(e=>e.trim().length>0);console.log(o);const t=[];let n=null;for(const u of o){const r=u.match(/^(\s*)([-*+])\s+(.*)$/);if(!r)continue;const h=r[1].replace(/\t/g,"  ").length,d=Math.floor(h/2);let e=r[3].trim(),c=null;const l=e.match(/^(.*?)(?:\s*->\s*)(https?:\/\/\S+)\s*$/);l&&(e=l[1].trim(),c=l[2].trim());const i={id:s(),topic:e,children:[]},a=e.match(/!\[\]\(\s*([^,\]]+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)\s*$/i);if(a){const t=a[1].trim(),n=Number(a[2]),s=Number(a[3]);e=e.replace(a[0],"").trim(),i.topic="",i.image={url:t,width:n,height:s}}if(c&&(i.hyperLink=c),!n){n=i,t.push({level:0,node:n});continue}for(;t.length&&t[t.length-1].level>=d;)t.pop();const m=t.length?t[t.length-1].node:n;m.children.push(i),t.push({level:d,node:i})}return n||{id:s(),topic:"Empty",children:[]}}e=JSON.parse(e),console.log(e);const t=a(e);console.log(t);const o={nodeData:{id:t.id,topic:t.topic,root:!0,children:t.children||[]},arrows:[],summaries:[],direction:2};console.log(o);const i=window.MindElixir?.default
