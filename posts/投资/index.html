- 投资基础认知
    - 什么是投资
        - 储蓄
            - 把钱存起来，追求安全，收益很低
            - 保住本金，几乎没有风险，也跑不赢通胀
        - 投资
            - 将钱投入到能长期产生回报的资产中
            - 有逻辑依据，关注长期价值、承担合理风险以获取合理回报
        - 投机
            - 试图通过短期价格波动赚差价
            - 投机接近于赌方向，往往没有对资产本身价值的深入分析，风险很高
    - 资产与负债
        - 资产
            - 能把钱放进你口袋的东西
            - 买了一套房，每月收租金 3000 元
        - 负债
            - 从口袋里面掏钱的东西
            - 买了一套房，每月还房贷 8000 元
        - 资产和负债的区别在于是给你创造现金流还是消耗现金流
    - 复利的力量
        - 单利
            - 投入 10000，年化收益 10%，每年赚 1000，10 年后有 20000
        - 复利
            - 同样投入 10000，第一年 11000，第二年 12100，利息变成利息，十年后有 25937
            - 公式：终值 = 本金 x (1 + 收益率) ^ 年数
            - 重要的不是能赚多高的收益率，而是能让钱复利多长时间
    - 通货膨胀
        - 本质：同样一笔钱，买到的东西变少
        - CPI（消费者价格指数）：是通胀的衡量标准，追踪一篮子日常消费品的价格变化
        - 虽然 CPI 每年只有 2%-3%，但是实际感知到的通胀更高，房价、教育、医疗这些大头支出涨幅远超 CPI
        - 发生的原因
            - 货币超发，央行印了更多的钱，但是东西没多
            - 需求拉动或者成本推动，原材料涨价
        - 投资收益率必须跑赢通胀，否则财富实际上是缩水的
        - 实际收益率 = 名义收益率 - 通胀率
    - 风险与收益
        - 风险排序：银行存款->货币基金->国债->企业债券->债券基金->股票指数基金->个股->期货期权->加密货币
        - 系统性风险：整个市场的风险，比如经济衰退、金融危机、战争，所有资产都会跌
        - 非系统性风险：某个公司或行业特有的风险，可以通过分散投资来大幅降低风险
        - 分散投资能消除非系统性风险，无法消除系统性风险
    - 主要投资品种概览
        - 股票
            - 花钱买了一家公司的一小块所有权
            - 赚钱方式
                - 价差：50 块买入，80 块卖出
                - 分红：赚钱的公司把利润分一部分给股东，叫做股息或分红
                    - 银行股股价 5 元，每年每股分红 0.3 元，股息率就是 6%
            - 股票特点：长期收益潜力最高，但是短期波动大，适合长期持有
            - 市值：股价乘以总股数，代表市场认为这家公司值多少钱
            - 大盘股：指市值几百亿以上的公司，波动相对较小，比较稳
            - 小盘股：市值较小，波动大，涨跌剧烈
            - 涨跌停：A 股特有的规则，普通股票每天最多涨/跌 10%，创业板和科创板是 20%
        - 债券
            - 把钱借给别人，对方承诺按时还本付息
            - 发行方分类
                - 国债：政府发行，信用最高，基本不违约，但是收益率也最低
                - 地方政府和企业债：信用等级低于国债，利率会更高
                - 可转债：是债券但是可以在指定条件下转换成股票
            - 债券和利率是反向关系，市场利率上升，已发行债券的价格就下降
        - 基金
            - 基金的本质是众筹投资：很多人凑钱给基金经理，由他决定买什么
            - 基金购买的是基金经理帮忙搭配好的一篮子资产
            - 解决的问题
                - 钱少，买不了那么多股票来分散风险
                - 不专业，选股的事给专业的人做
            - 投资方向分类
                - 股票型基金
                - 债权型基金
                - 混合性基金
                - 货币基金
            - 管理方式分类
                - 主动性基金：基金尽力主动选择，管理费较高（1.2%-1.5%）
                - 被动型基金：直接复制某个指数的成分股，管理费很低（0.1%-0.5%）
                - 长期来看，大多数主动型基金经理跑不赢指数
            - 关注的核心指标
                - 费率
                - 规模
                - 历史业绩
                - 基金经理的从业年限和风格
        - ETF
            - 全称是“交易所交易基金“，可以理解为是一只可以像股票一样在交易所买卖的基金
            - 和普通基金的区别在交易方式上
                - 普通基金在支付宝或者银行 app 申购赎回，一天只有一个价格（收盘后结算），到账通常 T+1 或者更久
                - ETF 直接在股票交易软件里买卖，和股票一样实时报价、实时成交，流动性好的多
            - ETF 大多是被动型的，跟着一个指数
            - ETF 的费率很低
        - 大宗商品与加密货币
            - 大宗商品指的是黄金、白银、石油、铜、大豆这类标准化的原材料
            - 普通人参与大宗商品的方式是买黄金或者相关的 ETF
            - 黄金被称为避险资产，当股市暴跌，通胀飙升或地缘政治紧张，资金会涌入黄金避险，推高金价
            - 黄金不产生任何现金流，不付利息也不分红，长期收益率不如股票
            - 加密货币以比特币和以太坊为代表
                - 比特币的设计理念是总量固定 2100 万枚，不受任何政府控制的数字货币
                - 以太坊是一个可以运行智能合约的平台，ETH 是这个平台的燃料
            - 加密货币波动性极高，24 小时不间断交易，没有涨跌停限制，全球流通，机会和风险都极大
            - 新手建议只碰比特币和以太坊两个主流币
    - 开户与交易规则
        - 投资不同品种需要不同的账户
            - 证券账户是买卖股票和场内 ETF 的，需要在一家证券公司（券商）开户，开完后得到一个资金账户和股东账户
            - 基金账户是买场外基金用的，可以通过银行 APP、基金公司 APP、第三方平台
            - 加密货币账户需要在交易所注册
            - 银行账户是所有投资的资金中转站，证券账户需要绑定一张银行卡，通过银证转账把钱转进转出
        - 交易规则和费用
            - 交易时间
                - 交易时间是每个工作日的上午 9:30-11:30 和下午的 13:00-15:00
                - 9:15-9:25 是集合竞价时间，决定开盘价
                - 美股的交易时间换算成北京时间是晚上 21:30 到次日凌晨 4:00，冬令时推迟一个小时
                - 加密货币是 7x24h 全天候交易
            - 交易单位
                - A 股买入最少 100 股（一手），卖出没有这个限制
                - ETF 通常 100 份起买，但是有些券商支持拆零
            - 费用
                - 券商佣金
                    - 券商佣金是每次买卖股票或者 ETF 券商收的手续费，大概是万2.5-万 3，买卖各收一次
                    - 很多券商会有最低 5 元的门槛
                    - 开户的时候可以和客户经理谈佣金率，通常能谈到万 1.5 甚至更低
                - 印花税
                    - 是国家收的，目前税率是千分之 0.5，只在卖出股票时收
                - 过户费
                    - 很少，每 10 万收 1 元，可以忽略不计
                - 基金费用
                    - 申购费是买入时收，股票型基金 1.5%，第三方平台通常打一折只要 0.15%
                    - 赎回费根据持有时间不同，持有越久费率越低，超过一定时间免赎回费
                    - 管理费和托管费是每天从基金净值里扣，看到的基金收益已经扣过了
    - 读懂行情软件
        - 行情软件核心信息
            - 现价：这只股票此刻的交易价格，也叫最新价，几秒钟就会跳动一次
            - 涨跌幅：今天相比昨天收盘价涨了或跌了百分之几
            - 开盘价：今天第一笔交易的成交价，由早上 9:15-9:25 集合竞价决定
            - 收盘价：当天最后的价格，15:00 收盘时确定
            - 最高价和最低价：今天盘中达到的极端值
            - 成交量：今天到目前为止总共成交了多少股，成交量突然放大说明有大资金在行动，需要注意
            - 成交额：总共成交了多少钱
            - 换手率：今天成交的股数占这只股票总流通股数的百分比，换手率 1-3% 正常，5% 比较活跃，10% 非常热烈
            - 总市值：股价乘以总股本，代表市场给这家公司的总定价
            - 流通市值：市场上能自由买卖的那部分股份，因为很多大股东的股份是有锁定期的
        - K 线图
            - 是 200 多年前日本米商发明的价格记录方法
            - 每一根 K 线代表一个时间周期内的四个价格：开盘价、收盘价、最高价、最低价
            - 如果收盘价高于开盘价，说明这个周期价格涨了，K 线画成红色，中间的实心方块叫做阳线
            - 方块的下边缘是开盘价，上边缘是收盘价
            - 如果收盘价低于开盘价，说明价格低了，画成绿色，叫阴线
            - 方块上下伸出的线叫做影线，上影线的顶端是最高价，下影线的底段是最低价
            - 上影线越长说明上方抛压越大，价格冲高后被打回来了
            - 下影线越长说明下方有支撑，价格跌下去又被拉起来了
            - 方块越长说明开盘价和收盘价差距越大，当天的趋势越明显
            - 方块很小说明多空双方力量接近，市场在犹豫
            - 日 K 代表一天，周 K 代表一周
            - K 线下方还有成交量柱，红色柱子对应上涨，绿色柱子对应下跌
            - 价格上涨同时成交量放大，说明涨势有资金支撑，比较健康
            - 价格上涨但是成交量萎缩，可能是虚涨，持续性存疑
        - 均线初识
            - K 线图上叠加的几条彩色的曲线就是均线（MA）
            - 均线把过去 N 天的收盘价求平均值连成一条线
            - MA5 是 5 日均线，反映最近一周的平均成本
            - MA20 是 20 日均线，反映一个月的平均成本
            - MA60 是 60 日均线，代表一个季度
            - MA250(年线)，代表一年
            - 基本逻辑
                - 股价在均线上方，代表近期买入的人平均是赚钱的，市场情绪偏乐观
                - 股价在均线下方，代表大部分人被套，情绪偏悲观
                - 短期均线在长期均线上方被视为上升趋势，否则是下降趋势
    - 什么是指数
        - 指数的本质
            - 指数就是从市场里面挑出一篮子股票，按照某种规则计算出来的一个数字，用来代表这一篮子股票的整体表现
            - 指数本身不能买卖，它只是一个统计数字
            - 可以通过购买跟踪指数的 ETF 或者指数基金来间接买入指数
            - 指数由专门的指数公司编制和维护，中国由中证指数公司编制，美国由标普道琼斯、MSCI等公司编制
            - 指数会定期调整成分股，把不合格的公司踢出去，把新的优质公司纳入进来
            - 指数自带优胜劣汰，长期看质量不会越来越差
        - 核心指数
            - 中国市场
                - 上证指数
                    - 涵盖了上海证券交易所的所有股票
                    - 按总市值加权，包含大量银行、石油等大盘股
                    - 包含所有股票不含优劣
                - 沪深 300 指数
                    - 从沪深两市挑出市值最大、流动性最好的 300 只股票，按自由市值加权
                    - 覆盖了 A 股越 6 成的总市值，是公认的最能代表 A 股大盘蓝筹表现的指数
                - 中证 500 指数
                    - 排除沪深 300 之后的 500 只中等市值股票
                    - 代表中盘成长股的表现
                    - 沪深 300 代表大公司，中证 500 代表小公司
                - 创业板指数
                    - 从创业板挑出 100 只市值最大的股票，科技和医药公司占比高，波动比沪深大，弹性也更强
            - 美国市场
                - 标普 500 指数
                    - 由美国市值最大的 500 家公司组成，覆盖每股 80% 的总市值
                    - 长期年化收益率大概在 10% 左右
                - 纳斯达克 100 指数
                    - 从纳斯达克交易所挑出 100 家最大的非金融公司，科技股权重极高
                - 道琼斯工业指数
                    - 只包含 30 只股票，用的是价格加权，专业性不高，但是历史悠久
            - 香港市场
                - 恒生指数
            - 日本市场
                - 日经 225 指数
            - 全球市场
                - MSCI 全球指数
                - 富时全球指数
    - 什么是 ETF
        - ETF 的运作机制
            - ETF 背后有一家交易公司管理
            - 基金公司的任务是买入指数所有成分股，按照指数中每只股票的权重来配置
            - 交易所买到的 ETF 份额，代表了这一篮子股票的一小部分所有权
            - ETF 价格会紧贴它所跟踪的指数走势
            - IOPV（参考净值）：交易时段每 15s 更新一次，告诉 ETF 底层那一篮子股票此刻值多少钱
            - 如果 ETF 的市场价格明显高于或低于 IOPV，说明此时出现了溢价或折价，不建议买入
        - 如何挑选一支好的 ETF
            - 跟踪误差
                - 衡量 ETF 的实际表现和它所跟踪的指数之间的偏差
                - 跟踪误差越小，说明 ETF 越忠实
                - 年化跟踪误差控制在 0.1% 以内的算优秀
            - 费率
                - ETF 的费用主要包含管理费和托管费，加起来每年 0.2%~0.6% 之间
            - 规模
                - 规模太小会出现买卖大的价差，或者被基金公司清盘
                - 建议选规模在 10 亿元以上的 ETF
            - 流动性
                - 成交额越大，说明买卖的人越多
                - 日均成交额在 1 亿以上的 ETF 就算不错
            - 成立时间
                - 运作时间越长的 ETF，数据越充分，管理经验越丰富
                - 优选 3 年以上的
        - 常见 ETF 分类
            - 宽基 ETF
                - 代表整个市场的宽基指数
                - 例如沪深 300 ETF、中证 500 ETF
            - 行业 ETF
                - 跟踪某个特定行业的指数
                - 例如医药 ETF、半导体 ETF、消费 ETF，集中度高，波动大
            - 策略 ETF
                - 不按市值加权，而是按照某种因子策略来选股和加权
                - 例如红利 ETF 选择高分红的公司，低波 ETF 选择波动低的公司
            - 跨境 ETF
                - 用人民币投资海外市场
                - 可能会有较大溢价，需要看溢价率
            - 债券 ETF
                - 跟踪债券指数
            - 商品 ETF
                - 跟踪大宗商品价格
    - 什么是债券
        - 核心要素
            - 面值
                - 债券到期时发行方要还给你的本金，通常是 100 元一张
                - 面值和买入价不一定相同，如果在二级市场买，可能要 101 一张（溢价买入）或者 98 一张（折价买入）
            - 票面利率（息票率）
                - 发行方承诺每年按面值的百分之几付利息
            - 期限
                - 从发行到到期还本的时间长度
                - 短期债一般 1 年以内，中期 1-10 年，长期 10 年以上
            - 到期收益率（YTM）
                - 考虑买入价格，未来收到的所有利息和到期拿回的本金，算出的年化实际回报率
                - 到期收益率才是真正能拿到的回报率
            - 信用评级
                - 是评级机构对债券发行方偿债能力的评估
                - AAA 是高等级，基本不会违约，往下依次是 AA、A、BBB 等
                - BBB 及以上是投资级债券，以下叫高收益债券（垃圾债）
        - 债券的分类和特点
            - 按发行方分类
                - 国债
                - 地方政府债
                - 企业债和公司债
                - 金融债
                - 可转换债
        - 利率与债券
            - 举例
                - 持有一张面值 100 元，票面利率 3% 的 10 年期债券
                - 市场利率从 3% 涨到了 4%
                - 新发行的债券能给投资者 4% 的回报
                - 债券必须降价，新买家才能接近 4% 的回报
                - 如果市场利率低了，那么债券就抢手
            - 如果预期未来利率要下降，现在买长期债券，未来债券价格上涨就赚到了资本利得
            - 降息周期中，债券是好投资，不光拿利息，还能赚价差
            - 期限越长的债券，对利率变化越敏感
    - 加密货币
        - 区块链与加密货币
            - 区块链要解决的问题
                - 不依赖任何中心化机构，让一群互补信任的人也能安全的记账和转账
            - 实现方案
                - 不把账本交给机构，而是让网络中所有参与者各持有一份完整的账本副本
                - 每当发生一笔交易，全网广播，大家一起验证这笔交易是否合法
                - 验证通过后，这笔交易会被打包进一个区块，链接到之前的区块后面，形成一条链
            - 特点
                - 由于每个人都有一份账本，每个区块都包含前一个区块的信息
                - 要篡改任何一笔历史记录就必须同时修改全网超过一半的账本，几乎不可能
            - 比特币
                - 是区块链技术的第一个也是最成功的应用
                - 总量上限 2100 万枚，永远不会增发
                - 每 4 年产出速度减半
                - 任何人都可以参与网络维护（挖矿），维护者获得新产出的比特币作为奖励
        - 以太坊与加密生态
            - 比特币类似数字黄金，以太坊更像一台全球共享的计算机
            - 以太坊的创新在于引入了智能合约，可以在区块链上写程序，这些程序一旦部署自动执行，不需要任何中间人
            - 智能合约的方式是把规则和赌金都锁在一段代码里，代码自动从天气数据源获取结果，赢了自动把钱转给赢家，不需要裁判
            - DeFi(去中心化金融)用智能合约实现了借贷、保险、交易等传统金融功能
            - NFT 是基于区块链的数字所有权证明
            - 稳定币(USDT、USDC)是价格锚定美元的加密货币
            - 以太坊的代币是 ETH，是使用以太坊网络的燃料，任何人在以太坊上执行智能合约都要支付 ETF 作为手续费
            - ETF 的价值和整个以太坊的繁荣程度挂钩
        - 风险
            - 加密货币极端波动是常态
            - 监管不确定性是最大的系统性风险
            - 安全风险，交易所被黑客攻击、个人钱包密钥丢失
            - 信息不对称
            - 没有涨跌停和熔断机制
    - 投资者心态
        - 市场大多数人在亏钱
            - 市场指数长期上涨
            - 大多数人亏钱是由于在错误的时间做出了被情绪驱动的决策
        - 贪婪与恐惧的循环
            - 追涨杀跌，在贪婪的时候高位买入，在恐惧的时候低位卖出
        - 常见的心态陷阱
            - 频繁交易的冲动
            - 过渡关注短期涨跌
            - 盲目跟风
            - 死扛不止损
            - 赚了觉得自己是天才

财务报表与公司分析





- 财务报表与公司分析
    - 为什么要看财报
        - 财报是什么
            - 财务报表就是一家上市公司定期公布的财务数据报告，是公司的体检报告
            - 上市公司被法律要求定期披露财报：年报每年一次，最全面最重要
            - 年报通常在每年 4 月 30 日之前披露完成
            - 财报提供了第一手的、经过审计的、客观的数据
        - 三张核心报表速览
            - 资产负债表
                - 这家公司在某个时间点拥有什么，欠了什么
                - 给公司在某一天拍了快照：左边列出所有资产，右边列出所有负债和股东权益
                - 资产 = 负债 + 股东权益
                - 告诉一家公司家底有多厚，杠杆有多高
            - 利润表
                - 这家公司在一段时间内赚了多少钱
                - 像一段视频，记录了从年初到年末，公司收入多少，花了多少成本和费用、最终净赚多少
                - 收入 - 成本 - 费用 = 利润
                - 告诉一家公司赚钱能力如何
            - 现金流量表
                - 这家公司在一段时间内实际收到和花出了多少真金白银
                - 利润和现金不是一回事，公司卖出一批货记录 100 万收入和 20 万利润，但是可能没收到客户付款，没有现金
                - 现金流量表就是为了区分账面利润和真实现金的
                - 告诉一家公司造血能力是否健康
        - 在哪里找财报
            - 交易所官网
            - 上交所上市公司公告页
            - 同花顺 APP 个股详情
        - 财报看什么
            - 主要财务数据和指标（前几页），会汇总最关键的数据，例如营收、净利润、总资产、每股收益等
            - 管理层讨论与分析（MD&A）是公司管理层用文字解释这一年经营情况的章节，更容易理解
            - 三张核心财务报表的具体数字与附注
    - 资产负债表
        - 基本结构
            - 核心等式：资产=负债+股东权益
                - 一家公司拥有的所有东西（资产）要么是借来的（负债），要命是股东投入的或者经营积累的（股东权益）
                - 假设购买了 300 万房子，首付 100 万是存款，200 万是银行贷款
                - 资产 300 万 = 负债 200 万 + 自有权益 100 万
                - 资产：公司拥有的现金、厂房、机器设备、存货、别人欠公司的钱
                - 负债：公司欠银行的钱、欠供应商的钱、欠员工的工资
                - 股东权益：股东投入到本金、历年积累下来没有分掉的利润
            - 资产端（变现速度分类）
                - 流动资产
                    - 一年内能变成现金的资产，流动性高
                    - 例如
                        - 货币基金（公司银行账号里的现金和扣款）
                        - 应收帐款（公司已经把货卖出去了，但是客户没付钱）
                        - 存货（公司仓库里面还没卖出去的产品和原材料）
                        - 预付款项（公司提前付给供应商的钱，还没有收到货）
                - 非流动性资产
                    - 需要超过一年才能变现或者公司打算长期持有的资产
                    - 例如
                        - 固定资产（厂房、机器设备、办公楼等实物资产）
                        - 无形资产（专利、商标、软件著作权、土地使用权）
                        - 商誉（公司收购另一家公司时多付的溢价）
                        - 长期股权投资（公司持有其他公司的股份）
            - 负债端（按时间分类）
                - 流动负债
                    - 一年内必须偿还的债务
                    - 例如
                        - 短期借款（一年内到期的银行贷款）
                        - 应付帐款（公司从供应商那里拿货了，但是没付钱）
                        - 预收帐款（客户提前付给公司，公司还没交货）
                        - 应付职工薪资
                - 非流动性负债
                    - 一年以后需要偿还的长期债务
                    - 例如
                        - 长期借款
                        - 应付债券
            - 股东权益
                - 股本（股东投入的本金，按面值计算）
                - 资本公积（股东投入中超过面值的部分，比如 IPO 溢价）
                - 未分配利润（公司历年赚的钱中没有分红分掉的部分，这是公司内部积累的家底）
        - 资产负债表的关键视角
            - 公司有多少真金白银
                - 货币资金：一家公司账上有大量现金，说明财务弹性好，有钱应对突发情况，也有能力抓住新的投资机会
                - 如果一家公司常年积累大量现金却不分红也不投入业务，可能说明管理层没有找到好的投资方向，资本配置效率低
            - 公司的资产质量如何
                - 现金是最优质的资产
                - 应收帐款有风险，如果客户赖账不还，应收帐款变成坏账，需要从利润扣除
                - 存货：如果是电子产品，存货放久了会贬值或者变为废品
                - 如果应收帐款和存货的占比在扩大，远快于营收增速，往往是危险信号
            - 钱从哪里来
                - 负债和股东权益的结构
                - 如果负债占总资产比例很高(>70%)，说明公司高度依赖借债经营，一旦经营出现波动，可能出现问题
                - 负债率不是越低越好，适度举债可以放大股东的回报率
                - 不同行业负债差异很大，银行和房地产天然是高负债行业，科技公司和消费品公司负债率很低
            - 衡量偿债能力的指标
                - 短期偿债能力
                    - 看的是公司能不能应付眼前的债务
                    - 流动比率=流动资产/流动负债
                    - 衡量的是公司用短期内能变现的资产去覆盖短期内必须偿还的债务的能力
                    - 一般认为流动比率在 1.5 到 2 之间比较健康，低于 1 意味着短期资产不够偿还短期债务
                - 速动比率
                    - (流动资产-存货)/流动负债
                    - 把存货提出来，只看更容易变现的资产
                    - 速动比率在 1 以上通常被认为是安全的，意味着不靠存货就能覆盖短期债务
                - 现金比率
                    - 货币资金/流动负债
                    - 只看账上最硬的真金白银能覆盖多少短期债务
                    - 这个指标过于保守，实际中不常用
                - 长期偿债能力
                    - 看的是公司整体的杠杆水平
                    - 资产负债率=总负债/总资产*100%
                    - 这是最常用的杠杆指标
                    - 制造业和消费行业资产负债率 40%-60% 算正常，房地产行业 60%-80% 常见
                    - 科技轻资产公司通常在 30%-50%
                    - 公用事业公司有大量固定资产可能在 50%-70%
            - 衡量资产质量的指标
                - 资产质量指标告诉你的公司家底是否扎实
                - 应收帐款周转天数
                    - 365 / (营业收入/平均应收帐款)
                    - 衡量的是公司从卖出货物到收回现金平均需要多少时间
                    - 周转天数越短说明公司收钱越快，议价能力越强
                    - 如果周转天数从去年的 45 天变成了 90 天，说明客户的付款速度明显变慢了
                    - 要么是公司放松了信用政策，要么是下游客户的经营出了问题，两种都不是好消息
                - 存货周转天数
                    - 365 / (营业成本/平均存货)
                    - 衡量存货从采购到卖出平均需要多少天
                    - 对于食品、电子产品这类保质期短或者贬值快的行业，存货周期变慢是严重的预警
                - 上述两个指标不看绝对值，而是看趋势和同行对比
                - 商誉
                    - 如果一家公司收购另一家公司，出价高于被收购公司净资产的公允价值，多付的被称为商誉
                    - 商誉本质是对未来协同效应的乐观预期
                    - 如果收购后实际效果不如预期，商誉会减值
                    - 商誉会直接从利润扣除，一下让公司从盈利变为亏损
                    - 当公司资产负债表商誉占比很高，要注意
            - 一家好公司的资产负债表
                - 账号有充足的资金，不用为短期生存发愁
                - 应收帐款和存货的增速与营收增速大致匹配
                - 流动比率在 1.5 以上，短期偿债没有压力
                - 资产负债率在行业合理范围，没有过度举债
                - 商誉占比不高或者没有商誉
                - 股东权益中未分配利润持续增长
    - 利润表
        - 利润表的结构与逻辑
            - 利润表记录的是一段时间内公司经营的全过程
            - 核心逻辑可以用漏斗来理解：钱从营业收入开始流入，经过一层层的成本和费用扣减，最终剩下的就是净利润
            - 营业收入
                - 营业收入是起点，也叫营收或者收入，公司通过卖产品或提供服务获得的总金额
                - 营收是一家公司规模和市场地位最直观的体现
                - 营收不等于公司公司收到的现金，只要货物已交付或者任务已完成，哪怕客户还没付款，会计上也可以确定为收入
            - 营业成本
                - 公司为了生产产品或提供服务而直接发生的支出
                - 例如制造业的原材料采购和工人工资、餐饮业的食材成本
            - 毛利润
                - 营收减去营业成本就得到毛利润
                - 毛利润体现了公司产品本身的盈利能力
                - 毛利润没扣除管理层工资、广告费、研发费这些间接支出
                - 毛利润可以理解为产品层面赚了多少，后面要扣的费用是公司运营层面花了多少
            - 费用
                - 销售费用
                    - 为了把产品卖出去而花的钱
                    - 例如广告投入、销售人员工资和提成、渠道佣金、促销活动、运输费等
                - 管理费用
                    - 维持公司日常运转的行政支出
                    - 管理层薪酬、办公室租金、行政人员工资、差旅费、法律和审计费用等
                - 研发费用
                    - 公司投入新产品开发和技术创新的钱
            - 营业利润
                - 毛利润减去三大费用再加上其他经营收支就得到了营业利润，反映的是公司核心业务的盈利情况
                - 营业利润之后还要扣减财务费用、加上投资收益、以及一些营业外收资，最终得到利润总额
            - 净利润
                - 利润总额扣减掉所得税，就是最终的净利润
        - 完整示例
            - 营业收入 100 亿，卖出这些产品的直接成本是 55 亿，毛利润是 45 亿
            - 为了把产品卖出去花了 15 亿销售费用，公司管理花了 5 亿管理费用，研发新品花了 3 亿研发费用，三项费用合计 23 亿
            - 45 亿毛利润减去 23 亿期间费用等于 22 亿营业利润
            - 公司有些银行贷款产生了 2 亿利息支出（财务费用），对外投资赚了 1 亿（投资收益），收到 0.5 亿政府补贴（营业外收入）
            - 利润总额是 22 - 2 + 1 + 0.5 = 21.5 亿
            - 按 25% 的企业所得税税率扣税，交了大约 5.4 亿的税，最终净利润是 16.1 亿
            - 经常性利润
            - 一次性利润：政府补贴是一次性的，明年不一定有
        - 利润表关键信号
            - 营收增长但利润下降：公司虽然卖的更多了，但是成本费用增长更快，赚钱效率在下降，可能是打价格战或者消费费用失控
            - 利润严重依赖非经营性收入：如果投资收益、政府补贴、资产处置收益在利润中占比很大，说明主业赚钱能力可能很弱
            - 营收增长异常平滑：可能是人为调节过了
            - 某一项费用突然大幅变化
        - 核心利润率指标
            - 毛利率
                - 毛利率 = 毛利润/营业收入*100%
                - 毛利率最能体现一门生意本质
                - 毛利率越高说明产品的附加价值越高，公司在产业链的议价能力越强
                - 白酒行业毛利率在 70%-90%，软件和互联网公司毛驴很高，超市零售只有 15%-25%，制造业通常只有 20%-40%
                - 毛利率不能跨行业比较，但是一个行业内，毛利率高的公司通常意味着产品更有竞争力
                - 趋势：如果毛利率下降，但是营收增长，也说明生意在变差
            - 净利率
                - 净利率 = 净利润/营业收入*100%
                - 净利率是最终的赚钱效率，体现了公司在扣除所有成本、费用和税后，每 100 块营收最终能留下多少利润
                - 净利率综合反映了毛利率和非要红控制两方面的能力，有些公司毛利率很高但是净利率低，说明费用支出太多
        - 费用率指标
            - 销售费用率
                - 销售费用/营业收入*100%
                - 告诉你公司每赚 100 块钱要花多少在营销推广上
                - 消费品公司和互联网公司的销售费用通常较高，有些可能超过 30%
                - ToB 的工业品或者垄断企业销售费用率可能只有 3%-5%
                - 销售费用率需要关注的核心问题是效率，花了钱后营收是否在增长，如果营收增速下降了，说明获客效率在下降
            - 管理费用率
                - 管理费用/营业收入*100%
                - 反映公司的管理效率
                - 随着公司营收增长，管理费用率应该逐步下降，因为管理费用中很多固定支出（办公司租金、行政人员工资）
                - 营收增长后这些固定支出被摊薄，这就是规模效应
                - 如果一家公司营收翻倍但是管理费用上升了，说明管理层没有控制好成本
            - 研发费用率
                - 研发费用/营业收入*100%
                - 关键不在于花了多少，而是花出去的钱有没有转化成有竞争力的产品和持续的营收增长
                - 通常和营收增速一起看
                    - 如果研发费用率保持 15% 而营收每年增长 20% 以上，说明研发投入有成果
                    - 如果研发费用率 20% 但营收已经连续两年不增长说明钱花的不够聪明
    - 现金流量表
        - 为什么利润不等于现金
            - 会计记账采用的是权责发生制，而不是收付实现制
            - 只要交易在经济意义上发生，不管钱是否到账，都可以记录为收入或者支出
            - 利润表告诉公司应该赚了多少，现金流量表告诉公司实际收到和花出了多少真金白银
            - 举例
                - 12 月份卖 500 万的货给客户，客户三个月后付款，按权责发生制，12 月利润表就可以确认 500w 利润，挂在应收帐款下
                - 12 月买 200 万的设备，能用 10 年，会计上不会把 200 万一次性计入当月成本，而是分 10 年每年折旧 20 万
            - 历史上很多公司利润表年年盈利，最后倒闭，就是因为现金流断裂，收不回现金
        - 现金流的三大板块
            - 经营活动现金流
                - 最核心的部分，反映了公司通过日常经营-卖产品，提供服务-实际收到多少现金，花出多出现金
                - 流入项包括销售商品收到的现金，提供劳务收到的现金等
                - 流出项包括采购原材料支付的现金、支付给员工的现金、缴纳的税款等
                - 经营活动现金流净额如果为正，说明公司的业主在造血
                - 一家公司可以通过调整会计政策来美化利润，但是经营现金流很难操作，有银行流水佐证
                - 通常把经营活动现金流金额和净利润放在一起，如果经营现金流长期大于或接近净利润，说明利润质量很高
            - 投资活动现金流
                - 反映的是公司在长期资产上的投入和回收
                - 流出项主要是购买固定资产、购买无形资产、对外投资收购
                - 流入项主要是处置固定资产回收的现金、出售投资回收的现金等
                - 通常是负数，一家正在成长的公司需要不断投入资金来扩大产能
                - 如果长期为正数，需要担心公司是否是变卖家产来生存
            - 筹资活动现金流
                - 反映的是公司和资金提供者之间的现金往来
                - 流入项包括银行借款、发行债券、增发股票融资等
                - 流出项包括偿还借款本金、支付利息、支付股东分红等
                - 筹资活动现金流为正说明公司在从外部输血
                - 为负说明公司在还血
                - 优秀的公司经营现金流充足到不需要外部融资就能支撑投资和分红，筹资活动现金净额为负或者小幅为正
        - 通过三类现金流判断公司所处的阶段
            - 最健康的组合是经营为正、投资为负、筹资为负
                - 意味着公司赚到的现金够多，一边扩张一边还债分红，完全靠自身造血能力驱动发展
            - 经营为正、投资为负、筹资为正也很常见，说明公司在快速扩张期
            - 经营为负、投资为负、筹资为正是最典型的烧钱模式
            - 经营为负、投资为正、筹资为正是最危险的组合
                - 主业不赚钱，靠变卖资产和借钱维持运营，是衰退或濒临破产的信号
    - 三表之间的关系
        - 资产负债表是起点和终点
        - 利润表和现金流量表是两条路径，解释了资产负债表从年初状态到年末状态的过程
        - 利润表解释了股东权益中未分配利润的变化，现金流量表解释了货币资金的变化
        - 三条核心连接线
            - 利润表的净利润流入资产负债表的股东权益
            - 现金流量表的三类现金流净额合计等于资产负债表上货币资金的变化
            - 利润表和现金流量表的桥梁
                - 间接法
                    - 起点是净利润，然后通过一系列调整把净利润还原成经营活动现金流
                    - 加回折扣和摊销
                    - 扣除应收帐款的增加
                    - 扣除存货的增加
                    - 加回应付帐款的增加
    - PE 市盈率
        - PE 的定义与直觉理解
            - PE = 股价 / 每股收益(EPS)
            - PE = 总市值 / 净利润
            - 假设公司每年都赚一样的钱，需要多少年才能通过利润回本
            - 静态 PE 是通过过去一年已经公布的净利润来计算
            - 动态 PE 用的是最近四个季度的净利润之和
        - PE 的应用方法
            - 同行业对比
                - 关键不是 PE 的绝对数字，而是差异背后的原因是否合理
            - 历史对比
                - 同一家公司的 PE 会随着市场情绪波动
                - 可以查询到 PE 的历史百分位，
            - 常见 PE
                - 银行股 PE 通常在 4-8 倍
                - 消费品公司 PE 通常在 20-35 倍
                - 高科技成长股 PE 可能在 50 倍甚至 100 倍以上
        - PE 局限性
            - PE 对亏损公司无效
                - 亏损公司的净利润为负数
            - PE 可以被一次性因素扭曲
                - 政府补贴等一次性因素会带来利润的暴涨或暴跌，PE 大幅失真
                - 扣除一次性项目后的扣非净利润算出的 PE 更有参考价值
                - 很多网站会提供 PE 和扣非 PE 两个数字
            - PE 是静态视角没有考虑增长
            - PE 无法反映资产负债情况
            - 低 PE 可能是价值陷阱
                - 低 PE 如果没有利润稳定或增长的支持就毫无意义
    - PB 市净率与 ROE
        - PB 市净率
            - PB = 股价/每股净资产
            - PB = 总市值/净资产(股东权益)
            - 净资产就是资产负债表上的股东权益，也就是总资产减去总负债后真正属于股东的部分
            - PB 衡量的是市场愿意为公司的每一块钱净资产支付多少钱
            - 直觉含义：今天把这家公司买下来然后立即清算，把所有资产卖掉，把所有债还清，是赚钱还是亏钱
            - PB 等于 1 意味着市值刚好等于净资产，以成本价买了公司所有家底
            - PB 最适合用于重资产行业的估值
            - 银行是 PB 用的最多的领域，银行的资产主要是贷款和债券，账面价值比较接近真实价值
            - 中国银行股的 PB 普遍在 0.4-0.8 倍之间，市场担心隐藏的坏账会让净资产缩水
            - 房地产、钢铁、建筑等重资产行业也常常用 PB 估值，这些行业净资产是真实可感的硬资产
            - PB 不适合轻资产公司
        - ROE 净资产收益率
            - ROE = 净利润 / 平均净资产 * 100%
            - ROE 是把利润表和资产负债表连接起来的桥梁，告诉你股东投入的每一块钱在一年能赚回多少利润
            - 巴菲特表示如果只能看一个财务指标只会选 ROE
            - ROE 直接衡量一家公司为股东创造回报的效率，可以理解为股东资金的回报率
            - 长期 ROE 能稳定在 15% 以上的公司通常被认为是优秀的企业
            - 低于 10% 说明盈利效率一般
            - 低于 5% 不如自己买理财产品
            - 持续性很关键，连续 5 年甚至 10 年的 ROE 都在 15%-20% 才是优质公司，例如苹果、茅台、腾讯
        - ROE、PB、PE 之间的内在关系
            - PB = PE x ROE
            - 如果两家公司的 PE 相同都是 20 倍，一家 ROE 是 25%，另一家是 8%
            - ROE 高的 PB 是 5 倍，ROE 低的只有 1.6 倍
            - 市场愿意为高 ROE 的公司支付更高的 PB 溢价
        - 杜邦分析
            - 杜邦分析法就是用来拆解 ROE，找到驱动因素的工具
            - ROE = 净利润 x 总资产周转率 x 权益系数
            - 净利润（营收/总资产）代表赚钱的效率
            - 资产周转率（营收/总资产）代表资产的使用效率
            - 权益乘数（总资产/股东权益）代表杠杆水平，权益乘数越多说明负债越多
            - 茅台这类公司的 ROE 高主要靠超高的净利率
            - 沃尔玛这类零售公司的 ROE 主要靠的是极高的资产周转率
            - 银行的 ROE 主要来自于高杠杆
    - 估值综合应用
        - PS 市销率
            - PS = 总市值/营业收入
            - 衡量的是市场为公司每一块钱的营业收入愿意支付多少钱
            - PS 等于 5，意味着你要花 5 块钱才能买到公司 1 块钱的年收入
            - PE 对亏损公司无效，因此，PS 就是最实用的估值工具
            - PS 的逻辑
                - 公司现在不赚钱，但它的收入在高速增长且未来有望实现盈利，市场就会给他的收入一个估值倍速
            - 适用场景
                - 高增长但是尚未盈利的公司
            - 局限性：营收高不代表能赚钱，一旦公司盈利就要切换到 PE
            - 使用 PS 要关注公司的毛利率，高毛利率加上高营收增速的组合才是 PS 估值的理想标的
        - PEG 指标
            - PEG = PE / 预期利润增长率(%)
            - 解决了 PE 最大的缺陷：不考虑增长
            - PEG 等于 1 被认为是合理估值，低于 1 被认为是低估，高于 1 被认为是高估
            - PEG 最大的局限性就是预期利润增长率用谁的预测，用过去的增速，历史不等于未来
            - PEG 的最佳使用场景是盈利且利润增速在 15%-20% 之间的成长股
        - 不同类型的公司的估值方法选择
            - 稳定盈利的成熟公司用 PE 为主
            - 高增长公司用 PEG 为主
            - 亏损但高增长的公司用 PS 为主
            - 重资产行业用 PB 为主
            - 周期性行业需要特殊处理，PE 高买入，PE 低卖出（利润高），更看 PB，跌到 PB 低的时候关注
        - 行业分析入门
            - 为什么行业分析重要
                - 行业分析帮助回答的问题
                    - 这个行业的蛋糕有多大，还在不在变大
                    - 这个行业赚钱容不容易、利润会不会被竞争吃掉
                    - 这个行业未来三到五年会变好还是会变差
                - 好行业有几个共同特征
                    - 市场空间大，还在不断增长
                    - 行业内公司能赚到不错的利润率
                    - 龙头公司有明显的竞争壁垒
                    - 不容易被新技术或者新商业模式颠覆
                - 判断方法
                    - 查看龙头公司的毛利率和净利率趋势

- 投资基础认知
    - 什么是投资
        - 储蓄
            - 把钱存起来，追求安全，收益很低
            - 保住本金，几乎没有风险，也跑不赢通胀
        - 投资
            - 将钱投入到能长期产生回报的资产中
            - 有逻辑依据，关注长期价值、承担合理风险以获取合理回报
        - 投机
            - 试图通过短期价格波动赚差价
            - 投机接近于赌方向，往往没有对资产本身价值的深入分析，风险很高
    - 资产与负债
        - 资产
            - 能把钱放进你口袋的东西
            - 买了一套房，每月收租金 3000 元
        - 负债
            - 从口袋里面掏钱的东西
            - 买了一套房，每月还房贷 8000 元
        - 资产和负债的区别在于是给你创造现金流还是消耗现金流
    - 复利的力量
        - 单利
            - 投入 10000，年化收益 10%，每年赚 1000，10 年后有 20000
        - 复利
            - 同样投入 10000，第一年 11000，第二年 12100，利息变成利息，十年后有 25937
            - 公式：终值 = 本金 x (1 &#43; 收益率) ^ 年数
            - 重要的不是能赚多高的收益率，而是能让钱复利多长时间
    - 通货膨胀
        - 本质：同样一笔钱，买到的东西变少
        - CPI（消费者价格指数）：是通胀的衡量标准，追踪一篮子日常消费品的价格变化
        - 虽然 CPI 每年只有 2%-3%，但是实际感知到的通胀更高，房价、教育、医疗这些大头支出涨幅远超 CPI
        - 发生的原因
            - 货币超发，央行印了更多的钱，但是东西没多
            - 需求拉动或者成本推动，原材料涨价
        - 投资收益率必须跑赢通胀，否则财富实际上是缩水的
        - 实际收益率 = 名义收益率 - 通胀率
    - 风险与收益
        - 风险排序：银行存款-&gt;货币基金-&gt;国债-&gt;企业债券-&gt;债券基金-&gt;股票指数基金-&gt;个股-&gt;期货期权-&gt;加密货币
        - 系统性风险：整个市场的风险，比如经济衰退、金融危机、战争，所有资产都会跌
        - 非系统性风险：某个公司或行业特有的风险，可以通过分散投资来大幅降低风险
        - 分散投资能消除非系统性风险，无法消除系统性风险
    - 主要投资品种概览
        - 股票
            - 花钱买了一家公司的一小块所有权
            - 赚钱方式
                - 价差：50 块买入，80 块卖出
                - 分红：赚钱的公司把利润分一部分给股东，叫做股息或分红
                    - 银行股股价 5 元，每年每股分红 0.3 元，股息率就是 6%
            - 股票特点：长期收益潜力最高，但是短期波动大，适合长期持有
            - 市值：股价乘以总股数，代表市场认为这家公司值多少钱
            - 大盘股：指市值几百亿以上的公司，波动相对较小，比较稳
            - 小盘股：市值较小，波动大，涨跌剧烈
            - 涨跌停：A 股特有的规则，普通股票每天最多涨/跌 10%，创业板和科创板是 20%
        - 债券
            - 把钱借给别人，对方承诺按时还本付息
            - 发行方分类
                - 国债：政府发行，信用最高，基本不违约，但是收益率也最低
                - 地方政府和企业债：信用等级低于国债，利率会更高
                - 可转债：是债券但是可以在指定条件下转换成股票
            - 债券和利率是反向关系，市场利率上升，已发行债券的价格就下降
        - 基金
            - 基金的本质是众筹投资：很多人凑钱给基金经理，由他决定买什么
            - 基金购买的是基金经理帮忙搭配好的一篮子资产
            - 解决的问题
                - 钱少，买不了那么多股票来分散风险
                - 不专业，选股的事给专业的人做
            - 投资方向分类
                - 股票型基金
                - 债权型基金
                - 混合性基金
                - 货币基金
            - 管理方式分类
                - 主动性基金：基金尽力主动选择，管理费较高（1.2%-1.5%）
                - 被动型基金：直接复制某个指数的成分股，管理费很低（0.1%-0.5%）
                - 长期来看，大多数主动型基金经理跑不赢指数
            - 关注的核心指标
                - 费率
                - 规模
                - 历史业绩
                - 基金经理的从业年限和风格
        - ETF
            - 全称是“交易所交易基金“，可以理解为是一只可以像股票一样在交易所买卖的基金
            - 和普通基金的区别在交易方式上
                - 普通基金在支付宝或者银行 app 申购赎回，一天只有一个价格（收盘后结算），到账通常 T&#43;1 或者更久
                - ETF 直接在股票交易软件里买卖，和股票一样实时报价、实时成交，流动性好的多
            - ETF 大多是被动型的，跟着一个指数
            - ETF 的费率很低
        - 大宗商品与加密货币
            - 大宗商品指的是黄金、白银、石油、铜、大豆这类标准化的原材料
            - 普通人参与大宗商品的方式是买黄金或者相关的 ETF
            - 黄金被称为避险资产，当股市暴跌，通胀飙升或地缘政治紧张，资金会涌入黄金避险，推高金价
            - 黄金不产生任何现金流，不付利息也不分红，长期收益率不如股票
            - 加密货币以比特币和以太坊为代表
                - 比特币的设计理念是总量固定 2100 万枚，不受任何政府控制的数字货币
                - 以太坊是一个可以运行智能合约的平台，ETH 是这个平台的燃料
            - 加密货币波动性极高，24 小时不间断交易，没有涨跌停限制，全球流通，机会和风险都极大
            - 新手建议只碰比特币和以太坊两个主流币
    - 开户与交易规则
        - 投资不同品种需要不同的账户
            - 证券账户是买卖股票和场内 ETF 的，需要在一家证券公司（券商）开户，开完后得到一个资金账户和股东账户
            - 基金账户是买场外基金用的，可以通过银行 APP、基金公司 APP、第三方平台
            - 加密货币账户需要在交易所注册
            - 银行账户是所有投资的资金中转站，证券账户需要绑定一张银行卡，通过银证转账把钱转进转出
        - 交易规则和费用
            - 交易时间
                - 交易时间是每个工作日的上午 9:30-11:30 和下午的 13:00-15:00
                - 9:15-9:25 是集合竞价时间，决定开盘价
                - 美股的交易时间换算成北京时间是晚上 21:30 到次日凌晨 4:00，冬令时推迟一个小时
                - 加密货币是 7x24h 全天候交易
            - 交易单位
                - A 股买入最少 100 股（一手），卖出没有这个限制
                - ETF 通常 100 份起买，但是有些券商支持拆零
            - 费用
                - 券商佣金
                    - 券商佣金是每次买卖股票或者 ETF 券商收的手续费，大概是万2.5-万 3，买卖各收一次
                    - 很多券商会有最低 5 元的门槛
                    - 开户的时候可以和客户经理谈佣金率，通常能谈到万 1.5 甚至更低
                - 印花税
                    - 是国家收的，目前税率是千分之 0.5，只在卖出股票时收
                - 过户费
                    - 很少，每 10 万收 1 元，可以忽略不计
                - 基金费用
                    - 申购费是买入时收，股票型基金 1.5%，第三方平台通常打一折只要 0.15%
                    - 赎回费根据持有时间不同，持有越久费率越低，超过一定时间免赎回费
                    - 管理费和托管费是每天从基金净值里扣，看到的基金收益已经扣过了
    - 读懂行情软件
        - 行情软件核心信息
            - 现价：这只股票此刻的交易价格，也叫最新价，几秒钟就会跳动一次
            - 涨跌幅：今天相比昨天收盘价涨了或跌了百分之几
            - 开盘价：今天第一笔交易的成交价，由早上 9:15-9:25 集合竞价决定
            - 收盘价：当天最后的价格，15:00 收盘时确定
            - 最高价和最低价：今天盘中达到的极端值
            - 成交量：今天到目前为止总共成交了多少股，成交量突然放大说明有大资金在行动，需要注意
            - 成交额：总共成交了多少钱
            - 换手率：今天成交的股数占这只股票总流通股数的百分比，换手率 1-3% 正常，5% 比较活跃，10% 非常热烈
            - 总市值：股价乘以总股本，代表市场给这家公司的总定价
            - 流通市值：市场上能自由买卖的那部分股份，因为很多大股东的股份是有锁定期的
        - K 线图
            - 是 200 多年前日本米商发明的价格记录方法
            - 每一根 K 线代表一个时间周期内的四个价格：开盘价、收盘价、最高价、最低价
            - 如果收盘价高于开盘价，说明这个周期价格涨了，K 线画成红色，中间的实心方块叫做阳线
            - 方块的下边缘是开盘价，上边缘是收盘价
            - 如果收盘价低于开盘价，说明价格低了，画成绿色，叫阴线
            - 方块上下伸出的线叫做影线，上影线的顶端是最高价，下影线的底段是最低价
            - 上影线越长说明上方抛压越大，价格冲高后被打回来了
            - 下影线越长说明下方有支撑，价格跌下去又被拉起来了
            - 方块越长说明开盘价和收盘价差距越大，当天的趋势越明显
            - 方块很小说明多空双方力量接近，市场在犹豫
            - 日 K 代表一天，周 K 代表一周
            - K 线下方还有成交量柱，红色柱子对应上涨，绿色柱子对应下跌
            - 价格上涨同时成交量放大，说明涨势有资金支撑，比较健康
            - 价格上涨但是成交量萎缩，可能是虚涨，持续性存疑
        - 均线初识
            - K 线图上叠加的几条彩色的曲线就是均线（MA）
            - 均线把过去 N 天的收盘价求平均值连成一条线
            - MA5 是 5 日均线，反映最近一周的平均成本
            - MA20 是 20 日均线，反映一个月的平均成本
            - MA60 是 60 日均线，代表一个季度
            - MA250(年线)，代表一年
            - 基本逻辑
                - 股价在均线上方，代表近期买入的人平均是赚钱的，市场情绪偏乐观
                - 股价在均线下方，代表大部分人被套，情绪偏悲观
                - 短期均线在长期均线上方被视为上升趋势，否则是下降趋势
    - 什么是指数
        - 指数的本质
            - 指数就是从市场里面挑出一篮子股票，按照某种规则计算出来的一个数字，用来代表这一篮子股票的整体表现
            - 指数本身不能买卖，它只是一个统计数字
            - 可以通过购买跟踪指数的 ETF 或者指数基金来间接买入指数
            - 指数由专门的指数公司编制和维护，中国由中证指数公司编制，美国由标普道琼斯、MSCI等公司编制
            - 指数会定期调整成分股，把不合格的公司踢出去，把新的优质公司纳入进来
            - 指数自带优胜劣汰，长期看质量不会越来越差
        - 核心指数
            - 中国市场
                - 上证指数
                    - 涵盖了上海证券交易所的所有股票
                    - 按总市值加权，包含大量银行、石油等大盘股
                    - 包含所有股票不含优劣
                - 沪深 300 指数
                    - 从沪深两市挑出市值最大、流动性最好的 300 只股票，按自由市值加权
                    - 覆盖了 A 股越 6 成的总市值，是公认的最能代表 A 股大盘蓝筹表现的指数
                - 中证 500 指数
                    - 排除沪深 300 之后的 500 只中等市值股票
                    - 代表中盘成长股的表现
                    - 沪深 300 代表大公司，中证 500 代表小公司
                - 创业板指数
                    - 从创业板挑出 100 只市值最大的股票，科技和医药公司占比高，波动比沪深大，弹性也更强
            - 美国市场
                - 标普 500 指数
                    - 由美国市值最大的 500 家公司组成，覆盖每股 80% 的总市值
                    - 长期年化收益率大概在 10% 左右
                - 纳斯达克 100 指数
                    - 从纳斯达克交易所挑出 100 家最大的非金融公司，科技股权重极高
                - 道琼斯工业指数
                    - 只包含 30 只股票，用的是价格加权，专业性不高，但是历史悠久
            - 香港市场
                - 恒生指数
            - 日本市场
                - 日经 225 指数
            - 全球市场
                - MSCI 全球指数
                - 富时全球指数
    - 什么是 ETF
        - ETF 的运作机制
            - ETF 背后有一家交易公司管理
            - 基金公司的任务是买入指数所有成分股，按照指数中每只股票的权重来配置
            - 交易所买到的 ETF 份额，代表了这一篮子股票的一小部分所有权
            - ETF 价格会紧贴它所跟踪的指数走势
            - IOPV（参考净值）：交易时段每 15s 更新一次，告诉 ETF 底层那一篮子股票此刻值多少钱
            - 如果 ETF 的市场价格明显高于或低于 IOPV，说明此时出现了溢价或折价，不建议买入
        - 如何挑选一支好的 ETF
            - 跟踪误差
                - 衡量 ETF 的实际表现和它所跟踪的指数之间的偏差
                - 跟踪误差越小，说明 ETF 越忠实
                - 年化跟踪误差控制在 0.1% 以内的算优秀
            - 费率
                - ETF 的费用主要包含管理费和托管费，加起来每年 0.2%~0.6% 之间
            - 规模
                - 规模太小会出现买卖大的价差，或者被基金公司清盘
                - 建议选规模在 10 亿元以上的 ETF
            - 流动性
                - 成交额越大，说明买卖的人越多
                - 日均成交额在 1 亿以上的 ETF 就算不错
            - 成立时间
                - 运作时间越长的 ETF，数据越充分，管理经验越丰富
                - 优选 3 年以上的
        - 常见 ETF 分类
            - 宽基 ETF
                - 代表整个市场的宽基指数
                - 例如沪深 300 ETF、中证 500 ETF
            - 行业 ETF
                - 跟踪某个特定行业的指数
                - 例如医药 ETF、半导体 ETF、消费 ETF，集中度高，波动大
            - 策略 ETF
                - 不按市值加权，而是按照某种因子策略来选股和加权
                - 例如红利 ETF 选择高分红的公司，低波 ETF 选择波动低的公司
            - 跨境 ETF
                - 用人民币投资海外市场
                - 可能会有较大溢价，需要看溢价率
            - 债券 ETF
                - 跟踪债券指数
            - 商品 ETF
                - 跟踪大宗商品价格
    - 什么是债券
        - 核心要素
            - 面值
                - 债券到期时发行方要还给你的本金，通常是 100 元一张
                - 面值和买入价不一定相同，如果在二级市场买，可能要 101 一张（溢价买入）或者 98 一张（折价买入）
            - 票面利率（息票率）
                - 发行方承诺每年按面值的百分之几付利息
            - 期限
                - 从发行到到期还本的时间长度
                - 短期债一般 1 年以内，中期 1-10 年，长期 10 年以上
            - 到期收益率（YTM）
                - 考虑买入价格，未来收到的所有利息和到期拿回的本金，算出的年化实际回报率
                - 到期收益率才是真正能拿到的回报率
            - 信用评级
                - 是评级机构对债券发行方偿债能力的评估
                - AAA 是高等级，基本不会违约，往下依次是 AA、A、BBB 等
                - BBB 及以上是投资级债券，以下叫高收益债券（垃圾债）
        - 债券的分类和特点
            - 按发行方分类
                - 国债
                - 地方政府债
                - 企业债和公司债
                - 金融债
                - 可转换债
        - 利率与债券
            - 举例
                - 持有一张面值 100 元，票面利率 3% 的 10 年期债券
                - 市场利率从 3% 涨到了 4%
                - 新发行的债券能给投资者 4% 的回报
                - 债券必须降价，新买家才能接近 4% 的回报
                - 如果市场利率低了，那么债券就抢手
            - 如果预期未来利率要下降，现在买长期债券，未来债券价格上涨就赚到了资本利得
            - 降息周期中，债券是好投资，不光拿利息，还能赚价差
            - 期限越长的债券，对利率变化越敏感
    - 加密货币
        - 区块链与加密货币
            - 区块链要解决的问题
                - 不依赖任何中心化机构，让一群互补信任的人也能安全的记账和转账
            - 实现方案
                - 不把账本交给机构，而是让网络中所有参与者各持有一份完整的账本副本
                - 每当发生一笔交易，全网广播，大家一起验证这笔交易是否合法
                - 验证通过后，这笔交易会被打包进一个区块，链接到之前的区块后面，形成一条链
            - 特点
                - 由于每个人都有一份账本，每个区块都包含前一个区块的信息
                - 要篡改任何一笔历史记录就必须同时修改全网超过一半的账本，几乎不可能
            - 比特币
                - 是区块链技术的第一个也是最成功的应用
                - 总量上限 2100 万枚，永远不会增发
                - 每 4 年产出速度减半
                - 任何人都可以参与网络维护（挖矿），维护者获得新产出的比特币作为奖励
        - 以太坊与加密生态
            - 比特币类似数字黄金，以太坊更像一台全球共享的计算机
            - 以太坊的创新在于引入了智能合约，可以在区块链上写程序，这些程序一旦部署自动执行，不需要任何中间人
            - 智能合约的方式是把规则和赌金都锁在一段代码里，代码自动从天气数据源获取结果，赢了自动把钱转给赢家，不需要裁判
            - DeFi(去中心化金融)用智能合约实现了借贷、保险、交易等传统金融功能
            - NFT 是基于区块链的数字所有权证明
            - 稳定币(USDT、USDC)是价格锚定美元的加密货币
            - 以太坊的代币是 ETH，是使用以太坊网络的燃料，任何人在以太坊上执行智能合约都要支付 ETF 作为手续费
            - ETF 的价值和整个以太坊的繁荣程度挂钩
        - 风险
            - 加密货币极端波动是常态
            - 监管不确定性是最大的系统性风险
            - 安全风险，交易所被黑客攻击、个人钱包密钥丢失
            - 信息不对称
            - 没有涨跌停和熔断机制
    - 投资者心态
        - 市场大多数人在亏钱
            - 市场指数长期上涨
            - 大多数人亏钱是由于在错误的时间做出了被情绪驱动的决策
        - 贪婪与恐惧的循环
            - 追涨杀跌，在贪婪的时候高位买入，在恐惧的时候低位卖出
        - 常见的心态陷阱
            - 频繁交易的冲动
            - 过渡关注短期涨跌
            - 盲目跟风
            - 死扛不止损
            - 赚了觉得自己是天才

- 财务报表与公司分析
    - 为什么要看财报
        - 财报是什么
            - 财务报表就是一家上市公司定期公布的财务数据报告，是公司的体检报告
            - 上市公司被法律要求定期披露财报：年报每年一次，最全面最重要
            - 年报通常在每年 4 月 30 日之前披露完成
            - 财报提供了第一手的、经过审计的、客观的数据
        - 三张核心报表速览
            - 资产负债表
                - 这家公司在某个时间点拥有什么，欠了什么
                - 给公司在某一天拍了快照：左边列出所有资产，右边列出所有负债和股东权益
                - 资产 = 负债 &#43; 股东权益
                - 告诉一家公司家底有多厚，杠杆有多高
            - 利润表
                - 这家公司在一段时间内赚了多少钱
                - 像一段视频，记录了从年初到年末，公司收入多少，花了多少成本和费用、最终净赚多少
                - 收入 - 成本 - 费用 = 利润
                - 告诉一家公司赚钱能力如何
            - 现金流量表
                - 这家公司在一段时间内实际收到和花出了多少真金白银
                - 利润和现金不是一回事，公司卖出一批货记录 100 万收入和 20 万利润，但是可能没收到客户付款，没有现金
                - 现金流量表就是为了区分账面利润和真实现金的
                - 告诉一家公司造血能力是否健康
        - 在哪里找财报
            - 交易所官网
            - 上交所上市公司公告页
            - 同花顺 APP 个股详情
        - 财报看什么
            - 主要财务数据和指标（前几页），会汇总最关键的数据，例如营收、净利润、总资产、每股收益等
            - 管理层讨论与分析（MD&A）是公司管理层用文字解释这一年经营情况的章节，更容易理解
            - 三张核心财务报表的具体数字与附注
    - 资产负债表
        - 基本结构
            - 核心等式：资产=负债&#43;股东权益
                - 一家公司拥有的所有东西（资产）要么是借来的（负债），要命是股东投入的或者经营积累的（股东权益）
                - 假设购买了 300 万房子，首付 100 万是存款，200 万是银行贷款
                - 资产 300 万 = 负债 200 万 &#43; 自有权益 100 万
                - 资产：公司拥有的现金、厂房、机器设备、存货、别人欠公司的钱
                - 负债：公司欠银行的钱、欠供应商的钱、欠员工的工资
                - 股东权益：股东投入到本金、历年积累下来没有分掉的利润
            - 资产端（变现速度分类）
                - 流动资产
                    - 一年内能变成现金的资产，流动性高
                    - 例如
                        - 货币基金（公司银行账号里的现金和扣款）
                        - 应收帐款（公司已经把货卖出去了，但是客户没付钱）
                        - 存货（公司仓库里面还没卖出去的产品和原材料）
                        - 预付款项（公司提前付给供应商的钱，还没有收到货）
                - 非流动性资产
                    - 需要超过一年才能变现或者公司打算长期持有的资产
                    - 例如
                        - 固定资产（厂房、机器设备、办公楼等实物资产）
                        - 无形资产（专利、商标、软件著作权、土地使用权）
                        - 商誉（公司收购另一家公司时多付的溢价）
                        - 长期股权投资（公司持有其他公司的股份）
            - 负债端（按时间分类）
                - 流动负债
                    - 一年内必须偿还的债务
                    - 例如
                        - 短期借款（一年内到期的银行贷款）
                        - 应付帐款（公司从供应商那里拿货了，但是没付钱）
                        - 预收帐款（客户提前付给公司，公司还没交货）
                        - 应付职工薪资
                - 非流动性负债
                    - 一年以后需要偿还的长期债务
                    - 例如
                        - 长期借款
                        - 应付债券
            - 股东权益
                - 股本（股东投入的本金，按面值计算）
                - 资本公积（股东投入中超过面值的部分，比如 IPO 溢价）
                - 未分配利润（公司历年赚的钱中没有分红分掉的部分，这是公司内部积累的家底）
        - 资产负债表的关键视角
            - 公司有多少真金白银
                - 货币资金：一家公司账上有大量现金，说明财务弹性好，有钱应对突发情况，也有能力抓住新的投资机会
                - 如果一家公司常年积累大量现金却不分红也不投入业务，可能说明管理层没有找到好的投资方向，资本配置效率低
            - 公司的资产质量如何
                - 现金是最优质的资产
                - 应收帐款有风险，如果客户赖账不还，应收帐款变成坏账，需要从利润扣除
                - 存货：如果是电子产品，存货放久了会贬值或者变为废品
                - 如果应收帐款和存货的占比在扩大，远快于营收增速，往往是危险信号
            - 钱从哪里来
                - 负债和股东权益的结构
                - 如果负债占总资产比例很高(&gt;70%)，说明公司高度依赖借债经营，一旦经营出现波动，可能出现问题
                - 负债率不是越低越好，适度举债可以放大股东的回报率
                - 不同行业负债差异很大，银行和房地产天然是高负债行业，科技公司和消费品公司负债率很低
            - 衡量偿债能力的指标
                - 短期偿债能力
                    - 看的是公司能不能应付眼前的债务
                    - 流动比率=流动资产/流动负债
                    - 衡量的是公司用短期内能变现的资产去覆盖短期内必须偿还的债务的能力
                    - 一般认为流动比率在 1.5 到 2 之间比较健康，低于 1 意味着短期资产不够偿还短期债务
                - 速动比率
                    - (流动资产-存货)/流动负债
                    - 把存货提出来，只看更容易变现的资产
                    - 速动比率在 1 以上通常被认为是安全的，意味着不靠存货就能覆盖短期债务
                - 现金比率
                    - 货币资金/流动负债
                    - 只看账上最硬的真金白银能覆盖多少短期债务
                    - 这个指标过于保守，实际中不常用
                - 长期偿债能力
                    - 看的是公司整体的杠杆水平
                    - 资产负债率=总负债/总资产*100%
                    - 这是最常用的杠杆指标
                    - 制造业和消费行业资产负债率 40%-60% 算正常，房地产行业 60%-80% 常见
                    - 科技轻资产公司通常在 30%-50%
                    - 公用事业公司有大量固定资产可能在 50%-70%
            - 衡量资产质量的指标
                - 资产质量指标告诉你的公司家底是否扎实
                - 应收帐款周转天数
                    - 365 / (营业收入/平均应收帐款)
                    - 衡量的是公司从卖出货物到收回现金平均需要多少时间
                    - 周转天数越短说明公司收钱越快，议价能力越强
                    - 如果周转天数从去年的 45 天变成了 90 天，说明客户的付款速度明显变慢了
                    - 要么是公司放松了信用政策，要么是下游客户的经营出了问题，两种都不是好消息
                - 存货周转天数
                    - 365 / (营业成本/平均存货)
                    - 衡量存货从采购到卖出平均需要多少天
                    - 对于食品、电子产品这类保质期短或者贬值快的行业，存货周期变慢是严重的预警
                - 上述两个指标不看绝对值，而是看趋势和同行对比
                - 商誉
                    - 如果一家公司收购另一家公司，出价高于被收购公司净资产的公允价值，多付的被称为商誉
                    - 商誉本质是对未来协同效应的乐观预期
                    - 如果收购后实际效果不如预期，商誉会减值
                    - 商誉会直接从利润扣除，一下让公司从盈利变为亏损
                    - 当公司资产负债表商誉占比很高，要注意
            - 一家好公司的资产负债表
                - 账号有充足的资金，不用为短期生存发愁
                - 应收帐款和存货的增速与营收增速大致匹配
                - 流动比率在 1.5 以上，短期偿债没有压力
                - 资产负债率在行业合理范围，没有过度举债
                - 商誉占比不高或者没有商誉
                - 股东权益中未分配利润持续增长
    - 利润表
        - 利润表的结构与逻辑
            - 利润表记录的是一段时间内公司经营的全过程
            - 核心逻辑可以用漏斗来理解：钱从营业收入开始流入，经过一层层的成本和费用扣减，最终剩下的就是净利润
            - 营业收入
                - 营业收入是起点，也叫营收或者收入，公司通过卖产品或提供服务获得的总金额
                - 营收是一家公司规模和市场地位最直观的体现
                - 营收不等于公司公司收到的现金，只要货物已交付或者任务已完成，哪怕客户还没付款，会计上也可以确定为收入
            - 营业成本
                - 公司为了生产产品或提供服务而直接发生的支出
                - 例如制造业的原材料采购和工人工资、餐饮业的食材成本
            - 毛利润
                - 营收减去营业成本就得到毛利润
                - 毛利润体现了公司产品本身的盈利能力
                - 毛利润没扣除管理层工资、广告费、研发费这些间接支出
                - 毛利润可以理解为产品层面赚了多少，后面要扣的费用是公司运营层面花了多少
            - 费用
                - 销售费用
                    - 为了把产品卖出去而花的钱
                    - 例如广告投入、销售人员工资和提成、渠道佣金、促销活动、运输费等
                - 管理费用
                    - 维持公司日常运转的行政支出
                    - 管理层薪酬、办公室租金、行政人员工资、差旅费、法律和审计费用等
                - 研发费用
                    - 公司投入新产品开发和技术创新的钱
            - 营业利润
                - 毛利润减去三大费用再加上其他经营收支就得到了营业利润，反映的是公司核心业务的盈利情况
                - 营业利润之后还要扣减财务费用、加上投资收益、以及一些营业外收资，最终得到利润总额
            - 净利润
                - 利润总额扣减掉所得税，就是最终的净利润
        - 完整示例
            - 营业收入 100 亿，卖出这些产品的直接成本是 55 亿，毛利润是 45 亿
            - 为了把产品卖出去花了 15 亿销售费用，公司管理花了 5 亿管理费用，研发新品花了 3 亿研发费用，三项费用合计 23 亿
            - 45 亿毛利润减去 23 亿期间费用等于 22 亿营业利润
            - 公司有些银行贷款产生了 2 亿利息支出（财务费用），对外投资赚了 1 亿（投资收益），收到 0.5 亿政府补贴（营业外收入）
            - 利润总额是 22 - 2 &#43; 1 &#43; 0.5 = 21.5 亿
            - 按 25% 的企业所得税税率扣税，交了大约 5.4 亿的税，最终净利润是 16.1 亿
            - 经常性利润
            - 一次性利润：政府补贴是一次性的，明年不一定有
        - 利润表关键信号
            - 营收增长但利润下降：公司虽然卖的更多了，但是成本费用增长更快，赚钱效率在下降，可能是打价格战或者消费费用失控
            - 利润严重依赖非经营性收入：如果投资收益、政府补贴、资产处置收益在利润中占比很大，说明主业赚钱能力可能很弱
            - 营收增长异常平滑：可能是人为调节过了
            - 某一项费用突然大幅变化
        - 核心利润率指标
            - 毛利率
                - 毛利率 = 毛利润/营业收入*100%
                - 毛利率最能体现一门生意本质
                - 毛利率越高说明产品的附加价值越高，公司在产业链的议价能力越强
                - 白酒行业毛利率在 70%-90%，软件和互联网公司毛驴很高，超市零售只有 15%-25%，制造业通常只有 20%-40%
                - 毛利率不能跨行业比较，但是一个行业内，毛利率高的公司通常意味着产品更有竞争力
                - 趋势：如果毛利率下降，但是营收增长，也说明生意在变差
            - 净利率
                - 净利率 = 净利润/营业收入*100%
                - 净利率是最终的赚钱效率，体现了公司在扣除所有成本、费用和税后，每 100 块营收最终能留下多少利润
                - 净利率综合反映了毛利率和非要红控制两方面的能力，有些公司毛利率很高但是净利率低，说明费用支出太多
        - 费用率指标
            - 销售费用率
                - 销售费用/营业收入*100%
                - 告诉你公司每赚 100 块钱要花多少在营销推广上
                - 消费品公司和互联网公司的销售费用通常较高，有些可能超过 30%
                - ToB 的工业品或者垄断企业销售费用率可能只有 3%-5%
                - 销售费用率需要关注的核心问题是效率，花了钱后营收是否在增长，如果营收增速下降了，说明获客效率在下降
            - 管理费用率
                - 管理费用/营业收入*100%
                - 反映公司的管理效率
                - 随着公司营收增长，管理费用率应该逐步下降，因为管理费用中很多固定支出（办公司租金、行政人员工资）
                - 营收增长后这些固定支出被摊薄，这就是规模效应
                - 如果一家公司营收翻倍但是管理费用上升了，说明管理层没有控制好成本
            - 研发费用率
                - 研发费用/营业收入*100%
                - 关键不在于花了多少，而是花出去的钱有没有转化成有竞争力的产品和持续的营收增长
                - 通常和营收增速一起看
                    - 如果研发费用率保持 15% 而营收每年增长 20% 以上，说明研发投入有成果
                    - 如果研发费用率 20% 但营收已经连续两年不增长说明钱花的不够聪明
    - 现金流量表
        - 为什么利润不等于现金
            - 会计记账采用的是权责发生制，而不是收付实现制
            - 只要交易在经济意义上发生，不管钱是否到账，都可以记录为收入或者支出
            - 利润表告诉公司应该赚了多少，现金流量表告诉公司实际收到和花出了多少真金白银
            - 举例
                - 12 月份卖 500 万的货给客户，客户三个月后付款，按权责发生制，12 月利润表就可以确认 500w 利润，挂在应收帐款下
                - 12 月买 200 万的设备，能用 10 年，会计上不会把 200 万一次性计入当月成本，而是分 10 年每年折旧 20 万
            - 历史上很多公司利润表年年盈利，最后倒闭，就是因为现金流断裂，收不回现金
        - 现金流的三大板块
            - 经营活动现金流
                - 最核心的部分，反映了公司通过日常经营-卖产品，提供服务-实际收到多少现金，花出多出现金
                - 流入项包括销售商品收到的现金，提供劳务收到的现金等
                - 流出项包括采购原材料支付的现金、支付给员工的现金、缴纳的税款等
                - 经营活动现金流净额如果为正，说明公司的业主在造血
                - 一家公司可以通过调整会计政策来美化利润，但是经营现金流很难操作，有银行流水佐证
                - 通常把经营活动现金流金额和净利润放在一起，如果经营现金流长期大于或接近净利润，说明利润质量很高
            - 投资活动现金流
                - 反映的是公司在长期资产上的投入和回收
                - 流出项主要是购买固定资产、购买无形资产、对外投资收购
                - 流入项主要是处置固定资产回收的现金、出售投资回收的现金等
                - 通常是负数，一家正在成长的公司需要不断投入资金来扩大产能
                - 如果长期为正数，需要担心公司是否是变卖家产来生存
            - 筹资活动现金流
                - 反映的是公司和资金提供者之间的现金往来
                - 流入项包括银行借款、发行债券、增发股票融资等
                - 流出项包括偿还借款本金、支付利息、支付股东分红等
                - 筹资活动现金流为正说明公司在从外部输血
                - 为负说明公司在还血
                - 优秀的公司经营现金流充足到不需要外部融资就能支撑投资和分红，筹资活动现金净额为负或者小幅为正
        - 通过三类现金流判断公司所处的阶段
            - 最健康的组合是经营为正、投资为负、筹资为负
                - 意味着公司赚到的现金够多，一边扩张一边还债分红，完全靠自身造血能力驱动发展
            - 经营为正、投资为负、筹资为正也很常见，说明公司在快速扩张期
            - 经营为负、投资为负、筹资为正是最典型的烧钱模式
            - 经营为负、投资为正、筹资为正是最危险的组合
                - 主业不赚钱，靠变卖资产和借钱维持运营，是衰退或濒临破产的信号
    - 三表之间的关系
        - 资产负债表是起点和终点
        - 利润表和现金流量表是两条路径，解释了资产负债表从年初状态到年末状态的过程
        - 利润表解释了股东权益中未分配利润的变化，现金流量表解释了货币资金的变化
        - 三条核心连接线
            - 利润表的净利润流入资产负债表的股东权益
            - 现金流量表的三类现金流净额合计等于资产负债表上货币资金的变化
            - 利润表和现金流量表的桥梁
                - 间接法
                    - 起点是净利润，然后通过一系列调整把净利润还原成经营活动现金流
                    - 加回折扣和摊销
                    - 扣除应收帐款的增加
                    - 扣除存货的增加
                    - 加回应付帐款的增加
    - PE 市盈率
        - PE 的定义与直觉理解
            - PE = 股价 / 每股收益(EPS)
            - PE = 总市值 / 净利润
            - 假设公司每年都赚一样的钱，需要多少年才能通过利润回本
            - 静态 PE 是通过过去一年已经公布的净利润来计算
            - 动态 PE 用的是最近四个季度的净利润之和
        - PE 的应用方法
            - 同行业对比
                - 关键不是 PE 的绝对数字，而是差异背后的原因是否合理
            - 历史对比
                - 同一家公司的 PE 会随着市场情绪波动
                - 可以查询到 PE 的历史百分位，
            - 常见 PE
                - 银行股 PE 通常在 4-8 倍
                - 消费品公司 PE 通常在 20-35 倍
                - 高科技成长股 PE 可能在 50 倍甚至 100 倍以上
        - PE 局限性
            - PE 对亏损公司无效
                - 亏损公司的净利润为负数
            - PE 可以被一次性因素扭曲
                - 政府补贴等一次性因素会带来利润的暴涨或暴跌，PE 大幅失真
                - 扣除一次性项目后的扣非净利润算出的 PE 更有参考价值
                - 很多网站会提供 PE 和扣非 PE 两个数字
            - PE 是静态视角没有考虑增长
            - PE 无法反映资产负债情况
            - 低 PE 可能是价值陷阱
                - 低 PE 如果没有利润稳定或增长的支持就毫无意义
    - PB 市净率与 ROE
        - PB 市净率
            - PB = 股价/每股净资产
            - PB = 总市值/净资产(股东权益)
            - 净资产就是资产负债表上的股东权益，也就是总资产减去总负债后真正属于股东的部分
            - PB 衡量的是市场愿意为公司的每一块钱净资产支付多少钱
            - 直觉含义：今天把这家公司买下来然后立即清算，把所有资产卖掉，把所有债还清，是赚钱还是亏钱
            - PB 等于 1 意味着市值刚好等于净资产，以成本价买了公司所有家底
            - PB 最适合用于重资产行业的估值
            - 银行是 PB 用的最多的领域，银行的资产主要是贷款和债券，账面价值比较接近真实价值
            - 中国银行股的 PB 普遍在 0.4-0.8 倍之间，市场担心隐藏的坏账会让净资产缩水
            - 房地产、钢铁、建筑等重资产行业也常常用 PB 估值，这些行业净资产是真实可感的硬资产
            - PB 不适合轻资产公司
        - ROE 净资产收益率
            - ROE = 净利润 / 平均净资产 * 100%
            - ROE 是把利润表和资产负债表连接起来的桥梁，告诉你股东投入的每一块钱在一年能赚回多少利润
            - 巴菲特表示如果只能看一个财务指标只会选 ROE
            - ROE 直接衡量一家公司为股东创造回报的效率，可以理解为股东资金的回报率
            - 长期 ROE 能稳定在 15% 以上的公司通常被认为是优秀的企业
            - 低于 10% 说明盈利效率一般
            - 低于 5% 不如自己买理财产品
            - 持续性很关键，连续 5 年甚至 10 年的 ROE 都在 15%-20% 才是优质公司，例如苹果、茅台、腾讯
        - ROE、PB、PE 之间的内在关系
            - PB = PE x ROE
            - 如果两家公司的 PE 相同都是 20 倍，一家 ROE 是 25%，另一家是 8%
            - ROE 高的 PB 是 5 倍，ROE 低的只有 1.6 倍
            - 市场愿意为高 ROE 的公司支付更高的 PB 溢价
        - 杜邦分析
            - 杜邦分析法就是用来拆解 ROE，找到驱动因素的工具
            - ROE = 净利润 x 总资产周转率 x 权益系数
            - 净利润（营收/总资产）代表赚钱的效率
            - 资产周转率（营收/总资产）代表资产的使用效率
            - 权益乘数（总资产/股东权益）代表杠杆水平，权益乘数越多说明负债越多
            - 茅台这类公司的 ROE 高主要靠超高的净利率
            - 沃尔玛这类零售公司的 ROE 主要靠的是极高的资产周转率
            - 银行的 ROE 主要来自于高杠杆
    - 估值综合应用
        - PS 市销率
            - PS = 总市值/营业收入
            - 衡量的是市场为公司每一块钱的营业收入愿意支付多少钱
            - PS 等于 5，意味着你要花 5 块钱才能买到公司 1 块钱的年收入
            - PE 对亏损公司无效，因此，PS 就是最实用的估值工具
            - PS 的逻辑
                - 公司现在不赚钱，但它的收入在高速增长且未来有望实现盈利，市场就会给他的收入一个估值倍速
            - 适用场景
                - 高增长但是尚未盈利的公司
            - 局限性：营收高不代表能赚钱，一旦公司盈利就要切换到 PE
            - 使用 PS 要关注公司的毛利率，高毛利率加上高营收增速的组合才是 PS 估值的理想标的
        - PEG 指标
            - PEG = PE / 预期利润增长率(%)
            - 解决了 PE 最大的缺陷：不考虑增长
            - PEG 等于 1 被认为是合理估值，低于 1 被认为是低估，高于 1 被认为是高估
            - PEG 最大的局限性就是预期利润增长率用谁的预测，用过去的增速，历史不等于未来
            - PEG 的最佳使用场景是盈利且利润增速在 15%-20% 之间的成长股
        - 不同类型的公司的估值方法选择
            - 稳定盈利的成熟公司用 PE 为主
            - 高增长公司用 PEG 为主
            - 亏损但高增长的公司用 PS 为主
            - 重资产行业用 PB 为主
            - 周期性行业需要特殊处理，PE 高买入，PE 低卖出（利润高），更看 PB，跌到 PB 低的时候关注
        - 行业分析入门
            - 为什么行业分析重要
                - 行业分析帮助回答的问题
                    - 这个行业的蛋糕有多大，还在不在变大
                    - 这个行业赚钱容不容易、利润会不会被竞争吃掉
                    - 这个行业未来三到五年会变好还是会变差
                - 好行业有几个共同特征
                    - 市场空间大，还在不断增长
                    - 行业内公司能赚到不错的利润率
                    - 龙头公司有明显的竞争壁垒
                    - 不容易被新技术或者新商业模式颠覆
                - 判断方法
                    - 查看龙头公司的毛利率和净利率趋势
