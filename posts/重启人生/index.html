- 东西放在固定的地方\\n                - 空调遥控器，床头柜\\n                - 手机，床头柜\\n                - 耳机，床头柜\\n                - 梳子、剃须刀，梳妆台\\n            - 东西拿完后放在固定的地方\\n            - 小便要抖干净\\n            - 经常刷鞋\\n            - 垃圾及时丢到垃圾桶\\n            - 鞋子放在鞋架，第二天穿的鞋及时晾晒\\n            - 床上不要放不必要的东西\\n        - 身体状态\\n            - 手脚冰冷要及时注意保暖\\n    - 运动\\n        - 保持散步，每天关闭活动圆环\\n        - 经常游泳\\n        - 尝试纠正脊椎侧弯，每天吊一会单杠\\n        - 养成健身房健身的习惯\\n    - 心理\\n        - 任何时候，只要身体没有疲劳，就应该立即行动\\n        - 不要焦虑内耗\\n        - 焦虑的时候，戴上耳机去跑步\\n        - 经常和 chatgpt 对话\\n    - 社交\\n        - 积极了解和整理当下热点话题\\n        - 把嗯、哦换成清晰短句\\n        - 1 - 3s 的眼神接触 + 微表情\\n        - 需求直给，减少内心纠结\\n        - 适当接话，不要逃避和宕机\\n        - 避免成为透明人，也不抢戏\\n        - 按照练习而不是表演的心态和别人交流，每次交流都是完成一个小目标\\n        - 将重心放在自己而不是别人的感受上面\\n        - 聊天万能公式 = 观察 + 具体提问/小感叹 + (可选)递话茬\\n            - 观察：正在发生的事情，例如排队、电梯\\n            - 具体提问：基于观察给出具体提问，不要大而空泛\\n        - 放弃完美接话\\n            - 表达共鸣 + 一点细节\\n            - 不硬接不懂的话题\\n            - 不过度解读\\n            - 不要使用哦、嗯、啊、好的，试着带点内容\\n        - 狭小空间\\n            - 眼神接触 + 点头/微笑 + 简单问候 + 不看手机 + 不硬聊\\n        - 不想参与对话\\n            - 直接 + 礼貌 + 简短拒绝 + 不编复杂借口\\n        - 线上沟通\\n            - 收到消息，不秒回，给自己一个缓冲\\n            - 回复带表单和语气词，例如 ～、哈、谢谢\\n            - 收到了 @ ，不装死，简单回复“收到，在处理了“。\\n    - 休息\\n        - 听一听播客\\n        - 休息时不要玩手机，统计一天的手机使用时长\\n        - 除了睡觉时间不要躺在床上\\n        - 像安排会议一样安排娱乐，5 分钟，不受外界干扰\\n    - 工作\\n        - 建立 SOP\\n            - 目标是什么，知道具体为什么做\\n            - 要有核心步骤和运行标准\\n            - 包含注意事项\\n        - 跨部门合作\\n            - 目标：解决跨部门对接不敢问、问不清、跟进无上下文的痛点\\n            - 核心步骤\\n                - 对接前准备\\n                    - 明确三个核心信息：需求信息、截止时间、交付标准\\n                    - 找好对接人：直属领导、项目经理、部门同事\\n                - 对接时\\n                    - 问候+背景+需求+标准+时间\\n                    - 主动问反馈时间\\n                - 沟通后\\n                    - 发文字确认：文字留痕\\n                    - 对接信息记录到任务协作记录表（对接人、需求、截止时间、反馈节点）\\n                - 跟进与闭环\\n                    - 到时间没反馈，主动询问\\n                    - 按照约定时间跟进进度，完成后发感谢消息，同时更新协作记录表为已完成\\n        - 工作周报 SOP\\n            - 目标：避免周报写的像流水账、方案漏关键信息、重复修改，让成果输出有逻辑、符合要求，避免返工\\n            - 核心步骤\\n                - 写前收集：每周五上午 10 点\\n                    - 收集 3 类素材：本周完成的任务，任务对应的数据、遇到的问题\\n                    - 参考公司流程框架\\n                - 撰写内容\\n                    - 本周工作成果：重要程度排序，不说做什么，要说做成了什么\\n                    - 数据汇总：清晰直观\\n                    - 问题与改进：不只说问题，要说问题 + 改进思路\\n                    - 下周计划：优先级排列\\n                - 自查\\n                    - 数据是否准确\\n                    - 逻辑是否清晰\\n                    - 任务是否有漏\\n                - 提交和反馈\\n                    - 邮件发直属领导\\n                    - 领导反馈，记录需要改进的点，\\n        - 进度和风险及时和领导同步\\n        - 养成专注的习惯，尽量进入心流状态\\n        - 拉齐会议前要有议程，会议结束后要有总结并同步到群内，会议前记得开启会议录制\\n        - 不要直接答应别人的要求，学会拒绝\\n        - 做事情前期给出明确的时间点\\n        - 学会排期和估时\\n        - 坐姿端正，不要翘二郎腿\\n        - 学会拆解任务\\n        - 使用番茄时钟，5 分钟进行时间审计，制定 SOP 的目标\\n    - 营养\\n        - 购买鱼油、复合维生素、锌补剂\\n    - 记录\\n        - 每日进行复盘，建一个文件夹，将每天做的事情记录下来\\n        - 每天早晨进行记录想法\\n    - 投资\\n        - 定投纳指 + 标普 + 上证 + 沪深\\n    - 学习\\n        - 使用费曼学习法\\n        - 使用思维导图\\n        - 学习演讲能力\\n        - 学习编写文档的能力\\n        - 学习沟通能力\\n        - 学习唱歌、简单舞蹈\\n        - 学习聚会小游戏\\n    - 决策\\n        - 决策前要深思熟虑，重大决定不轻易下达\\n    - 购物\\n        - 极简主义，不买不需要的东西\""</script><script>(function(){if(typeof MindElixir=="undefined"){console.error("MindElixir not loaded. Check your CDN script tag.");return}const n="me_0";let e=JSON.parse(document.getElementById(n+"_src").textContent);function s(){return"n_"+Math.random().toString(16).slice(2)+Date.now().toString(16)}function a(e){const o=e.split(/\n/).map(e=>e.replace(/\s+$/g,"")).filter(e=>e.trim().length>0);console.log(o);const t=[];let n=null;for(const u of o){const r=u.match(/^(\s*)([-*+])\s+(.*)$/);if(!r)continue;const h=r[1].replace(/\t/g,"  ").length,d=Math.floor(h/2);let e=r[3].trim(),c=null;const l=e.match(/^(.*?)(?:\s*->\s*)(https?:\/\/\S+)\s*$/);l&&
