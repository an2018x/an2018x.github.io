ment=elements[0];const e=encodeURI(activeElement.getAttribute("id")).toLowerCase();document.querySelector(`.inner ul li a[href="#${e}"]`).classList.add("active")}const t=document.getElementById("top-link");t&&t.addEventListener("click",e=>{e.preventDefault(),window.scrollTo({top:0,behavior:"smooth"})})},!1),window.addEventListener("resize",function(){checkTocPosition()},!1),window.addEventListener("scroll",()=>{const e=window.pageYOffset||document.documentElement.scrollTop;if(e===0)return;elements&&elements.length>0&&(activeElement=Array.from(elements).find(t=>{if(getOffsetTop(t)-e>0&&getOffsetTop(t)-e<window.innerHeight/2)return t})||activeElement,elements.forEach(e=>{const n=encodeURI(e.getAttribute("id")).toLowerCase(),t=document.querySelector(`.inner ul li a[href="#${n}"]`);if(e===activeElement){t.classList.add("active");const e=document.querySelector(".toc .inner"),n=t.offsetTop,s=e.clientHeight,o=t.clientHeight,i=n-s/2+o/2;e.scrollTo({top:i,behavior:"smooth"})}else t.classList.remove("active")}))},!1);const main=parseInt(getComputedStyle(document.body).getPropertyValue("--article-width"),10),toc=parseInt(getComputedStyle(document.body).getPropertyValue("--toc-width"),10),gap=parseInt(getComputedStyle(document.body).getPropertyValue("--gap"),10);function checkTocPosition(){const e=document.body.scrollWidth;e-main-toc*2-gap*4>0?document.getElementById("toc-container").classList.add("wide"):document.getElementById("toc-container").classList.remove("wide")}function getOffsetTop(e){if(!e.getClientRects().length)return 0;let t=e.getBoundingClientRect(),n=e.ownerDocument.defaultView;return t.top+n.pageYOffset}</script><div class=post-content><h1 id=cap-与一致性模型>CAP 与一致性模型<a hidden class=anchor aria-hidden=true href=#cap-与一致性模型>#</a></h1><div id=me_0 class=mindelixir-container style=height:560px;width:100%></div><script type=application/json id=me_0_src>"\"- CAP 与一致性模型\\n    - CAP 定理\\n        - 组成\\n            - C(Consistency，一致性)：所有客户端在同一时刻读到的数据一致\\n            - A(Availability，可用性)：每个请求都能在有限时间内得到非错误响应\\n            - P(Partition tolerance，分区容错)：系统在网络分区时仍然能提供服务\\n        - 关键结论\\n            - 发生网络分区时，无法同时满足 C 和 A\\n            - 分布式系统里 P 几乎是必选项（网络一定会分区/超时/抖动）\\n    - 一致性\\n        - 线性一致性\\n            - 定义：所有操作看起来像某个全局时间顺序瞬间发生，读一定能看到最近完成的读\\n            - 工程含义：通常需要 leader+共识+或严格 quorum+顺序约束\\n            - 代价：跨节点协调-\\u003e延迟变高；分区时更可能不可用\\n        - 顺序一致：比线性一致弱\\n            - 只要存在一个全局顺序能解释所有的操作，但不要去符合真实时间，不要去最近完成的写立即可见\\n        - 因果一致：社交消息系统常见\\n            - 保证有因果关系的操作顺序一致；无因果关系的并发操作允许不同节点看到不同顺序\\n            - 先发帖再评论，所有人必须看到帖再评论，但两个人同时发帖，顺序可能不一样\\n        - 最终一致：AP 常见的一致性目标\\n            - 定义：如果不再有新的更新，所有副本都最终收敛到一个值\\n            - 允许：短时间读到旧值，不同客户端看到不同值\\n            - 收敛：复制、反熵、读修复、后台合并、冲突解决策略\\n    - Quorum(N/R/W)\\n        - 数据库用 quorum 思路来调一致性/可用性\\n        - 定义\\n            - N：副本数\\n            - W：写成功需要确认的副本数\\n            - R：读成功需要读取的副本数\\n        - 关键结论\\n            - 若 R+W\\u003eN，读写集合必然有交集-\\u003e通常能读到最新写（接近强一致，但还要考虑版本选择/时钟/并发写）\\n            - 若 R+W\\u003c=N，可能读不到最新写（更偏最终一致/读旧值概率更高）\\n            - 举例\\n                - W=2,R=2-\\u003eR+W=4\\u003e3：读写交集至少一个副本，读更可能拿到最新\\n                - W=1,R=1-\\u003e2\\u003c=3：读很可能读到旧副本\\n        - 分区时怎么选 C/A\\n            - 更一致：提高 W 或 R，分区更容易失败\\n            - 更可用：降低 W 或 R，分区时能继续响应，可能读旧/冲突\\n        - 读修复与 hinted handoff\\n            - Read Repair（读修复）：读时发现副本版本不一致，把新值回写到旧副本，加速收敛\\n            - Hinted Handoff：某副本暂时不可达，协调者先把代写的 hint 记录下来，等它恢复再补写\\n        - 冲突从哪里来？怎么解决？\\n            - AP 系统分区时允许两边都写 -\\u003e 一定会出现冲突，关键是冲突语义\\n            - LWW(Last Write Wins)\\n                - 用事件戳/版本号选最新覆盖旧值\\n                - 风险：依赖时钟\\n                - 优点：实现简单，很多常见足够\\n            - 向量时钟/版本向量\\n                - 判断两个更新是否并发（不可比较）还是有先后关系（可比较）\\n                - 并发写需要应用层合并\\n            - CRDT\\n                - 通过数学结构保证并发合并可收敛\\n    - 一致性 != 事务 ACID\\n        - CAP 的 C：指副本之间对外可见的读写一致语义\\n        - ACID 里的 C：Consistency（约束一致性）是事务前后满足约束\\n        - 事务强一致可能跨分区不可用；最终一致系统也可以在单分区内做局部事务\\n    - 典型场景\\n        - 必须强一致\\n            - 余额扣款、库存扣减不超卖、唯一性约束、权限变更立即生效\\n            - 宁可失败重试/排队，也不能错\\n        - 可以最终一致\\n            - 点赞数、播放量、推荐特征、日志埋点、监控指标\\n            - 短时间误差可接受，最终对齐即可\\n        - 折中：读写分离 + 关键路径强一致\\n            - 下单扣库存走强一致存储：报表/BI 走 ClickHouse 最终一致导入\\n            - 缓存允许短暂不一致，通过失效策略、异步刷新、补偿修正\""</script><script>(function(){if(typeof MindElixir=="undefined"){console.error("MindElixir not loaded. Check your CDN script tag.");return}const n="me_0";let e=JSON.parse(document.getElementById(n+"_src").textContent);function s(){return"n_"+Math.random().toString(16).slice(2)+Date.now().toString(16)}function a(e){const o=e.split(/\n/).map(e=>e.replace(/\s+$/g,"")).filter(e=>e.trim().length>0);console.log(o);const t=[];let n=null;for(const u of o){const r=u.match(/^(\s*)([-*+])\s+(.*)$/);if(!r)continue;const h=r[1].replace(/\t/g,"  ").length,d=Math.floor(h/2);let e=r[3].trim(),c=null;const l=e.match(/^(.*?)(?:\s*->\s*)(https?:\/\/\S+)\s*$/);l&&(e=l[1].trim(),c=l[2].trim());const i={id:s(),topic:e,children:[]},a=e.match(/!\[\]\(\s*([^,\]]+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)\s*$/i);if(a){const t=a[1].trim(),n=Number(a[2]),s=Number(a[3]);e=e.replace(a[0],"").trim(),i.topic="",i.image={url:t,width:n,height:s}}if(c&&(i.hyperLink=c),!n){n=i,t.push({level:0,node:n});continue}for(;t.length&&t[t.length-1].level>=d;)t.pop();const m=t.length?t[t.length-1].node:n;m.children.push(i),t.push({level:d,node:i})}return n||{id:s(),topic:"Empty",children:[]}}e=JSON.parse(e),console.log(e);const t=a(e);console.log(t);const o={nodeData:{id:t.id,topic:t.topic,root:!0,children:t.children||[]},arrows:[],summaries:[],direction:2};console.log(o);const i=window.MindElixir?.default??window.MindElixir;if(typeof i!="function"){console.error("MindElixir loaded but not a constructor. window.MindElixir =",window.MindElixir);return}const r=new i({el:"#"+n});r.init(o)})()</script><h1 id=分布式存储底层>分布式存储底层<a hidden class=anchor aria-hidden=true href=#分布式存储底层>#</a></h1><div id=me_1 class=mindelixir-container style=height:560px;width:100%></div><script type=application/json id=me_1_src>"\"- 分布式存储底层\\n    - 分布式存储底层总览\\n        - Client/SDK\\n        - 路由层：根据 Key 找到 Shard/Leader\\n        - 分片层：每个分片负责一段 key 空间\\n        - 复制层：每个分片有 N 个副本\\n        - 一致层/共识层：决定写要等谁确认，谁是 Leader，如何提交日志\\n        - 存储引擎层：WAL + Memtable + SST/BTREE 等\\n        - 后台维护：compaction、rebalance、修复、反熵、GC\\n    - 数据分片\\n        - 为什么必须分片\\n            - 目标：水平扩展，吞吐=节点数线性增长\\n        - 分片策略对比\\n            - Hash 分片\\n                - 优点：数据分布均匀，天然抗热点\\n                - 缺点：范围查询弱，扩容时大量搬迁\\n                - 适用：KV，用户 ID 随机读写，计数器，缓存\\n            - Range 分片\\n                - 优点：范围查询强\\n                - 缺点：容易热点，需要 split/merge\\n                - 适用：按事件排序的日志、时序、OLAP 分区表\\n            - 一致性哈希 + 虚拟节点\\n                - 目标：扩容/缩容时减少迁移量\\n                - 一致性哈希结论：加/减一个节点只影响环上相邻的一段 key\\n                - 虚拟节点：每台机器对应多个 vnode，负载更均衡，迁移更细粒度\\n        - 路由：请求如何找到分片\\n            - Client-side routing（客户端算）\\n                - Client 拿到分片拓扑，自己算目标节点\\n                - 优点：少一跳、性能好\\n                - 缺点：拓扑变更要更新客户端（gossip/配置中心）\\n            - Proxy/Router（中间代理）\\n                - 由 Proxy 接请求，负责路由与重试\\n                - 优点：客户端简单，拓扑变更透明\\n                - 缺点：proxy 可能成为瓶颈/单点\\n            - Coordinator （协调节点）\\n                - 写入/查询可能由协调者拆分到多个分片再聚合\\n                - 常用于分析系统/分布式 SQL\\n        - Rebalance（扩缩容/再均衡）\\n            - 扩容\\n                - 数据迁移：搬迁期间读写怎么保证正确性\\n                - 双写/转发：迁移期间某些 key 可能在 old/new 两处\\n                - 限流：迁移会抢光 IO/CPU，影响线上延迟\\n            - 策略\\n                - 迁移期间双写，再切流\\n                - 迁移期间转发（写 old，old 转发到 new）\\n                - 分批搬迁+限速+热点优点处理\\n                - 稳定窗口切换元数据\\n    - 热点问题\\n        - 热点是什么\\n            - Hot key：单个 key QPS 极高\\n            - Hot partition：单个分片承担大量 key 或大量访问\\n        - 热点为什么致命\\n            - 分布式扩展依赖均匀分布，热点让整体吞吐被最热分片锁死\\n            - 延迟抖动：最热节点 CPU/网卡/锁竞争导致 p99 爆炸\\n        - 治理手段\\n            - Key 打散（加盐/分桶）\\n                - counter:global 拆分成 counter:global:{0..99}，读时聚合，写时随机桶\\n                - 代价：读放大/需要聚合\\n            - 读写分离 + 多副本读\\n                - 热读 key：允许从 follower/replica 读，或者使用 cache 层\\n            - 本地缓存 + 请求合并\\n                - 在网关/服务端合并通同 key 并发请求，防止缓存击穿引起雪崩\\n            - 分区拆分\\n                - range 分片：把热区间再拆细\\n                - 配合动态 split\\n            - 异步化/预计算\\n                - 把热点聚合改成写日志，异步聚合出结果\\n    - 副本复制\\n        - Leader-Follower（主从/Primary-Replica）\\n            - 写入路径：Client-\\u003eLeader 写入-\\u003e复制到 followers-\\u003e达到确认策略后返回\\n            - 关键问题\\n                - 同步复制 vs 异步复制\\n                    - 同步：延迟高但丢数据风险低\\n                    - 异步：延迟低但主挂可能丢最后一段数据\\n                - 读策略\\n                    - 读 leader：更一致\\n                    - 读 follower：延迟小/抗压，但可能读旧\\n            - 适用：大多数传统分布式 DB/缓存系统\\n        - Multi-Leader（多主）\\n            - 多个 Leader 都可写，各自复制\\n            - 冲突不可避免，需要冲突解决（LWW/向量时钟/CRDT/业务合并）\\n            - 适用：跨地域多活、离线写入，复杂度高\\n        - Leaderless（无主，Dynamo 风格）\\n            - 任意节点可接写，写到 N 个副本\\n            - 用 Quorum(N/R/W)控制一致性\\n            - 配套：读修复、hinted handoff、反熵\\n            - 适用：高可用、可水平扩展、允许最终一致的系统\\n    - 一致写入确认：Quorum\\n        - 定义\\n            - N：副本数\\n            - W：写成功需要确认的副本数\\n            - R：读成功需要读取的副本数\\n        - 关键结论\\n            - 若 R+W\\u003eN，读写集合必然有交集-\\u003e通常能读到最新写（接近强一致，但还要考虑版本选择/时钟/并发写）\\n            - 若 R+W\\u003c=N，可能读不到最新写（更偏最终一致/读旧值概率更高）\\n            - 举例\\n                - W=2,R=2-\\u003eR+W=4\\u003e3：读写交集至少一个副本，读更可能拿到最新\\n                - W=1,R=1-\\u003e2\\u003c=3：读很可能读到旧副本\\n    - 共识与选主\\n        - 共识\\n            - 只有一个 Leader（避免脑裂乱写）\\n            - 日志顺序一致（写入顺序全局一致）\\n            - 多数派提交（保证故障后不回滚）\\n        - Raft 最小正确集\\n            - Leader 选主\\n                - 节点有 term(任期)，超时发起选举\\n                - 多数派投票选出 Leader\\n                - 心跳维持 leader 身份\\n            - 日志复制\\n                - 客户端写入先到 leader\\n                - leader 追加日志并复制给 follower\\n                - follower 按 index/term 对齐（不一致就回滚到匹配点再补）\\n            - 提交规则\\n                - leader 只有在日志被多数派复制后才能提交\\n                - 提交后对外可见\""</script><script>(function(){if(typeof MindElixir=="undefined"){console.error("MindElixir not loaded. Check your CDN script tag.");return}const n="me_1";let e=JSON.parse(document.getElementById(n+"_src").textContent);function s(){return"n_"+Math.random().toString(16).slice(2)+Date.now().toString(16)}function a(e){const o=e.split(/\n/).map(e=>e.replace(/\s+$/g,"")).filter(e=>e.trim().length>0);console.log(o);const t=[];let n=null;for(const u of o){const r=u.match(/^(\s*)([-*+])\s+(.*)$/);if(!r)continue;const h=r[1].replace(/\t/g,"  ").length,d=Math.floor(h/2);let e=r[3].trim(),c=null;const l=e.match(/^(.*?)(?:\s*->\s*)(https?:\/\/\S+)\s*$/);l&&(e=l[1].trim(),c=l[2].trim());const i={id:s(),topic:e,children:[]},a=e.match(/!\[\]\(\s*([^,\]]+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)\s*$/i);if(a){const t=a[1].trim(),n=Number(a[2]),s=Number(a[3]);e=e.replace(a[0],"").trim(),i.topic="",i.image={url:t,width:n,height:s}}if(c&&(i.hyperLink=c),!n){n=i,t.push({level:0,node:n});continue}for(;t.length&&t[t.length-1].level>=d;)t.pop();const m=t.length?t[t.length-1].node:n;m.children.push(i),t.push({level:d,node:i})}return n||{id:s(),topic:"Empty",children:[]}}e=JSON.parse(e),console.log(e);const t=a(e);console.log(t);const o={nodeData:{id:t.id,topic:t.topic,root:!0,children:t.children||[]},arrows:[],summaries:[],direction:2};console.log(o);const i=window.MindElixir?.default??window.MindElixir;if(typeof i!="function"){console.error("MindElixir loaded but not a constructor. window.MindElixir =",window.MindElixir);return}const r=new i({el:"#"+n});r.init(o)})()</script><h1 id=cassandrahbase>Cassandra/HBase<a hidden class=anchor aria-hidden=true href=#cassandrahbase>#</a></h1><div id=me_2 class=mindelixir-container style=height:560px;width:100%></div><script type=application/json id=me_2_src>"\"- Cassandra/HBase\\n    - LSM-Tree + WAL\\n        - ![](https://an-img.oss-cn-hangzhou.aliyuncs.com/2026/02/22/20260222101553862.png,604,382)\\n        - LSM-Tree 要解决什么问题\\n            - 传统 OLTP 存储引擎常见是 B+Tree\\n                - B+Tree 更新/插入会改动树上的多个节点页\\n                - 页可能在磁盘不同位置-\\u003e随机写很多\\n                - 随机在 HDD 上很慢，在 SSD 上也不便宜\\n            - LSM 的核心目标\\n                - 把随机写变成顺序写/批量写\\n                - 把整理数据到成本挪到后台异步做（Compaction）\\n            - LSM 通过先写日志+写内存+顺序刷盘成不可变文件，再后台合并文件，大幅提高写吞吐，但是读取会更复杂，且 compaction 会带来放大和抖动\\n        - 写入流程\\n            - 先写 WAL（顺序追加）\\n                - 把这条写操作追加到 WAL 文件末尾\\n                - 顺序写，非常快\\n                - 目的：宕机可恢复\\n            - 写入 Memtable（内存有序结构）\\n                - MemTable 一般用 SkipList/红黑树等保证有序\\n                - 写入是内存操作，快\\n            - MemTable 满了就 Freeze（变成 Immutable）\\n                - 当前 Memetable 变成不可变，新写进入新的 MemTable\\n                - immutable 的存在时为了让刷盘不阻塞写入\\n            - 刷盘生成 SSTable（顺序写文件）\\n                - 后台线程把 immutbale MemTable 以排序后的顺序写成 SSTable，不可变有序文件\\n                - SSTable 通常附带\\n                    - 稀疏索引\\n                    - Bloom Filter\\n                    - 数据块\\n        - 读流程\\n            - 步骤\\n                - 先查 MemTable\\n                - 再查 Immutable MemTable\\n                - 再查磁盘上的多个 SSTable\\n                - 找到 Key 后还要做版本合并\\n            - 同一个 Key 可能在很多层都有\\n                - SSTable 不可变，更新不是原地修改，而是写一个新版本\\n                - 旧版本会在后台 compaction 时被清理\\n                - 读放大：SSTable 越多，读需要查的地方越多\\n            - Bloom Filter 的作用\\n                - 对于某个 SSTable，Bloom Filter 判断：这个 key 不可能在里面-\\u003e直接跳过，不读磁盘\\n                - 如果 Bloom 说在，才去查索引/数据块\\n            - Delete 怎么做\\n                - LSM 不会立刻物理删除数据，而是写入一个 Tombstone（删除标记）\\n                - Delete(key) 本质是写入 key-\\u003etombstone\\n                - 读到 tombstone 说明该 key 已经被删除\\n                - 真正清理旧值与 tombstone，依靠 Compaction 完成\\n        - Compaction\\n            - 目标\\n                - 合并多个 SSTable\\n                - 丢弃被覆盖的旧版本\\n                - 清理 tombstone\\n                - 降低读放大、回收空间\\n            - Compaction 为什么会导致 p99 抖动\\n                - 需要大量读旧文件 + 写新文件\\n                - CPU 做合并、校验、压缩\\n                - 可能把 SSD/HDD 打满，影响在线请求\\n            - compaction 策略\\n                - Sized-Tiered Compaction\\n                    - 当 L0/L1 有若干大小相近的 SSTable，就合并成更大的\\n                    - 优点：写放大相对小，吞吐高\\n                    - 缺点：读放大可能更大\\n                - Leveled Compaction\\n                    - 各层有大小上限，保证 L1+ 之间范围重叠更可控\\n                    - 优点：读放大更小\\n                    - 缺点：写放大更高\""</script><script>(function(){if(typeof MindElixir=="undefined"){console.error("MindElixir not loaded. Check your CDN script tag.");return}const n="me_2";let e=JSON.parse(document.getElementById(n+"_src").textContent);function s(){return"n_"+Math.random().toString(16).slice(2)+Date.now().toString(16)}function a(e){const o=e.split(/\n/).map(e=>e.replace(/\s+$/g,"")).filter(e=>e.trim().length>0);console.log(o);const t=[];let n=null;for(const u of o){const r=u.match(/^(\s*)([-*+])\s+(.*)$/);if(!r)continue;const h=r[1].replace(/\t/g,"  ").length,d=Math.floor(h/2);let e=r[3].trim(),c=null;const l=e.match(/^(.*?)(?:\s*->\s*)(https?:\/\/\S+)\s*$/);l&&(e=l[1].trim(),c=l[2].trim());const i={id:s(),topic:e,children:[]},a=e.match(/!\[\]\(\s*([^,\]]+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)\s*$/i);if(a){const t=a[1].trim(),n=Number(a[2]),s=Number(a[3]);e=e.replace(a[0],"").trim(),i.topic="",i.image={url:t,width:n,height:s}}if(c&&(i.hyperLink=c),!n){n=i,t.push({level:0,node:n});continue}for(;t.length&&t[t.length-1].level>=d;)t.pop();const m=t.length?t[t.length-1].node:n;m.children.push(i),t.push({level:d,node:i})}return n||{id:s(),topic:"Empty",children:[]}}e=JSON.parse(e),console.log(e);const t=a(e);console.log(t);const o={nodeData:{id:t.id,topic:t.topic,root:!0,children:t.children||[]},arrows:[],summaries:[],direction:2};console.log(o);const i=window.MindElixir?.default??window.MindElixir;if(typeof i!="function"){console.error("MindElixir loaded
