        public class TimestampWatermarkDemo {

            public static class Event {
                public String user;
                public long eventTime;
                public int value;

                public Event(){}

                public Event(String user, long eventTime, int value) {
                    this.user = user;
                    this.eventTime = eventTime;
                    this.value = value;
                }

                public long getEventTime() {
                    return eventTime;
                }

                @Override
                public String toString() {
                    return "Event{" +
                            "user=&#39;" + user + &#39;\&#39;&#39; +
                            ", eventTime=" + eventTime +
                            ", value=" + value +
                            &#39;}&#39;;
                }
            }

            public static void main(String[] args) throws Exception {
                StreamExecutionEnvironment env = StreamExecutionEnvironment.getExecutionEnvironment();

                DataStream<Event> source = env.fromElements(
                        new Event("alice", 1000L, 1),
                        new Event("alice", 4000L, 1),
                        new Event("alice", 3000L, 1),
                        new Event("bob",   8000L, 1),
                        new Event("alice", 12000L, 1)
                );

                WatermarkStrategy<Event> wmStrategy = WatermarkStrategy.<Event>forBoundedOutOfOrderness(Duration.ofSeconds(5))
                        .withTimestampAssigner((event, recordTimestamp) -> event.getEventTime());

                DataStream<Event> withWaterMark = source.assignTimestampsAndWatermarks(wmStrategy);
                withWaterMark.print();
                env.execute("timestamp-water-mark-demo");
            }
        }
        ```
