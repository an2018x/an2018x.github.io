60px;width:100%></div><script type=application/json id=me_0_src>"\"- 全局框架\\n    - 系统层次\\n        - ![](https://an-img.oss-cn-hangzhou.aliyuncs.com/2026/02/18/20260218105815855.png,424,537)\\n        - 核心矛盾：速度差\\n            - CPU 运算快、内存慢、外设更慢\\n        - 系统用层次结构（寄存器/Cache/内存/磁盘）和并行性（流水线/乱序/多核/DMA）来隐藏或者摊薄延迟\\n        - 指令在 CPU 里按“取值-译码-执行-访存-写回“的数据通道运行\\n        - 为了加速，做流水线把这 5 步重叠\\n        - 内存访问通过 Cache 利用局部性降低平均延迟\\n        - 虚拟内存通过 MMU/TLB 把程序看到的地址映射到物理内存\\n        - I/O 慢是由于设备与总线带宽/延迟远弱于 CPU，因此依赖中断、缓冲与 DMA 来减少 CPU 参与\""</script><script>(function(){if(typeof MindElixir=="undefined"){console.error("MindElixir not loaded. Check your CDN script tag.");return}const n="me_0";let e=JSON.parse(document.getElementById(n+"_src").textContent);function s(){return"n_"+Math.random().toString(16).slice(2)+Date.now().toString(16)}function a(e){const o=e.split(/\n/).map(e=>e.replace(/\s+$/g,"")).filter(e=>e.trim().length>0);console.log(o);const t=[];let n=null;for(const u of o){const r=u.match(/^(\s*)([-*+])\s+(.*)$/);if(!r)continue;const h=r[1].replace(/\t/g,"  ").length,d=Math.floor(h/2);let e=r[3].trim(),c=null;const l=e.match(/^(.*?)(?:\s*->\s*)(https?:\/\/\S+)\s*$/);l&&(e=l[1].trim(),c=l[2].trim());const i={id:s(),topic:e,children:[]},a=e.match(/!\[\]\(\s*([^,\]]+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)\s*$/i);if(a){const t=a[1].trim(),n=Number(a[2]),s=Number(a[3]);e=e.replace(a[0],"").trim(),i.topic="",i.image={url:t,width:n,height:s}}if(c&&(i.hyperLink=c),!n){n=i,t.push({level:0,node:n});continue}for(;t.length&&t[t.length-1].level>=d;)t.pop();const m=t.length?t[t.length-1].node:n;m.children.push(i),t.push({level:d,node:i})}return n||{id:s(),topic:"Empty",children:[]}}e=JSON.parse(e),console.log(e);const t=a(e);console.log(t);const o={nodeData:{id:t.id,topic:t.topic,root:!0,children:t.children||[]},arrows:[],summaries:[],direction:2};console.log(o);const i=window.MindElixir?.default??window.MindElixir;if(typeof i!="function"){console.error("MindElixir loaded but not a constructor. window.MindElixir =",window.MindElixir);return}const r=new i({el:"#"+n});r.init(o)})()</script><h1 id=指令系统与数据表示>指令系统与数据表示<a hidden class=anchor aria-hidden=true href=#指令系统与数据表示>#</a></h1><div id=me_1 class=mindelixir-container style=height:560px;width:100%></div><script type=application/json id=me_1_src>"\"- 指令系统与数据表示\\n    - 整数与位运算的数据表示\\n        - 位、字节、字\\n            - bit：0/1\\n            - Byte：8bit\\n            - Word（字）：CPU 自然处理的宽度，与寄存器/ALU/地址宽度相关\\n            - 为什么 byte 是最小编址单位：大多数现代机器按照字节编址，方便表示字符/结构体/网络数据等\\n        - 原码/反码/补码\\n            - 原码\\n                - 表示方法：最高位符号位，剩下是绝对值\\n                - 问题：\\n                    - 有 +0 和 -0 两种零\\n                    - 加减法需要额外处理符号，硬件复杂\\n            - 反码\\n                - 正数同原码\\n                - 负数：对正数位取反\\n                - 问题\\n                    - 仍然有 +0 和 -0\\n                    - 加法需要回卷进位\\n            - 补码\\n                - 正数：与无符号相同\\n                - 负数：按位取反 + 1\\n                - 关键性质：\\n                    - 只有一个 0（没有 -0）\\n                    - 加减法统一为同一套加法器：a-b=a+(~b+1)\\n                    - 符号扩展简单：高位补符号位即可\\n                    - 范围不对称 [-2^{n-1},2^{n-1}-1]\\n                - 快速转换\\n                    - 补码-\\u003e十进制\\n                        - 最高位 0：按无符号直接算\\n                        - 最高位 1：取反 +1 得到绝对值，再加负号\\n                    - 十进制-\\u003e补码\\n                        - 正数：直接写二进制，左侧补 0\\n                        - 负数：先写绝对值二进制 -\\u003e 取反+1\\n            - 有符号/无符号加法与溢出判断\\n                - 无符号溢出(Unsigned overflow)\\n                    - 本质：结果超出 [0, 2^n-1]\\n                    - 判定方法：看进位 Carry-out\\n                - 有符号溢出\\n                    - 本质：结果超出 [-2^{n-1},2^{n-1}-1]\\n                    - 判断口径统一\\n                        - 同号相加，异号结果 =\\u003e 溢出\\n                        - 异号相加不会溢出\\n                    - 等价位级判定\\n                        - 符号位的进位与最高位进位输出不同=\\u003e溢出\\n            - 字节序：大端 vs 小端\\n                - 对 32-bit 只 0x12 34 56 78 高位在左\\n                - 大端\\n                    - 低地址存高字节\\n                    - 内存从低地址到高地址 12 34 56 78\\n                    - 直觉：与人类书写一致\\n                - 小端\\n                    - 低地址存低字节\\n                    - 内存从低地址到高地址：78 56 34 12\\n                    - 直觉：低地址就是低位，做逐字节扩展/截断更自然\\n                    - x86 等主流架构长期使用小端\\n                - 对齐与 Padding\\n                    - 对齐\\n                        - 要求：某类型对象的地址必须是某个中的倍数(4/8)\\n                    - 为什么要对齐\\n                        - 硬件访问效率：CPU/总线按照字/双字读写；未对齐可能需要两次内存读写再拼接\\n                        - Cache line 与内存访问粒度：对齐能减少跨行/跨 cache line 的概率\\n                    - Padding（填充）\\n                        - 为了满足对齐，编译器会在结构体字段之间或末尾插入空字节\\n                        - 结构体大小通常是其最大对齐需求的倍数\\n    - 浮点数(IEEE 754) 与误差本质\\n        - IEEE 754 基本格式\\n            - 浮点数表示\\n                - S（符号位）：0 正 1 负\\n                - E（指数/阶码）：带拍支 bias\\n                - F（尾数/小数部分）：有效数 significand 的小数部分\\n                - ![](https://an-img.oss-cn-hangzhou.aliyuncs.com/2026/02/18/20260218112914998.png,218,39)\\n                - 单精度 float（32-bit）\\n                    - S: 1 位\\n                    - E: 8 位，bias = 127\\n                    - F: 23 位\\n                - 双精度 double（64-bit）\\n                    - S：1 位\\n                    - E: 11 位，bias=1023\\n                    - F: 52 位\\n                - 规格化、非规格、0、INF、NaN\\n                    - 规格化\\n                        - 指数 E 既不是全 0 也不是全 1\\n                        - 有隐含的 leading 1：1.F\\n                    - 非规格化\\n                        - 指数 E 全 0，尾数 F 非 0\\n                        - 没有隐含 1：有效数是 0.F\\n                        - 目的：渐进下溢，让非常接近 0 的数仍然能表示\\n                    - 0\\n                        - E 全 0，F 全 0\\n                        - 有 +0 和 -0\\n                    - Inf 无穷\\n                        - E 全 0，F 全 0\\n                        - 有 +0 和 -0\\n                    - NaN（非数）\\n                        - E 全 1，F 非 0\\n                        - 来自非法操作：0/0\\n                        - NaN 会传播\\n                - 0.1 + 0.2 != 0.3\\n                    - 十进制小数在二进制中往往是无线不循环小数\\n                    - 0.1 的二进制是 0.0001100111\\n                    - float/double 只能保存有限位尾数\\n                    - 存储时发生舍入，计算时再舍入，误差叠加\\n                    - 比较时用 ==，就可能不相等\""</script><script>(function(){if(typeof MindElixir=="undefined"){console.error("MindElixir not loaded. Check your CDN script tag.");return}const n="me_1";let e=JSON.parse(document.getElementById(n+"_src").textContent);function s(){return"n_"+Math.random().toString(16).slice(2)+Date.now().toString(16)}function a(e){const o=e.split(/\n/).map(e=>e.replace(/\s+$/g,"")).filter(e=>e.trim().length>0);console.log(o);const t=[];let n=null;for(const u of o){const r=u.match(/^(\s*)([-*+])\s+(.*)$/);if(!r)continue;const h=r[1].replace(/\t/g,"  ").length,d=Math.floor(h/2);let e=r[3].trim(),c=null;const l=e.match(/^(.*?)(?:\s*->\s*)(https?:\/\/\S+)\s*$/);l&&(e=l[1].trim(),c=l[2].trim());const i={id:s(),topic:e,children:[]},a=e.match(/!\[\]\(\s*([^,\]]+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)\s*$/i);if(a){const t=a[1].trim(),n=Number(a[2]),s=Number(a[3]);e=e.replace(a[0],"").trim(),i.topic="",i.image={url:t,width:n,height:s}}if(c&&(i.hyperLink=c),!n){n=i,t.push({level:0,node:n});continue}for(;t.length&&t[t.length-1].level>=d;)t.pop();const m=t.length?t[t.length-1].node:n;m.children.push(i),t.push({level:d,node:i})}return n||{id:s(),topic:"Empty",children:[]}}e=JSON.parse(e),console.log(e);const t=a(e);console.log(t);const o={nodeData:{id:t.id,topic:t.topic,root:!0,children:t.children||[]},arrows:[],summaries:[],direction:2};console.log(o);const i=window.MindElixir?.default??window.MindElixir;if(typeof i!="function"){console.error("MindElixir loaded but not a constructor. window.MindElixir =",window.MindElixir);return}const r=new i({el:"#"+n});r.init(o)})()</script><h1 id=cpu-执行与控制>CPU 执行与控制<a hidden class=anchor aria-hidden=true href=#cpu-执行与控制>#</a></h1><div id=me_2 class=mindelixir-container style=height:560px;width:100%></div><script type=application/json id=me_2_src>"\"- CPU 执行与控制\\n    - 单周期 Datapath\\n        - 必备组件\\n            - ![](https://an-img.oss-cn-hangzhou.aliyuncs.com/2026/02/18/20260218153017482.png,429,229)\\n            - PC 当前指令地址寄存器\\n            - Instruction Memory/I-Cache：根据 PC 取指令\\n            - Register File （寄存器堆）：两读一写（rs1、rs2 读；rd 写）\\n            - Immediate Generator（立即数生成/符号扩展）\\n            - ALU：算数逻辑/比较/地址计算\\n            - Data Memory/D-Cache：load/store 访问\\n            - Adders：\\n                - PC + 4\\n                - PC + imm （分支目标）\\n            - 关键 MUX（多路选择器）\\n                - ALUSrc：ALU 第二操作数是来自 rs2 还是 imm\\n                - MemToReg：写回 rd 的数据来自 ALU 还是内存\\n                - PCSrc：下一 PC 来自 PC+4 还是分支目标\\n            - Control Unit（控制器）：根据 opcode/funct 产生控制信号\\n            - datapath = 一堆功能模块 + 多根线 + MUX 选路\\n    - 四条指令在 datapath 里怎么走\\n        - R 型算数：add rd, rs1, rs2\\n            - 目标：rd = rs1 + rs2\\n            - 数据流\\n                - PC -\\u003e 取指令\\n                - 寄存器堆读 rs1、rs2\\n                - ALU 计算 ALUOut = rs1 + rs2\\n                - 写回：rd \\u003c- ALUOut\\n                - PC 更新：PC \\u003c- PC + 4\\n            - 关键控制\\n                - RegWrite = 1 写寄存器\\n                - ALUSrc = 0 第二操作数来自 rs2\\n                - MemRead = 0, MemWrite = 0\\n                - MemToReg = 0（写回来自 ALU）\\n                - Branch = 0（不分支）\\n                - ALUOp = R-type（由 funct 决定是 add/sub/and/or）\\n        - 访存读：lw rd, imm(rs1)\\n            - 目标：rd = Mem[rs1+imm]\\n            - 数据流\\n                - 取指\\n                - 读寄存器 rs1 (base)，rs2 通常也读但不用\\n                - ALU 计算有效地址：ALUOut = rs1 + imm\\n                - 数据内存读：MemOut = Mem[ALUOut]\\n                - 写回：rd \\u003c- MemOut\\n                - PC \\u003c- PC + 4\\n        - 访存写：sw rs2, imm(rs1)\\n            - 目标：Mem[rs1+imm] = rs2\\n            - 数据流\\n                - 取指\\n                - 读 rs1（base） 和 rs2（要写入的数据）\\n                - ALU 算地址：ALUOut = rs1 + imm\\n                - 数据内存写：Mem[ALUOut] \\u003c- rs2\\n                - PC \\u003c- PC + 4\\n        - 条件分支：beq rs1, rs2, imm\\n            - 目标：如果 rs1 == rs2，则 PC \\u003c- PC + imm；否则 PC \\u003c- PC + 4\\n            - 数据流\\n                - 取指\\n                - 读 rs1，rs2\\n                - ALU 做比较：Zero = (rs1-rs2==0)\\n                - 同时计算目标分支：Target = PC + imm\\n                - PC 选择\\n                    - if Branch \\u0026 Zero：PC \\u003c- Target\\n                    - else: PC \\u003c- PC + 4\\n    - 单周期 vs 多周期\\n        - 单周期\\n            - 每条指令都在一个周期完成\\n            - 周期必须长到容纳最慢指令路径\\n            - 结果：简单但浪费，端指令也被迫跑长周期\\n        - 多周期\\n            - 把一条指令拆分成多个步骤，每一步一个周期\\n            - 不同指令用不同步骤数量\\n            - 可以复用硬件\\n    - 性能\\n        - 性能公式\\n            - ![](https://an-img.oss-cn-hangzhou.aliyuncs.com/2026/02/18/20260218153851413.png,354,137)\\n            - IC：执行的指令条数\\n            - CPI：平均每条指令需要多少周期\\n            - Cycle Time：每周期多长时间 (=1/主频) \\n        - Amdahl 定律（优化上限）\\n            - 如果系统中某部分占比位 f，该部分加速 S 倍，总加速比\\n            - ![](https://an-img.oss-cn-hangzhou.aliyuncs.com/2026/02/18/20260218154107114.png,227,64)\\n        - IPC、吞吐、延迟\\n            - 延迟：完成单个任务/单条指令/一次请求需要的时间\\n            - 吞吐：单位时间完成多少任务\\n            - IPC：每周期完成多少条指令\\n            - 吞吐 = IPC x 频率\""</script><script>(function(){if(typeof MindElixir=="undefined"){console.error("MindElixir not loaded. Check your CDN script tag.");return}const n="me_2";let e=JSON.parse(document.getElementById(n+"_src").textContent);function s(){return"n_"+Math.random().toString(16).slice(2)+Date.now().toString(16)}function a(e){const o=e.split(/\n/).map(e=>e.replace(/\s+$/g,"")).filter(e=>e.trim().length>0);console.log(o);const t=[];let n=null;for(const u of o){const r=u.match(/^(\s*)([-*+])\s+(.*)$/);if(!r)continue;const h=r[1].replace(/\t/g,"  ").length,d=Math.floor(h/2);let e=r[3].trim(),c=null;const l=e.match(/^(.*?)(?:\s*->\s*)(https?:\/\/\S+)\s*$/);l&&(e=l[1].trim(),c=l[2].tri W(Read After Write)真依赖：后读依赖前写，最关键\\n            - WAR(Write After Read)反依赖：后写不能早于前读\\n            - WAW(Write After Write)输出依赖：两条写同一目的寄存器\\n        - 为什么会 RAW：写回晚，读取早\\n            - 读寄存器在 ID\\n            - 写回寄存器在 WB\\n        - Fowwarding （旁路/转发）机制\\n            - 不等写回到寄存器堆，直接把产生的结果从后端绕回到前段使用\\n            - 转发路径\\n                - EX/MEM -\\u003e ID/EX（给下一条的 EX 用）\\n                - MEM/WB -\\u003e ID/EX （给下一条或下下条的 EX 用）\\n        - Stall(插泡)与 load-use hazard\\n            - load-use 典型序列\\n                - lw r1, 0(r2)\\n                - add r3, r1, r4\\n                - 原因\\n                    - lw 的数据到 MEM 末才可用\\n                    - add 需要在 EX 用到 r1\\n                    - 时间上赶不上，即使有 forwarding 也不够快\\n                - 结论：需要插入一个 bubble\\n                - 实现\\n                    - 冻结 PC 和 IF/ID\\n                    - 往 ID/EX 注入一个 NOP （控制信号清零）形成 bubble \\n    - 控制冒险\\n        - 定义：PC 的下一值不确定：到底走 PC+4 还是分支目标\\n        - 分支决定在哪里做决定 penalty\\n            - 如果分支在 EX 才能确定\\n            - 在分支结果出来之前，流水线已经取了后续若干条\\n            - 一旦发现分支 taken，就要把错路径指令 flush 掉\\n        - 基础策略\\n            - stall until branch resolved：等分支算出来再取后续\\n            - predict not taken：默认不跳，先取顺序；若实际 taken -\\u003e flush\\n            - 动态分支预测：用分支历史表、2-bit 饱和计数器等降低错预测\\n            - BTB：预测 taken 时快速给出目标地址\\n            - 延迟槽\\n        - penalty\\n            - 分支罚时：错预测或 taken 导致需要清空的阶段数\""</script><script>(function(){if(typeof MindElixir=="undefined"){console.error("MindElixir not loaded. Check your CDN script tag.");return}const n="me_3";let e=JSON.parse(document.getElementById(n+"_src").textContent);function s(){return"n_"+Math.random().toString(16).slice(2)+Date.now().toString(16)}function a(e){const o=e.split(/\n/).map(e=>e.replace(/\s+$/g,"")).filter(e=>e.trim().length>0);console.log(o);const t=[];let n=null;for(const u of o){const r=u.match(/^(\s*)([-*+])\s+(.*)$/);if(!r)continue;const h=r[1].replace(/\t/g,"  ").length,d=Math.floor(h/2);let e=r[3].trim(),c=null;const l=e.match es\\n                - Cache line 大小 = B bytes\\n                - 总行数 (lines) = L = C/B\\n                - 相联度 (ways) = A\\n                - 组数 (sets) = S = L/A\\n            - 直接映射\\n                - 每个内存块只能映射到唯一一个 cache 行\\n                - 优点：硬件简单、命中快\\n                - 缺点：冲突 miss 多\\n            - 全相联\\n                - 任意内存块可放任意行\\n                - 优点：几乎无冲突 miss\\n                - 缺点：需要对所有行比较 tag（实现复杂、命中更慢、耗能更高）\\n            - 组相联\\n                - 内存块映射到某个 set，但可以放在 set 内任一 way。\\n                - 折中方案\\n        - 地址拆分\\n            - 对于字节编址系统，地址通常拆分为：tag+index+block offset\\n                - offset 块内偏移\\n                    - 表示在一条 cache line 內的字节位置\\n                    - 位数 offset bits = log2(B)\\n                - index 组索引\\n                    - 选择 set\\n                    - index bits = log2(S)\\n                - tag 标记\\n                    - 用于判断该 set 中某一 way 是否是想要的内存块\\n                    - tagbits = Address bits - index bits - offset bits\\n            - 替换策略\\n                - LRU：替换最久没用的行\\n                - Pseudo-LRU（伪 LRU）：用更少 bit 近似 LRU\\n                - FIFO：先进先出\\n            - 写策略\\n                - write-throught（写穿）\\n                    - 写命中：同时写 Cache 和下一级\\n                    - 优点：下一级始终最新，实现简单\\n                    - 缺点：写流量大\\n                - write-back（写回）\\n                    - 写命中：只写 Cache，把该行标记为 dirty\\n                    - 该行被替换时才写回下一级\\n                    - 优点：显著减少写带宽压力\\n                    - 缺点：一致性更复杂（多核）\\n                - 写不命中 write miss 的两种策略\\n                    - write-allocate（写分配）：先把整条 line 读入 Cache，再在 Cache 上写，与 write-back 搭配\\n                    - no-write-allocate（不写分配）：不把 line 加入 Cache，直接写下一级，常与 write-throught 搭配\\n            - 多级 Cache 的 AMAT\\n                - L1/L2 两级\\n                    - AMAT=HitTime_L1​+MissRate_L1​×(HitTime_L2​+MissRate_L2​×MissPenalty_L2​)\\n            - 多核：一致性 vs 一致性协议\\n                - Cache Coherence（一致性）\\n                    - 目标：对于同一内存地址 X，各核的 cache 中 X 的副本要看起来像一个指在变化，不能读各自的旧值\\n                    - 解决办法：一致性协议(MESI)保证写入能让其他核的副本失效/更新\\n                - Memory Consistency（一致性模型，针对不同地址的顺序）\\n                    - 目标：规定不同核对不同地址的读写在时间顺序上允许怎么样被观察到\\n                    - 是内存模型讨论的问题，涉及重排序与屏障。\\n                - Coherence 解决同一地址副本一致，Consistency 解决不同地址操作的可见顺序，前者靠协议，后者靠内存模型和 fence。\\n            - MESI 协议\\n            - False Sharing\\n                - 定义\\n                    - 不同核访问的是不同变量，但是这些变量恰好落在同一条 cache line 里\\n                    - 其中一个核写它自己的变量，会把整条 line 的其他核副本失效，导致另一核反复 miss\\n                - 性能问题\\n                    - 引发 invalidation（整条 line 粒度）\\n                    - 两个核交替写同一条 line 上不同字节\\n                    - line 在核之间反复迁移，带来大量一致性流量\""</script><script>(function(){if(typeof MindElixir=="undefined"){console.error("MindElixir not loaded. Check your CDN script tag.");return}const n="me_4";let e=JSON.parse(document.getElementById(n+"_src").textContent);function s(){return"n_"+Math.random().toString(16).slice(2)+Date.now().toString(16)}function a(e){const o=e.split(/\n/).map(e=>e.replace(/\s+$/g,"")).filter(e=>e.trim().length>0);console.log(o);const t=[];let n=null;for(const u of o){const r=u.match(/^(\s*)([-*+])\s+(.*)$/);if(!r)continue;const h=r[1].replace(/\t/g,"  ").length,d=Math.floor(h/2);let e=r[3].trim(),c=null;const l=e.match(/^(.*?)(?:\s*->\s*)(https?:\/\/\S+)\s*$/);l&&(e=l[1].trim(),c=l[2].trim());const i={id:s(),topic:e,children:[]},a=e.match(/!\[\]\(\s*([^,\]]+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)\s*$/i);if(a){const t=a[1].trim(),n=Number(a[2]),s=Number(a[3]);e=e.replace(a[0],"").trim(),i.topic="",i.image={url:t,width:n,height:s}}if(c&&(i.hyperLink=c),!n){n=i,t.push({level:0,node:n});continue}for(;t.length&&t[t.length-1].level>=d;)t.pop();const m=t.length?t[t.length-1].node:n;m.children.push(i),t.push({level:d,node:i})}return n||{id:s(),topic:"Empty",children:[]}}e=JSON.parse(e),console.log(e);const t=a(e);console.log(t);const o={nodeData:{id:t.id,topic:t.topic,root:!0,children:t.children||[]},arrows:[],summaries:[],direction:2};console.log(o);const i=window.MindElixir?.default??window.MindElixir;if(typeof i!="function"){console.error("MindElixir loaded but not a constructor. window.MindElixir =",window.MindElixir);return}const r=new i({el:"#"+n});r.init(o)})()</script><h1 id=虚拟内存>虚拟内存<a hidden class=anchor aria-hidden=true href=#虚拟内存>#</a></h1><div id=me_5 class=mindelixir-container style=height:560px;width:100%></div><script type=application/json id=me_5_src>"\"- 虚拟内存\\n    - 要解决的问题\\n        - 抽象：每个进程看到连续的虚拟内存空间（VA）\\n        - 保护：权限控制（R/W/X，用户态/内核态）\\n        - 共享：共享库/共享内存/页共享\\n        - 扩展：按需分页 + 换入换出\\n    - 页\\n        - 虚拟页：进程看到的虚拟地址空间被切分成的固定大小块\\n        - 物理页框：正式物理内存被切成同样大小的块\\n        - 二者的大小相同，比如常见 4KB\\n        - 虚拟内存用虚拟页编号，物理内存用页框编号，页表负责把虚拟页号 -\\u003e 物理页框号\\n        - 地址和页对应\\n            - 页大小是 4KB\\n            - 4KB = 4096 字节 = 2^12\\n            - 一个地址的低 12 位代表页内偏移\\n            - 高位表示虚拟页号（VPN）\\n    - 地址转换链路\\n        - VA -\\u003e TLB -\\u003e page table -\\u003e PTE -\\u003e PA -\\u003e Cache/Memory\\n        - 术语解释\\n            - VA：进程发出的地址\\n            - PA：真实内存地址\\n            - VPN：虚拟页号\\n            - VPO：页内偏移\\n            - PPN：物理页框号\\n            - PTE：页表项，记录 VPN -\\u003e PPN 的映射与权限等元数据\\n            - TLB：页表项的高速缓存\\n        - 页大小与地址拆分\\n            - 页大小是 PageSize = 2^k 字节\\n                - offsetBits = k\\n                - VPNBits = AddrBits - k\\n            - 转换过程\\n                - CPU 产生 VA\\n                - MMU 用 VA 的 VPN 去查 TLB\\n                - TLB hit：直接得到 PPN + 权限\\n                - 物理地址 PA = (PPN \\u003c\\u003c offsetBits) | Offset\\n                - TLB miss：用 VPN 去查页表\\n                - 拿到 PTE\\n                    - 有效 -\\u003e 填入 TLB -\\u003e 形成 PA -\\u003e 继续访问\\n                    - 无效 -\\u003e 触发异常\\n        - 页表结构\\n            - PTE 包含什么\\n                - PPN：物理页框号\\n                - Present/Valid：是否在内存\\n                - R/W/X：读写执行权限\\n                - U/S：用户/内核权限\\n                - Accessed/Referenced(A)：是否被访问过\\n                - Dirty(D)：是否被写过\\n            - 为什么需要多级页表\\n                - 单级页表\\n                    - VA 空间大，VPN 组合数巨大\\n                    - 每个进程都有一张覆盖整个虚拟空间的大表\\n                - 多级页表做法\\n                    - 把 VPN 再拆分成多端：VPN1/VPN2/.../VPNn\\n                    - 顶层页表只在需要时为某个范围分配下一级页表\\n                    - 没用到的地址区间不分配页表 -\\u003e 按需分配页表\\n            - 多级页表的 Page Walk\\n                - 先用 VPN 的高段索引顶层页表，取到二级页表的地址\\n                - 再用下一段索引二级页表页\\n                - 最终找到叶子 PTE 得到 PPN\\n                - 代价：要读多次内存\\n            - TLB\\n                - 没有 TLB\\n                    - 每次 load/store 都要走 page walk，可能是 4/5 级\\n                    - 意味着每次访问内存前都要额外多次访存\\n                - TLB 的本质\\n                    - 缓存最近用过的 VPN -\\u003e PPN + 权限\\n                    - 命中时地址翻译几乎是常数空间\\n        - 缺页异常\\n            - 典型原因\\n                - Demand paging（按需分页）：页还没加载到内存\\n                - Swap out：页被换出到磁盘\\n                - 权限违规：写只读页\\n                - Copy-on-write：写共享只读页\\n            - 缺页处理流程\\n                - CPU 访问 VA，发现 PTE present = 0 或者权限不符合\\n                - 触发异常，陷入内核（保存上下文，切换到内核栈）\\n                - 内核 fault handler 判断 fault 类型\\n                    - 是合法的按需页/非法地址\\n                - 合法\\n                    - 找到磁盘位置\\n                    - 分配物理页框\\n                    - 发起 IO 把页读入内存\\n                    - 更新页表 PTE\\n                    - 更新 TLB\\n                - 恢复进程执行\\n    - 页面置换\\n        - 当需要一个物理页框但是没有空闲页时，OS 必须选择一个牺牲页换出\\n        - LRU\\n        - Clock/Second-Chance(近似 LRU)\\n            - 维护环形指针\\n            - 每个页有 Accessed/Referenced 位\\n            - 扫描时\\n                - 若 A=0：淘汰\\n                - 若 A=1：把 A 清 0，给第二次机会，指针继续走\\n        - 共享与写时复制(COW)\\n            - 为什么需要 COW\\n                - fork 的语义：子进程得到父进程内存的副本\\n                - 如果把所有页都复制一遍，成本极高\\n            - COW\\n                - fork 后，父子进程的页表都指向同一批物理页框\\n                - 把这些页的 PTE 权限改为只读\\n                - 当父或子尝试写入某页\\n                    - 写入触发 page fault\\n                    - 内核分配新物理页\\n                    - 复制旧页内容到新页\\n                    - 修改该进程页表让它指向新页，恢复写权限\\n                    - 另一个进程仍然指向旧页\""</script><script>(function(){if(typeof MindElixir=="undefined"){console.error("MindElixir not loaded. Check your CDN script tag.");return}const n="me_5";let e=JSON.parse(document.getElementById(n+"_src").textContent);function s(){return"n_"+Math.random().toString(16).slice(2)+Date.now().toString(16)}function a(e){const o=e.split(/\n/).map(e=>e.replace(/\s+$/g,"")).filter(e=>e.trim().length>0);console.log(o);const t=[];let n=null;for(const u of o){const r=u.match(/^(\s*)([-*+])\s+(.*)$/);if(!r)continue;const h=r[1].replace(/\t/g,"  ").length,d=Math.floor(h/2);let e=r[3].trim(),c=null;const l=e.match(/^(.*?)(?:\s*->\s*)(https?:\/\/\S+)\s*$/);l&&(e=l[1].trim(),c=l[2].trim());const i={id:s(),topic:e,children:[]},a=e.match(/!\[\]\(\s*([^,\]]+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)\s*$/i);if(a){const t=a[1].trim(),n=Number(a[2]),s=Number(a[3]);e=e.replace(a[0],"").trim(),i.topic="",i.image={url:t,width:n,height:s}}if(c&&(i.hyperLink=c),!n){n=i,t.push({level:0,node:n});continue}for(;t.length&&t[t.length-1].level>=d;)t.pop();const m=t.length?t[t.length-1].node:n;m.children.push(i),t.push({level:d,node:i})}return n||{id:s(),topic:"Empty",children:[]}}e=JSON.parse(e),console.log(e);const t=a(e);console.log(t);const o={nodeData:{id:t.id,topic:t.topic,root:!0,children:t.children||[]},arrows:[],summaries:[],direction:2};console.log(o);const i=window.MindElixir?.default??window.MindElixir;if(typeof i!="function"){console.error("MindElixir loaded but not a constructor. window.MindElixir =",window.MindElixir);return}const r=new i({el:"#"+n});r.init(o)})()</script><h1 id=io-总线>IO 总线<a hidden class=anchor aria-hidden=true href=#io-总线>#</a></h1><div id=me_6 class=mindelixir-container style=height:560px;width:100%></div><script type=application/json id=me_6_src>"\"- IO 总线\\n    - IO 本质上慢\\n        - 设备物理特性：SSD/网卡/磁盘的延迟远远高于 CPU\\n        - 路径长：系统调用、内核态切换、驱动、协议栈、队列管理\\n        - 数据搬运：拷贝次数多、缓存一致性/同步开销高\\n    - I/O 的基本硬件/软件组件\\n        - 设备、控制器、驱动\\n            - 设备：网络、磁盘、USB 设备等\\n            - 控制器：设备侧的执行单元，负责 DMA、队列、寄存器接口等\\n            - 驱动：内核中的软件，负责配置设备、提交请求、处理中断、管理队列\\n        - 数据通路常见参与者\\n            - CPU 核心\\n            - Cache\\n            - 内存\\n            - I/O 互联 (PCIe)\\n            - 设备控制器\\n            - 设备介质\\n    - 轮询 vs 中断\\n        - 轮询\\n            - 做法：CPU 不断读取设备状态寄存器\\n            - 优点：实现简单、延迟可控\\n            - 缺点：浪费 CPU、高并发/多设备会严重占用 CPU\\n        - 中断\\n            - 设备完成后发中断信号，CPU 暂停当前执行，进入中断处理程序(ISR)\\n            - 优点：\\n                - CPU 不需要忙等-\\u003e提升整体吞吐\\n            - 缺点：\\n                - 有中断开销：恢复/保存上下文、切换栈、处理 ISR\\n                - 中断频繁造成抖动\\n    - DMA\\n        - 不用 DMA 的程序搬运\\n            - CPU 循环从设备寄存器读数据，再写入内存\\n            - 缺点：CPU 被数据搬运绑死，带宽高、功耗高\\n        - DMA 的本质\\n            - DMA 让设备/控制器直接读写内存，CPU 只做设置与收尾\\n            - CPU 配置 DMA 描述符：内存地址、长度、方向、队列位置\\n            - DMA 引擎通过总线把数据直接写入/读出 DRAM\\n            - 完成后用中断通知 CPU（或写状态寄存器）\\n        - DMA 为什么更快\\n            - 释放 CPU 周期\\n            - DMA 更贴近总线/设备，能更高效做 burst 传输\\n            - 配合 ring buffer/descriptor queue 能批量提交\\n    - 内存映射 I/O 与端口 I/O\\n        - MMIO\\n            - 设备寄存器被映射到某段物理地址空间\\n            - CPU 用普通的 load/store 指令读写这些地址，就等价于读写设备寄存器\\n        - Port-mapped I/O\\n            - 使用专门的 IN/OUT 指令访问 I/O 端口空间\\n            - 现代系统多以 MMIO 为主\\n    - 零拷贝\\n        - 传统读文件再发网络的拷贝路径\\n            - read()：磁盘-\\u003e内核页缓存-\\u003e拷贝到用户缓冲区\\n            - write()：用户缓冲区-\\u003e再拷贝回内核 socket buffer -\\u003e 网卡 DMA 发走\\n            - 至少需要两次 CPU 拷贝（内核\\u003c-\\u003e用户，用户\\u003c-\\u003e内核）\\n        - sendfile 思路\\n            - 直接让内核把 page cache 中的文件页挂到 socket 发送队列\\n            - 避免拷贝到用户态再拷回内核态\\n            - 网卡通过 DMA 从内核缓冲直接发\\n        - mmap 思路\\n            - mmap 把文件映射进进程地址空间\\n            - 应用像访问内存一样访问文件内容，缺页时 OS 按需把页载入 page cache\\n            - 适合随机访问，但是直接转发场景 sendfile 更适合\""</script><script>(function(){if(typeof MindElixir=="undefined"){console.error("MindElixir not loaded. Check your CDN script tag.");return}const n="me_6";let e=JSON.parse(document.getElementById(n+"_src").textContent);function s(){return"n_"+Math.random().toString(16).slice(2)+Date.now().toString(16)}function a(e){const o=e.split(/\n/).map(e=>e.replace(/\s+$/g,"")).filter(e=>e.trim().length>0);console.log(o);const t=[];let n=null;for(const u of o){const r=u.match(/^(\s*)([-*+])\s+(.*)$/);if(!r)continue;const h=r[1].replace(/\t/g,"  ").length,d=Math.floor(h/2);let e=r[3].trim(),c=null;const l=e.match(/^(.*?)(?:\s*->\s*)(https?:\/\/\S+)\s*$/);l&&(e=l[1].trim(),c=l[2].trim());const i={id:s(),topic:e,children:[]},a=e.match(/!\[\]\(\s*([^,\]]+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)\s*$/i);if(a){const t=a[1].trim(),n=Number(a[2]),s=Number(a[3]);e=e.replace(a[0],"").trim(),i.topic="",i.image={url:t,width:n,height:s}}if(c&&(i.hyperLink=c),!n){n=i,t.push({level:0,node:n});continue}for(;t.length&&t[t.length-1].level>=d;)t.pop();const m=t.length?t[t.length-1].node:n;m.children.push(i),t.push({level:d,node:i})}return n||{id:s(),topic:"Empty",children:[]}}e=JSON.parse(e),console.log(e);const t=a(e);console.log(t);const o={nodeData:{id:t.id,topic:t.topic,root:!0,children:t.children||[]},arrows:[],summaries:[],direction:2};console.log(o);const i=window.MindElixir?.default??window.MindElixir;if(typeof i!="function"){console.error("MindElixir loaded but not a constructor. window.MindElixir =",window.MindElixir);return}const r=new i({el:"#"+n});r.init(o)})()</script></div><footer class=post-footer><ul class=post-tags></ul></footer></article></main><footer class=footer><span>© 2025 <a href=https://www.ans20xx.com/>安橙</a></span> ·
