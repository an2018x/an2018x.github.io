        - 理解环境变量

                - 
                ```bash

            - GOPATH vs Go Modules
                - 早期 Go 用 GOPATH 管理所有的代码，所有项目必须放在 $GOPATH/src 下
                - Go 1.11 引入了 Go Modules，可以在任意目录创建项目
                - 现在 Go Modules 是默认模式，不需要关注 GOPATH 了
                - 只需要确认 GO111MODULE=on
            - 设置常用模块
                - 
                ```bash
                # 确保模块模式开启
                go env -w GO111MODULE=on

                # 设置国内代理（如果你在中国大陆）
                go env -w GOPROXY=https://goproxy.cn,direct
                ```

    - 类型系统与变量
        - 基本类型总览
            - Go 是强类型语言，每个类型都有明确的类型，
            - 整数
                - int/uint 平台相关(32 位或 64 位) 最常用
                - int8/int16/int32/int64 指定位数的有符号整数
                - uint8(byte)/uint16/uint32/uint64 无符号整数
            - 浮点数
                - float32 单进度浮点数 (7 位有效数字)
                - float64 双进度浮点数 (15 位有效数字)
            - 其他
                - bool true/false 
                - string UTF-8 编码的不可变字节序列
                - byte uint8 的别名，表示一个字节
                - rune int32 的别名，表示一个 Unicode 码点
            - byte vs rune
                - byte 是一个字节，用于处理原始字节数据
                - rune 是一个 Unicode 码点，用于处理字符
                - 一个中文字符占 3 个 byte，但只是一个 1 rune
                - 遍历字符串，for range 遍历的是 rune，for i 遍历的是 byte
            - 
            ```go
            s := "Hello你好"

            // byte 视角：看到的是字节
            fmt.Println(len(s))        // 11（5个ASCII + 6个中文字节）

            // rune 视角：看到的是字符
            fmt.Println(len([]rune(s))) // 7（5个英文字符 + 2个中文字符）

            // for range 按 rune 遍历
            for i, ch := range s {
                fmt.Printf("索引=%d 字符=%c\n", i, ch)
            }
            // 索引=0 字符=H
            // 索引=1 字符=e
            // ...
            // 索引=5 字符=你   ← 注意索引跳了
            // 索引=8 字符=好
            ```
        - 变量声明的四种方式
            - 核心原则：函数内用 :=，函数外用 var
            - 
            ```go
            // ① var + 类型（最完整的写法）
            var name string = "Gopher"

            // ② var + 类型推断（省略类型）
            var age = 25  // Go 推断为 int

            // ③ 短变量声明（最常用，只能在函数内）
            city := "Tokyo"  // 等价于 var city = "Tokyo"

            // ④ 批量声明（常用于包级别变量）
            var (
                host     = "localhost"
                port     = 8080
                debug    = false
            )
            ```
            - 选用参考
                - 函数内：几乎总是使用 := 短声明，简洁明了
                - 函数外：只能用 var，因为 := 只能在函数内使用
                - 需要显式指定类型时，用 var name Type
                - 声明但是暂不赋值，用var name Type
            - 常见陷阱
                - 短声明的遮蔽
                - 
                ```go
                x := 1
                fmt.Println(x)  // 1

                if true {
                    x := 2     // 注意：这是一个新的 x，遮蔽了外层的 x！
                    fmt.Println(x)  // 2
                }
                fmt.Println(x)  // 1 ← 外层的 x 没有变！

                // 正确做法：用 = 而不是 :=
                if true {
                    x = 2      // 修改的是外层的 x
                }
                fmt.Println(x)  // 2
                ```
        - 零值机制
            - Go 没有 undefined、null、None 的概念
            - 每个类型都有一个确定的零值，声明变量时不赋值就是零值
            - ![](https://an-img.oss-cn-hangzhou.aliyuncs.com/2026/04/18/20260418230943782.png,200,180)
            - 
            ```go
            // 零值是安全的，可以直接使用
            var count int      // 0，可以直接 count++
            var name string    // ""，可以直接 name += "Go"
            var ok bool        // false

            // 但 nil 类型需要初始化后才能使用！
            var m map[string]int   // nil，直接 m["key"] = 1 会 panic！
            m = make(map[string]int) // 先 make 初始化

            var s []int        // nil，但 append 是安全的
            s = append(s, 1)   // ✅ nil 切片可以直接 append
            ```
        - 常量与 iota 枚举
            - Go 用 const 定义常量
            - Go 没有 enum 关键字，但是提供了 iota 自增器
            - 基本常量
            ```go
            const Pi = 3.14159
            const AppName = "MyApp"

            // 批量声明
            const (
                StatusOK    = 200
                StatusNotFound = 404
                StatusError = 500
            )
            ```
            - iota Go 的枚举利器
            ```Go
            // iota 在 const 块中从 0 开始，每行自增 1
            type Weekday int

            const (
                Sunday    Weekday = iota  // 0
                Monday                    // 1（自动继承 iota 表达式）
                Tuesday                   // 2
                Wednesday                 // 3
                Thursday                  // 4
                Friday                    // 5
                Saturday                  // 6
            )
            ```
            - iota 高级用法
            ```Go
            // 用法一：跳过某个值
            type Color int
            const (
                _      Color = iota  // 0，用 _ 跳过
                Red                  // 1
                Green                // 2
                Blue                 // 3
            )

            // 用法二：位掩码（权限系统常用）
            type Permission uint

            const (
                Read    Permission = 1 << iota  // 1  (001)
                Write                           // 2  (010)
                Execute                         // 4  (100)
            )
            // 组合权限
            userPerm := Read | Write  // 3 (011)
            fmt.Println(userPerm & Read != 0)   // true，有读权限
            fmt.Println(userPerm & Execute != 0) // false，无执行权限

            // 用法三：文件大小单位
            const (
                _  = iota
                KB = 1 << (10 * iota)  // 1 << 10 = 1024
                MB                      // 1 << 20
                GB                      // 1 << 30
                TB                      // 1 << 40
            )
            ```
            - iota 的本质
                - 不是一个值，是 const 块的行索引计数器
                - 每次遇到一个新的 const 就重置为 0
                - 同一行的多个 iota 值相同
        - 类型转换
            - 
            ```Go
            // ❌ 隐式转换在 Go 中不存在
            var a int = 42
            var b float64 = a      // 编译错误！
            var c int64 = a        // 编译错误！即使都是整数

            // ✅ 必须显式转换
            var b float64 = float64(a)  // 42.0
            var c int64 = int64(a)      // 42

            // 字符串 ↔ 数字（用 strconv 包）
            import "strconv"

            s := strconv.Itoa(42)         // int → string: "42"
            n, err := strconv.Atoi("42")  // string → int: 42
            f, err := strconv.ParseFloat("3.14", 64)  // string → float64

            // 字符串 ↔ 字节切片
            bytes := []byte("Hello")     // string → []byte
            str := string(bytes)          // []byte → string

            // ⚠️ 精度丢失要注意
            big := int64(1<<62)
            small := int32(big)  // 溢出！结果不可预测
            ```
            - fmt.Sprintf 万能转字符串
                - 性能不如 strconv，高频调用优先用 strconv
    - 流程控制
        - if/else 条件判断
            - 条件不需要括号
            - 允许在条件前加入一个初始化语句
            - 基本语法
                - 
                ```Go
                score := 85

                if score >= 90 {
                    fmt.Println("优秀")
                } else if score >= 60 {
                    fmt.Println("及格")
                } else {
                    fmt.Println("不及格")
                }

                // 注意：
                // 1. 条件不需要括号 (score >= 90) 写成 score >= 90
                // 2. 大括号必须有，即使只有一行
                // 3. else 必须和右大括号同一行
                ```
            - 前置初始化语句 (GO 特色)
                - 
                ```Go
                // 在条件中声明并使用变量
                if err := doSomething(); err != nil {
                    fmt.Println("出错了:", err)
                    return
                }
                // err 的作用域仅限于 if-else 块内，块外不可见

                // 对比：不用前置初始化的写法
                err := doSomething()
                if err != nil {
                    fmt.Println("出错了:", err)
                    return
                }
                // 这里 err 仍在作用域内，可能造成后续变量名冲突
                ```
            - 前置初始化的好处
                - 限制了变量的作用域
                - 避免污染外部命名空间
                - 在错误处理中常见
        - for 循环
            - Go 只有 for 一个循环关键字
            - for 有多种形式，能覆盖其他语言的各种循环要求
            - 经典三段式
                - 
                ```Go
                for i := 0; i < 10; i++ {
                    fmt.Println(i)
                }
                ```
            - 类 while 循环 (只有条件)
                - 
                ```Go
                n := 10
                for n > 0 {
                    fmt.Println(n)
                    n-- 
                }
                ```
            - 无限循环
                - 
                ```Go
                for {
                    // 死循环，用 break 退出
                    if someCondition() {
                        break
                    }
                }

                // 常用于服务器主循环
                for {
                    conn, err := listener.Accept()
                    if err != nil {
                        continue
                    }
                    go handleConn(conn)
                }
                ```
            - for-range 遍历
                - 
                ```Go
                // 遍历切片/数组
                nums := []int{10, 20, 30}
                for i, v := range nums {
                    fmt.Printf("索引=%d 值=%d\n", i, v)
                }

                // 只要索引
                for i := range nums {
                    fmt.Println(i)
                }

                // 只要值（用 _ 忽略索引）
                for _, v := range nums {
                    fmt.Println(v)
                }

                // 遍历 map（顺序随机！）
                m := map[string]int{"a": 1, "b": 2}
                for k, v := range m {
                    fmt.Printf("%s=%d\n", k, v)
                }

                // 遍历字符串（按 rune）
                for i, ch := range "Hello你好" {
                    fmt.Printf("%d: %c\n", i, ch)
                }

                // 遍历 channel（Day 9 会讲）
                // for msg := range ch { ... }
                ```
            - 循环复用坑
                - 在 Go 1.22 之前，for-range 的循环变量是复用的，在 go routine 中捕获会出现问题
                - 
                ```Go
                // Go 1.22+ 这样写是安全的
                for _, v := range []int{1, 2, 3} {
                    go func() {
                        fmt.Println(v) // 1.22 前可能全打印 3
                    }()
                }

                // Go 1.22 之前的兼容写法：
                for _, v := range []int{1, 2, 3} {
                    v := v // 显式创建副本
                    go func() {
                        fmt.Println(v)
                    }()
                }
                ```
        - switch 分支
            - 支持默认 break、多值匹配、任意表达式
            - 基本用法：默认不穿透
                - 
                ```go
                day := 3

                switch day {
                case 1:
                    fmt.Println("周一")
                case 2:
                    fmt.Println("周二")
                case 3:
                    fmt.Println("周三")
                    // 默认自动 break，不会掉到 case 4
                case 4, 5:  // ✨ 多值匹配
                    fmt.Println("周四或周五")
                case 6, 7:
                    fmt.Println("周末")
                default:
                    fmt.Println("无效")
                }
                ```
            - 无条件 switch (if-else 链的优雅写法)
                - 
                ```go
                score := 85

                // 省略 switch 后的条件，相当于 switch true
                switch {
                case score >= 90:
                    fmt.Println("A")
                case score >= 80:
                    fmt.Println("B")
                case score >= 60:
                    fmt.Println("C")
                default:
                    fmt.Println("F")
                }

                // 比 if-else 链更清晰
                // 等价于：
                // if score >= 90 { ... } 
                // else if score >= 80 { ... }
                // ...
                ```
            - 前置初始化语句
                - 
                ```go
                switch os := runtime.GOOS; os {
                case "linux":
                    fmt.Println("Linux")
                case "darwin":
                    fmt.Println("macOS")
                case "windows":
                    fmt.Println("Windows")
                default:
                    fmt.Printf("未知系统: %s\n", os)
                }
                ```
            - fallthrough:显式穿透
                - 
                ```go
                // 如果真的需要穿透到下一个 case，用 fallthrough
                switch n := 1; n {
                case 1:
                    fmt.Println("一")
                    fallthrough  // 继续执行下一个 case
                case 2:
                    fmt.Println("二") // 会被打印
                case 3:
                    fmt.Println("三") // 不会打印，fallthrough 只穿透一层
                }
                // 输出：一、二
                ```
        - break、continue、goto
            - 基础 break 和 continue
                - 
                ```go
                for i := 0; i < 10; i++ {
                    if i == 3 {
                        continue  // 跳过本次迭代
                    }
                    if i == 7 {
                        break     // 退出循环
                    }
                    fmt.Println(i)
                }
                // 输出：0 1 2 4 5 6
                ```
            - 标签：跳出嵌套循环
                - 
                ```go
                // 问题：break 只能跳出一层循环
                // 在嵌套循环中如何跳出外层？

                OuterLoop:
                for i := 0; i < 5; i++ {
                    for j := 0; j < 5; j++ {
                        if i*j > 6 {
                            break OuterLoop  // 直接跳出外层循环
                        }
                        fmt.Printf("%d*%d ", i, j)
                    }
                }

                // continue 也支持标签：continue OuterLoop 会回到外层循环的下一次迭代
                ```
            - goto 存在，但是不建议用
        - defer 延迟执行
            - defer 是 Go 的标志性特性，用来注册「函数退出前必须执行」的逻辑
            - 它彻底解决了资源清理、错误恢复等场景
            - 基本行为：函数返回前执行
                - 
                ```go
                func main() {
                    fmt.Println("1. 开始")
                    defer fmt.Println("3. 延迟执行")
                    fmt.Println("2. 中间")
                }
                // 输出：
                // 1. 开始
                // 2. 中间
                // 3. 延迟执行 ← 在函数返回前执行
                ```
            - 典型用法：资源清理
                - 
                ```go
                // 文件操作
                func readFile(name string) error {
                    f, err := os.Open(name)
                    if err != nil {
                        return err
                    }
                    defer f.Close()  // ✨ 立刻注册关闭，无论函数怎么退出都会执行
                    
                    // 读取文件内容...
                    // 即使这里 return 或 panic，f.Close() 都会被执行
                    return nil
                }

                // 锁
                func updateCounter() {
                    mu.Lock()
                    defer mu.Unlock()  // ✨ 保证解锁，不会死锁
                    
                    counter++
                    // 即使后续代码 panic，锁也能释放
                }
                ```
            - 多个 defer: LIFO 栈顺序
                - 
                ```go
                func main() {
                    defer fmt.Println("1")
                    defer fmt.Println("2")
                    defer fmt.Println("3")
                    fmt.Println("main")
                }
                // 输出：
                // main
                // 3  ← 后进先出（栈）
                // 2
                // 1
                ```
            - defer 语句参数
                - defer 语句的参数在注册是就计算好，不是执行时
                - 
                ```go
                func main() {
                    x := 10
                    defer fmt.Println("defer:", x)  // x 的值 10 被立即捕获
                    x = 20
                    fmt.Println("main:", x)
                }
                // 输出：
                // main: 20
                // defer: 10   ← 不是 20！

                // 如果想用最终值，用闭包：
                func main() {
                    x := 10
                    defer func() {
                        fmt.Println("defer:", x)  // 闭包捕获变量引用
                    }()
                    x = 20
                }
                // 输出 defer: 20
                ```
    - 函数深入
        - 函数基础
            - Go 的函数定义和 C 系列语言不一样：关键字 func 在前，返回值类型在后
                - 
                ```go
                // 基本语法：func 函数名(参数列表) 返回值类型 { 函数体 }
                func add(a int, b int) int {
                    return a + b
                }

                // 参数同类型可以合并声明
                func add2(a, b int) int {
                    return a + b
                }

                // 无返回值
                func greet(name string) {
                    fmt.Println("Hello,", name)
                }

                // 无参数也无返回值
                func printVersion() {
                    fmt.Println("v1.0.0")
                }
                ```
            - 函数是一等公民
                - Go 的函数可以赋值给变量、作为参数传递、作为返回值返回
                - 这让 Go 支持函数式编程风格，比如高阶函数、回调、中间件模式等
                - 
                ```go
                // 函数赋值给变量
                var operation func(int, int) int = add
                result := operation(1, 2) // 3

                // 函数作为参数
                func apply(nums []int, fn func(int) int) []int {
                    result := make([]int, len(nums))
                    for i, n := range nums {
                        result[i] = fn(n)
                    }
                    return result
                }

                doubled := apply([]int{1, 2, 3}, func(x int) int {
                    return x * 2
                }) // [2, 4, 6]
                ```
        - 多返回值
            - go 原生支持多返回值
                - 
                ```go
                // 返回商和余数
                func divmod(a, b int) (int, int) {
                    return a / b, a % b
                }

                q, r := divmod(10, 3) // q=3, r=1

                // 只想要其中一个，用 _ 忽略
                q, _ := divmod(10, 3) // 只要商
                _, r = divmod(10, 3) // 只要余数
                ```
            - 几乎所有主流库都用这个特性返回 (result, error)
            - go 的惯用法：(result,error)
                - 
                ```go
                // 几乎所有可能失败的操作都返回 (结果, error)
                func readFile(name string) (string, error) {
                    data, err := os.ReadFile(name)
                    if err != nil {
                        return "", err // 失败时返回零值 + 错误
                    }
                    return string(data), nil // 成功时返回结果 + nil
                }

                // 调用方的标准模式
                content, err := readFile("hello.txt")
                if err != nil {
                    log.Fatal(err)
                }
                fmt.Println(content)
                ```
        - 命名返回值
            - go 允许给返回值命名，在返回值多，复杂逻辑时有用
                - 
                ```go
                // 普通多返回值
                func divide1(a, b float64) (float64, error) {
                    if b == 0 {
                        return 0, errors.New("除数不能为零")
                    }
                    return a / b, nil
                }

                // 命名返回值版本
                func divide2(a, b float64) (result float64, err error) {
                    if b == 0 {
                        err = errors.New("除数不能为零")

                    ```go

                    b := [3]int{1, 2, 3}   // 字面量初始化

                    // 长度是类型的一部分！

                    - 大数组这样性能会很差，实际开发总是使用切片
                    - 
                    ```go
                    a := [3]int{1, 2, 3}
                    b := a       // ✨ 完全拷贝！b 和 a 是独立的
                    b[0] = 100

                    fmt.Println(a)  // [1 2 3]  ← a 没变
                    fmt.Println(b)  // [100 2 3]

            - 切片：Go 的主力军
                - 切片是 Go 中最常用的数据结构
                - 看起来像动态数组，但底层是对数组的视图
                - 切片的三要素
                    - 
                    ```go
                    // 切片在内存中是一个结构体（概念上）：
                    // type slice struct {
                    //     ptr      *T    // 指向底层数组的指针
                    //     len      int   // 当前长度
                    //     cap      int   // 容量（底层数组剩余空间）
                    // }

                    s := []int{10, 20, 30}
                    fmt.Println(len(s))  // 3（长度）
                    fmt.Println(cap(s))  // 3（容量）
                    ```
                - 创建切片的五种方式
                    - 
                    ```go
                    // ① 字面量
                    s1 := []int{1, 2, 3}

                    // ② make：指定长度（和容量）
                    s2 := make([]int, 5)       // len=5, cap=5，值全是 0
                    s3 := make([]int, 3, 10)   // len=3, cap=10

                    // ③ nil 切片
                    var s4 []int                // nil，len=0, cap=0
                    fmt.Println(s4 == nil)      // true
                    // 但 nil 切片可以直接 append，不会 panic

                    // ④ 空切片（和 nil 切片 len/cap 相同但底层不同）
                    s5 := []int{}
                    fmt.Println(s5 == nil)      // false

                    // ⑤ 切割已有数组/切片（下一节详讲）
                    arr := [5]int{1, 2, 3, 4, 5}
                    s6 := arr[1:4]              // [2, 3, 4]
                    ```
                - ni 切片 vs 空切片
                    - 两者几乎可以互换
                    - 都可以 append，都可以 range
                    - JSON 序列化时 nil 变为 null，空切片变为 【】
                    - 推荐总是优先使用 nil 切片

                - 切割语法 s[low:high:max]
                    - 
                    ```go
                    s := []int{0, 1, 2, 3, 4, 5}

                    // 基本切割 [low:high]
                    s[1:4]      // [1, 2, 3]  ← 左闭右开
                    s[:3]       // [0, 1, 2]  省略 low 默认 0
                    s[3:]       // [3, 4, 5]  省略 high 默认 len
                    s[:]        // [0, 1, 2, 3, 4, 5]  完整拷贝引用

                    // 三参数切割 [low:high:max] —— 限制容量
                    s2 := s[1:4:4]
                    fmt.Println(len(s2), cap(s2))  // 3, 3（容量被限制）
                    // 不加 :max 的话，cap(s2) 会是 5（底层数组剩余容量）
                    ```
                - append: 扩容机制
                    - 
                    ```go
                    s := []int{1, 2, 3}
                    s = append(s, 4)          // [1 2 3 4]
                    s = append(s, 5, 6, 7)    // 添加多个

                    // 合并两个切片
                    a := []int{1, 2}
                    b := []int{3, 4}
                    c := append(a, b...)      // 注意 ...，展开 b
                    // c = [1 2 3 4]
                    ```
                - 扩容规则
                    - 
                    ```go
                    // 当 append 超过 cap 时，Go 会分配新的底层数组
                    // 扩容规则（Go 1.18+ 简化）：
                    //   cap < 256：翻倍（1 → 2 → 4 → 8 ...）
                    //   cap >= 256：每次增加约 25%

                    s := make([]int, 0, 2)
                    fmt.Println(cap(s))  // 2

                    s = append(s, 1, 2, 3)
                    fmt.Println(cap(s))  // 4（翻倍）

                    // 扩容是昂贵的！如果知道最终大小，一开始就 make 好
                    s := make([]int, 0, 1000)  // ✅ 预分配
                    for i := 0; i < 1000; i++ {
                        s = append(s, i)        // 不会触发扩容
                    }
                    ```
            - 切片陷阱
                - 切割共享底层数组
                    - 
                    ```go
                    original := []int{1, 2, 3, 4, 5}
                    sub := original[1:3]        // [2, 3]，但底层数组是共享的！

                    sub[0] = 999
                    fmt.Println(original)       // [1 999 3 4 5]  ← 原数组被改了！
                    fmt.Println(sub)            // [999 3]

                    // 安全做法：显式拷贝
                    sub := make([]int, 2)
                    copy(sub, original[1:3])    // sub 是独立的
                    sub[0] = 999
                    fmt.Println(original)       // [1 2 3 4 5]  ← 不受影响
                    ```
                - append 可能修改原切片
                    - 
                    ```go
                    original := []int{1, 2, 3, 4, 5}
                    sub := original[:3]         // [1 2 3]，cap=5

                    sub = append(sub, 999)      // append 时 cap 够用，复用底层数组！
                    fmt.Println(original)       // [1 2 3 999 5]  ← 原数组第 4 位被改了！

                    // 用三参数切割限制容量，强制 append 时分配新数组
                    sub := original[:3:3]       // cap=3
                    sub = append(sub, 999)      // 容量不够，分配新数组
                    fmt.Println(original)       // [1 2 3 4 5]  ← 原数组安全
                    ```
                - 大切片导致内存泄露
                    - 
                    ```go
                    // 读一个 1GB 大文件，只保留前 100 字节
                    func readSmallPart(filename string) []byte {
                        big, _ := os.ReadFile(filename)  // 1GB
                        return big[:100]  // ⚠️ 返回的切片引用着整个 1GB 数组！
                        // 只要返回值存活，1GB 内存就不会被 GC
                    }

                    // 正确做法：主动拷贝脱离引用
                    func readSmallPart(filename string) []byte {
                        big, _ := os.ReadFile(filename)
                        small := make([]byte, 100)
                        copy(small, big)
                        return small  // ✅ 只引用 100 字节，big 可以被 GC
                    }
                    ```

                - 删除元素

                    s = append(s[:i], s[i+1:]...)
