                    u.Name = "Changed"  // 只修改了拷贝
                }
                modify(u1)
                fmt.Println(u1.Name)  // Alice（没变！）

                // 想修改原对象？传指针
                func modifyPtr(u *User) {
                    u.Name = "Changed"
                }
                modifyPtr(&u1)
                fmt.Println(u1.Name)  // Changed
                ```
            - 什么时候用指针
                - 
                ```go
                // ✅ 使用指针的场景：

                // 1. 需要修改原对象
                func (u *User) SetName(name string) {
                    u.Name = name
                }

                // 2. 结构体很大，拷贝开销大
                type Config struct {
                    // 假设有 50 个字段
                }
                func process(c *Config) { ... }  // 传指针避免拷贝

                // 3. 想表达「可能为空」的语义
                func findUser(id int) *User {
                    if !found {
                        return nil  // 用 nil 表示未找到
                    }
                    return &user
                }

                // ❌ 不用指针的场景：
                // - 小结构体（几个字段的）
                // - 不修改的只读操作
                // - 代表不可变概念（如 time.Time）
                ```
            - 经验法则
                - 拿不准就用指针
                - Go 代码中 *User 比 User 更常见
                - 但像 time.Time、image.Point 这种小且不可变的类型，用值类型更自然
        - 方法：给类型加行为
            - 方法是绑定到特定类型的函数
            - Go 的方法语法有点特别——接收者写在函数名前面
            - 方法定义语法
                - 
                ```go
                type Rectangle struct {
                    Width, Height float64
                }

                // 方法定义：func (接收者 类型) 方法名(参数) 返回值
                func (r Rectangle) Area() float64 {
                    return r.Width * r.Height
                }

                func (r Rectangle) Perimeter() float64 {
                    return 2 * (r.Width + r.Height)
                }

                // 调用
                rect := Rectangle{Width: 3, Height: 4}
                fmt.Println(rect.Area())       // 12
                fmt.Println(rect.Perimeter())  // 14
                ```
            - 值接收者 vs 指针接收者
                - 
                ```go
                type Counter struct {
                    count int
                }

                // ❌ 值接收者：修改不会生效！
                func (c Counter) IncrementWrong() {
                    c.count++  // 只修改了副本
                }

                // ✅ 指针接收者：修改原对象
                func (c *Counter) Increment() {
                    c.count++
                }

                // ✅ 只读方法用值接收者
                func (c Counter) Get() int {
                    return c.count
                }

                c := Counter{}
                c.IncrementWrong()
                fmt.Println(c.Get())  // 0 ← 没变！

                c.Increment()
                fmt.Println(c.Get())  // 1 ← 生效了
                c.Increment()
                fmt.Println(c.Get())  // 2
                ```
            - 选择接受者类型的原则
                - 需要修改对象 -> 必须用指针接收者
                - 结构体很大 -> 用指针避免拷贝
                - 包含 sync.Mutex 等不可拷贝字段 -> 必须用指针
                - 其他情况两者都行，但是一个类型的方法应该统一
                - 要么全值接收者，要么全指针接收者
            - go 的自动转换
                - 
                ```go
                // Go 会在值和指针之间自动转换，调用方法时不用纠结
                
                c := Counter{}   // 值
                c.Increment()    // ✨ Go 自动取地址 (&c).Increment()
                c.Get()          // 值调用值方法，直接
                
                p := &Counter{}  // 指针
                p.Increment()    // 指针调用指针方法，直接
                p.Get()          // ✨ Go 自动解引用 (*p).Get()
                
                // 唯一限制：不能在「不可寻址」的值上调用指针方法
                Counter{}.Increment()  // ❌ 编译错误，字面量不可寻址
                
                // 但可以：
                c := Counter{}
                c.Increment()          // ✅ 变量可寻址
                ```
        - 给任意类型定义方法
            - 方法不只能定义在 struct 上，任何在当前包定义的类型都可以有方法
                - 
                ```go
                // 给 int 起别名并加方法
                type Celsius float64

                func (c Celsius) ToFahrenheit() float64 {
                    return float64(c)*9/5 + 32
                }

                func (c Celsius) String() string {
                    return fmt.Sprintf("%.1f°C", float64(c))
                }

                // 给切片起别名并加方法
                type IntSlice []int

                func (s IntSlice) Sum() int {
                    total := 0
                    for _, n := range s {
                        total += n
                    }
                    return total
                }

                func (s IntSlice) Max() int {
                    if len(s) == 0 {
                        return 0
                    }
                    m := s[0]
                    for _, n := range s[1:] {
                        if n > m {
                            m = n
                        }
                    }
                    return m
                }

                func main() {
                    temp := Celsius(25)
                    fmt.Println(temp)               // 25.0°C（调用了 String 方法）
                    fmt.Println(temp.ToFahrenheit()) // 77

                    nums := IntSlice{1, 5, 3, 8, 2}
                    fmt.Println(nums.Sum())  // 19
                    fmt.Println(nums.Max())  // 8
                }
                ```
            - 只能给本包类型加方法
                - 不能直接给 int、string 等内置类型加方法，也不能给其他包的类型加方法
                - 需要的话就 type MyInt int 定义一个新类型。这个限制防止混乱——每个类型的方法归属清晰
        - 结构体嵌入
            - Go 没有继承，但有「嵌入」
            - 把一个 struct 嵌入到另一个里面，外层可以直接访问内层的字段和方法
            - 这就是 Go 面向对象的核心——组合优于继承
            - 基本嵌入
                - 
                ```go
                type Animal struct {
                    Name string
                    Age  int
                }

                func (a Animal) Describe() string {
                    return fmt.Sprintf("%s, %d岁", a.Name, a.Age)
                }

                // Dog 嵌入 Animal
                type Dog struct {
                    Animal          // ✨ 嵌入字段（没有字段名）
                    Breed  string
                }

                d := Dog{
                    Animal: Animal{Name: "旺财", Age: 3},
                    Breed:  "柴犬",
                }

                // 直接访问嵌入字段的属性和方法（提升）
                fmt.Println(d.Name)         // "旺财"（不用 d.Animal.Name）
                fmt.Println(d.Describe())   // "旺财, 3岁"（继承了 Animal 的方法）
                fmt.Println(d.Breed)        // "柴犬"

                // 也可以显式访问
                fmt.Println(d.Animal.Name)  // 同上
                ```
            - 方法覆盖
                - 
                ```go
                // Dog 可以定义同名方法「覆盖」Animal 的
                func (d Dog) Describe() string {
                    // 可以调用被覆盖的方法
                    base := d.Animal.Describe()
                    return fmt.Sprintf("%s，品种：%s", base, d.Breed)
                }

                d := Dog{Animal: Animal{Name: "旺财", Age: 3}, Breed: "柴犬"}
                fmt.Println(d.Describe())  // "旺财, 3岁，品种：柴犬"
                ```
            - 嵌入接口
                - 
                ```go
                // 也可以嵌入接口，常见于标准库
                type ReadCloser interface {
                    io.Reader    // 嵌入接口
                    io.Closer    // 嵌入接口
                }
                // 等价于：
                // type ReadCloser interface {
                //     Read(p []byte) (n int, err error)
                //     Close() error
                // }

                // 实战场景：给一个已有类型「增强」
                type LoggedDB struct {
                    *sql.DB          // 嵌入指针，继承所有方法
                    logger *log.Logger
                }

                // 只需要定义想增强的方法
                func (db *LoggedDB) Query(query string, args ...any) (*sql.Rows, error) {
                    db.logger.Printf("SQL: %s", query)
                    return db.DB.Query(query, args...)
                }
                // 其他方法（Ping、Exec 等）自动继承自 *sql.DB
                ```
            - 嵌入 vs 继承
                - 嵌入不是继承
                - 嵌入字段是一个真实存在的字段，外层 struct has-a 内层，不是 is-a
                - 你可以嵌入多个类型（多继承的感觉），但本质是组合：Dog 不是 Animal 的子类，而是「包含了一个 Animal」
        - 构造函数模式
            - Go 没有 constructor 关键字
            - 惯例是定义 NewXxx 函数返回初始化好的实例，这样可以封装验证、默认值、依赖注入等逻辑。
            - 示例
                - 
                ```go
                type User struct {
                    ID        int
                    Name      string
                    Email     string
                    CreatedAt time.Time
                }

                // 标准构造函数：返回值
                func NewUser(name, email string) User {
                    return User{
                        Name:      name,
                        Email:     email,
                        CreatedAt: time.Now(),
                    }
                }

                // 更常见：返回指针 + error
                func NewUser(name, email string) (*User, error) {
                    if name == "" {
                        return nil, errors.New("name 不能为空")
                    }
                    if !strings.Contains(email, "@") {
                        return nil, fmt.Errorf("无效的 email: %s", email)
                    }
                    return &User{
                        Name:      name,
                        Email:     email,
                        CreatedAt: time.Now(),
                    }, nil
                }

                // 使用
                u, err := NewUser("Alice", "alice@example.com")
                if err != nil {
                    log.Fatal(err)
                }
                fmt.Println(u.Name)
                ```
            - 函数选项模式
                - 
                ```go
                // 问题：构造函数参数太多怎么办？
                // func NewServer(host string, port int, timeout time.Duration, tls bool, ...) 

                // 解决：函数选项模式（Functional Options）
                type Server struct {
                    host    string
                    port    int
                    timeout time.Duration
                    tls     bool
                }

                // Option 是一个修改 Server 的函数
                type Option func(*Server)

                func WithPort(p int) Option {
                    return func(s *Server) { s.port = p }
                }

                func WithTimeout(t time.Duration) Option {
                    return func(s *Server) { s.timeout = t }
                }

                func WithTLS() Option {
                    return func(s *Server) { s.tls = true }
                }

                // 构造函数接受任意个 Option
                func NewServer(host string, opts ...Option) *Server {
                    // 默认值
                    s := &Server{
                        host:    host,
                        port:    80,
                        timeout: 30 * time.Second,
                        tls:     false,
                    }
                    // 应用选项
                    for _, opt := range opts {
                        opt(s)
                    }
                    return s
                }

                // 使用：非常灵活
                s1 := NewServer("localhost")
                s2 := NewServer("example.com", WithPort(443), WithTLS())
                s3 := NewServer("api.com", WithTimeout(10*time.Second))
                ```
            - 函数选项模式的威力
                - 这个模式在 Go 生态广泛使用（gRPC、Kubernetes、各种库的配置都是这个模式）
                - 优势：可选参数不用硬编码、扩展性好（加新选项不破坏现有代码）、可读性强（调用方清楚写出每个选项）
        - 结构体标签
            - Struct Tag 是字段后面的反引号字符串，为字段附加元数据
            - JSON 序列化、数据库映射、表单校验都用它
            - 示例
                - 
                ```go
                type User struct {
                    ID       int       `json:"id"`
                    Name     string    `json:"name" validate:"required,min=2"`
                    Email    string    `json:"email" validate:"required,email"`
                    Password string    `json:"-"`                          // - 表示不参与 JSON 序列化
                    Age      int       `json:"age,omitempty"`               // omitempty：零值时忽略
                    Role     string    `json:"role" db:"user_role"`          // 同一字段可有多个 tag
                }

                // JSON 序列化
                u := User{
                    ID:    1,
                    Name:  "Alice",
                    Email: "alice@example.com",
                    Password: "secret",
                    // Age 是 0，会被忽略
                }

                data, _ := json.Marshal(u)
                fmt.Println(string(data))
                // {"id":1,"name":"Alice","email":"alice@example.com","role":""}
                // 注意：password 不在输出中，age 也被忽略
                ```
            - 常见 Tag 用法一览
                - 
                ```go
                type Article struct {
                    // encoding/json
                    ID       int       `json:"id"`
                    Title    string    `json:"title"`
                    Content  string    `json:"content,omitempty"`  // 空时忽略
                    Internal string    `json:"-"`                   // 从不序列化

                    // GORM（Day 17-18）
                    CreatedAt time.Time `gorm:"autoCreateTime"`
                    Slug      string    `gorm:"uniqueIndex;size:100"`

                    // validator（参数校验）
                    Author   string    `validate:"required,min=2,max=50"`
                    Views    int       `validate:"gte=0"`

                    // 组合使用
                    Email    string    `json:"email" validate:"required,email" db:"user_email"`
                }
                ```
            - tag 只是字符串
                - Tag 本身只是给字段附加的字符串元数据，语言本身不处理
                - 是各个库（encoding/json、gorm、validator...）通过反射读取 tag 并做相应处理
                - tag 的语法完全由使用它的库定义
    - 接口与多态
        - 接口是什么
            - 接口是 Go 最优雅的特性。
            - 它定义了一组方法签名，任何实现了这些方法的类型都「自动」满足这个接口——不需要显式声明 implements。
            - 这叫做「隐式接口实现」，也叫鸭子类型。
            - 接口示例
                - 
                ```go
                // 定义接口：只有方法签名，没有实现
                type Animal interface {
                    Sound() string
                    Name() string
                }

                // Dog 实现了 Animal 接口
                // 注意：不需要写 "implements Animal"！
                type Dog struct{ name string }

                func (d Dog) Sound() string { return "汪汪" }
                func (d Dog) Name() string  { return d.name }

                // Cat 也实现了 Animal 接口
                type Cat struct{ name string }

                func (c Cat) Sound() string { return "喵喵" }
                func (c Cat) Name() string  { return c.name }

                // 函数接受接口类型
                func Describe(a Animal) {
                    fmt.Printf("%s 说：%s\n", a.Name(), a.Sound())
                }

                func main() {
                    dog := Dog{name: "旺财"}
                    cat := Cat{name: "咪咪"}

                    Describe(dog)  // 旺财 说：汪汪
                    Describe(cat)  // 咪咪 说：喵喵

                    // 接口变量可以持有任意满足条件的类型
                    var a Animal = dog
                    a = cat  // 随时切换
                }
                ```
            - 隐式实现的威力
                - Java/C# 要写 implements Animal，Go 不需要
                - 只要你的类型有对应的方法，它就是那个接口
                - 你可以让一个你不能修改的第三方类型满足你的接口
                - 也可以在不改动现有代码的情况下新定义接口来约束它们
                - 这是 Go 解耦的核心武器
        - 接口值的内部结构
            - 接口值在底层由两部分组成：动态类型（type）和动态值（value）
            - 示例
                - 
                ```go
                // 接口值 = (type, value)
                var a Animal  // (nil, nil)，零值

                a = Dog{name: "旺财"}
                // a 现在是 (Dog, {name:"旺财"})

                // 打印类型和值
                fmt.Printf("类型: %T\n", a)  // main.Dog
                fmt.Printf("值: %v\n", a)    // {旺财}
                ```
            - nil 接口 vs 含 nil 的接口
                - 
                ```go
                // 这是 Go 最反直觉的陷阱之一！

                var d *Dog = nil  // d 是 nil 指针

                var a Animal = d  // a 的 type=*Dog, value=nil
                                // a 不是 nil！因为 type 部分有值

                fmt.Println(a == nil)   // false ← 让人意外！
                fmt.Println(d == nil)   // true

                // 正确判断接口是否有效
                func process(a Animal) {
                    // ❌ 错误：a != nil 不代表 a 里的值不是 nil
                    if a != nil {
                        // 如果 a = (*Dog)(nil)，这里调用方法会 panic
                    }
                    
                    // ✅ 正确：用 reflect 或 type switch 检查
                    if a == nil {
                        return
                    }
                }

                // 最佳实践：函数返回接口时，失败直接返回 nil
                func findAnimal() Animal {
                    var d *Dog = nil
                    return d   // ❌ 坑！返回的接口不是 nil
                    return nil // ✅ 这才是真正的 nil 接口
                }
                ```
                - 「含有 nil 指针的接口，不等于 nil 接口。」
                - 一个接口值只有当 type 和 value 都是 nil 时，它才等于 nil
                - 函数返回接口类型时，失败直接 return nil，而不是 return (*ConcreteType)(nil)
        - 类型断言与 type switch
            - 有时候你需要从接口里把具体类型「取出来」
            - Go 提供了两种方式：类型断言和 type switch
            - 类型断言
                - 
                ```go
                var a Animal = Dog{name: "旺财"}

                // 方式一：直接断言（不安全，失败会 panic）
                d := a.(Dog)
                fmt.Println(d.name)  // 旺财

                // 方式二：逗号 ok（推荐，安全）
                d, ok := a.(Dog)
                if ok {
                    fmt.Println("是 Dog:", d.name)
                } else {
                    fmt.Println("不是 Dog")
                }

                // 断言为接口（检查是否实现了另一个接口）
                type Swimmer interface {
                    Swim() string
                }

                if s, ok := a.(Swimmer); ok {
                    fmt.Println(s.Swim())
                } else {
                    fmt.Println("不会游泳")
                }
                ```
            - type switch
                - 
                ```go
                func describe(i interface{}) {
                    switch v := i.(type) {
                    case int:
                        fmt.Printf("整数: %d，翻倍是 %d\n", v, v*2)
                    case string:
                        fmt.Printf("字符串: %q，长度 %d\n", v, len(v))
                    case bool:
                        fmt.Printf("布尔值: %t\n", v)
                    case []int:
                        fmt.Printf("整数切片，长度 %d\n", len(v))
                    case nil:
                        fmt.Println("是 nil")
                    default:
                        fmt.Printf("未知类型: %T\n", v)
                    }
                }

                describe(42)            // 整数: 42，翻倍是 84
                describe("hello")       // 字符串: "hello"，长度 5
                describe(true)          // 布尔值: true
                describe([]int{1,2,3})  // 整数切片，长度 3
                describe(nil)           // 是 nil
                ```
            - 类型断言 vs 类型转换
                - 类型断言 a.(Dog) 是从接口里取出具体类型
                - 运行时才知道结果，失败会 panic
                - 类型转换 int(3.14) 是编译时已知的类型转换，不会失败（但可能丢精度）
        - 标准库核心接口
            - Go 标准库定义了很多小接口，每个接口只有 1-3 个方法
            - fmt.Stringer：自定义打印格式
                - 
                ```go
                // 标准库定义：
                // type Stringer interface {
                //     String() string
                // }

                type Point struct{ X, Y int }

                // 实现 Stringer 接口
                func (p Point) String() string {
                    return fmt.Sprintf("(%d, %d)", p.X, p.Y)
                }

                p := Point{3, 4}
                fmt.Println(p)        // (3, 4)  ← 自动调用 String()
                fmt.Printf("%v\n", p) // (3, 4)
                fmt.Printf("%s\n", p) // (3, 4)
                ```
            - error：自定义错误类型
                - 
                ```go
                // error 接口只有一个方法：
                // type error interface {
                //     Error() string
                // }

                // 自定义错误类型（携带更多信息）
                type ValidationError struct {
                    Field   string
                    Message string
                }

                func (e *ValidationError) Error() string {
                    return fmt.Sprintf("字段 %s 验证失败: %s", e.Field, e.Message)
                }

                // 使用
                func validateAge(age int) error {
                    if age < 0 || age > 150 {
                        return &ValidationError{
                            Field:   "age",
                            Message: fmt.Sprintf("值 %d 超出合法范围 [0, 150]", age),
                        }
                    }
                    return nil
                }

                err := validateAge(-1)
                if err != nil {
                    fmt.Println(err)  // 字段 age 验证失败: 值 -1 超出合法范围 [0, 150]
                    
                    // 用类型断言获取详细信息
                    if ve, ok := err.(*ValidationError); ok {
                        fmt.Println("出问题的字段:", ve.Field)
                    }
                }
                ```
            - io.Reader 和 io.Writer：I/O 的基石
                - 
                ```go
                // io.Reader：能被读取的任何东西
                // type Reader interface {
                //     Read(p []byte) (n int, err error)
                // }

                // io.Writer：能被写入的任何东西
                // type Writer interface {
                //     Write(p []byte) (n int, err error)
                // }

                // 这两个接口让函数极其通用：
                func copyData(dst io.Writer, src io.Reader) (int64, error) {
                    return io.Copy(dst, src)
                }

                // 文件、网络连接、内存 buffer 都实现了这两个接口：
                file, _ := os.Open("input.txt")
                buf := &bytes.Buffer{}

                copyData(buf, file)      // 文件 → 内存
                copyData(os.Stdout, buf) // 内存 → 标准输出
                copyData(os.Stdout, strings.NewReader("hello")) // 字符串 → 标准输出

                // 自己实现 io.Writer（比如日志收集器）
                type LogWriter struct {
                    prefix string
                }

                func (w *LogWriter) Write(p []byte) (int, error) {
                    fmt.Printf("[%s] %s", w.prefix, p)
                    return len(p), nil
                }

                lw := &LogWriter{prefix: "INFO"}
                fmt.Fprintf(lw, "服务器启动在端口 %d\n", 8080)
                // [INFO] 服务器启动在端口 8080
                ```
        - 接口组合
            - 和结构体嵌入一样，接口也可以嵌入其他接口
            - Go 鼓励定义小接口，再通过组合构建大接口
            - 示例
                - 
                ```go
                // 小接口：单一职责
                type Reader interface {
                    Read(p []byte) (n int, err error)
                }

                type Writer interface {
                    Write(p []byte) (n int, err error)
                }

                type Closer interface {
                    Close() error
                }

                // 通过组合构建复合接口
                type ReadWriter interface {
                    Reader
                    Writer
                }

                type ReadWriteCloser interface {
                    Reader
                    Writer
                    Closer
                }

                // 实践中的例子
                type Shape interface {
                    Area() float64
                    Perimeter() float64
                }

                type Drawable interface {
                    Draw() string
                }

                // 组合成「可绘制的形状」
                type DrawableShape interface {
                    Shape
                    Drawable
                }
                ```
            - 接口应该越小越好
                - 
                ```go
                // ❌ 大接口：实现困难，测试困难，耦合高
                type UserService interface {
                    CreateUser(name, email string) (*User, error)
                    GetUser(id int) (*User, error)
                    UpdateUser(id int, name string) error
                    DeleteUser(id int) error
                    ListUsers() ([]*User, error)
                    AuthenticateUser(email, password string) (string, error)
                    ResetPassword(email string) error
                    // ... 还有 20 个方法
                }

                // ✅ 小接口：精准，易测试，低耦合
                type UserCreator interface {
                    CreateUser(name, email string) (*User, error)
                }

                type UserFinder interface {
                    GetUser(id int) (*User, error)
                }

                type Authenticator interface {
                    Authenticate(email, password string) (string, error)
                }

                // 函数只声明它真正需要的
                func registerHandler(creator UserCreator) http.HandlerFunc {
                    return func(w http.ResponseWriter, r *http.Request) {
                        // 只需要 CreateUser，不依赖整个 UserService
                    }
                }
                ```
        - 空接口与 any
            - 空接口 interface{} 没有任何方法要求，所以所有类型都满足它
            - Go 1.18 引入了 any 作为 interface{} 的别名，更简洁
            - 示例
                - 
                ```go
                // interface{} 和 any 完全等价
                var x any = 42
                x = "hello"
                x = []int{1, 2, 3}
                x = struct{ Name string }{"Alice"}

                // 常见于需要处理任意类型的场景
                func printAll(values ...any) {
                    for _, v := range values {
                        fmt.Printf("%T: %v\n", v, v)
                    }
                }

                printAll(1, "hello", true, 3.14)
                // int: 1
                // string: hello
                // bool: true
                // float64: 3.14

                // map 存储任意类型（类似 JSON 对象）
                config := map[string]any{
                    "host":    "localhost",
                    "port":    8080,
                    "debug":   true,
                    "timeout": 30.5,
                }
                ```
            - 使用 any 的代价
                - 
                ```go
                // any 丢失了类型信息，使用时必须断言
                var v any = 42

                // ❌ 不能直接运算
                // fmt.Println(v + 1)  // 编译错误

                // ✅ 先断言再使用
                if n, ok := v.(int); ok {
                    fmt.Println(n + 1)  // 43
                }

                // any 的性能也比具体类型差（有装箱开销）
                // 能用泛型（Day 14）就用泛型，不要滥用 any

                // 合理使用场景：
                // 1. JSON 解析（结构未知时）
                // 2. 通用容器（在泛型之前的历史代码）
                // 3. fmt.Println 这种需要接受任意值的工具函数
                ```
            - any 不是银弹
                - any 让你绕过了类型系统，失去了编译器的保护
                - 能用具体类型就用具体类型，能用泛型就用泛型（Go 1.18+），any 是最后的选择
        - 接口定义最佳实践
            - 在使用方定义接口，不在实现方
                - 
                ```go
                // ❌ 在实现包里定义接口（Java 风格）
                // package userservice
                // type UserService interface { ... }
                // type UserServiceImpl struct { ... }

                // ✅ Go 风格：在需要的地方定义接口
                // package handler

                type userStore interface {  // 小写，包私有
                    GetUser(id int) (*User, error)
                    CreateUser(name, email string) (*User, error)
                }

                type Handler struct {
                    store userStore  // 依赖接口，不依赖具体类型
                }

                // 任何实现了 GetUser 和 CreateUser 的类型都可以注入
                func NewHandler(store userStore) *Handler {
                    return &Handler{store: store}
                }
                ```
            - 接口让测试更容易
                - 
                ```go
                // 生产代码
                type DBStore struct { db *sql.DB }
                func (s *DBStore) GetUser(id int) (*User, error) { /* 查数据库 */ }

                // 测试用 Mock（不需要数据库！）
                type MockStore struct {
                    users map[int]*User
                }
                func (m *MockStore) GetUser(id int) (*User, error) {
                    u, ok := m.users[id]
                    if !ok {
                        return nil, errors.New("not found")
                    }
                    return u, nil
                }
                func (m *MockStore) CreateUser(name, email string) (*User, error) {
                    u := &User{ID: len(m.users) + 1, Name: name, Email: email}
                    m.users[u.ID] = u
                    return u, nil
                }

                // 测试
                func TestHandler(t *testing.T) {
                    mock := &MockStore{users: map[int]*User{
                        1: {ID: 1, Name: "Alice"},
                    }}
                    h := NewHandler(mock)  // 注入 Mock
                    // ... 测试 handler 逻辑，完全不依赖数据库
                }
                ```
            - 接口是 Go 依赖注入的基础
                - Go 不需要 Spring 这样的 DI 框架
                - 接口 + 构造函数注入就够了
                - 生产环境注入真实实现，测试时注入 Mock
                - 这让代码既解耦又易测试
                - 这是 Go 后端项目的标准架构模式

并发与工程化





- 并发与工程化
    - Goroutine 入门
        - Goroutine 是什么
            - Goroutine 是 Go 并发的核心——比线程轻量得多的「协程」
            - 启动一个 Goroutine 只需要在函数调用前加 go 关键字
            - 示例
                - 
                ```go
                package main

                import (
                    "fmt"
                    "time"
                )

                func say(s string) {
                    for i := 0; i < 3; i++ {
                        fmt.Println(s)
                        time.Sleep(100 * time.Millisecond)
                    }
                }

                func main() {
                    go say("世界")   // 新 goroutine 中运行
                    say("你好")      // 当前 goroutine 中运行
                }

                // 输出（顺序不确定）：
                // 你好
                // 世界
                // 你好
                // 世界
                // 你好
                // 世界
                ```
            - Goroutine vs 线程
                - ![](https://an-img.oss-cn-hangzhou.aliyuncs.com/2026/04/19/20260419160732615.png,310,100)
        - GMP 调度模型（概览）
            - Go 运行时用 GMP 模型来调度 Goroutine
            - 示例
                - 
                ```go
                // G = Goroutine（协程）
                // M = Machine（OS 线程）
                // P = Processor（逻辑处理器，调度上下文）

                // P 的数量默认等于 CPU 核数，可以设置
                import "runtime"

                runtime.GOMAXPROCS(4)              // 设置使用 4 个 P
                fmt.Println(runtime.GOMAXPROCS(0)) // 查看当前 P 数量
                fmt.Println(runtime.NumCPU())      // CPU 核数

                // Go 1.5+ 默认 GOMAXPROCS = NumCPU
                // 大多数时候不需要手动设置
                ```
            - 调度模型示意
                - 
                ```
                P1 [G1→G2→G3]   P2 [G4→G5→G6]
                    ↓                  ↓
                    M1                 M2
                    ↓                  ↓
                OS Thread          OS Thread

                当 G 执行系统调用阻塞时，P 会把 M 换掉继续跑其他 G
                这叫"work stealing"（工作窃取）——空闲的 P 会从别的 P 偷 G 来跑
                ```
        - sync.WaitGroup 等待协程完成
            - 启动 Goroutine 后，main 函数不会自动等待它们结束
            - 如果 main 退出，所有 Goroutine 都会被强制终止
            - WaitGroup 是等待一组 Goroutine 完成的标准方式
            - 示例
                - 
                ```go
                // ❌ 错误：main 退出，goroutine 还没跑完
                func main() {
                    go fmt.Println("可能跑不到")
                    // main 立即结束，goroutine 被杀死
                }

                // ✅ 用 WaitGroup 等待
                import "sync"

                func main() {
                    var wg sync.WaitGroup

                    for i := 0; i < 5; i++ {
                        wg.Add(1)              // 计数器 +1
                        go func(id int) {
                            defer wg.Done()    // 函数结束时计数器 -1
                            fmt.Printf("Worker %d 完成\n", id)
                        }(i)
                    }

                    wg.Wait()  // 阻塞，直到计数器归零
                    fmt.Println("所有 Worker 完成")
                }
                ```
            - WaitGroup 的使用规范
                - 
                ```go
                // ✅ 正确：在 goroutine 启动前 Add
                wg.Add(1)
                go func() {
                    defer wg.Done()
                    // ...
                }()

                // ❌ 错误：在 goroutine 内部 Add（可能来不及）
                go func() {
                    wg.Add(1)      // 可能 Wait() 已经过了，竞态！
                    defer wg.Done()
                    // ...
                }()

                // ✅ WaitGroup 不能拷贝，传指针
                func process(wg *sync.WaitGroup) {
                    defer wg.Done()
                    // ...
                }

                var wg sync.WaitGroup
                wg.Add(1)
                go process(&wg)
                wg.Wait()
                ```
            - 固定节奏
                - 启动 goroutine 前 wg.Add(1)
                - goroutine 内第一行 defer wg.Done()
                - 主流程 wg.Wait()
        - Goroutine 泄露
            - Goroutine 泄漏是 Go 并发最常见的 bug：启动了 Goroutine，但它永远不会退出，一直占用内存和资源
            - 泄露的常见原因
                - 
                ```go
                // ❌ 泄漏一：等待永远不会发送的 channel
                func leak1() {
                    ch := make(chan int)
                    go func() {
                        val := <-ch  // 永远阻塞！没人往 ch 发数据
                        fmt.Println(val)
                    }()
                    // 函数返回，但 goroutine 永远卡在这
                }

                // ❌ 泄漏二：没有退出机制的无限循环
                func leak2() {
                    go func() {
                        for {
                            doWork()  // 没有 break/return/cancel 条件
                        }
                    }()
                }

                // ❌ 泄漏三：阻塞的 HTTP 请求没有超时
                func leak3() {
                    go func() {
                        resp, _ := http.Get("http://slow-server.com")  
                        // 如果服务器不响应，goroutine 永远等着
                        _ = resp
                    }()
                }
                ```
            - 正确的退出机制
                - 
                ```go
                // ✅ 用 done channel 通知退出
                func worker(done <-chan struct{}) {
                    for {
                        select {
                        case <-done:
                            fmt.Println("收到退出信号，正在退出")
                            return
                        default:
                            doWork()
                        }
                    }
                }

                done := make(chan struct{})
                go worker(done)

                time.Sleep(5 * time.Second)
                close(done)  // 通知所有监听 done 的 goroutine 退出

                // ✅ 用 context.Context（更推荐，Day 10 详讲）
                ctx, cancel := context.WithTimeout(context.Background(), 5*time.Second)
                defer cancel()

                go func() {
                    select {
                    case <-ctx.Done():
                        fmt.Println("超时退出:", ctx.Err())
                        return
                    case result := <-doAsyncWork():
                        fmt.Println("完成:", result)
                    }
                }()
                ```
            - 检测泄露工具 goleak
                - 
                ```go
                // 在测试中检测 goroutine 泄漏
                import "go.uber.org/goleak"

                func TestNoLeak(t *testing.T) {
                    defer goleak.VerifyNone(t)  // 测试结束时检查是否有泄漏的 goroutine
                    
                    // 你的业务代码
                    runSomeTask()
                }

                // 也可以用运行时查看当前 goroutine 数量
                import "runtime"
                fmt.Println("goroutine 数量:", runtime.NumGoroutine())
                ```
            - Goroutine 的黄金原则
                - 启动 Goroutine 的人负责结束它
                - 每次 go func() 之前，问自己：这个 Goroutine 什么时候、在什么条件下会退出？
        - 数据竞争与 Race Detector
            - 多个 Goroutine 同时读写同一变量时，会产生数据竞争（Data Race）
            - Go 自带了竞态检测器
                - 
                ```go
                // ❌ 数据竞争：多个 goroutine 同时写 counter
                var counter int

                func main() {
                    var wg sync.WaitGroup
                    for i := 0; i < 1000; i++ {
                        wg.Add(1)
                        go func() {
                            defer wg.Done()
                            counter++  // ❌ 非原子操作，存在竞争！
                        }()
                    }
                    wg.Wait()
                    fmt.Println(counter)  // 结果不确定，可能不是 1000
                }

                // 运行竞态检测器
                // go run -race main.go
                // 输出：WARNING: DATA RACE
                // 清晰显示哪些行在竞争
                ```
            - 三种解决方案
                - 
                ```go
                // ✅ 方案一：sync.Mutex 加锁
                var (
                    mu      sync.Mutex
                    counter int
                )

                go func() {
                    mu.Lock()
                    defer mu.Unlock()
                    counter++
                }()

                // ✅ 方案二：atomic 原子操作（更快，适合简单计数）
                import "sync/atomic"
                var counter int64

                go func() {
                    atomic.AddInt64(&counter, 1)
                }()
                result := atomic.LoadInt64(&counter)

                // ✅ 方案三：用 channel 传递数据（不共享状态）
                // 这是最地道的 Go 风格（Day 9 详讲）
                ch := make(chan int, 1000)

                for i := 0; i < 1000; i++ {
                    go func() { ch <- 1 }()
                }

                total := 0
                for i := 0; i < 1000; i++ {
                    total += <-ch
                }
                fmt.Println(total)  // 1000，保证正确
                ```
            - -race 标志
                - 开发阶段始终用 go test -race 和 go run -race 运行代码
                - Race Detector 会在运行时检测数据竞争并打印详细报告（文件名、行号、goroutine 栈）
                - 生产环境不用开（有约 20% 性能损耗），但 CI/CD 流水线里一定要跑
        - sync 包核心原语
            - sync 包提供了并发编程的基础工具
            - 除了 WaitGroup，还有互斥锁、读写锁和 Once
            - sync.Mutex 互斥锁
                - 
                ```go
                type SafeCounter struct {
                    mu    sync.Mutex
                    count int
                }

                func (c *SafeCounter) Inc() {
                    c.mu.Lock()
                    defer c.mu.Unlock()  // 保证解锁
                    c.count++
                }

                func (c *SafeCounter) Value() int {
                    c.mu.Lock()
                    defer c.mu.Unlock()
                    return c.count
                }

                // 使用
                counter := &SafeCounter{}
                var wg sync.WaitGroup
                for i := 0; i < 1000; i++ {
                    wg.Add(1)
                    go func() {
                        defer wg.Done()
                        counter.Inc()
                    }()
                }
                wg.Wait()
                fmt.Println(counter.Value())  // 1000，保证正确
                ```
            - sync.RWMutex 读写锁 (读多写少场景)
                - 
                ```go
                type Cache struct {
                    mu   sync.RWMutex
                    data map[string]string
                }

                // 写操作：独占锁
                func (c *Cache) Set(key, val string) {
                    c.mu.Lock()
                    defer c.mu.Unlock()
                    c.data[key] = val
                }

                // 读操作：共享锁（多个 goroutine 可同时读）
                func (c *Cache) Get(key string) (string, bool) {
                    c.mu.RLock()
                    defer c.mu.RUnlock()
                    v, ok := c.data[key]
                    return v, ok
                }

                // 读写锁的性能优势：
                // 纯读的场景下，多个 goroutine 可以并发读，不阻塞
                // 只有写时才独占，适合缓存、配置这类读多写少的场景
                ```
            - sync.Once 单例初始化
                - 
                ```go
                // 保证函数只执行一次，线程安全
                var (
                    instance *DB
                    once     sync.Once
                )

                func GetDB() *DB {
                    once.Do(func() {
                        instance = &DB{
                            conn: openConnection(),
                        }
                    })
                    return instance
                }

                // 无论多少 goroutine 并发调用 GetDB()
                // openConnection() 只会执行一次
                // 这是 Go 实现单例模式的标准方式
                ```
    - Channel 通信
        - Channel 基础
            - Channel 是 Go 并发的通信机制
            - Go 的并发哲学是：「不要通过共享内存来通信，要通过通信来共享内存。」
            - Channel 就是这个哲学的具体实现——Goroutine 之间通过 channel 传递数据，而不是共享变量。
            - 示例
                - 
                ```go
                // 创建 channel：make(chan 类型)
                ch := make(chan int)       // 无缓冲 channel
                ch := make(chan string, 5) // 有缓冲 channel，容量 5

                // 发送数据：ch <- value
                ch <- 42

                // 接收数据：value := <-ch
                v := <-ch

                // 关闭 channel
                close(ch)

                // 判断 channel 是否关闭
                v, ok := <-ch
                // ok == false 说明 channel 已关闭且已空

                // channel 的零值是 nil
                var ch chan int  // nil channel
                // 向 nil channel 发送/接收会永远阻塞！
                ```
            - 两个 Goroutine 通信
                - 
                ```go
                func main() {
                    ch := make(chan string)

                    // 发送方 goroutine
                    go func() {
                        ch <- "Hello from goroutine!"
                    }()

                    // 接收方（主 goroutine）
                    msg := <-ch
                    fmt.Println(msg)  // Hello from goroutine!
                }

                // ✨ 不需要 WaitGroup！
                // <-ch 会阻塞，直到有数据，天然同步
                ```
            - Channel 的方向是通信，不是存储
                - Channel 不是消息队列，不是用来存数据的
                - 它是两个 Goroutine 之间的「传送带」，一端发送，另一端接收，数据在两者之间流动
        - 无缓冲 vs 有缓冲
            - 无缓冲和有缓冲 channel 的行为差异很大，选错会导致死锁或意外的并发行为。
            - 无缓冲 Channel (同步)
                - 
                ```go
                ch := make(chan int)  // 无缓冲

                // 发送方和接收方必须同时就绪，否则阻塞
                // 就像打电话：双方必须同时在线

                // ❌ 死锁：同一个 goroutine 又发又收
                ch <- 1   // 阻塞等待接收方
                v := <-ch // 永远不会执行到这里
                // fatal error: all goroutines are asleep - deadlock!

                // ✅ 正确：发送和接收在不同 goroutine
                go func() { ch <- 42 }()  // 另一个 goroutine 发送
                v := <-ch                  // 主 goroutine 接收（会等待）
                fmt.Println(v)             // 42
                ```
            - 有缓冲 Channel (异步)
                - 
                ```go
                ch := make(chan int, 3)  // 缓冲容量 3

                // 就像发短信：发完不用等对方读
                // 只要缓冲区没满，发送不阻塞
                ch <- 1  // 不阻塞
                ch <- 2  // 不阻塞
                ch <- 3  // 不阻塞
                ch <- 4  // 阻塞！缓冲区已满

                // 缓冲区为空时，接收阻塞
                v := <-ch  // 1

                // 查看状态
                fmt.Println(len(ch))  // 2（当前数据量）
                fmt.Println(cap(ch))  // 3（总容量）
                ```
            - ![](https://an-img.oss-cn-hangzhou.aliyuncs.com/2026/04/20/20260420213936856.png,310,90)
            - 用有缓冲的场景
                - 发送方和接收方速度不匹配，例如任务队列、批量处理
                - 缓冲大小要谨慎，太大会掩盖背压问题（下游处理慢时上游应该被限速）
        - Channel 方向限定
            - 在函数参数中，可以限制 channel 只能发送或只能接收
                - 
                ```go
                // chan<- T：只能发送（send-only）
                // <-chan T：只能接收（receive-only）
                // chan T：双向（可以转换为单向）

                func producer(out chan<- int) {  // 只能往 out 发送
                    for i := 0; i < 5; i++ {
                        out <- i
                    }
                    close(out)  // 生产完毕，关闭 channel
                }

                func consumer(in <-chan int) {   // 只能从 in 接收
                    for v := range in {          // for range 自动处理 close
                        fmt.Println("收到:", v)
                    }
                }

                func main() {
                    ch := make(chan int, 5)  // 双向 channel
                    go producer(ch)          // 自动转换为 chan<- int
                    consumer(ch)             // 自动转换为 <-chan int
                }
                ```
            - for range 遍历 Channel
                - 
                ```go
                // chan<- T：只能发送（send-only）
                // <-chan T：只能接收（receive-only）
                // chan T：双向（可以转换为单向）

                func producer(out chan<- int) {  // 只能往 out 发送
                    for i := 0; i < 5; i++ {
                        out <- i
                    }
                    close(out)  // 生产完毕，关闭 channel
                }

                func consumer(in <-chan int) {   // 只能从 in 接收
                    for v := range in {          // for range 自动处理 close
                        fmt.Println("收到:", v)
                    }
                }

                func main() {
                    ch := make(chan int, 5)  // 双向 channel
                    go producer(ch)          // 自动转换为 chan<- int
                    consumer(ch)             // 自动转换为 <-chan int
                }
                ```
            - 关于 close 的规则
                - 只有发送方应该关闭 channel，接收方不应该关闭
                - 关闭已关闭的 channel 会 panic
                - 向已关闭的 channel 发送会 panic
                - 从已关闭的 channel 接收会立即返回零值
                - 简单原则：谁生产，谁关闭
        - select 多路复用
            - select 是 channel 的多路复用工具，当需要同时监听多个 channel 时，select 是标准答案
                - 
                ```go
                ch1 := make(chan string)
                ch2 := make(chan string)

                go func() {
                    time.Sleep(1 * time.Second)
                    ch1 <- "来自 ch1"
                }()
                go func() {
                    time.Sleep(2 * time.Second)
                    ch2 <- "来自 ch2"
                }()

                // select 等待第一个就绪的 case
                select {
                case msg := <-ch1:
                    fmt.Println("ch1:", msg)
                case msg := <-ch2:
                    fmt.Println("ch2:", msg)
                }
                // 输出：ch1: 来自 ch1（先到先得）
                ```
            - 带 default 的非阻塞操作
                - 
                ```go
                ch := make(chan int, 1)

                // 非阻塞发送
                select {
                case ch <- 42:
                    fmt.Println("发送成功")
                default:
                    fmt.Println("channel 已满，丢弃")
                }

                // 非阻塞接收
                select {
                case v := <-ch:
                    fmt.Println("接收到:", v)
                default:
                    fmt.Println("channel 为空，跳过")
                }
                ```
            - 超时控制 (实战必备)
                - 
                ```go
                func fetchWithTimeout(url string) (string, error) {
                    resultCh := make(chan string, 1)

                    go func() {
                        // 模拟 HTTP 请求
                        time.Sleep(2 * time.Second)
                        resultCh <- "响应内容"
                    }()

                    select {
                    case result := <-resultCh:
                        return result, nil
                    case <-time.After(1 * time.Second):  // 1 秒超时
                        return "", errors.New("请求超时")
                    }
                }
                ```
            - 循环中使用 select
                - 
                ```go
                func worker(jobs <-chan int, done <-chan struct{}) {
                    for {
                        select {
                        case job, ok := <-jobs:
                            if !ok {
                                fmt.Println("jobs channel 已关闭")
                                return
                            }
                            fmt.Println("处理任务:", job)
                        case <-done:
                            fmt.Println("收到退出信号")
                            return
                        }
                    }
                }

                // 多 case 同时就绪时，select 随机选一个
                // 这是刻意设计的，避免某个 case 被饿死
                ```
            - select 的随机性
                - 当多个 case 同时就绪时，select 随机选择一个，不保证顺序
                - 这是 Go 刻意的设计——防止某个 case 总被忽略（饥饿）
        - Done Channel 模式
            - Done channel 是 Go 并发里用来广播退出信号的经典模式
            - 通过 close(done) 可以同时通知所有监听它的 Goroutine 退出
            - 示例
                - 
                ```go
                func generator(done <-chan struct{}, nums ...int) <-chan int {
                    out := make(chan int)
                    go func() {
                        defer close(out)
                        for _, n := range nums {
                            select {
                            case out <- n:       // 正常发送
                            case <-done:         // 收到退出信号
                                return
                            }
                        }
                    }()
                    return out
                }

                func main() {
                    done := make(chan struct{})
                    defer close(done)  // 函数退出时自动广播退出信号

                    out := generator(done, 1, 2, 3, 4, 5)

                    // 只消费 2 个，然后退出
                    // done 关闭会通知 generator goroutine 退出
                    fmt.Println(<-out)  // 1
                    fmt.Println(<-out)  // 2
                    // defer close(done) 执行，generator goroutine 收到信号退出
                }
                ```
            - close 广播的原理
                - 
                ```go
                done := make(chan struct{})

                // 启动多个监听 done 的 goroutine
                for i := 0; i < 3; i++ {
                    go func(id int) {
                        <-done  // 阻塞等待
                        fmt.Printf("Worker %d 退出\n", id)
                    }(i)
                }

                time.Sleep(1 * time.Second)
                close(done)  // ✨ 关闭会「广播」到所有接收方
                // 所有 3 个 goroutine 同时收到通知并退出

                // 原理：从已关闭的 channel 接收立即返回零值
                // 所以 close 一次，所有 <-done 都会解除阻塞
                ```
            - Done channel vs context.Context
                - Done channel 是手动实现退出信号，简单直接
                - 新代码优先用 context
        - 生产者-消费者模式
            - 基础版：单生产者、单消费者
                - 
                ```go
                func producer(out chan<- int, count int) {
                    defer close(out)
                    for i := 0; i < count; i++ {
                        out <- i
                        time.Sleep(50 * time.Millisecond)
                    }
                }

                func consumer(in <-chan int, results chan<- int) {
                    defer close(results)
                    for v := range in {
                        results <- v * v  // 计算平方
                    }
                }

                func main() {
                    jobs := make(chan int, 10)
                    results := make(chan int, 10)

                    go producer(jobs, 5)
                    go consumer(jobs, results)

                    for r := range results {
                        fmt.Println(r)  // 0, 1, 4, 9, 16
                    }
                }
                ```
            - Worker Pool: 多消费者并发处理
                - 
                ```go
                func workerPool(jobs <-chan int, results chan<- int, workerCount int) {
                    var wg sync.WaitGroup
                    
                    for i := 0; i < workerCount; i++ {
                        wg.Add(1)
                        go func(id int) {
                            defer wg.Done()
                            for job := range jobs {
                                // 模拟处理耗时
                                time.Sleep(100 * time.Millisecond)
                                result := job * job
                                results <- result
                                fmt.Printf("Worker %d 处理任务 %d -> %d\n", id, job, result)
                            }
                        }(i)
                    }
                    
                    // 所有 worker 完成后关闭 results
                    go func() {
                        wg.Wait()
                        close(results)
                    }()
                }

                func main() {
                    jobs := make(chan int, 100)
                    results := make(chan int, 100)

                    // 启动 3 个 worker
                    workerPool(jobs, results, 3)

                    // 发送 9 个任务
                    for i := 1; i <= 9; i++ {
                        jobs <- i
                    }
                    close(jobs)  // 任务发送完毕

                    // 收集结果
                    for r := range results {
                        fmt.Println("结果:", r)
                    }
                }

                // 3 个 worker 并发处理 9 个任务
                // 总耗时 ≈ 3 * 100ms = 300ms（串行需 900ms）
                ```
    - 并发模式进阶：context.Context
        - 为什么需要 Context
            - 在 Go 的并发程序里，经常需要跨多个 Goroutine 传递：截止时间、取消信号、请求相关值
            - 没有 context 前，这些靠 done channel 手动实现
            - context 包是 go 官方对这些需求的统一实现
        - context 三大能力
            - 取消信号：主动取消或超时自动取消，自动传播给所有子 context。
            - 截止时间：知道还剩多少时间，让每个环节合理分配时间。
            - 携带值：在调用链上传递请求级别的元数据（traceID、userID 等）。这三点让 context 成为 Go 服务端编程的基础设施。
        - Context 树结构
            - Context 是一棵树：从根节点出发，不断派生子节点
            - 父节点取消时，所有子节点自动取消。这个设计让取消信号天然地从上往下传播
            - 示例
                - 
                ```go
                import "context"

                // 根节点（两种）
                ctx := context.Background()  // 最常用的根，永不取消
                ctx := context.TODO()        // 占位用，表示「还没想好用哪个」

                // 从根派生子节点
                ctx1, cancel1 := context.WithCancel(context.Background())
                ctx2, cancel2 := context.WithTimeout(ctx1, 5*time.Second)
                ctx3, cancel3 := context.WithDeadline(ctx2, time.Now().Add(10*time.Second))
                ctx4 := context.WithValue(ctx3, "traceID", "abc-123")

                // 取消任意一个节点，它的所有子节点都会取消
                cancel1()  // ctx1、ctx2、ctx3、ctx4 全部取消！

                // 每个 WithXxx 返回的 cancel 函数必须调用
                // 否则 context 相关资源永远不会释放（泄漏）
                defer cancel1()
                defer cancel2()
                ``` 
            - 流程
                - 
                ```
                        Background()
                            │
                        WithCancel()  ← cancel() 取消这里
                            │
                        WithTimeout() ← 5秒后自动取消（或父被取消）
                            │
                        WithDeadline() ← 到达截止时间取消（或父被取消）
                            │
                        WithValue()   ← 携带 traceID（不产生取消）

                父节点取消 → 所有子孙节点自动取消 ✨
                ```
        - WithCancel 主动取消
            - WithCancel 是最基础的 context 派生方式，返回一个可手动取消的 context
            - 适用于需要主动控制 goroutine 生命周期的场景
            - 示例
                - 
                ```go
                func longRunningTask(ctx context.Context) error {
                    for {
                        select {
                        case <-ctx.Done():
                            // ctx.Err() 返回取消原因
                            // context.Canceled：被主动取消
                            // context.DeadlineExceeded：超时
                            return ctx.Err()
                        default:
                            // 执行任务的一步
                            doWork()
                            time.Sleep(100 * time.Millisecond)
                        }
                    }
                }

                func main() {
                    ctx, cancel := context.WithCancel(context.Background())

                    // 启动任务
                    go func() {
                        err := longRunningTask(ctx)
                        fmt.Println("任务结束:", err)  // context canceled
                    }()

                    time.Sleep(1 * time.Second)
                    cancel()  // 主动取消，goroutine 收到信号退出

                    time.Sleep(100 * time.Millisecond)
                    fmt.Println("主程序退出")
                }
                ```
            - 一个父取消，多个子都取消
                - 
                ```go
                func worker(ctx context.Context, id int) {
                    for {
                        select {
                        case <-ctx.Done():
                            fmt.Printf("Worker %d 退出: %v\n", id, ctx.Err())
                            return
                        default:
                            fmt.Printf("Worker %d 工作中\n", id)
                            time.Sleep(200 * time.Millisecond)
                        }
                    }
                }

                func main() {
                    ctx, cancel := context.WithCancel(context.Background())
                    defer cancel()

                    // 启动多个 worker，共享同一个 ctx
                    for i := 1; i <= 3; i++ {
                        go worker(ctx, i)
                    }

                    time.Sleep(1 * time.Second)
                    cancel()  // 一次取消，所有 worker 同时退出 ✨

                    time.Sleep(100 * time.Millisecond)
                }
                ```
        - WithTimeout & WithDeadline
            - 超时控制是服务端最常见的需求。
            - WithTimeout 设置相对时间，WithDeadline 设置绝对时间。
            - 两者本质相同，WithTimeout 是对 WithDeadline 的封装。
            - WithTimeout 最常用
                - 
                ```go
                // HTTP 请求超时
                func callExternalAPI(url string) ([]byte, error) {
                    ctx, cancel := context.WithTimeout(context.Background(), 3*time.Second)
                    defer cancel()  // 无论成功失败都要调用

                    req, err := http.NewRequestWithContext(ctx, "GET", url, nil)
                    if err != nil {
                        return nil, err
                    }

                    resp, err := http.DefaultClient.Do(req)
                    if err != nil {
                        // 超时时 err 会包含 "context deadline exceeded"
                        return nil, fmt.Errorf("请求失败: %w", err)
                    }
                    defer resp.Body.Close()

                    return io.ReadAll(resp.Body)
                }

                // 数据库查询超时
                func getUser(db *sql.DB, id int) (*User, error) {
                    ctx, cancel := context.WithTimeout(context.Background(), 2*time.Second)
                    defer cancel()

                    var u User
                    err := db.QueryRowContext(ctx,
                        "SELECT id, name, email FROM users WHERE id = ?", id,
                    ).Scan(&u.ID, &u.Name, &u.Email)

                    return &u, err
                }
                ```
            - 检查剩余时间
                - 
                ```go
                ctx, cancel := context.WithTimeout(context.Background(), 5*time.Second)
                defer cancel()

                // 检查截止时间
                deadline, ok := ctx.Deadline()
                if ok {
                    remaining := time.Until(deadline)
                    fmt.Printf("还剩 %.1f 秒\n", remaining.Seconds())
                }

                // 合理分配时间
                // 总共 5 秒，给第一步 2 秒，给第二步 3 秒
                step1Ctx, cancel1 := context.WithTimeout(ctx, 2*time.Second)
                defer cancel1()
                doStep1(step1Ctx)

                // step2 用剩余时间（最多 3 秒，但如果父 ctx 已超时则立即取消）
                doStep2(ctx)
                ```
            - WithDeadline 绝对时间点
                - 
                ```go
                // 设定必须在某个时间点前完成
                deadline := time.Date(2025, 12, 31, 23, 59, 59, 0, time.UTC)
                ctx, cancel := context.WithDeadline(context.Background(), deadline)
                defer cancel()

                // 检查是否已超过截止时间
                if ctx.Err() == context.DeadlineExceeded {
                    return errors.New("已超过截止时间")
                }
                ```
            - 超时值怎么定
                - 通常根据 SLA（服务等级协议）来定
                - 数据库查询：100ms-2s。内部 RPC：200ms-1s
                - 外部 HTTP：1s-10s
                - 给每一层调用留足缓冲——如果你的总超时是 5s，不要给每个子操作也设 5s，要合理分配
                - 记录 p99 延迟来校准超时值
        - HTTP 服务中的 Context
            - HTTP 服务是 context 最常见的使用场景
            - 每个请求都有一个 context，当客户端断开连接时，context 自动取消，让你能及时释放资源
            - 示例
                - 
                ```go
                // net/http 标准库：每个 Request 自带 context
                func handler(w http.ResponseWriter, r *http.Request) {
                    ctx := r.Context()  // 获取请求的 context

                    // 客户端断开时，ctx.Done() 会收到信号
                    result, err := slowDBQuery(ctx)
                    if err != nil {
                        if ctx.Err() != nil {
                            // 客户端已断开，不需要返回错误
                            return
                        }
                        http.Error(w, err.Error(), 500)
                        return
                    }

                    json.NewEncoder(w).Encode(result)
                }

                // 慢查询感知取消
                func slowDBQuery(ctx context.Context) ([]Row, error) {
                    rows, err := db.QueryContext(ctx,
                        "SELECT * FROM large_table WHERE complex_condition",
                    )
                    if err != nil {
                        return nil, err  // 包含超时/取消信息
                    }
                    defer rows.Close()

                    var result []Row
                    for rows.Next() {
                        // 检查 context，避免在取消后继续处理
                        if ctx.Err() != nil {
                            return nil, ctx.Err()
                        }
                        var row Row
                        rows.Scan(&row.ID, &row.Name)
                        result = append(result, row)
                    }
                    return result, nil
                }
                ```
            - 完整的中间件链
                - 
                ```go
                func main() {
                    mux := http.NewServeMux()
                    mux.HandleFunc("/api/user", userHandler)

                    // 中间件链：每层都可以增强/修改 context
                    handler := timeoutMiddleware(
                        authMiddleware(
                            traceMiddleware(mux),
                        ),
                    )

                    http.ListenAndServe(":8080", handler)
                }

                // 超时中间件：为每个请求加上统一超时
                func timeoutMiddleware(next http.Handler) http.Handler {
                    return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
                        ctx, cancel := context.WithTimeout(r.Context(), 10*time.Second)
                        defer cancel()
                        next.ServeHTTP(w, r.WithContext(ctx))
                    })
                }

                // 认证中间件：注入用户信息
                func authMiddleware(next http.Handler) http.Handler {
                    return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
                        token := r.Header.Get("Authorization")
                        user, err := validateToken(token)
                        if err != nil {
                            http.Error(w, "未授权", 401)
                            return
                        }
                        ctx := context.WithValue(r.Context(), UserIDKey, user.ID)
                        next.ServeHTTP(w, r.WithContext(ctx))
                    })
                }
                ```
            - context 是第一个参数，不是字段
                - Go 官方规范：context 始终作为函数的第一个参数，命名为 ctx
                - 不要把 context 存在结构体字段里——这会让生命周期管理变得混乱
                - 每次函数调用传入，每次可以传入不同的 context，这才是正确的使用姿势
        - context 最佳实践
            - 规范汇总
                - 
                ```go
                // ✅ 1. ctx 永远是第一个参数
                func doSomething(ctx context.Context, param string) error

                // ✅ 2. 函数入口处检查 ctx
                func process(ctx context.Context) error {
                    if ctx.Err() != nil {
                        return ctx.Err()
                    }
                    // ...
                }

                // ✅ 3. defer cancel() 紧跟在 WithXxx 后面
                ctx, cancel := context.WithTimeout(parentCtx, 5*time.Second)
                defer cancel()

                // ✅ 4. 传递 ctx，不要存在结构体字段里
                type Service struct {
                    db *sql.DB
                    // ❌ ctx context.Context  // 不要这样
                }
                func (s *Service) Query(ctx context.Context) error { ... }

                // ✅ 5. 长循环中定期检查 ctx
                func processBatch(ctx context.Context, items []Item) error {
                    for i, item := range items {
                        if i%100 == 0 {  // 每 100 条检查一次
                            if err := ctx.Err(); err != nil {
                                return fmt.Errorf("在第 %d 条时被取消: %w", i, err)
                            }
                        }
                        process(item)
                    }
                    return nil
                }

                // ✅ 6. 区分 Background 和 TODO
                // Background：程序入口、main、测试、HTTP 根 handler
                // TODO：占位用，表示「这里应该有 ctx 但还没传进来」
                ```
            - 常见错误模式
                - 
                ```go
                // ❌ 1. 忘记调用 cancel
                ctx, cancel := context.WithTimeout(ctx, 5*time.Second)
                // 忘写 defer cancel()，定时器资源永远不释放

                // ❌ 2. 在 goroutine 里使用已取消的 ctx
                ctx, cancel := context.WithTimeout(parent, 1*time.Second)
                defer cancel()
                go func() {
                    time.Sleep(2 * time.Second)
                    doWork(ctx)  // ❌ ctx 已超时，doWork 立即失败
                }()

                // ✅ 应该为新 goroutine 派生新 ctx 或用父 ctx
                go func() {
                    newCtx, cancel := context.WithTimeout(parent, 5*time.Second)
                    defer cancel()
                    doWork(newCtx)
                }()

                // ❌ 3. 用 context.Background() 代替传入的 ctx
                func handler(ctx context.Context) error {
                    // 丢失了超时/取消信息！
                    return db.QueryContext(context.Background(), "SELECT ...")
                }

                // ✅ 始终传递原始 ctx
                func handler(ctx context.Context) error {
                    return db.QueryContext(ctx, "SELECT ...")
                }
                ```
            - Context 的使用场景
                - 请求进来 → 用 WithTimeout 加超时 → 中间件用 WithValue 注入元数据 → 传给 handler
                - handler 传给数据库/RPC/外部 HTTP → 客户端断开/超时 → ctx.Done() 触发 → 所有下游自动取消
                - 整条链路只用一个 ctx，层层传递，层层受控
    - 错误处理哲学
        - 错误处理回顾与痛点
            - 示例
                - 
                ```go
                // 基础版：丢失了太多信息
                func readConfig(path string) error {
                    _, err := os.ReadFile(path)
                    if err != nil {
                        return err  // ❌ 调用方不知道是什么操作失败了
                    }
                    return nil
                }

                // 稍好：加了上下文，但还有问题
                func readConfig(path string) error {
                    _, err := os.ReadFile(path)
                    if err != nil {
                        return fmt.Errorf("读取配置失败: %v", err)  // ❌ 用 %v，丢失了原始 err 类型！
                    }
                    return nil
                }

                // ✅ Go 1.13+ 正确做法：用 %w 包装，保留原始 error
                func readConfig(path string) error {
                    _, err := os.ReadFile(path)
                    if err != nil {
                        return fmt.Errorf("读取配置 %s 失败: %w", path, err)  // ✅ %w 包装
                    }
                    return nil
                }

                // 调用方可以拆包检查原始错误
                err := readConfig("/etc/app.yaml")
                if errors.Is(err, os.ErrNotExist) {
                    fmt.Println("配置文件不存在，使用默认配置")
                }
                ```
            - %v 和 %w 的本质区别
                - %v 把 err 转成字符串，原始错误信息被「压扁」成文字，调用方无法再用 errors.Is/As 检查原始类型
                - %w 把原始 err 包裹在新错误里，形成错误链，调用方可以用 errors.Is/As 沿链查找
                - 只要你想让调用方能检查原始错误，就用 %w
        - 错误包装与错误链
            - 错误链就像俄罗斯套娃：最外层是最高级的上下文描述，最内层是根本原因。
            - 每一层都用 %w 包装，形成一条可以追溯的链路。
            - 示例
                - 
                ```go
                // 错误链示例：从底层到顶层
                // 层级：DB驱动 → DB层 → 业务层 → API层

                // ① 最底层：数据库驱动报错
                var ErrNotFound = errors.New("记录不存在")

                // ② DB 层包装
                func (r *UserRepo) Get(id int) (*User, error) {
                    // ...
                    return nil, fmt.Errorf("UserRepo.Get id=%d: %w", id, ErrNotFound)
                }

                // ③ 业务层包装
                func (s *UserService) GetUser(id int) (*User, error) {
                    u, err := s.repo.Get(id)
                    if err != nil {
                        return nil, fmt.Errorf("UserService.GetUser: %w", err)
                    }
                    return u, nil
                }

                // ④ API 层包装
                func handleGetUser(id int) {
                    _, err := userService.GetUser(id)
                    if err != nil {
                        // err.Error() 输出完整链路：
                        // "UserService.GetUser: UserRepo.Get id=42: 记录不存在"
                        fmt.Println(err)
                    }
                }
                ```
            - 手动实现 Unwrap (支持自定义类型)
                - 
                ```go
                // 自定义错误类型也可以支持错误链
                type DBError struct {
                    Op  string  // 操作名
                    Err error   // 原始错误
                }

                func (e *DBError) Error() string {
                    return fmt.Sprintf("数据库操作 %s 失败: %v", e.Op, e.Err)
                }

                // ✨ 实现 Unwrap 方法，支持 errors.Is/As 穿透
                func (e *DBError) Unwrap() error {
                    return e.Err
                }

                // 使用
                err := &DBError{Op: "INSERT", Err: ErrDuplicate}
                fmt.Println(errors.Is(err, ErrDuplicate))  // true，因为实现了 Unwrap
                ```
            - 错误链的价值
                - 一条好的错误链就像一份事故报告：「API层在做什么 → 业务层在做什么 → 数据层在做什么 → 根本原因是什么」
                - 出了问题直接看错误信息就能定位，不用加断点。
                - 这在微服务日志里尤其有价值。
        - errors.Is: 判断错误类型
            - errors.Is 用来判断错误链中是否包含某个特定的「哨兵错误」（Sentinel Error）。
            - 它会递归 Unwrap 整条链，不像 == 只比较最外层。
            - 示例
                - 
                ```go
                // 定义哨兵错误（包级别的可比较 error 值）
                var (
                    ErrNotFound    = errors.New("未找到")
                    ErrUnauthorized = errors.New("未授权")
                    ErrTimeout     = errors.New("超时")
                )

                func doSomething() error {
                    return fmt.Errorf("操作失败: %w", ErrNotFound)  // 包装了 ErrNotFound
                }

                err := doSomething()

                // ❌ == 只比较最外层，找不到
                fmt.Println(err == ErrNotFound)        // false！

                // ✅ errors.Is 会沿链查找
                fmt.Println(errors.Is(err, ErrNotFound))  // true ✨

                // 实际使用场景
                if errors.Is(err, ErrNotFound) {
                    http.Error(w, "资源不存在", http.StatusNotFound)
                } else if errors.Is(err, ErrUnauthorized) {
                    http.Error(w, "请先登录", http.StatusUnauthorized)
                } else if err != nil {
                    http.Error(w, "内部错误", http.StatusInternalServerError)
                }
                ```
            - 自定义 Is 方法
                - 
                ```go
                // 有时候两个错误「相等」不是值相等，而是逻辑相等
                type StatusError struct {
                    Code int
                }

                func (e *StatusError) Error() string {
                    return fmt.Sprintf("HTTP %d", e.Code)
                }

                // 自定义 Is：只要 Code 相同就认为相等
                func (e *StatusError) Is(target error) bool {
                    t, ok := target.(*StatusError)
                    if !ok {
                        return false
                    }
                    return e.Code == t.Code
                }

                err := fmt.Errorf("请求失败: %w", &StatusError{Code: 404})
                target := &StatusError{Code: 404}

                fmt.Println(errors.Is(err, target))  // true，通过自定义 Is 比较
                ```
        - errors.As: 提取错误详情
            - errors.Is 只判断「是不是」，errors.As 则「取出来」——把错误链中某个具体类型的错误提取出来，访问它的字段
            - 示例
                - 
                ```go
                // 自定义错误类型，携带更多信息
                type ValidationError struct {
                    Field   string
                    Value   any
                    Message string
                }

                func (e *ValidationError) Error() string {
                    return fmt.Sprintf("字段 %s（值=%v）验证失败: %s",
                        e.Field, e.Value, e.Message)
                }

                func validateAge(age int) error {
                    if age < 0 {
                        return &ValidationError{
                            Field:   "age",
                            Value:   age,
                            Message: "不能为负数",
                        }
                    }
                    return nil
                }

                func processUser(age int) error {
                    if err := validateAge(age); err != nil {
                        return fmt.Errorf("processUser: %w", err)  // 包装了 ValidationError
                    }
                    return nil
                }

                // 调用方提取详情
                err := processUser(-1)
                if err != nil {
                    var ve *ValidationError
                    if errors.As(err, &ve) {  // ✅ 会沿链查找 *ValidationError 类型
                        fmt.Printf("字段 %q 的值 %v 有误: %s\n",
                            ve.Field, ve.Value, ve.Message)
                        // 字段 "age" 的值 -1 有误: 不能为负数
                    } else {
                        fmt.Println("未知错误:", err)
                    }
                }
                ```
