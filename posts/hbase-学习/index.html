ents.length>0){activeElement=elements[0];const e=encodeURI(activeElement.getAttribute("id")).toLowerCase();document.querySelector(`.inner ul li a[href="#${e}"]`).classList.add("active")}const t=document.getElementById("top-link");t&&t.addEventListener("click",e=>{e.preventDefault(),window.scrollTo({top:0,behavior:"smooth"})})},!1),window.addEventListener("resize",function(){checkTocPosition()},!1),window.addEventListener("scroll",()=>{const e=window.pageYOffset||document.documentElement.scrollTop;if(e===0)return;elements&&elements.length>0&&(activeElement=Array.from(elements).find(t=>{if(getOffsetTop(t)-e>0&&getOffsetTop(t)-e<window.innerHeight/2)return t})||activeElement,elements.forEach(e=>{const n=encodeURI(e.getAttribute("id")).toLowerCase(),t=document.querySelector(`.inner ul li a[href="#${n}"]`);if(e===activeElement){t.classList.add("active");const e=document.querySelector(".toc .inner"),n=t.offsetTop,s=e.clientHeight,o=t.clientHeight,i=n-s/2+o/2;e.scrollTo({top:i,behavior:"smooth"})}else t.classList.remove("active")}))},!1);const main=parseInt(getComputedStyle(document.body).getPropertyValue("--article-width"),10),toc=parseInt(getComputedStyle(document.body).getPropertyValue("--toc-width"),10),gap=parseInt(getComputedStyle(document.body).getPropertyValue("--gap"),10);function checkTocPosition(){const e=document.body.scrollWidth;e-main-toc*2-gap*4>0?document.getElementById("toc-container").classList.add("wide"):document.getElementById("toc-container").classList.remove("wide")}function getOffsetTop(e){if(!e.getClientRects().length)return 0;let t=e.getBoundingClientRect(),n=e.ownerDocument.defaultView;return t.top+n.pageYOffset}</script><div class=post-content><h1 id=基础认知>基础认知<a hidden class=anchor aria-hidden=true href=#基础认知>#</a></h1><div id=me_0 class=mindelixir-container style=height:860px;width:100%></div><script type=application/json id=me_0_src>"\"- 基础认知\\n    - HBase 和 MySQL、Redis、Elasticsearch、Hive 的区别\\n        - HBase\\n            - 一个建立在 Hadoop/HDFS 上的、支持联机、实时读写的分布式数据库，适合承载超大表\\n            - 面向宽表/稀疏表\\n            - 以 RowKey 为核心访问路径\\n            - 强项是海量数据下的主键访问和范围扫描\\n        - MySQL\\n            - 关系型数据库\\n            - 强 SQL 能力\\n            - 强事务\\n            - 适合 OLTP 业务系统\\n        - Redis\\n            - 内存型数据存储\\n            - 超低延迟\\n            - 丰富数据结构\\n            - 更像高性能数据结构引擎/缓存平台\\n        - ElasticSerach\\n            - 分布式搜索引擎\\n            - 文档模型\\n            - 擅长全文检索、相关性排序、聚合分析\\n            - 不是传统事务数据库\\n        - Hive\\n            - 数据仓库\\n            - 面向离线分析\\n            - 适合大规模批处理、报表、数仓\\n            - 不适合在线高并发事务场景\\n    - 列式/列族模型是什么\\n        - 列族模型\\n            - 看起来像一张表\\n            - 但是每一行并不是必须拥有同样的列\\n            - HBase 把列分成若干个 Column Family (列族)\\n            - 同一个列族里面的数据会被一起管理和物理存储\\n            - 每一条具体的数据单元是一个 Cell，由行键、列族、列限定符、事件戳和值共同确定\\n            - HBase 是一个按 RowKey 组织、按列族管理、按单元格存值、支持多版本的稀疏宽表结构\\n        - 模型示例\\n            - 层次结构\\n                - Table -\\u003e Row -\\u003e Column Family -\\u003e Column Qualifier -\\u003e Cell(Value + TimeStamp)\\n            - 一张用户表 user_profile，定义了两个列族 info + stat\\n                - 一行数据\\n                    - RowKey = user_1001\\n                    - info:name = \\\"Alice\\\"\\n                    - info:city = \\\"Tokyo\\\"\\n                    - stat:login_cnt = 25\\n                - info、stat 是列族\\n                - name、city、login_cnt 是列限定符\\n                - 完整列名是 family:qualifier\\n                - 每个值都带 timestamp，可以保留多个版本\\n        - 列族、列、Cell\\n            - RowKey\\n                - 是一行数据的主键，也是 HBase 最核心的访问入口\\n                - 查 HBase，本质是在查某个 RowKey，或者扫描一段 RowKey 的范围\\n                - 决定这一行是谁\\n                - 决定数据在字典序上的排序方式\\n                - 决定大部分查询的性能上限\\n            - Column Family\\n                - 是 HBase 中必须定义的逻辑分组\\n                - 列族在创建表时就确定好\\n                - HBase shell 和 API 文档都以先创建表，定义 family，再在 family 下写具体列的方式使用 HBase\\n                - 列族是一组经常一起出现，一起管理，一起存储策略配置的数据\\n            - Column Qualifier（列限定符）\\n                - 列限定符就是列族下面具体的列名\\n                - 列限定符不需要像 MySQL 字段在建表时全部固定列出来\\n                - 列族通常固定，但是 qualifier 可以按需动态增加。\\n                - HBase 适合列很多，而且不同记录拥有的列不一样的场景\\n            - Cell\\n                - Cell 是最小存储单元\\n                - 一个 Cell 由这些部分唯一定位\\n                    - row\\n                    - family\\n                    - qualifier\\n                    - timestamp\\n                    - value\\n            - TimeStamp/Version\\n                - HBase 天然支持多版本\\n                - 同一个 row + family + qualifier，可以在不同 timestamp 下保存多个值\\n                - Get/Scan API 也支持按照版本范围取数据\\n                - HBase 的默认思维是：一个单元格可以有历史版本\\n        - 为什么要有列族\\n            - HBase 不只是逻辑上分组，还会影响物理管理和存储策略\\n            - 列族可以把访问模式相近的数据放在一起\\n            - 列族可以让不同数据有不同的存储策略\\n            - 列族可以让稀疏表更自然\\n        - 稀疏宽表\\n            - 稀疏\\n                - 不是每一行都有同样的列\\n                - 举例\\n                    - 商品 A：颜色、尺寸、品牌\\n                    - 商品 B：品牌、功率、电压\\n                    - 商品 C：材质、长度、颜色、重量\\n                - 如果用 MySQL，固定列会导致很多字段为空\\n                - HBase 只保存实际存在的 family:qualifier-\\u003evalue 即可\\n                - HBase 在列族下使用动态 qualifier\\n            - 宽表\\n                - 列非常多，甚至 qualifier 的数量可以远大于传统关系表的字段数\\n    - HBase 为什么是 Bigtable 风格数据库\\n        - 什么是 Bigtable\\n            - Bigtable 是 Google 提出的一个分布式存储系统，用来存放结构化数据，典型特点\\n                - 面向超大规模数据\\n                - 稀疏，可扩展的表\\n                - 以 row key 为核心组织数据\\n                - 支持列族\\n                - 支持多版本\\n                - 支持按键范围扫描\\n        - 以 RowKey 为中心，而不是以 SQL 为中心\\n            - Bigtable 风格数据库核心访问方式\\n                - 按 RowKey 精准查\\n                - 按 RowKey 前缀或范围扫描\\n                - 设计 schema 时优先围绕查询路径设计 row key\\n            - 设计数据库时，优先设计 RowKey 和访问路径，而不是优先设计复杂 SQL\""</script><script>(function(){if(typeof MindElixir=="undefined"){console.error("MindElixir not loaded. Check your CDN script tag.");return}const n="me_0";let e=JSON.parse(document.getElementById(n+"_src").textContent);function s(){return"n_"+Math.random().toString(16).slice(2)+Date.now().toString(16)}function a(e){const o=e.split(/\n/).map(e=>e.replace(/\s+$/g,"")).filter(e=>e.trim().length>0);console.log(o);const t=[];let n=null;for(const u of o){const r=u.match(/^(\s*)([-*+])\s+(.*)$/);if(!r)continue;const h=r[1].replace(/\t/g,"  ").length,d=Math.floor(h/2);let e=r[3].trim(),c=null;const l=e.match(/^(.*?)(?:\s*->\s*)(https?:\/\/\S+)\s*$/);l&&(e=l[1].trim(),c=l[2].trim());const i={id:s(),topic:e,children:[]},a=e.match(/!\[\]\(\s*([^,\]]+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)\s*$/i);if(a){const t=a[1].trim(),n=Number(a[2]),s=Number(a[3]);e=e.replace(a[0],"").trim(),i.topic="",i.image={url:t,width:n,height:s}}if(c&&(i.hyperLink=c),!n){n=i,t.push({level:0,node:n});continue}for(;t.length&&t[t.length-1].level>=d;)t.pop();const m=t.length?t[t.length-1].node:n;m.children.push(i),t.push({level:d,node:i})}return n||{id:s(),topic:"Empty",children:[]}}e=JSON.parse(e),console.log(e);const t=a(e);console.log(t);const o={nodeData:{id:t.id,topic:t.topic,root:!0,children:t.children||[]},arrows:[],summaries:[],direction:2};console.log(o);const i=window.MindElixir?.default??window.MindElixir;if(typeof i!="function"){console.error("MindElixir loaded but not a constructor. window.MindElixir =",window.MindElixir);return}const r=new i({el:"#"+n});r.init(o)})()</script><h1 id=数据模型与表设计>数据模型与表设计<a hidden class=anchor aria-hidden=true href=#数据模型与表设计>#</a></h1><div id=me_1 class=mindelixir-container style=height:860px;width:100%></div><script type=application/json id=me_1_src>"\"- 数据模型与表设计\\n    - RowKey 设计原则\\n        - 总纲\\n            - RowKey 不是随便选一个主键，而是 HBase 里面最重要的访问索引、排序依据和分布依据。\\n            - 每行只有一个被索引的值，就是 row key\\n        - 本质\\n            - 数据如何定位\\n            - 数据怎么按字典序排序\\n            - 数据怎么在集群中分布，会不会热点\\n        - RowKey 为什么重要\\n            - 最快、最强、最自然的访问路径就是按照 RowKey 去查和按范围扫\\n            - RowKey 设计不好\\n                - 查询路径不顺\\n                - scan 范围过大\\n                - 热点集中\\n                - 读写吞吐不均衡\\n                - 很难靠 SQL 或者二级索引补救\\n        - 核心原则\\n            - 先按查询方式设计，不要按照字段含义设计\\n                - 最常见的查询是什么\\n                - 查询是点查还是范围查\\n                - 查询维度谁排第一\\n                - 结果取最近一条、最近 N 条还是一个时间段\\n            - 让最常用的过滤维度出现在 RowKey 前部\\n                - Row Key 前缀直接决定\\n                    - 哪些数据会排在一起\\n                    - 哪些数据可以用 prefix/range 高效扫描\\n            - Row Key 要支持高频查询的自然范围扫描\\n                - HBase 擅长的不是随意条件查询，而是连续键空间扫描\\n                - 建议围绕 row key prefix 设计 schema\\n                - 例如查询设备时序数据\\n                    - 按设备查最近数据\\n                    - 按设备查某段时间数据\\n                    - device_id#reverse_ts\\n                - 避免单 key 递增直接写入，防止热点\\n                    - 不断递增的 rowKey 最新写入通常会不断打到键空间尾部，把写压力集中到少数 region\\n            - 在可扫描性和均匀分布之间做平衡\\n                - 分桶：bucket(user_id)#user_id#reverse_ts\\n            - 时间类场景通常需要显式设计时间顺序\\n            - rowKey 要短、稳定、可解析\\n        - 常见设计模式\\n            - 单主键模型\\n                - user_id\\n                - 一行就是一个主键\\n                - 点查为主\\n                - 不需要时间维度\\n            - 主维度 + 时间\\n                - user_id#ts\\n            - 主维度 + 倒序时间\\n                - user_id#reverse_ts\\n            - 桶 + 主维度 + 时间\\n                - bucket(user_id)%16#user_id#reverse_ts\\n            - 数据集前缀 + 业务键\\n                - U#1001\\n    - 列族应该怎么拆\\n        - 为什么列族拆分重要\\n            - 列族会把同一族的一组列物理共置\\n            - 列族带有独立的存储属性\\n            - 每一行都拥有相同的列族集合\\n            - 未写入的单元格不占用实际空间\\n        - 列族拆分总原则\\n            - 同查：经常一起读的字段，放在一起\\n            - 同配：需要相同存储策略的字段，适合放在一起\\n            - 同寿命：生命周期相近的字段，适合放在一起\\n            - 同频率：更新频率相近的字段，适合放在一起\\n        - 拆分口诀\\n            - 基础资料一族、频繁指标一族、短期日志一族、打对象单独一族\\n    - 版本机制\\n        - 什么是版本\\n            - 同一个字段可能保存多份历史值\\n            - 每一份历史值靠 timestamp 区分\\n            - HBase 官方文档把 Cell 展示为包含 row、column、timestamp 和 value\\n        - timestamp 和 version 的关系\\n            - timestamp 是版本标识\\n                - 在 HBase 里，每写入一个 Cell，都要有对应的 timestamp\\n                - timestamp 由系统自动生成，也可以由自己指定\\n            - version 是字段保留的历史份数\\n                - 按列族配置，说明最多留多少份历史数据\\n    - TTL、压缩、Bloom Filter\\n        - TTL 是什么\\n            - Time To Live，生存时间\\n            - 是 cell contents 的生存时间，单位是 s\\n            - 是列族级的数据过期策略\\n        - TTL 解决的问题\\n            - 控制历史数据无限膨胀\\n            - 降低存储成本\\n            - 让冷热数据边界更为清晰\\n        - 压缩是什么\\n            - 压缩就是把 HBase 存到 StoreFile/HFile 里面的数据，用某种压缩算法压小\\n            - 可以在 ColumnFamily 上启用压缩，且不需要重建表\\n            - 用 CPU 换磁盘空间、换 I/O 带宽\\n        - Bloom Filter 是什么\\n            - 是一种概率型存在性判断结构\\n            - 帮助你快速判断这个 StoreFile 里面大概率没有你想要的数据，就不去做无效读取了\\n    - 热点问题\\n        - 什么是热点\\n            - HBase/Bigtable 这类系统的数据是按照 rowKey 的字段序排列的\\n            - 相邻的 Key 也会落在相邻的 key range 上，这些 key range 被分配给特定的 Region/RegionServer 来服务\\n            - 如果请求集中在某一个 RowKey/某一小段连续 RowKey/某个不断增长的最新 key 区间，负载就不会均匀摊开，造成热点\""</script><script>(function(){if(typeof MindElixir=="undefined"){console.error("MindElixir not loaded. Check your CDN script tag.");return}const n="me_1";let e=JSON.parse(document.getElementById(n+"_src").textContent);function s(){return"n_"+Math.random().toString(16).slice(2)+Date.now().toString(16)}function a(e){const o=e.split(/\n/).map(e=>e.replace(/\s+$/g,"")).filter(e=>e.trim().length>0);console.log(o);const t=[];let n=null;for(const u of o){const r=u.match(/^(\s*)([-*+])\s+(.*)$/);if(!r)continue;const h=r[1].replace(/\t/g,"  ").length,d=Math.floor(h/2);let e=r[3].trim(),c=null;const l=e.match(/^(.*?)(?:\s*->\s*)(https?:\/\/\S+)\s*$/);l&&(e=l[1].trim(),c=l[2].trim());const i={id:s(),topic:e,children:[]},a=e.match(/!\[\]\(\s*([^,\]]+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)\s*$/i);if(a){const t=a[1].trim(),n=Number(a[2]),s=Number(a[3]);e=e.replace(a[0],"").trim(),i.topic="",i.image={url:t,width:n,height:s}}if(c&&(i.hyperLink=c),!n){n=i,t.push({level:0,node:n});continue}for(;t.l            - 请求发到该 Region Server\\n            - RegionServer 找到这个 Region 对应 family 的 Store\\n            - 先写 WAL\\n            - 在把数据写到 Store 里面的 MemStore\\n            - 后台达到条件后，MemStoreFlusher 把数据 flush 到 StoreFile\\n            - 之后 CompactSplitThread/MajorCompactionChecker 再持续维护这些文件\\n        - Get/Scan 流程\\n            - 客户端根据元数据找到 Region 所在的 Region Server\\n            - RegionServer 在对应 Region 的 Store 中查找\\n            - 优先利用 BlockCache\\n            - 必要时再读 StoreFile/HFile\\n            - 利用索引和 BloomFilter 缩小无效读取\\n            - 返回结果给客户端\\n    - Region 是什么\\n        - Region 定义\\n            - Region 是一段连续的、按 RowKey 排序的行范围\\n            - 表的层级结构 Table-\\u003eRegion-\\u003eStore-\\u003eMemStore/StoreFile-\\u003eBlock\\n        - 为什么要有 Region\\n            - 做分布式切片\\n            - 支持扩展\\n            - 支持负载均衡\\n        - Region 结构\\n            - 一个 Region 内部，每个 ColumFile 对应一个 Store，每个 Store 有自己的 MemStore 和若干 StoreFile\\n        - Region 如何分配\\n            - 同一时刻，一个 Region 只由一个 RegionServer 提供服务\\n            - 一个 RegionServer 可以持有很多 Region\\n            - HMaster 负责 Region 给谁、是否迁移、是否均衡\\n            - RegionServer 负责真正持有 Region 并处理这个 Region 的读写\\n        - Region 为什么需要切分\\n            - 单个 Region 太大，迁移和恢复成本高\\n            - 该 Region 所在 RegionServer 负载可能过重\\n            - 并行度不够，一大段数据只能由一个 Region 服务\\n            - 热点更集中，难以分散\\n            - split 的目的，是把一个过大的 key range 拆分成两个更小的 key range，来提升可扩展性和分布性\\n        - 什么时候会 split\\n            - 由 RegionSplitPolicy 决定\\n            - 当 Region 增长到某个阈值/满足当前 split policy 的条件\\n    - WAL 是什么\\n        - 为什么需要 WAL\\n            - HBase 不是收到请求就立即写成 HFile\\n            - 写请求先进入内存里面的 MemStore\\n            - MemStore 是内存结构，掉电或进程崩溃会丢\\n            - WAL 为还没落成 HFile 的持久化阶段兜底\\n            - 写入请求里的 cells 会一直保留，直到成功持久化到 WAL 和 MemStore\\n            - MemStore 负责写入速度，WAL 负责稳定性\\n        - 为什么叫 Write-Ahead\\n            - 先把将要发生的修改记录到日志中，再依赖后续流程把它整理进正式数据文件\\n            - 这条写操作在正式长期存储结构整理完成之前\\n            - 已经被写入到一个可恢复的日志里\\n        - WAL 处在的位置/Put 操作链路\\n            - 客户端把 Put 请求发送到目标 RegionServer\\n            - RegionServer 把这次修改追加到 WAL\\n            - 同时把数据写入目标 Store 的 MemStore\\n            - 之后后台线程再把 MemStore Flush 成 StoreFile/HFile\\n            - 最后通过 compaction 整理文件\\n        - WAL 记录的内容\\n            - WAL 记录的是这次写操作的增量编辑记录\\n            - WAL 写入的内容加做 WALEdit，有 WAL.Entry、WALKey 类型来表示一条日志条目及其键\\n    - MemStore、StoreFile/HFile、BlockCache\\n        - 概述\\n            - MemStore：写入时的内存缓冲区\\n            - StoreFile/HFile：Flush 之后落盘的正式数据文件\\n            - BlockCache：读路径上的数据块缓存\\n            - 在一个 Region 里，每个列族对应一个 Store，每个 Store 有自己的 MemStore 和若干 StoreFile\\n        - MemStore 是什么\\n            - MemStore 是 Store 在内存中的缓冲区\\n            - 客户端写入数据， RegionServer 会先把修改写入 WAL，并把数据存放在对应的 Store 的 MemStore\\n            - 后续达到条件后，再 flush 到磁盘形成 StoreFile\\n            - 主要解决写的快的问题，如果每次 Put/Delete 都直接改磁盘主文件，开销会很大\\n            - 先写入内存，可以把随机小写聚合起来，再批量 flush 到磁盘\\n            - MemStore 只是内存态，不是最终查询文件，内容会在后续 flush 后变为 StoreFile/HFile\\n        - StoreFile 是什么\\n            - 是 Store 在磁盘上的数据文件\\n            - MemStore 不会只 flush 一次，每次 flush 会生成新的 StoreFile\\n            - 当 BlockCache miss 且 MemStore 没有目标数据，RegionStore 会去 HFile/StoreFile 中查\\n        - HFile 是什么\\n            - 是底层文件格式，StoreFile 是 HBase 在 RegionServer/Store 这一层使用的数据文件抽象\\n            - 一个 StoreFile 对应一个 HFile\\n        - BlockCache 是什么\\n            - 是 HBase 读路径上的数据库缓存\\n            - 缓存的是从 HFile 里读出来的 block\\n            - 解决的是读的快的问题\\n    - Flush、Compaction、Split 的流程\\n        - Flush 是什么\\n            - 定义\\n                - 把某个 Store 的 MemStore 内容写到磁盘，生成新的 StoreFile\\n            - 为什么必须 Flush\\n                - MemStore 在内存中，不能无限增长\\n            - flush 后发生什么\\n                - flush 完成后，这批数据会变成新的 StoreFile，被纳入该 Store 的文件集合。\\n        - Flush 触发条件\\n            - 内存压力触发\\n            - 时间触发\\n            - 运维/内部流程触发\\n        - Compaction 是什么\\n            - Compaction 是把一个 Store 多个 StoreFile 文件合并整理成更少的新文件\\n        - Minor Compaction 和 Major Compaction 的区别\\n            - Minor Compaction\\n                - 把若干个较小的 StoreFile 合并成更少的较大文件，但通常不是把该 Store 的所有文件一次性全部重写\\n            - Major Compaction\\n                - 更彻底地重写该 Store 的文件集合\\n        - Split 是什么\\n            - Split 是把一个 Region 沿 RowKey 边界切成两个子 Region\\n    - Zookeeper 的作用\\n        - 核心作用\\n            - 主节点选举：决定谁是 active HMaster\\n            - 服务发现：让客户端知道该连谁\\n            - 节点状态感知：知道哪些服务还活着\\n            - 协调关键元数据入口\\n        - 为什么 HBase 需要 ZooKeeper\\n            - HBase 把协调问题外包给 ZooKeeper，把自己更多精力放在存储和读写路径上\\n        - Zookeeper 不做什么\\n            - 不存储业务明细数据\\n            - 不承担高吞吐读写\\n            - 不等于 HMaster\""</script><script>(function(){if(typeof MindElixir=="undefined"){console.error("MindElixir not loaded. Check your CDN script tag.");return}const n="me_2";let e=JSON.parse(document.getElementById(n+"_src").textContent);function s(){return"n_"+Math.random().toString(16).slice(2)+Date.now().toString(16)}function a(e){const o=e.split(/\n/).map(e=>e.replace(/\s+$/g,"")).filter(e=>e.trim().length>0);console.log(o);const t=[];let n=null;for(const u of o){const r=u.match(/^(\s*)([-*+])\s+(.*)$/);if(!r)continue;const h=r[1].replace(/\t/g,"  ").length,d=Math.floor(h/2);let e=r[3].trim(),c=null;const l=e.match(/^(.*?)(?:\s*->\s*)(https?:\/\/\S+)\s*$/);l&&(e=l[1].trim(),c=l[2].trim());const i={id:s(),topic:e,children:[]},a=e.match(/!\[\]\(\s*([^,\]]+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)\s*$/i);if(a){const t=a[1].trim(),n=Number(a[2]),s=Number(a[3]);e=e.replace(a[0],"").trim(),i.topic="",i.image={url:t,width:n,height:s}}if(c&&(i.hyperLink=c),!n){n=i,t.push({level:0,node:n});continue}for(;t.length&&t[t.length-1].level>=d;)t.pop();const m=t.length?t[t.length-1].node:n;m.children.push(i),t.push({level:d,node:i})}return n||{id:s(),topic:"Empty",children:[]}}e=JSON.parse(e),console.log(e);const t=a(e);console.log(t);const o={nodeData:{id:t.id,topic:t.topic,root:!0,children:t.children||[]},arrows:[],summaries:[],direction:2};console.log(          - default\\n                - 用户表默认所在 namespace\\n            - hbase\\n                - 系统 namespace，保留给 hbase 内部表\\n        - 创建 namespace\\n            - create_namespace 'demo'\\n        - 查看 namespace\\n            - list_namespace\\n        - 在 namespace 下建表\\n            - create 'demo:test', 'cf'\\n        - 写入和读取\\n            - put 'demo:test', 'row1', 'cf:a', 'value1'\\n            - get 'demo:test', 'row1'\\n            - scan 'demo:test'\\n        - 删除 namespace\\n            - drop_namespace 'demo'\\n    - 设置版本数、TTL、压缩\\n        - 列族级配置\\n            - family 是物理和策略边界\\n            - VERSIONS、TTL、COMPRESSION 这类配置，默认思维都是这个 family 怎么存，不是这一列怎么存\\n        - alter 是什么命令\\n            - alter 用来修改已有表的 schema 或表/列族相关配置\\n        - VERSIONS\\n            - 控制什么\\n                - 同一个 row+family+qualifier 最多保存多少个历史版本\\n            - 怎么改\\n                - alter 'test', NAME =\\u003e 'cf', VERSIONS =\\u003e 5\\n        - TTL\\n            - 控制什么\\n                - 这个列族里面的数据默认能活多久\\n            - 怎么改\\n                - alter 'test', NAME =\\u003e 'cf', TTL =\\u003e 2592000\\n        - COMPRESSION\\n            - 控制什么\\n                - 这个列族的 StoreFile/HFile 落盘时用什么压缩算法\\n            - 怎么改\\n                - alter 'test', NAME =\\u003e 'cf', COMPRESSION =\\u003e 'SNAPPY'\\n        - 验证修改\\n            - describe 'test'\\n    - 查看 Region 分布\\n        - web ui\\n            - localhost:16010\\n            - ![](https://an-img.oss-cn-hangzhou.aliyuncs.com/2026/03/24/20260324154801170.png,600,400)\\n    - 简单 filter 查询\\n        - 为什么要用 filter\\n            - 不想整表扫出来自己筛\\n            - 只看某些 row key 前缀/只看某些列名前缀/只取前 N 行/只保留某个列值满足条件的行\\n            - 让 RegionServer 在服务端先过滤（server-side filtering）\\n        - filter 的基本写法\\n            - scan '表明', { FILTER =\\u003e \\\"过滤器表达式\\\" }\\n        - 准备练习数据\\n            - ![](https://an-img.oss-cn-hangzhou.aliyuncs.com/2026/03/24/20260324155538852.png,475,206)\\n        - 5 类简单 filter\\n            - PrefixFilter：按 row key 前缀过滤\\n                - ![](https://an-img.oss-cn-hangzhou.aliyuncs.com/2026/03/24/20260324155813044.png,801,131)\\n            - PageFilter：限制返回多少行\\n                - scan 'demo:filter_test', { FILTER =\\u003e \\\"PageFilter(2)\\\" }\\n                - ![](https://an-img.oss-cn-hangzhou.aliyuncs.com/2026/03/24/20260324160025865.png,799,138)\\n            - ColumnPrefixFilter：按列限定符前缀过滤\\n                - scan 'demo:filter_test', { FILTER =\\u003e \\\"ColumnPrefixFilter('na')\\\" }\\n                - ![](https://an-img.oss-cn-hangzhou.aliyuncs.com/2026/03/24/20260324160109778.png,801,134)\\n            - SingleColumnValueFilter：按某一列的值筛行\\n                - scan 'demo:filter_test', { FILTER =\\u003e \\\"SingleColumnValueFilter('cf', 'city', =, 'binary:Tokyo')\\\" }\\n                - ![](https://an-img.oss-cn-hangzhou.aliyuncs.com/2026/03/24/20260324160214742.png,941,100)\\n            - ValueFilter：按值过滤列\\n                - 如果只是做简单的 family:qualifier:value 等值判断，推荐限制后再配 ValueFilter，这样能避免扫描无关的 family/column\\n        - 组合使用 filter\\n            - \\\"PrefixFilter ('Row') AND PageFilter (1) AND FirstKeyOnlyFilter ()\\\"\""</script><script>(function(){if(typeof MindElixir=="undefined"){console.error("MindElixir not loaded. Check your CDN script tag.");return}const n="me_3";let e=JSON.parse(document.getElementById(n+"_src").textContent);function s(){return"n_"+Math.random().toString(16).slice(2)+Date.now().toString(16)}function a(e){const o=e.split(/\n/).map(e=>e.replace(/\s+$/g,"")).filter(e=>e.trim().length>0);console.log(o);const t=[];let n=null;for(const u of o){const r=u.match(/^(\s*)([-*+])\s+(.*)$/);if(!r)continue;const h=r[1].replace(/\t/g,"  ").length,d=Math.floor(h/2);let e=r[3].trim(),c=null;const l=e.match(/^(.*?)(?:\s*->\s*)(https?:\/\/\S+)\s*$/);l&&(e=l[1].trim(),c=l[2].trim());const i={id:s(),topic:e,children:[]},a=e.match(/!\[\]\(\s*([^,\]]+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)\s*$/i);if(a){const t=a[1].trim(),n=Number(a[2]),s=Number(a[3]);e=e.repl
