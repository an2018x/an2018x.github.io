类的生命周期\\n            - 流程\\n                - Loading（加载）\\n                    - 把 .class 的字节流变成 JVM 内部的 Class 对象\\n                - 验证\\n                    - 确保字节码符合 JVM 规范、类型安全、不会破坏虚拟机\\n                - 准备\\n                    - 为类变量 static 字段分配内存并设置默认零值\\n                - 解析\\n                    - 把常量池中的符号引用（字符串/描述符）转换成直接引用（指针/句柄）\\n                - 初始化\\n                    - 执行类初始化方法 \\u003cclinit\\u003e\\n                - 准备阶段：有 static 变量的空间+默认值，初始化阶段执行你的 static 赋值逻辑\\n            - 准备阶段 vs 初始化阶段\\n                - 默认值发生在准备阶段\\n                    - ![](https://an-img.oss-cn-hangzhou.aliyuncs.com/2026/02/19/20260219205053393.png,301,57)\\n                - 显式赋值发生在初始化阶段\\n                    - ![](https://an-img.oss-cn-hangzhou.aliyuncs.com/2026/02/19/20260219205149229.png,283,54)\\n                - 常量折叠\\n            - \\u003cclinit\\u003e 类初始化方法\\n                - \\u003cclinit\\u003e 是编译器合成的类初始化方法\\n                - 来自于所有 static 字段的显式赋值语句和所有 static{} 块\\n                - 按源码出现顺序合并执行\\n                - JVM 保证同一个类的 \\u003cclinit\\u003e 在多线程下只会被一个线程执行，其他线程阻塞等待\\n            - 初始化触发时机\\n                - 初始化只在主动使用时触发\\n                - 常用触发初始化场景\\n                    - new A()\\n                    - 读取写入 A.staticField\\n                    - 调用 A.staticMethod()\\n                    - Class.forName(\\\"A\\\")\\n                    - 初始化子类前，先初始化父类\\n                    - JVM 启动时执行 main 类\\n            - Class.forName 和 ClassLoader.loadClass\\n                - Class.forName(\\\"A\\\")：默认加载+连接+初始化\\n                - ClassLoader.loadClass(\\\"A\\\")，默认只做加载和必要时连接，不初始化\\n    - 类加载体系与双亲委派\\n        - 三类内置类加载器\\n            - Bootstrap：加载核心库(rt/基础模块)，通常由 JVM 实现，不是 Java 对象\\n            - Platform(JDK9+)/Ext(JDK8)：平台扩展库\\n            - App：应用 classpath 下的类（写的业务代码）\\n        - 双亲委派模型\\n            - 流程\\n                - loadClass(name) 先检查本加载器是否已经加载\\n                - 没加载则委派给父加载器\\n                - 父加载器加载不到，再由当前加载器尝试 findClass 加载\\n                - 最终返回 Class\\u003c?\\u003e\\n            - 动机\\n                - 安全：防止核心类被伪造替换\\n                - 一致性：保证同名类在 JVM 中尽量只加载一份，避免类型混乱\\n        - 破坏双亲委派\\n            - 破坏方式\\n                - 自定义 ClassLoader，重写 loadClass，不再先委派\\n                - 使用线程上下文类加载器绕过父类限制\\n            - 典型场景\\n                - SPI/ServierLoader：核心库需要加载应用层实现（反向委派）\\n                - JDBC Driver：早期通过 Class.forName 强制注册类驱动\\n                - 应用容器（Tomcat）：每个 WebApp 一个 ClassLoader，实现隔离与热部署\\n            - 破坏带来的风险\\n                - 类重复加载\\n                - 内存泄露：容器热部署时，类加载器无法回收-\\u003e元空间泄露\\n        - 类相等判断\\n            - JVM 中，一个类的唯一性由（类的全限定名）+（加载它的 ClassLoader）共同决定\""</script><script>(function(){if(typeof MindElixir=="undefined"){console.error("MindElixir not loaded. Check your CDN script tag.");return}const n="me_0";let e=JSON.parse(document.getElementById(n+"_src").textContent);function s(){return"n_"+Math.random().toString(16).slice(2)+Date.now().toString(16)}function a(e){const o=e.split(/\n/).map(e=>e.replace(/\s+$/g,"")).filter(e=>e.trim().length>0);console.log(o);const t=[];let n=null;for(const u of o){const r=u.match(/^(\s*)([-*+])\s+(.*)$/);if(!r)continue;const h=r[1].replace(/\t/g,"  ").length,d=Math.floor(h/2);let e=r[3].trim(),c=null;const l=e.match(/^(.*?)(?:\s*->\s*)(https?:\/\/\S+)\s*$/);l&&(e=l[1].trim(),c=l[2].trim());const i={id:s(),topic:e,children:[]},a=e.match(/!\[\]\(\s*([^,\]]+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)\s*$/i);if(a){const t=a[1].trim(),n=Number(a[2]),s=Number(a[3]);e=e.replace(a[0],"").trim(),i.topic="",i.image={url:t,width:n,height:s}}if(c&&(i.hyperLink=c),!n){n=i,t.push({level:0,node:n});continue}for(;t.length&&t[t.length-1].level>=d;)t.pop();const m=t.length?t[t.length-1].node:n;m.children.push(i),t.push({level:d,node:i})}return n||{id:s(),topic:"Empty",children:[]}}e=JSON.parse(e),console.log(e);const t=a(e);console.log(t);const o={nodeData:{id:t.id,topic:t.topic,root:!0,children:t.children||[]},arrows:[],summaries:[],direction:2};console.log(o);const i=window.MindElixir?.default??window.MindElixir;if(typeof i!="function"){console.error("MindElixir loaded but not a constructor. window.MindElixir =",window.MindElixir);return}const r=new i({el:"#"+n});r.init(o)})()</script><h1 id=jvm-内存结构与对象模型>JVM 内存结构与对象模型<a hidden class=anchor aria-hidden=true href=#jvm-内存结构与对象模型>#</a></h1><div id=me_1 class=mindelixir-container style=height:560px;width:100%></div><script type=application/json id=me_1_src>"\"- JVM 内存结构与对象模型\\n    - 运行时数据区\\n        - 整体结构\\n            - 线程私有\\n                - 程序计数器\\n                - Java 虚拟机栈\\n                - 本地方法栈\\n            - 线程共享\\n                - 堆\\n                - 方法区（Hotspot 对应元空间 + 运行时常量池）\\n        - 程序计数器\\n            - 存放线程正在执行的字节码指令地址\\n            - 线程私有：线程切换后能恢复执行位置\\n            - 几乎不会 OOM\\n            - 如果执行 Native 方法，PC 值不一定有意义\\n        - Java 虚拟机栈\\n            - 栈帧结构：一次方法调用对应一个栈帧\\n                - 局部变量表：基本类型值、对象引用、returnAddress\\n                - 操作数栈：字节码执行的临时计算区\\n                - 动态链接：指向运行时常量池的方法/字段引用信息\\n                - 方法返回地址\\n                - 异常表\\n            - 栈中存的对象\\n                - 栈里一般不存对象本体，存的是对象引用\\n                - 对象本体在堆上\\n            - 栈相关错误\\n                - StackOverflowError：递归太深/栈帧太大\\n                - OutOfMemoryError：unable to create new native thread：系统资源耗尽\\n            - 常见参数\\n                - -Xss：每个线程的栈大小（越大单线程可递归更深，但是可创建线程数更少）\\n        - 本地方法栈\\n            - 执行 JNI/Native 方法用\\n        - 堆\\n            - 存放几乎所有对象实例 + 数组\\n            - 常见结构\\n                - 新生代：Eden + Survivor(S0/S1)\\n                - 老年代\\n                - G1 下是 Region 化，不强行分固定代区\\n            - 常用参数\\n                - -Xms 初始堆\\n                - -Xmx 最大堆\\n                - -XX:NewRatio/-XX:SurvivorRatio （传统分代）\\n                - -XX:+UseG1GC 选择收集器\\n            - 堆相关 OOM\\n                - OutOfMemoryError: Java heap space 最常见\\n                - OutOfMemoryError: GC overhead limit exceed\\n        - 方法区/元空间\\n            - 存放类元数据：类结构信息、字段/方法信息、运行时常量池、方法字节码元信息等\\n            - JDK 8 以后 HotSpot 用 Metaspace （本地内存）替代永久代 PermGen\\n            - 常见参数\\n                - -XX:MaxMetaspaceSize 限制元空间上限\\n                - -XX:MetaspaceSize 触发元空间 GC 的阈值\\n            - 典型 OOM\\n                - 动态生成大量类 CGLIB、ByteBuddy、JSP 编译、反射代理\\n                - 热部署/自定义类加载器泄露导致旧类加载器无法回收\\n    - 对象创建与内存分配\\n        - 对象创建的典型步骤\\n            - 类检查：该类是否加载、解析、初始化\\n            - 分配内存：在堆上为对象划分出一块连续空间\\n            - 零值初始化：对象实例字段设置为默认值\\n            - 设置对象头：写入 Mark Word，类指针等元信息\\n            - 执行 \\u003cinit\\u003e：构造方法把字段设置为期望的初始值\\n        - 内存分配方式：指针碰撞 vs 空闲列表\\n            - 指针碰撞\\n                - 堆内存规整，已用区和闲置区是连续的，只要把指针往后移\\n                - 优点：速度快\\n            - 空闲列表\\n                - 堆存在碎片，需要维护空闲列表，从中找合适块\\n                - 优点：有碎片（标记-清除类收集器）\\n            - 是否能用指针碰撞，取决于 GC 是否会整理/复制使空间规整；不规整举要用空闲列表\\n        - 并发分配：TLAB(Thread Local Allocation Buffer)\\n            - TLAB：为每个线程在 Eden 预留一小块私有分配区域，线程在 TLAB 内分配对象时基本无需加锁。\\n            - 原因\\n                - 多线程并发 new 对象频繁，每次都竞争全局堆指针，会有锁/原子操作开销\\n                - TLAB 把大多数分配变成线程本地，提升吞吐\\n            - TLAB 不够时会申请新的 TLAB 或者退到全局分配路径\\n    - 对象内存布局与引用类型\\n        - 对象内存布局\\n            - 对象头\\n                - MarkWord：哈希码、GC 分代年龄、锁信息\\n                - Klass Pointer：指向类元数据（对象属于哪个类）\\n            - 实例数据：定义的字段\\n            - 对齐填充：按 8 字节对齐\\n        - 引用类型\\n            - 强引用\\n                - 默认引用：只要强引用存在，对象不回收\\n                - OOM 大户：强引用过长导致对象一直存活\\n            - 软引用\\n                - 内存不足时才回收\\n            - 弱引用\\n                - 下一次 GC 旧可能回收（只要没有强引用）\\n                - 典型：WeakHashMap、ThreadLocal 的 key\\n            - 虚引用\\n                - 不能通过它获取对象\\n                - 用于对象回收后的通知/资源清理配合 ReferenceQueue\\n        - ThreadLocal 为什么会内存泄露\\n            - 关键结构\\n                - 每个 Thread 内部有一个 ThreadLocalMap\\n                - ThreadLocalMap 的 Key 是 ThreadLocal 的弱引用\\n                - value 是强引用\\n            - 泄露发生条件\\n                - ThreadLocal 实例没有强引用\\n                - 线程还活着\\n                - ThreadLocalMap 里面出现 key=null，value=大对象的 entry\\n                - value 可能长期挂挂着\\n            - 正确姿势\\n                - 用完必须 remove()\\n                - 线程池环境更好要 remove\""</script><script>(function(){if(typeof MindElixir=="undefined"){console.error("MindElixir not loaded. Check your CDN script tag.");return}const n="me_1";let e=JSON.parse(document.getElementById(n+"_src").textContent);function s(){return"n_"+Math.random().toString(16).slice(2)+Date.now().toString(16)}function a(e){const o=e.split(/\n/).map(e=>e.replace(/\s+$/g,"")).filter(e=>e.trim().length>0);console.log(o);const t=[];let n=null;for(const u of o){const r=u.match(/^(\s*)([-*+])\s+(.*)$/);if(!r)continue;const h=r[1].replace(/\t/g,"  ").length,d=Math.floor(h/2);let e=r[3].trim(),c=null;const l=e.match(/^(.*?)(?:\s*->\s*)(https?:\/\/\S+)\s*$/);l&&(e=l[1].trim(),c=l[2].trim());const i={id:s(),topic:e,children:[]},a=e.match(/!\[\]\(\s*([^,\]]+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)\s*$/i);if(a){const t=a[1].trim(),n=Number(a[2]),s=Number(a[3]);e=e.replace(a[0],"").trim(),i.topic="",i.image={url:t,width:n,height:s}}if(c&&(i.hyperLink=c),!n){n=i,t.push({level:0,node:n});continue}for(;t.length&&t[t.length-1].level>=d;)t.pop();const m=t.length?t[t.length-1].node:n;m.children.push(i),t.push({level:d,node:i})}return n||{id:s(),topic:"Empty",children:[]}}e=JSON.parse(e),console.log(e);const t=a(e);console.log(t);const o={nodeData:{id:t.id,topic:t.topic,root:!0,children:t.children||[]},arrows:[],summaries:[],direction:2};console.log(o);const i=window.MindElixir?.default??window.MindElixir;if(typeof i!="function"){console.error("MindElixir loaded but not a constructor. window.MindElixir =",window.MindElixir);return}const r=new i({el:"#"+n});r.init(o)})()</script><h1 id=gc-体系>GC 体系<a hidden class=anchor aria-hidden=true href=#gc-体系>#</a></h1><div id=me_2 class=mindelixir-container style=height:560px;width:100%></div><script type=application/json id=me_2_src>"\"- GC 体系\\n    - GC 基础原理\\n        - GC 要解决的问题\\n            - Java 对象生命周期动态、数量大、手动 free 易错\\n            - GC 的核心目标：在可接受停顿和吞吐下，回收不可达对象占用的内存\\n        - 判定垃圾\\n            - 引用计数\\n                - 优点：实现直接\\n                - 缺点：循环引用难处理\\n                - Hotspot 主流不靠它做 GC 判定\\n            - 可达性分析\\n                - 从 GC Roots 出发做图遍历，遍历不到的对象是垃圾\\n                - GC Roots 常见来源\\n                    - 虚拟机栈（栈帧局部变量表）引用的对象\\n                    - 方法区/元空间中静态字段引用的对象\\n                    - 方法区中常量引用的对象\\n                    - JNI 引用的对象\\n                    - 活跃线程对象，同步锁持有的对象\\n        - 三大经典回收算法\\n            - 标记-清除（Mark-Sweep）\\n                - 过程：标记可达 -\\u003e 清掉不可达\\n                - 优点：简单\\n                - 缺点：内存碎片\\n            - 标记-整理（Mark-Compact）\\n                - 过程：标记可达-\\u003e把存活对象向一侧移动-\\u003e整理出连续空闲区\\n                - 优点：无碎片\\n                - 缺点：移动对象成本高，停顿更长\\n            - 复制\\n                - 过程：把存活对象复制到另一块区域，清空原区域\\n                - 优点：分配快、碎片少\\n                - 缺点：需要额外空间\\n        - 分代为什么有效\\n            - 核心假设：大多数对象朝生夕死，少数对象存活很久\\n            - 堆分为\\n                - 新生代(Young)：频繁回收，复制算法为主\\n                - 老年代(Old)：存活对象多，回收频率低，整理/并发标记策略为主\\n        - STW 从哪里来\\n            - STW 的根源\\n                - 根枚举/安全点：要一致地拿到 GC Roots，需要让线程在安全点停下\\n                - 对象移动/引用更新：复制/整理需要更新指针，必须在一致视图下完成\\n        - 并发标记时代的写屏障/记忆集\\n            - 当 GC 和应用线程并发时，会出现对象引用关系变化的一致性问题。需要\\n                - 写屏障：在写入引用字段时执行一小段额外逻辑\\n                - Card Table/Remembered Set (RSet)：记录跨代引用，避免全堆扫描\\n                - 为避免扫描整个老年代/全堆，新生代回收时需要知道老年代指向新生代的引用；并发标记需要处理引用更新，因此用写屏障把变更记录到卡表/RSet，保证正确性与效率\\n    - 收集器体系\\n        - G1 (Garbage First)\\n            - 设计目标\\n                - 在吞吐与低停顿之间折中，提供可预测停顿\\n                - 关键机制\\n                    - Region 化：堆切成很多等大小 Region\\n                    - 按收益优先回收：优先回收“垃圾最多、收益最高“的 Region\\n                    - RSet：每个 Region 维护“谁引用我“的集合，避免全堆扫描\\n                    - 并发标记：找出老年代可回收对象，随后 Mixed GC 回收部分 old Regions\\n        - G1 的堆结构\\n            - Region 是物理切片；在不同时间扮演不同角色\\n                - Eden Region\\n                - Survivor Region\\n                - Old Region\\n                - Humongous Region (大对象)\\n            - G1 不是固定的新生代/老年代，而是逻辑分代\\n        - G1 的回收类型与流程\\n            - Young GC（仅回收 Young）\\n                - 触发常见原因：Eden 满\\n                - 步骤\\n                    - STW 暂停\\n                    - 处理根与 RSet，找出可达对象\\n                    - 复制存活对象：Eden/Survivor -\\u003e 新的 Survivor/Old （晋升）\\n                    - 更新引用，释放旧 Eden/Survivor Region\\n                    - 恢复执行\\n            - Concurrent Mark （并发标记周期）\\n                - 找出 Old 区的存活情况，为 Mixed GC 提供候选 Old Regions\\n                - 阶段\\n                    - Initial Mark：STW，很短，标记 GC Roots 直接可达（通常搭车在一次 Young GC 上）\\n                    - Concurrent Mark（并发标记）：与应用并发，从根开始遍历可达视图\\n                    - Remark（再标记）：STW，修正并发期间引用变化\\n                    - Cleanup（清理/回收候选统计）：统计每个 Region 的存活率，为 Mixed 选择回收集合\\n            - Mixed GC （回收 Young + 部分 Old）\\n                - 触发条件：完成并发标记后，G1 会在若干 GC 中选择一批 Old Regions 与 Young 一起回收\\n                - 特点\\n                    - Mixed 仍然是 STW（复制/整理 + 引用更新）\\n                    - 部分 Old 由 G1 按收益挑选\\n                    - G1 的 Old 回收不是一次性全回收，而是多次 Mixed 逐步回收\\n            - Full GC（G1 不想发生，但会发生）\\n                - Full GC 是兜底\\n                    - 并发标记跟不上分配速度\\n                    - 晋升失败/分配失败\\n                    - to-space exhausted（复制目标空间不足）\\n                    - Humongous 压力导致碎片/可用 Region 不够\\n                - Full GC 特点\\n                    - STW 时间长\\n                    - 会做全堆标记整理\\n        - Humongous（大对象）\\n            - 在 G1 中，大对象通常定义为：大小 \\u003e Region 大小的 50%\\n            - 表现\\n                - 大对象会直接分配到 Humongous Regions\\n                - Humongous 回收不如普通对象灵活，容易造成\\n                    - Old 快速膨胀\\n                    - Mixed 效果变差\\n                    - 频繁并发标记或 Full GC 风险上升\\n        - RSet\\n            - 作用：支持只回收一部分 Region 仍然能正确找到 Roots\\n            - 代价：维护 RSet 需要写屏障与额外内存/CPU\\n        - G1 调优\\n            - 4 个参数\\n                - -XX:+UseG1GC\\n                - -XX:MaxGCPauseMillis=\\u003cN\\u003e: 停顿目标\\n                - -Xms/-Xmx: 堆大小\\n                - -XX:InitiatingHeapOccupancyPercent=\\u003cN\\u003e：老年代占用多少开始并发标记\\n    - CMS\\n        - CMS 是什么\\n            - 是 HotSpot 里老年代并发收集器\\n            - 核心目标是降低老年代回收的停顿时间-让标记尽可能与应用线程并发执行\\n            - Young 通常配 ParNew\\n        - CMS 总体结构\\n            - 经典周期\\n                - Initial Mark（初始标记）-STW\\n                - Concurrent Mark（并发标记）- 并发\\n                - Remark（重新标记）-STW\\n                - Concurrent Sweep （并发清除）\\n            - Initial Mark（初始标记，STW）\\n                - 从 GC Roots 触发，标记直接可达的对象\\n                - STW：一致性地枚举根，必须在 safepoint 停住线程\\n            - Concurrent Mark（并发标记）\\n                - 从初始标记得到的对象开始，遍历对象图，标记所有可达对象\\n                - 与应用线程并发执行\\n                - 问题：应用线程在改引用-\\u003e可能影响标记正确性\\n            - Remark（重新标记，STW）\\n                - 修正并发标记期间因为引用变化导致的“漏标/标记不完整“\\n                - 处理并发期间记录到变更（dirty card 等），把可达闭包补齐）\\n                - STW 原因：并发期间引用一直在变，如果不暂停，就无法在一个确定点收束标记结果\\n            - Concurrent Sweep（并发清除）\\n                - 回收未标记对象的空间，把它们加入空闲链表\\n                - 与应用线程并发执行\\n        - 设计缺陷\\n            - 内存碎片\\n                - CMS 是 Mark-Sweep，不做压缩整理\\n                - 老年代空闲空间可能变成很多不连续小块\\n                - 后果：触发 Full GC（Serial Old/Parallel Old）来做一次标记-整理压缩\\n            - 浮动垃圾\\n                - CMS 标记是并发进行的\\n                - 并发标记开始后，应用线程还在不断创建新对象，产生新垃圾\\n                - 这些对象可能在本轮标记后才产生，不会被本轮回收\\n        - CMS 回收触发的典型机制\\n            - 不会等老年代完全满才开始\\n            - 老年代使用率达到阈值开始一次 CMS 周期 -XX:CMSInitiatingOccupancyFraction 配合 -XX:+UseCMSInitiatingOccupancyOnly\\n            - 如果阈值太高，容易并发失败；阈值太低，吞吐下降\\n        - 常用参数\\n            - -XX:+UseConcMarkSweepGC：启用 CMS\\n            - -XX:+UseParNewGC：新生代用 ParNew\\n            - -XX:+CMSParallelRemarkEnabled: Remark 并行化\\n    - ParNew 回收\\n        - 作用范围：新生代（Eden+S0+S1）\\n        - 算法：标记复制\\n        - 并发：STW，但是 GC 线程并行执行\\n        - 核心流程\\n            - STW（停顿）\\n                - 所有应用线程到达 safepoint 暂停，保证 Roots 枚举一致\\n            - 根扫描（Roots）\\n                - 扫各线程栈、静态引用等 GC Roots\\n                - 额外要处理老年代 -\\u003e 新生代的引用\\n                - YoungGC 不能扫描整个老年代，需要靠卡表 Card Table 记录老年代那些卡页变脏，只扫描这些变脏区域找到 Old-\\u003eYoung 的引用作为额外 Roots\\n            - 复制存活对象\\n                - Eden 中存活对象复制到 Survivor（或者晋升到 Old）\\n                - Survivor（From）中存活对象复制到另一个 Survivor，年龄 + 1\\n                - 复制过程中会设置 forwarding pointer，避免重复复制并更新引用\\n            - 交换 Survivor\\n                - Eden 和旧 From Survior 清空\\n                - To Survivor 变成新的 From\\n                - 恢复引用线程\\n        - 对象如何从 Young 晋升到 Old\\n            - 年龄阈值：对象每熬过一次 YoungGC 年龄 +1，达到阈值 -XX:MaxTenuringThreshold 晋升\\n            - Survivor 放不下：Survivor 容量不足，直接晋升到 old\\n            - 大对象直接进老年代：如果开启/配置了相关策略，大对象可能绕过 Young\\n    - ZGC\\n        - 目标：极低停顿\\n        - 核心：并发标记+并发重定位，依赖读写屏障等机制\\n        - 适合：大堆、强延迟敏感\""</script><script>(function(){if(typeof MindElixir=="undefined"){console.error("MindElixir not loaded. Check your CDN script tag.");return}const n="me_2";let e=JSON.parse(document.getElementById(n+"_src").textContent);function s(){return"n_"+Math.random().toString(16).slice(2)+Date.now().toString(16)}function a(e){const o=e.split(/\n/).map(e=>e.replace(/\s+$/g,"")).filter(e=>e.trim().length>0);console.log(o);const t=[];let n=null;for(const u of o){const r=u.match(/^(\s*)([-*+])\s+(.*)$/);if(!r)continue;const h=r[1].replace(/\t/g,"  ").length,d=Math.floor(h/2);let e=r[3].trim(),c=null;const l=e.match(/^(.*?)(?:\s*->\s*)(https?:\/\/\S+)\s*$/);l&&(e=l[1].trim(),c=l[2].trim());const i={id:s(),topic:e,children:[]},a=e.match(/!\[\]\(\s*([^,\]]+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)\s*$/i);if(a){const t=a[1].trim(),n=Number(a[2]),s=Number(a[3]);e=e.replace(a[0],"").trim(),i.topic="",i.image={url:t,width:n,height:s}}if(c&&(i.hyperLink=c),!n){n=i,t.push({level:0,node:n});c PerfCounter.print: 性能计数器\\n    - jstack: 线程栈、死锁、阻塞、热点定位\\n        - 用途\\n            - CPU 高：找 RUNNABLE 热点线程在跑啥\\n            - RT 抖动：看 BLOCKED/WAITING/TIMED_WAITING\\n            - 死锁：Found one Java-level deadlock 直接给出环\\n        - 间隔 5-10s 连续采样 3 次，看热点栈是否稳定\\n    - jstat: 快速查看 GC/类加载/编译统计\\n        - 用户\\n            - 判断 GC 是否频繁、老年代是否持续增长、晋升是否异常\\n            - 看 metaspace/class load 是否异常增长\\n        - 常用命令\\n            - jstat -gcutil \\u003cpid\\u003e 1s 20: 每秒输出 20 次 GC 利用率\\n            - jstat -gc \\u003cpid\\u003e 1s 20: 更详细的各区大小/容量\\n            - jstat -class \\u003cpid\\u003e 1s 20: 类加载数量\\n            - jstat -compiler \\u003cpid\\u003e 1s 20: JIT 编译情况\\n    - jmap vs jcmd heap_dump: dump 与直方图\\n        - 直方图\\n            - 快速看到哪个类对象最多/占用最大\\n            - 常用于 OOM 前后或内存上涨时的第一眼判断\\n        - heap dump\\n            - 确定谁在引用链上把对象留住\\n    - Arthas: 线上动态诊断\\n        - dashboard: CPU/内存/线程/GC 全览\\n        - thread -n 5: 找 CPU 占用最高的线程\\n        - thread \\u003cid\\u003e: 看指定线程栈\\n        - jvm: JVM 信息、参数、内存、GC、类加载器\\n        - heapdump xx.hprof: 导出 heap dump\\n        - trace com.xx.Service method: 方法调用链耗时\\n        - watch com.xx.Service method '{params,returnObj,throwExp}' -x 2: 观察入参/返回/异常\\n        - tt：录制与回放\\n    - 高频场景\\n        - CPU 100%\\n            - 目标：找到哪个线程在烧 CPU，以及烧 CPU 的代码路径\\n            - 标准流程：\\n                - OS 层确认\\n                    - top/htop 看进程 CPU\\n                - 定位 java 线程\\n                    - Arthas: thread -n 5\\n                    - top -H -p \\u003cpid\\u003e 找到线程 TID\\n                - 将 TID 转 16 进制\\n                    - printf \\\"%x\\\\n\\\" 12345\\n                - jstack \\u003cpid\\u003e 或 jcmd Thread.print 中搜索 16 进制 nid\\n                    - 找到对应线程栈\\n                - 判断栈顶\\n                    - 如果是业务循环/正则灾难/大 JSON 解析/排序/加密-\\u003e代码问题\\n                    - 如果是 GC 线程占 CPU -\\u003e 看 GC 是否频繁\\n                - 需要更准时，上 profiler\\n                    - JFR/async-profiler 火焰图确认热点\\n        - RT 抖动/毛刺\\n            - 目标：分辨是 STW、锁阻塞、还是 IO/下游慢\\n            - 标准流程\\n                - 先看是否有 STW\\n                    - GC 日志看 pause\\n                    - jstat -gcutil 看 GC 是否在尖峰时频繁\\n                - 非 GC，查看线程状态分布\\n                    - jstack 多次采样\\n                    - BLOCKED 多：锁竞争\\n                    - WAITING/TIME_WAITING 多：可能在等 IO/队列/park\\n                - 下游排查\\n                    - DB 慢查询、线程池队列积压，连接池耗尽\\n        - 频繁 Full GC\\n            - 目标：解释为什么 Full 以及回收效果如何\\n            - 标准流程：\\n                - 看 GC 日志：Full GC 的触发原因\\n                - jstat -gcutil 看\\n                    - Old 是否增长\\n                    - FGC 是否增长\\n                    - YGC 后 Old 增长是否很快\\n                - 先做直方图\\n                    - jcmd GC.class_histogram 看大对象/大集合\\n                - 必要时 heap dump:\\n                    - MAT 看 Dominator Tree + Path to Roots\""</script><script>(function(){if(typeof MindElixir=="undefined"){console.error("MindElixir not loaded. Check your CDN script tag.");return}const n="me_4";let e=JSON.parse(document.getElementById(n+"_src").textContent);function s(){return"n_"+Math.random().toString(16).slice(2)+Date.now().toString(16)}function a(e){const o=e.split(/\n/).map(e=>e.replace(/\s+$/g,"")).filter(e=>e.trim().length>0);console.log(o);const t=[];let n=null;for(const u of o){const r=u.match(/^(\s*)([-*+])\s+(.*)$/);if(!r)continue;const h=r[1].replace(/\t/g,"  ").length,d=Math.floor(h/2);let e=r[3].trim(),c=null;const l=e.match(/^(.*?)(?:\s*->\s*)(https?:\/\/\S+)\s*$/);l&&(e=l[1].trim(),c=l[2].trim());const i={id:s(),topic:e,children:[]},a=e.match(/!\[\]\(\s*([^,\]]+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)\s*$/i);if(a){const t=a[1].trim(),n=Number(a[2]),s=Number(a[3]);e=e.replace(a[0],"").trim(),i.topic="",i.image={url:t,width:n,height:s}}if(c&&(i.hyperLink=c),!n){n=i,t.push({level:0,node:n});continue}for(;t.length&&t[t.length-1].level>=d;)t.pop();const m=t.length?t[t.length-1].node:n;m.children.push(i),t.push({level:d,node:i})}return n||{id:s(),to
