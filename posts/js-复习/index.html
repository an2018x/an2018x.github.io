- 面向对象与核心机制
    - this 指向
        - 为什么 this 这么重要
            - 和大多数语言不同，JS 中 this 的值不取决于函数在哪里定义，而取决于函数怎么被调用（箭头函数除外）
        - 规则一：默认绑定
            - 当函数作为独立函数调用（不通过对象、不用 call/apply/bind、不用 new），this 指向全局对象（浏览器中是 window，Node 中是 global）。严格模式下 this 是 undefined。
            - 
            ```js
            function showThis() {
                console.log(this);
            }

            showThis(); // 浏览器：window，Node：global

            // 严格模式
            function strictShow() {
                &#39;use strict&#39;;
                console.log(this);
            }

            strictShow(); // undefined
            ```
        - 规则二：隐式绑定
            - 当函数作为对象的方法调用时（obj.method()），this 指向调用它的那个对象。
            -
            ```js
            const user = {
                name: &#39;An&#39;,
                greet() {
                    console.log(this.name);
                }
            };

            user.greet(); // &#34;An&#34;，this === user

            // 链式对象：this 指向最近的调用者
            const company = {
                name: &#39;MiniMax&#39;,
                department: {
                    name: &#39;Agent Team&#39;,
                    getName() {
                        return this.name;
                    }
                }
            };

            company.department.getName(); // &#34;Agent Team&#34;，不是 &#34;MiniMax&#34;
            // this 指向 department，因为 department 是最近的调用者
            ```
        - 规则三：显式绑定 — call / apply / bind
            - 当你想手动指定 this 时，使用这三个方法
            - call — 立即调用，逐个传参
            ```js
            function introduce(greeting, punctuation) {
                console.log(`${greeting}, I&#39;m ${this.name}${punctuation}`);
            }

            const user = { name: &#39;An&#39; };

            introduce.call(user, &#39;Hello&#39;, &#39;!&#39;);
            // &#34;Hello, I&#39;m An!&#34;

            // 第一个参数是 this 的值，后面依次是函数参数
            ```
            - apply — 立即调用，参数以数组形式传入
            ```js
            introduce.apply(user, [&#39;Hi&#39;, &#39;~&#39;]);
            // &#34;Hi, I&#39;m An~&#34;

            // call 和 apply 的唯一区别就是参数传递方式
            // 助记：Apply 用 Array

            // 经典用法：借用方法
            const arrayLike = { 0: &#39;a&#39;, 1: &#39;b&#39;, 2: &#39;c&#39;, length: 3 };
            const realArray = Array.prototype.slice.call(arrayLike);
            // [&#39;a&#39;, &#39;b&#39;, &#39;c&#39;]

            // 求数组最大值（ES5 时代）
            Math.max.apply(null, [3, 1, 4, 1, 5]); // 5
            // 现在用展开运算符更好：Math.max(...[3, 1, 4, 1, 5])
            ```
            - bind — 返回新函数，永久绑定 this（不立即调用）：
            ```js
            const user = { name: &#39;An&#39; };

            function greet(greeting) {
            console.log(`${greeting}, ${this.name}`);
            }

            const greetAn = greet.bind(user);
            greetAn(&#39;Hello&#39;);     // &#34;Hello, An&#34;
            greetAn(&#39;Hey&#39;);       // &#34;Hey, An&#34;

            // bind 也可以预设参数（偏函数/Partial Application）
            const helloAn = greet.bind(user, &#39;Hello&#39;);
            helloAn(); // &#34;Hello, An&#34;（greeting 已经被绑定为 &#39;Hello&#39;）

            // 解决回调中 this 丢失的问题
            setTimeout(user.greet.bind(user), 100); // ✅ 不会丢失 this

            // bind 返回的函数，this 不可被再次修改
            const bound = greet.bind(user);
            bound.call({ name: &#39;Bob&#39; }, &#39;Hi&#39;); // &#34;Hi, An&#34;（仍然是 An，bind 的优先级更高）
            ```
        - 规则四：new 绑定
            - 当用 new 调用函数时，JS 会自动创建一个新对象，将 this 绑定到这个新对象上。
            -
            ```js
            function User(name, age) {
                // new 调用时，this 自动指向新创建的空对象 {}
                this.name = name;
                this.age = age;
                // 不需要 return，自动返回 this
            }

            const user = new User(&#39;An&#39;, 25);
            console.log(user); // User { name: &#39;An&#39;, age: 25 }

            // new 到底做了什么？等价于：
            function myNew(Constructor, ...args) {
                // 1. 创建空对象，原型指向构造函数的 prototype
                const obj = Object.create(Constructor.prototype);
                // 2. 执行构造函数，this 绑定到新对象
                const result = Constructor.apply(obj, args);
                // 3. 如果构造函数返回了对象，就用那个对象；否则返回新创建的对象
                return result instanceof Object ? result : obj;
            }

            const user2 = myNew(User, &#39;Bob&#39;, 30);
            console.log(user2); // User { name: &#39;Bob&#39;, age: 30 }
            ```
        - 箭头函数中的 this
            - 箭头函数没有自己的 this，它的 this 继承自定义时所在的外层作用域（词法 this），且永远不可改变。
            -
            ```js
            const user = {
                name: &#39;An&#39;,

                // 普通方法
                greetNormal() {
                    console.log(this.name); // this 取决于调用方式
                },

                // 箭头函数作为方法 ❌
                greetArrow: () =&gt; {
                    console.log(this.name); // this 是外层作用域的 this，不是 user
                }
            };

            user.greetNormal(); // &#34;An&#34; ✅
            user.greetArrow();  // undefined ❌（箭头函数的 this 是全局/模块作用域）
            ```
        - 绑定优先级
            - new 绑定  &gt;  显式绑定(call/apply/bind)  &gt;  隐式绑定(obj.fn())  &gt;  默认绑定(fn())
    - 原型与原型链
        - 为什么需要原型
            - 在没有原型机制的情况下，每次用构造函数创建实例，方法都会被重复创建
            ```js
            function User(name) {
                this.name = name;
                // 每个实例都创建一个新的 greet 函数，浪费内存
                this.greet = function() {
                    return `Hi, I&#39;m ${this.name}`;
                };
            }

            const u1 = new User(&#39;An&#39;);
            const u2 = new User(&#39;Bob&#39;);

            console.log(u1.greet === u2.greet); // false —— 两个不同的函数对象

            // 如果创建 10000 个用户，就有 10000 份完全相同的 greet 函数
            // 原型就是用来解决这个问题的
            ```
        - prototype 与 __proto__
            - prototype：只有函数才拥有的属性，它是一个对象，当用 new 调用该函数时，新创建的实例的原型会指向这个对象。
            - __proto__（或者说 [[Prototype]]）：每个对象都有的内部属性，指向它的原型对象。__proto__ 是非标准但被广泛支持的访问方式，标准方式是 Object.getPrototypeOf()。
            ```js
            function User(name) {
                this.name = name;
            }

            // 在 prototype 上定义方法，所有实例共享
            User.prototype.greet = function() {
                return `Hi, I&#39;m ${this.name}`;
            };

            const u1 = new User(&#39;An&#39;);
            const u2 = new User(&#39;Bob&#39;);

            // 实例的 __proto__ 指向构造函数的 prototype
            console.log(u1.__proto__ === User.prototype);           // true
            console.log(Object.getPrototypeOf(u1) === User.prototype); // true（标准写法）

            // 所有实例共享 prototype 上的方法
            console.log(u1.greet === u2.greet); // true ✅ 同一个函数
            u1.greet(); // &#34;Hi, I&#39;m An&#34;
            u2.greet(); // &#34;Hi, I&#39;m Bob&#34;
            ```
        - constructor 属性
            - 每个函数的 prototype 对象默认有一个 constructor 属性，指回函数本身
            - 
            ```js
            function User(name) {
            this.name = name;
            }

            console.log(User.prototype.constructor === User); // true

            const u = new User(&#39;An&#39;);
            console.log(u.constructor === User); // true（通过原型链找到的）

            // 可以用 constructor 判断实例是由哪个构造函数创建的
            // 但不如 instanceof 可靠，因为 constructor 可以被覆盖
            ```
        - 原型链（Prototype Chain）
            - 当你访问一个对象的属性时，JS 引擎会沿着原型链逐层查找，直到找到该属性或到达链的顶端 null
            -
            ```js
            function Animal(name) {
                this.name = name;
            }
            Animal.prototype.eat = function() {
                return `${this.name} is eating`;
            };

            function Dog(name, breed) {
                Animal.call(this, name); // 调用父构造函数
                this.breed = breed;
            }

            // 建立原型链：Dog.prototype 的原型指向 Animal.prototype
            Dog.prototype = Object.create(Animal.prototype);
            Dog.prototype.constructor = Dog; // 修复 constructor

            Dog.prototype.bark = function() {
                return `${this.name} says woof!`;
            };

            const dog = new Dog(&#39;Buddy&#39;, &#39;Golden&#39;);

            // 属性查找过程
            dog.name;    // &#34;Buddy&#34;      ← 在 dog 自身找到
            dog.bark();  // &#34;Buddy says woof!&#34; ← 在 Dog.prototype 上找到
            dog.eat();   // &#34;Buddy is eating&#34;  ← 在 Animal.prototype 上找到
            dog.toString(); // &#34;[object Object]&#34;  ← 在 Object.prototype 上找到
            dog.whatever;   // undefined  ← 一路找到 null，没找到
            ```
        - Object.create()
            - Object.create(proto) 创建一个新对象，将它的 __proto__ 设为指定的对象。这是建立原型链最干净的方式。
    - Class 语法与继承
        - Class 的本质
            - ES6 的 class 是原型继承的语法糖。
            - 它不引入新的对象模型，底层仍然是原型机制，但写法更清晰、更接近传统面向对象语言。
            - 
            ```js
            // ES5 写法
            function User(name, age) {
                this.name = name;
                this.age = age;
            }
            User.prototype.greet = function() {
                return `Hi, I&#39;m ${this.name}`;
            };

            // ES6 class 写法（完全等价）
            class User {
                constructor(name, age) {
                    this.name = name;
                    this.age = age;
                }

                greet() {
                    return `Hi, I&#39;m ${this.name}`;
                }
            }

            // 验证底层仍然是原型
            console.log(typeof User);                         // &#34;function&#34;
            console.log(User.prototype.greet);                // function
            console.log(new User(&#39;An&#39;, 25).__proto__ === User.prototype); // true
            ```

            console.log(Object.keys(MyClass.prototype)); // []（空，method 不可枚举）

        - 静态方法与静态字段
            - static 定义在类本身上，不是在实例上。通过类名调用，不能通过实例调用。

        - 私有字段（Private Fields）
            - ES2022 引入 # 前缀表示真正的私有属性和方法，只能在类内部访问。
            ```js
            class BankAccount {
                // 私有字段
                #balance;
                #owner;
                #transactionHistory = [];

                constructor(owner, initialBalance) {
                    this.#owner = owner;
                    this.#balance = initialBalance;
                }

                // 私有方法
                #recordTransaction(type, amount) {
                    this.#transactionHistory.push({
                    type,
                    amount,
                    date: new Date(),
                    balance: this.#balance
                    });
                }

                // 公开方法（通过它们间接访问私有数据）
                deposit(amount) {
                    if (amount &lt;= 0) throw new Error(&#39;金额必须大于0&#39;);
                    this.#balance &#43;= amount;
                    this.#recordTransaction(&#39;deposit&#39;, amount);
                    return this;
                }

                withdraw(amount) {
                    if (amount &gt; this.#balance) throw new Error(&#39;余额不足&#39;);
                    this.#balance -= amount;
                    this.#recordTransaction(&#39;withdraw&#39;, amount);
                    return this;
                }

                get balance() {
                    return this.#balance;
                }

                get history() {
                    // 返回副本，防止外部修改
                    return [...this.#transactionHistory];
                }

                // 静态私有方法
                static #validateAmount(amount) {
                    return typeof amount === &#39;number&#39; && amount &gt; 0;
                }
            }

            const account = new BankAccount(&#39;An&#39;, 1000);
            account.deposit(500).withdraw(200); // 链式调用

            console.log(account.balance); // 1300
            console.log(account.history); // [{...}, {...}]

            // ❌ 私有字段外部完全不可访问
            // account.#balance;           // SyntaxError
            // account.#recordTransaction; // SyntaxError
            ```
        - extends 与 super — 类继承
            - extends 建立继承关系，super 用于调用父类。
            -
            ```js
            class Animal {
                constructor(name) {
                    this.name = name;
                    this.energy = 100;
                }

                eat(amount) {
                    this.energy &#43;= amount;
                    return `${this.name} ate, energy: ${this.energy}`;
                }

                sleep(hours) {
                    this.energy &#43;= hours * 10;
                    return `${this.name} slept ${hours}h, energy: ${this.energy}`;
                }

                info() {
                    return `${this.name} (energy: ${this.energy})`;
                }
                }

                class Dog extends Animal {
                // 子类的 constructor 必须在使用 this 之前调用 super()
                constructor(name, breed) {
                    super(name); // 调用 Animal 的 constructor
                    this.breed = breed;
                }

                // 新方法
                bark() {
                    this.energy -= 5;
                    return `${this.name} says Woof!`;
                }

                // 重写父类方法
                eat(amount) {
                    // 调用父类的 eat 方法
                    super.eat(amount * 2); // 狗吃东西恢复双倍能量
                    return `${this.name} gobbled food! energy: ${this.energy}`;
                }

                // 扩展父类方法
                info() {
                    return `${super.info()} [${this.breed}]`;
                }
            }

            const dog = new Dog(&#39;Buddy&#39;, &#39;Golden&#39;);
            dog.eat(10);  // &#34;Buddy gobbled food! energy: 120&#34;（10*2=20，100&#43;20=120）
            dog.bark();   // &#34;Buddy says Woof!&#34;
            dog.sleep(2); // &#34;Buddy slept 2h, energy: 135&#34;（继承自 Animal）
            dog.info();   // &#34;Buddy (energy: 135) [Golden]&#34;

            // 原型链验证
            console.log(dog instanceof Dog);    // true
            console.log(dog instanceof Animal); // true
            ```

            ```js
            // 标签函数接收两个参数：
            // strings — 模板中的静态文本部分（数组）
            // values — 插值表达式的值（rest 参数）
            function highlight(strings, ...values) {
                return strings.reduce((result, str, i) =&gt; {
                    const value = values[i] !== undefined ? `【${values[i]}】` : &#39;&#39;;
                    return result &#43; str &#43; value;
                }, &#39;&#39;);

            // 函数替换：每次匹配时调用函数，返回值作为替换内容
            const result = &#39;hello-world-foo&#39;.replace(/\w&#43;/g, (match) =&gt; {
                return match.charAt(0).toUpperCase() &#43; match.slice(1);
            });
            // &#34;Hello-World-Foo&#34;

            &#39;2026-04-07&#39;.replace(
                /(\d{4})-(\d{2})-(\d{2})/,
                (match, year, month, day) =&gt; `${day}/${month}/${year}`
            );
            // &#34;07/04/2026&#34;

            // 实际场景：模板引擎
            function template(str, data) {
                return str.replace(/\{\{(\w&#43;)\}\}/g, (match, key) =&gt; {
                    return data[key] ?? match; // 找不到就保留原文
                });

            template(&#39;Hello, {{name}}! You have {{count}} messages.&#39;, {

            function camelToKebab(str) {

            }
            camelToKebab(&#39;backgroundColor&#39;); // &#34;background-color&#34;

            // 编号捕获组
            const dateRe = /(\d{4})-(\d{2})-(\d{2})/;
            const match = dateRe.exec(&#39;2026-04-07&#39;);

            console.log(match[0]); // &#34;2026-04-07&#34;（完整匹配）
            console.log(match[1]); // &#34;2026&#34;（第1个捕获组）
            console.log(match[2]); // &#34;04&#34;（第2个捕获组）
            console.log(match[3]); // &#34;07&#34;（第3个捕获组）

            const namedRe = /(?&lt;year&gt;\d{4})-(?&lt;month&gt;\d{2})-(?&lt;day&gt;\d{2})/;
            const m = namedRe.exec(&#39;2026-04-07&#39;);

            console.log(m.groups.year);  // &#34;2026&#34;
            console.log(m.groups.month); // &#34;04&#34;
            console.log(m.groups.day);   // &#34;07&#34;

            // 解构命名捕获组
            const { groups: { year, month, day } } = namedRe.exec(&#39;2026-04-07&#39;);

            // 在 replace 中使用捕获组
            &#39;2026-04-07&#39;.replace(
                /(?&lt;y&gt;\d{4})-(?&lt;m&gt;\d{2})-(?&lt;d&gt;\d{2})/,
                &#39;$&lt;d&gt;/$&lt;m&gt;/$&lt;y&gt;&#39;
            );
            // &#34;07/04/2026&#34;

            // 编号引用
            &#39;2026-04-07&#39;.replace(/(\d{4})-(\d{2})-(\d{2})/, &#39;$3/$2/$1&#39;);
            // &#34;07/04/2026&#34;

            // 反向引用：在正则内部引用前面的捕获组
            // 匹配重复的单词
            /\b(\w&#43;)\s&#43;\1\b/.test(&#39;the the&#39;);  // true（\1 引用第一个捕获组）
            /\b(\w&#43;)\s&#43;\1\b/.test(&#39;the cat&#39;);  // false
            ```

        - Map — 键值映射
            - Map 是 ES6 引入的键值对集合，和普通对象的核心区别在于：任何类型都可以作为键。
            -
            ```js
            const map = new Map();

            // 设置键值对
            map.set(&#39;name&#39;, &#39;An&#39;);
            map.set(42, &#39;number key&#39;);
            map.set(true, &#39;boolean key&#39;);

            const objKey = { id: 1 };
            const fnKey = () =&gt; {};
            map.set(objKey, &#39;对象作为键&#39;);
            map.set(fnKey, &#39;函数作为键&#39;);

            // 获取
            map.get(&#39;name&#39;);    // &#34;An&#34;
            map.get(42);        // &#34;number key&#34;
            map.get(objKey);    // &#34;对象作为键&#34;
            map.get({ id: 1 }); // undefined！不是同一个引用

            // 检查与删除
            map.has(&#39;name&#39;);    // true
            map.delete(42);     // true（删除成功）
            map.size;           // 4

            // 清空
            map.clear();
            map.size;           // 0

            - 用可迭代对象初始化：
            ```js
            // 用二维数组初始化
            const map = new Map([
                [&#39;name&#39;, &#39;An&#39;],
                [&#39;age&#39;, 25],
                [&#39;city&#39;, &#39;Tokyo&#39;]
            ]);

            // 从对象转换
            const obj = { a: 1, b: 2, c: 3 };
            const mapFromObj = new Map(Object.entries(obj));

            // 从 Map 转回对象

            - Map vs 普通对象
            ```js
            // 1. 键的类型
            // 对象的键只能是 string 或 Symbol
            const obj = {};
            obj[1] = &#39;one&#39;;
            obj[&#39;1&#39;] = &#39;string one&#39;;
            console.log(obj[1]);  // &#34;string one&#34;（数字键被转成了字符串，覆盖了）

            // Map 的键保持原始类型
            const map = new Map();
            map.set(1, &#39;number one&#39;);
            map.set(&#39;1&#39;, &#39;string one&#39;);
            map.get(1);   // &#34;number one&#34;
            map.get(&#39;1&#39;); // &#34;string one&#34;（两个不同的键）

            // 2. 顺序保证
            // Map 始终按插入顺序遍历
            // 对象的键顺序在现代引擎中也基本有序，但规范上数字键会排在前面

            // 3. 性能
            // Map 在频繁增删键值对时性能更好
            // Map 有原生的 size 属性（O(1)），对象需要 Object.keys(obj).length

            // 4. 原型污染
            // 对象会继承 Object.prototype 上的属性
            const plain = {};
            console.log(&#39;toString&#39; in plain); // true（原型上的）

            // Map 没有这个问题
            const safeMap = new Map();

        - 可迭代协议
            - JavaScript 中 for...of、展开运算符 ...、解构赋值等特性，都依赖可迭代协议。
            - 一个对象如果实现了 Symbol.iterator 方法，并且该方法返回一个迭代器，这个对象就是可迭代的。
            -
            ```js
            // 内置可迭代对象
            // Array, String, Map, Set, TypedArray, arguments, NodeList

            // 验证是否可迭代
            function isIterable(obj) {
            return obj != null && typeof obj[Symbol.iterator] === &#39;function&#39;;
            }

            isIterable([1, 2, 3]);     // true
            isIterable(&#39;hello&#39;);        // true
            isIterable(new Map());     // true
            isIterable(new Set());     // true
            isIterable({ a: 1 });      // false（普通对象不可迭代）
            isIterable(42);             // false
            ```
        - 迭代器协议：
            - 迭代器是一个对象，它有一个 next() 方法，每次调用返回 { value, done }。
            -
            ```js
            // 手动使用迭代器
            const arr = [10, 20, 30];
            const iterator = arr[Symbol.iterator]();

            iterator.next(); // { value: 10, done: false }
            iterator.next(); // { value: 20, done: false }
            iterator.next(); // { value: 30, done: false }
            iterator.next(); // { value: undefined, done: true }

            // for...of 本质就是自动调用迭代器
            // 等价于：
            const iter = arr[Symbol.iterator]();
            let result = iter.next();
            while (!result.done) {
                console.log(result.value);
                result = iter.next();
            }
            ```
        - 自定义可迭代对象
            - 
            ```js
            // 实现一个范围对象
            class Range {
                constructor(start, end, step = 1) {
                    this.start = start;
                    this.end = end;
                    this.step = step;
                }

                [Symbol.iterator]() {
                    let current = this.start;
                    const end = this.end;
                    const step = this.step;

                    return {
                    next() {
                        if (current &lt;= end) {
                        const value = current;
                        current &#43;= step;
                        return { value, done: false };
                        }
                        return { value: undefined, done: true };
                    }
                    };
                }
            }

            const range = new Range(1, 5);
            for (const n of range) {
            console.log(n); // 1, 2, 3, 4, 5
            }

            // 因为实现了迭代协议，所有相关语法都自动支持
            console.log([...range]);              // [1, 2, 3, 4, 5]
            const [a, b, c] = range;              // a=1, b=2, c=3
            const nums = Array.from(range);        // [1, 2, 3, 4, 5]
            const set = new Set(range);            // Set { 1, 2, 3, 4, 5 }

            // 带步长
            const evens = new Range(0, 10, 2);
            console.log([...evens]); // [0, 2, 4, 6, 8, 10]
            ```

            - 生成器用 function* 声明，yield 暂停并产出值。它自动实现了迭代器协议。
            -
            ```js
            // 基本语法
            function* numberGenerator() {
                yield 1;
                yield 2;
                yield 3;
            }

            const gen = numberGenerator();
            gen.next(); // { value: 1, done: false }
            gen.next(); // { value: 2, done: false }
            gen.next(); // { value: 3, done: false }
            gen.next(); // { value: undefined, done: true }

            // 生成器自动可迭代
            for (const n of numberGenerator()) {
                console.log(n); // 1, 2, 3
            }

            console.log([...numberGenerator()]); // [1, 2, 3]
            ```

            exports.add = add;

            // 导入
            const { add, subtract } = require(&#39;./utils&#39;);
            const utils = require(&#39;./utils&#39;);

            // 主要区别：
            // 1. CJS 是同步加载，ESM 是异步的
            // 2. CJS 的 require 可以在任何地方调用，ESM 的 import 必须在顶层
            // 3. CJS 导出的是值的拷贝，ESM 导出的是活绑定
            // 4. CJS 用 .js 后缀，ESM 在 Node 中用 .mjs 或在 package.json 中设 &#34;type&#34;: &#34;module&#34;

            // Node.js 中使用 ESM 的两种方式：
            // 方式1：文件后缀用 .mjs
            // 方式2：package.json 中添加 &#34;type&#34;: &#34;module&#34;
            ```
</textarea><h1 id="异步编程与浏览器-api">异步编程与浏览器 API<a hidden class="anchor" aria-hidden="true" href="#异步编程与浏览器-api">#</a></h1><div class="mindmap-container" id="mindmap-87152436" style="width:100%;height:860px;min-height:860px"></div><textarea id="mindmap-data-87152436" style="display:none">
- 异步编程与浏览器 API
    - 异步基础与回调
        - 同步 vs 异步
            - JavaScript 是单线程语言——同一时刻只能执行一段代码
            - 现实中很多操作是耗时的（网络请求、文件读写、定时器），如果同步等待，整个程序就会卡住
        - 事件循环
            - ![](https://an-img.oss-cn-hangzhou.aliyuncs.com/2026/04/07/20260407204918171.png,531,461)
        - 宏任务与微任务
            - 
            ```js
            console.log(&#39;1. 同步&#39;);

            setTimeout(() =&gt; {
                console.log(&#39;2. 宏任务 - setTimeout&#39;);
            }, 0);

            Promise.resolve().then(() =&gt; {
                console.log(&#39;3. 微任务 - Promise.then&#39;);
            });

            queueMicrotask(() =&gt; {
                console.log(&#39;4. 微任务 - queueMicrotask&#39;);
            });

            console.log(&#39;5. 同步&#39;);

            // 输出顺序：
            // 1. 同步
            // 5. 同步
            // 3. 微任务 - Promise.then
            // 4. 微任务 - queueMicrotask
            // 2. 宏任务 - setTimeout

            // 解释：
            // 第一轮：执行所有同步代码 → 1, 5
            // 清空微任务队列 → 3, 4
            // 取一个宏任务 → 2
            ```
        - setTimeout 与 setInterval
            - setTimeout — 延迟执行：
            -
            ```js
            // 基本用法
            const timerId = setTimeout(() =&gt; {
                console.log(&#39;3 秒后执行&#39;);
            }, 3000);

            // 取消定时器
            clearTimeout(timerId);

            // 传递参数给回调
            setTimeout((name, age) =&gt; {
                console.log(`${name}, ${age}`);
            }, 1000, &#39;An&#39;, 25);
            // 1 秒后打印 &#34;An, 25&#34;

            // ⚠️ 延迟时间不是精确的
            // setTimeout(fn, 100) 意思是&#34;至少 100ms 后执行&#34;
            // 实际可能更长（调用栈忙、页面后台时浏览器会节流等）

            // 最小延迟：嵌套 setTimeout 超过 5 层后，最小延迟被限制为 4ms
            function nested(depth = 0) {
                const start = performance.now();
                setTimeout(() =&gt; {
                    console.log(`depth ${depth}: ${(performance.now() - start).toFixed(1)}ms`);
                    if (depth &lt; 10) nested(depth &#43; 1);
                }, 0);
            }
            // 前几层接近 0ms，深层后会变成 4ms&#43;
            ```
        - 回调函数模式
            - 回调是 JavaScript 最早的异步处理方式——把&#34;完成后要做的事&#34;作为函数传进去。
            -
            ```js
            // 最简单的回调
            function fetchData(callback) {
                setTimeout(() =&gt; {
                    const data = { name: &#39;An&#39;, age: 25 };
                    callback(data);
                }, 1000);
            }

            fetchData((data) =&gt; {
                console.log(&#39;收到数据:&#39;, data);
            });

            // Node.js 风格的回调：错误优先（Error-first Callback）
            function readFile(path, callback) {
                setTimeout(() =&gt; {
                    if (path === &#39;&#39;) {
                    callback(new Error(&#39;路径不能为空&#39;), null);
                    } else {
                    callback(null, `${path} 的内容`); // 第一个参数是错误，第二个是结果
                    }
                }, 500);
            }

            readFile(&#39;data.txt&#39;, (error, data) =&gt; {
                if (error) {
                    console.error(&#39;读取失败:&#39;, error.message);
                    return;
                }
                console.log(&#39;读取成功:&#39;, data);
            });
            ```
    - Promise
        - Promise 是什么
            - Promise 是一个代表异步操作最终结果的对象。它解决了回调地狱的问题，让异步代码像同步一样线性书写。
            - 一个 Promise 有三种状态，一旦从 pending 变为 fulfilled 或 rejected，就不可再改变：
            - 
            ```js
            // pending（进行中）→ fulfilled（已成功）
            // pending（进行中）→ rejected（已失败）

            // 创建 Promise
            const promise = new Promise((resolve, reject) =&gt; {
            // 这个函数（executor）立即同步执行
            console.log(&#39;executor 执行了&#39;);

            // 异步操作
            setTimeout(() =&gt; {
                const success = true;
                    if (success) {
                        resolve(&#39;成功的数据&#39;);  // pending → fulfilled
                    } else {
                        reject(new Error(&#39;失败了&#39;)); // pending → rejected
                    }
                }, 1000);
            });

            console.log(&#39;Promise 创建后&#39;);
            // 输出顺序：
            // &#34;executor 执行了&#34;（同步）
            // &#34;Promise 创建后&#34;（同步）
            // （1 秒后）promise 被 resolve
            ```
        - then/catch/finally
            - then — 处理成功和失败：
                -
                ```js
                const promise = new Promise((resolve) =&gt; {
                    setTimeout(() =&gt; resolve(42), 1000);
                });

                // then 接受两个回调：onFulfilled 和 onRejected
                promise.then(
                    (value) =&gt; console.log(&#39;成功:&#39;, value),   // 42
                    (error) =&gt; console.log(&#39;失败:&#39;, error)
                );

                // 通常只传第一个参数，用 catch 处理错误
                promise
                .then(value =&gt; console.log(&#39;成功:&#39;, value))
                .catch(error =&gt; console.log(&#39;失败:&#39;, error));
                ```
            - then 的返回值——链式调用的基础：
                - then 始终返回一个新的 Promise。返回值决定了新 Promise 的状态：
                -
                ```js
                // 1. 返回普通值 → 新 Promise 以该值 resolve
                Promise.resolve(1)
                .then(v =&gt; v &#43; 1)   // 返回 2
                .then(v =&gt; v * 3)   // 返回 6
                .then(v =&gt; console.log(v)); // 6

                // 2. 返回 Promise → 新 Promise 跟随返回的 Promise
                Promise.resolve(1)
                    .then(v =&gt; {
                        return new Promise(resolve =&gt; {
                        setTimeout(() =&gt; resolve(v &#43; 10), 500);
                        });
                    })
                .then(v =&gt; console.log(v)); // 11（等待 500ms 后）

                // 3. 抛出异常 → 新 Promise 被 reject
                Promise.resolve(1)
                .then(v =&gt; {
                    throw new Error(&#39;出错了&#39;);
                })
                .then(v =&gt; console.log(&#39;不会执行&#39;))
                .catch(err =&gt; console.log(err.message)); // &#34;出错了&#34;

                // 4. 不写 return → 返回 undefined
                Promise.resolve(1)
                .then(v =&gt; { v &#43; 1; })  // 忘了 return！
                .then(v =&gt; console.log(v)); // undefined
                ```
            - catch 错误处理
                - 
                ```js
                // catch 是 .then(null, onRejected) 的语法糖
                // 它能捕获前面所有 then 中抛出的错误

                Promise.resolve(1)
                .then(v =&gt; {
                    throw new Error(&#39;then 中的错误&#39;);
                })
                .then(v =&gt; {
                    console.log(&#39;跳过&#39;); // 不执行
                })
                .catch(err =&gt; {
                    console.log(&#39;捕获:&#39;, err.message); // &#34;then 中的错误&#34;
                    return &#39;已恢复&#39;; // catch 也可以返回值，让链继续
                })
                .then(v =&gt; {
                    console.log(v); // &#34;已恢复&#34;（链恢复了）
                });

                // ⚠️ then 的第二个参数 vs catch 的区别
                Promise.reject(new Error(&#39;初始错误&#39;))
                .then(
                    v =&gt; console.log(&#39;成功&#39;),
                    err =&gt; {
                    console.log(&#39;then 的 onRejected:&#39;, err.message);
                    throw new Error(&#39;新错误&#39;);
                    }
                );
                // &#34;新错误&#34; 无法被捕获！因为同一个 then 的 onRejected 不能捕获 onFulfilled 的错误

                // ✅ 用 catch 更安全
                Promise.reject(new Error(&#39;初始错误&#39;))
                .then(v =&gt; console.log(&#39;成功&#39;))
                .catch(err =&gt; console.log(&#39;catch 捕获:&#39;, err.message));
                ```
            - finally — 无论成败都执行：
                -
                ```js
                function fetchData() {
                    showLoading();

                    return fetch(&#39;/api/data&#39;)
                        .then(res =&gt; res.json())
                        .then(data =&gt; {
                        displayData(data);
                        return data;
                        })
                        .catch(err =&gt; {
                        showError(err.message);
                        })
                        .finally(() =&gt; {
                        hideLoading(); // 无论成功失败都要隐藏 loading
                        });
                }

                // finally 的特殊行为：
                // 1. 不接收参数（不知道是成功还是失败）
                // 2. 默认&#34;透传&#34;前一步的值
                Promise.resolve(42)
                .finally(() =&gt; {
                    console.log(&#39;清理&#39;); // 执行
                    return 999;          // 返回值被忽略（除非抛错）
                })
                .then(v =&gt; console.log(v)); // 42（透传，不是 999）

                // 3. 如果 finally 中抛出错误，会覆盖之前的结果
                Promise.resolve(42)
                .finally(() =&gt; {
                    throw new Error(&#39;finally 出错&#39;);
                })
                .catch(err =&gt; console.log(err.message)); // &#34;finally 出错&#34;
                ```
        - Promise 静态方法
            - Promise.resolve / Promise.reject — 快速创建：
                -
                ```js
                // 创建一个立即 resolve 的 Promise
                const p1 = Promise.resolve(42);
                p1.then(v =&gt; console.log(v)); // 42

                // 如果传入 Promise，原样返回
                const p2 = Promise.resolve(Promise.resolve(&#39;hello&#39;));
                p2.then(v =&gt; console.log(v)); // &#34;hello&#34;（不会嵌套）

                // 如果传入 thenable（有 then 方法的对象），会展开
                const thenable = {
                    then(resolve) {
                        resolve(&#39;from thenable&#39;);
                    }
                };
                Promise.resolve(thenable).then(v =&gt; console.log(v)); // &#34;from thenable&#34;

                // 创建一个立即 reject 的 Promise
                const p3 = Promise.reject(new Error(&#39;失败&#39;));
                p3.catch(err =&gt; console.log(err.message)); // &#34;失败&#34;
                ```
            - Promise.all — 全部成功才成功：
                - 
                ```js
                const p1 = fetch(&#39;/api/users&#39;).then(r =&gt; r.json());
                const p2 = fetch(&#39;/api/posts&#39;).then(r =&gt; r.json());
                const p3 = fetch(&#39;/api/comments&#39;).then(r =&gt; r.json());

                // 并行执行，全部完成后返回结果数组（顺序与传入一致）
                Promise.all([p1, p2, p3])
                .then(([users, posts, comments]) =&gt; {
                    console.log(users, posts, comments);
                })
                .catch(err =&gt; {
                    // ⚠️ 任何一个失败，整个 all 就失败
                    // 其他 Promise 仍然会执行完，但结果被丢弃
                    console.error(&#39;有一个请求失败:&#39;, err);
                });

                // 传入空数组立即 resolve
                Promise.all([]).then(v =&gt; console.log(v)); // []

                // 非 Promise 值会被自动包装
                Promise.all([1, &#39;hello&#39;, Promise.resolve(42)])
                .then(v =&gt; console.log(v)); // [1, &#39;hello&#39;, 42]

                // 实际应用：批量操作
                const userIds = [1, 2, 3, 4, 5];
                const users = await Promise.all(
                    userIds.map(id =&gt; getUser(id))
                );
                ```
    - async/await
        - async 函数基础
            - async/await 是 Promise 的语法糖，让异步代码看起来像同步代码一样。
            -
            ```js
            // async 函数始终返回 Promise
            async function greet() {
                return &#39;Hello&#39;; // 自动包装为 Promise.resolve(&#39;Hello&#39;)
            }

            greet().then(v =&gt; console.log(v)); // &#34;Hello&#34;

            // 等价于
            function greet() {
                return Promise.resolve(&#39;Hello&#39;);
            }

            // 即使返回普通值，也是 Promise
            async function getNumber() {
                return 42;
            }
            console.log(getNumber() instanceof Promise); // true

            // 抛出的错误变成 rejected Promise
            async function fail() {
                throw new Error(&#39;出错了&#39;);
            }
            fail().catch(err =&gt; console.log(err.message)); // &#34;出错了&#34;
            ```
        - await 表达式
            - await 只能在 async 函数（或模块顶层）内部使用。它暂停函数执行，等待 Promise resolve，然后返回 resolve 的值。
            -
            ```js
            async function example() {
                console.log(&#39;1. 开始&#39;);

                // await 暂停，等 Promise resolve
                const result = await new Promise(resolve =&gt; {
                    setTimeout(() =&gt; resolve(&#39;数据&#39;), 1000);
                });

                console.log(&#39;2. 收到:&#39;, result); // 1 秒后
                console.log(&#39;3. 继续&#39;);
            }

            example();
            console.log(&#39;4. async 函数外部&#39;);

            // 输出：
            // 1. 开始
            // 4. async 函数外部（不等待 async 函数）
            // （1 秒后）
            // 2. 收到: 数据
            // 3. 继续
            ```
            - await 的本质——对比 then 链：
            ```js
            // Promise 链
            function getData() {
                return getUser(1)
                    .then(user =&gt; getOrders(user.id))
                    .then(orders =&gt; getOrderDetail(orders[0].id))
                    .then(detail =&gt; {
                        console.log(detail);
                        return detail;
                    });
            }

            // async/await（完全等价，但可读性好得多）
            async function getData() {
                const user = await getUser(1);
                const orders = await getOrders(user.id);
                const detail = await getOrderDetail(orders[0].id);
                console.log(detail);
                return detail;
            }

            // 最大的优势：中间变量全部可用
            // 不需要像 Promise 链那样用嵌套或外部变量传递
            ```
        - 错误处理
            - try/catch
            ```js
            async function fetchUserData(userId) {
                try {
                    const user = await getUser(userId);
                    const orders = await getOrders(user.id);
                    const detail = await getOrderDetail(orders[0].id);
                    return { user, orders, detail };
                } catch (error) {
                    // 任何一步的 reject 或 throw 都会被捕获
                    console.error(&#39;获取数据失败:&#39;, error.message);
                    throw error; // 重新抛出或返回兜底数据
                }
            }

            // 精细化错误处理：每步单独 try/catch
            async function fetchWithFallback(userId) {
                let user;
                try {
                    user = await getUser(userId);
                } catch (error) {
                    console.warn(&#39;用户服务异常，使用默认数据&#39;);
                    user = { id: userId, name: &#39;Unknown&#39; };
                }

                let orders;
                try {
                    orders = await getOrders(user.id);
                } catch (error) {
                    console.warn(&#39;订单服务异常&#39;);
                    orders = [];
                }

                return { user, orders };
            }
            ```
