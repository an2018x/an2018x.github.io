v></aside><script>let activeElement,elements;document.addEventListener("DOMContentLoaded",function(){if(checkTocPosition(),elements=document.querySelectorAll("h1[id],h2[id],h3[id],h4[id],h5[id],h6[id]"),elements.length>0){activeElement=elements[0];const e=encodeURI(activeElement.getAttribute("id")).toLowerCase();document.querySelector(`.inner ul li a[href="#${e}"]`).classList.add("active")}const t=document.getElementById("top-link");t&&t.addEventListener("click",e=>{e.preventDefault(),window.scrollTo({top:0,behavior:"smooth"})})},!1),window.addEventListener("resize",function(){checkTocPosition()},!1),window.addEventListener("scroll",()=>{const e=window.pageYOffset||document.documentElement.scrollTop;if(e===0)return;elements&&elements.length>0&&(activeElement=Array.from(elements).find(t=>{if(getOffsetTop(t)-e>0&&getOffsetTop(t)-e<window.innerHeight/2)return t})||activeElement,elements.forEach(e=>{const n=encodeURI(e.getAttribute("id")).toLowerCase(),t=document.querySelector(`.inner ul li a[href="#${n}"]`);if(e===activeElement){t.classList.add("active");const e=document.querySelector(".toc .inner"),n=t.offsetTop,s=e.clientHeight,o=t.clientHeight,i=n-s/2+o/2;e.scrollTo({top:i,behavior:"smooth"})}else t.classList.remove("active")}))},!1);const main=parseInt(getComputedStyle(document.body).getPropertyValue("--article-width"),10),toc=parseInt(getComputedStyle(document.body).getPropertyValue("--toc-width"),10),gap=parseInt(getComputedStyle(document.body).getPropertyValue("--gap"),10);function checkTocPosition(){const e=document.body.scrollWidth;e-main-toc*2-gap*4>0?document.getElementById("toc-container").classList.add("wide"):document.getElementById("toc-container").classList.remove("wide")}function getOffsetTop(e){if(!e.getClientRects().length)return 0;let t=e.getBoundingClientRect(),n=e.ownerDocument.defaultView;return t.top+n.pageYOffset}</script><div class=post-content><h1 id=并发基础与-jmm-入门>并发基础与 JMM 入门<a hidden class=anchor aria-hidden=true href=#并发基础与-jmm-入门>#</a></h1><div id=me_0 class=mindelixir-container style=height:560px;width:100%></div><script type=application/json id=me_0_src>"\"- 并发基础与 JMM 入门\\n    - 并发三大问题\\n        - 原子性\\n            - 定义：一个操作要么全部完成，要么完全不完成，中间过程对其他线程不可见\\n            - 典型反例：i++ 不是原子操作\\n        - 可见性\\n            - 定义：一个线程对共享变量的修改，能否及时被其他线程看到\\n            - 根因\\n                - CPU 缓存(L1/L2/L3) 与编译器/CPU 重排序\\n                - 线程可能一直读到自己缓存中的旧值\\n            - 解决方法\\n                - volatile: 保证写入对其他线程可见\\n                - synchronized/Lock：解锁前的写对之后加锁的读可见\\n                - final：初始化安全\\n        - 有序性\\n            - 定义：代码执行顺序是否一定和你写的一样\\n            - 根因\\n                - 编译器优化：指令重排(JIT)\\n                - CPU 乱序执行\\n    - JMM(Java 内存模型)\\n        - JMM 解决的问题\\n            - JMM 的目标不是描述硬件，而是给 Java 程序提供一个跨平台一致的并发可见性与有序性规范\\n            - 规范：\\n                - 写的代码跑在不同 CPU 上，缓存协议，重排序规则不同\\n                - JMM 通过 happens-before 规定：只要满足 HB，结果必须可见且有序；不满足 HB，结果运行不可预测\\n                - HB = Java 并发正确性的法律条文\\n        - happends-before (HB)\\n            - HB 是可见性 + 有序性的保证关系\\n            - A happens-before B\\n                - A 的结果对 B 可见\\n                - A 的执行顺序对 B 先行约束\\n            - 没有 HB，就不保证可见/有序\\n        - happends-before 规则\\n            - 程序次序规则\\n                - 同一个线程能，按程序顺序，前面的操作 HB 后面的操作\\n            - 监视器锁规则\\n                - 对同一把锁，unlock HB 之后对同一锁的 lock\\n            - volatile 变量规则\\n                - 对同一 volatile 变量，对 volatile 的写 HB 后续对该 volatile 的读\\n            - 线程启动规则\\n                - Thread.start() HB 该线程内的所有操作\\n            - 线程终止规则\\n                - 线程内所有操作 HB 其他线程成功从 Thread.join() 返回\\n            - 中断规则\\n                - 对线程调用 interrupt() HB 被中断线程检测到中断\\n            - 传递性\\n                - 若 A HB B，B HB C，则 A HB C\\n    - volatile\\n        - volatile 保证什么\\n            - 可见性：写入会刷新到主内存，读取会从主内存获取\\n            - 有序性：禁止 volatile 写/读周围的特定重排序（内存屏障）\\n            - 建立 happens-before：写 HB 读\\n        - volatile 不保证\\n            - 不保证复合操作原子性\\n            - 不保证所有代码不重拍：只约束与 volatile 相关的重排边界\\n        - volatile 的经典使用场景\\n            - 状态标志：停止线程 volatile boolean stop\\n            - 单例的安全发布\\n            - 读多写少的配置刷新\\n    - DLC（双重检查锁）为什么必须加 volatile\\n        - ![](https://an-img.oss-cn-hangzhou.aliyuncs.com/2026/02/20/20260220165657231.png,292,241)\\n        - new Singleton() 在底层上被视为三步：\\n            - 分配内存\\n            - 调用构造器初始化对象\\n            - 把引用赋给 instance\\n        - 如果发生重排序，可能变为\\n            - 分配内存\\n            - 赋引用给 instance\\n            - 初始化对象\\n        - 另一个线程看到 instance != null 就返回，但是拿到半初始化对象\\n        - volatile 禁止这种关键重排并建立 HB，确保安全发布\\n    - final 的初始化安全\\n        - final 字段在构造完成后有更强的可见性保障\""</script><script>(function(){if(typeof MindElixir=="undefined"){console.error("MindElixir not loaded. Check your CDN script tag.");return}const n="me_0";let e=JSON.parse(document.getElementById(n+"_src").textContent);function s(){return"n_"+Math.random().toString(16).slice(2)+Date.now().toString(16)}function a(e){const o=e.split(/\n/).map(e=>e.replace(/\s+$/g,"")).filter(e=>e.trim().length>0);console.log(o);const t=[];let n=null;for(const u of o){const r=u.match(/^(\s*)([-*+])\s+(.*)$/);if(!r)continue;const h=r[1].replace(/\t/g,"  ").length,d=Math.floor(h/2);let e=r[3].trim(),c=null;const l=e.match(/^(.*?)(?:\s*->\s*)(https?:\/\/\S+)\s*$/);l&&(e=l[1].trim(),c=l[2].trim());const i={id:s(),topic:e,children:[]},a=e.match(/!\[\]\(\s*([^,\]]+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)\s*$/i);if(a){const t=a[1].trim(),n=Number(a[2]),s=Number(a[3]);e=e.replace(a[0],"").trim(),i.topic="",i.image={url:t,width:n,height:s}}if(c&&(i.hyperLink=c),!n){n=i,t.push({level:0,node:n});continue}for(;t.length&&t[t.length-1].level>=d;)t.pop();const m=t.length?t[t.length-1].node:n;m.children.push(i),t.push({level:d,node:i})}return n||{id:s(),topic:"Empty",children:[]}}e=JSON.parse(e),console.log(e);const t=a(e);console.log(t);const o={nodeData:{id:t.id,topic:t.topic,root:!0,children:t.children||[]},arrows:[],summaries:[],direction:2};console.log(o);const i=window.MindElixir?.default??window.MindElixir;if(typeof i!="function"){console.error("MindElixir loaded but not a constructor. window.MindElixir =",window.MindElixir);return}const r=new i({el:"#"+n});r.init(o)})()</script><h1 id=线程模型与线程安全>线程模型与线程安全<a hidden class=anchor aria-hidden=true href=#线程模型与线程安全>#</a></h1><div id=me_1 class=mindelixir-container style=height:560px;width:100%></div><script type=application/json id=me_1_src>"\"- 线程模型与线程安全\\n    - Java 线程模型：Thread/Runnable/Callable/Future\\n        - 四者关系与使用场景\\n            - Thread: 线程载体+执行单元\\n            - Runnable：无返回值、不能抛受检异常\\n            - Callable\\u003cV\\u003e: 有返回值，可抛异常（配合 Future）\\n            - Future\\u003cV\\u003e：异步结果句柄（拿结果、取消、超时）\\n            - Thread 是执行容器，Runnable/Callable 是任务；Callable 比 Runnable 多返回值与异常；Future 是任务的控制面板\\n        - Future API\\n            - get()：阻塞拿结果\\n            - get(timeout, unit)：超时等待\\n            - cancel(true/false)：尝试取消\\n                - true：会向线程发 interrupt\\n                - false：不 interrupt，只是标记取消\\n            - isDone()/isCancelled()\\n    - 线程生命周期与状态\\n        - Java Thread.State\\n            - NEW：未 start\\n            - RUNNABLE：可运行（包括运行中+就绪）\\n            - BLOCKED：等待获取 monitor 锁（synchronized 竞争）\\n            - WAITING：无限期等待（Object.wait()/Thread.join()/LockSupport.park()）\\n            - TIME_WAITED：限时等待（sleep()/wait(timeout)/join(timeout)/parkNanos）\\n            - TERMINATED：结束\\n        - BLOCKED 和 WAITING 的区别\\n            - BLOCKED：卡在 synchronized，等锁\\n            - WAITING：已经拿到锁，主动等待某个条件\\n        - 线程切换成本\\n            - 上下文切换：保存恢复寄存器、栈、调度\\n            - CPU cache 命中下降\\n            - 线程越多，竞争越激烈，吞吐反而下降\\n    - 中断机制：interrupt 不是杀进程\\n        - 三个 API 的语义\\n            - thread.interrupt()：给线程设置中断标志位\\n            - thread.isInterrupted()：读取中断标志位（不清除）\\n            - Thread.interrupted()：读取当前线程的中断标志位，并且清除\\n        - 那些操作对中断敏感\\n            - 会抛 InterruptedException （清除中断标志）\\n                - Object.wait()\\n                - Thread.sleep()\\n                - Thread.join()\\n                - BlockingQueue.put/take 等可中断阻塞\\n            - Lock 的可中断\\n                - lockInterruptibly()：阻塞等锁时可响应 interrupt\\n                - lock()：等锁期间不相应 interrupt\\n        - 优雅停线程\\n            - 循环里检查中断标志\\n            - 捕获 InterruptedException 后要么退出，要么重新设置中断标志位再退出/上抛\\n                - ![](https://an-img.oss-cn-hangzhou.aliyuncs.com/2026/02/20/20260220171246171.png,387,319)\\n    - 线程安全方法论\\n        - 不变性\\n            - 对象状态创建后不再改变\\n            - 示例： String、Interger\\n            - 业务做法：配置对象、DTO 用不可变 + 构造完成后安全发布\\n            - 优点：天然线程安全、无锁高性能\\n            - 缺点：需要复制，内存开销上升\\n        - 线程封闭\\n            - 数据只在一个线程访问\\n            - 典型：方法栈内局部变量、线程私有变量\\n            - 示例：每个线程一个 SimpleDateFormat\\n        - 同步互斥\\n            - 通过临界区序列化访问共享状态\\n        - 无锁/低锁\\n            - 原子类/CAS、分段化\\n    - Synchronized\\n        - Synchronized 锁的是什么\\n            - synchronized(obj)：锁 obj 的 monitor\\n            - synchronized 实例方法：锁 this\\n            - static synchronized: 锁 Class 对象（xxx.class）\\n            - 锁的是对象的 monitor，不是代码块本身\\n        - synchornized 三大语义\\n            - 互斥：同一时刻只有一个线程进入临界区\\n            - 可见性：释放锁前的写，对之后获取同一锁的线程可见\\n            - 可重入：同一线程可重复获得同一把锁\\n        - 锁升级\\n            - 目标：在无竞争/低竞争时，让 synchronzied 尽可能便宜；在竞争激烈时保证正确性与吞吐。\\n            - 策略\\n                - 无竞争：尽量不做原子指令/不进内核\\n                - 少量竞争：用 CAS + 自旋解决（避免线程阻塞/唤醒成本）\\n                - 激烈竞争：进入 monitor，阻塞/唤醒\\n            - 对象头与 Mark Word：锁状态存在哪里\\n                - 每个 Java 对象在 HotSpot 里都有对象头，核心是 Mark Word，用于存：\\n                    - 哈希码\\n                    - GC 分代/标记信息\\n                    - 锁相关信息（锁标志位、线程 ID、指针等）\\n                - synchronized 不单独存一个锁对象结构，优先把锁状态编码在对象头里；必要时才膨胀到 monitor(重量级)。\\n            - 四种主要锁形态\\n                - 无锁\\n                    - 对象头处于可锁定但未加锁状态\\n                    - 第一次进入 synchronized，会走向偏向/轻量的获取逻辑\\n                - 偏向锁\\n                    - 适用场景：几乎总是同一个线程反复进入同一把锁\\n                    - 核心思想：预期每次都 CAS/自旋，不如直接偏向某个线程\\n                    - MarkWord 记录偏向的线程 id\\n                    - 同一线程再次进入，只需要快速检查是不是我，几乎零成本\\n                    - 偏向锁的获取：\\n                        - 第一次进入：尝试把对象头偏向当前线程（轻量 CAS 一次）\\n                        - 再次进入：只做线程 ID 校验\\n                    - 偏向锁的撤销\\n                        - 另一个线程也来竞争这把锁\\n                        - 偏向线程已经结束，且有其他线程来加锁\\n                        - JVM 需要批量撤销/重偏向\\n                - 轻量级锁\\n                    - 适用场景：有短暂竞争，但竞争不激烈；临界区很短\\n                    - 核心机制\\n                        - 线程在栈上创建一个 Lock Record（锁记录）\\n                        - 把对象头的 Mark Word 复制到 Lock Record（保存旧值）\\n                        - 用 CAS 尝试把对象头替换为指向 Lock Record 的指针（同时设置轻量锁标志）\\n                            - CAS 成功：拿到轻量锁\\n                            - CAS 失败：说明有竞争 -\\u003e 可能自旋等待 -\\u003e 若仍失败/竞争升高 -\\u003e 膨胀为重量级锁\\n                - 重量级锁\\n                    - 使用场景：竞争激烈，自旋会浪费 CPU，或者线程阻塞更划算\\n                    - 核心机制\\n                        - 对象关联一个 ObjectMonitor\\n                        - 竞争失败的线程进入 EntryList/WaitSet（不同状态的队列）\\n                        - 由 OS 互斥/park-unpark 等机制进行阻塞与唤醒\\n                    - 特点\\n                        - 成本高：涉及线程挂起/唤醒、上下文切换\\n                        - 高竞争下更稳定：避免大量线程空转自旋把 CPU 烧穿\\n    - wait/notify：线程协作的基础\\n        - wait/notify 使用规则\\n            - 必须在 synchronized 内调用，否则抛 IllegalMonitorStateException\\n            - wait() 会\\n                - 释放当前 monitor\\n                - 把线程放入该 monitor 的等待队列\\n                - 被唤醒后需要重新竞争锁\\n            - 永远用 while 检查条件，不用 if\\n                - 防止虚假唤醒\\n                - 防止被唤醒时条件已被其他线程改变\\n            - ![](https://an-img.oss-cn-hangzhou.aliyuncs.com/2026/02/20/20260220192817406.png,154,106)\\n        - notify vs notifyAll\\n            - notify(): 随机唤醒一个等待线程\\n            - notifyAll(): 唤醒全部等待线程，让它们竞争并再次检查条件\\n            - 多数条件 prefer notifyAll，除非非常确定只存在一种等待条件且不会误唤醒 \\n        - wait/notify vs sleep\\n            - sleep()：不释放锁，属于 Thread 方法，主要用于延时\\n            - wait()：释放锁，属于 Object 方法；用于条件等待\\n    - Condition 与 LockSupport：更现代的协作手段\\n        - Condition 相对 wait/notify 的优势\\n            - 可拥有多个条件队列\\n            - API 更清晰 await/signal/singalAll\\n            - 与 ReentrantLock 组合可实现更复杂的并发控制\\n        - LockSupport\\n            - park() 阻塞当前线程\\n            - unpark(thread)：给某个线程发许可，让它从 park 返回\\n            - unpark() 可以先于 park 发生，比 wait/notify 更灵活\\n    - 可中断的生产者-消费者\\n        - ![](https://an-img.oss-cn-hangzhou.aliyuncs.com/2026/02/20/20260220194750850.png,375,460)\\n        - ![](https://an-img.oss-cn-hangzhou.aliyuncs.com/2026/02/20/20260220194816875.png,451,697)\\n    - Condition 版本\\n        - ![](https://an-img.oss-cn-hangzhou.aliyuncs.com/2026/02/20/20260220195331750.png,365,599)\""</script><script>(function(){if(typeof MindElixir=="undefined"){console.error("MindElixir not loaded. Check your CDN script tag.");return}const n="me_1";let e=JSON.parse(document.getElementById(n+"_src").textContent);function s(){return"n_"+Math.random().toString(16).slice(2)+Date.now().toString(16)}function a(e){const o=e.split(/\n/).map(e=>e.replace(/\s+$/g,"")).filter(e=>e.trim().length>0);console.log(o);const t=[];let n=null;for(const u of o){const r=u.match(/^(\s*)([-*+])\s+(.*)$/);if(!r)continue;const h=r[1].replace(/\t/g,"  ").length,d=Math.floor(h/2);let e=r[3].trim(),c=null;const l=e.match(/^(.*?)(?:\s*->\s*)(https?:\/\/\S+)\s*$/);l&&(e=l[1].trim(),c=l[2].trim());const i={id:s(),topic:e,children:[]},a=e.match(/!\[\]\(\s*([^,\]]+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)\s*$/i);if(a){const t=a[1].trim(),n=Number(a[2]),s=Number(a[3]);e=e.replace(a[0],"").trim(),i.topic="",i.image={url:t,width:n,height:s}}if(c&&(i.hyperLink=c),!n){n=i,t.push({level:0,node:n});continue}for(;t.length&&t[t.length-1].level>=d;)t.pop();const m=t.length?t[t.length-1].node:n;m.children.push(i),t.push({level:d,node:i})}return n||{id:s(),topic:"Empty",children:[]}}e=JSON.parse(e),console.log(e);const t=a(e);console.log(t);const o={nodeData:{id:t.id,topic:t.topic,root:!0,children:t.children||[]},arrows:[],summaries:[],direction:2};console.log(o);const i=window.MindElixir?.default??window.MindElixir;if(typeof i!="function"){console.error("MindElixir loaded but not a constructor. window.MindElixir =",window.MindElixir);return}const r=new i({el:"#"+n});r.init(o)})()</script><h1 id=juc-核心与-aqs>JUC 核心与 AQS<a hidden class=anchor aria-hidden=true href=#juc-核心与-aqs>#</a></h1><div id=me_2 class=mindelixir-container style=height:560px;width:100%></div><script type=application/json id=me_2_src>"\"- JUC 核心与 AQS\\n    - CAS 与原子类\\n        - CAS 是什么\\n            - CAS 本质是一个 CPU 原子指令\\n            - 比较内存位置的值是否等于 expected\\n            - 是则写入 update\\n            - 返回成功/失败\\n        - CAS 解决了什么\\n            - 解决复合更新在并发下的原子性\\n            - 避免锁的阻塞/唤醒，吞吐通常更高\\n        - CAS 的代价\\n            - 自旋重试：竞争大时空转，CPU 飙高\\n            - 可能导致某些线程长期失败\\n        - AtomicInteger/AtomicLong 的工作方式\\n            - AtomicInteger.incrementAndGet()，本质是\\n                - 循环：读旧值 -\\u003e 计算新值 -\\u003e CAS 尝试更新 -\\u003e 失败重试\\n            - 原子类=CAS 自旋 + volatile 语义，失败重试直到成功\\n        - ABA 问题\\n            - 问题描述\\n                - 线程 T1 看到值为 A，准备 CAS 成 B；期间 T2 把 A 改成 C 又改为 A。\\n                - T1 CAS 会成功，它不知道中间发生过变化\\n            - ABA 什么时候有害\\n                - 关心的是值有没与变过，而不是当前值是不是 A\\n            - 解决方案\\n                - 版本号：AtomicStampedReference（值+stamp）\\n                - 也有 AtomicMarkableReference（值+boolean 标记）\\n            - LongAddr 为什么比 AtomicLong 快\\n                - AtomicLong：所有线程竞争同一个 value，CAS 冲突高\\n                - LongAdder：把热点拆分成多个 Cell，线程尽量更新自己的 Cell，最后 sum 时聚合\\n    - AQS：JUC 的核心骨架\\n        - AQS 最重要的三件东西\\n            - state (volatile int)：同步状态\\n            - CLH 变体 FIFO 队列：等待线程排队\\n            - acquire/release 模板方法：统一的获取/释放流程\\n            - AQS 用 state 表示资源，用队列管理竞争失败的线程，用 acquire/release 模板屏蔽排队、阻塞与唤醒细节，同步器只要实现 tryAquire/tryRelease\\n        - AQS 的两种模式\\n            - 独占：一次只允许一个线程获取\\n                - ReentrantLock、ReentrantReadWriteLock 的写锁\\n            - 共享：运行多个线程同时获取\\n                - Semaphore、CountDownLatch、读锁\\n        - acquire/release\\n            - acquire\\n                - tryAcquire() 尝试直接获取资源\\n                - 失败：把当前线程包装成 Node 入队\\n                - 自旋检查是否轮到自己（前驱是 head 且再 tryAquire）\\n                - 若仍然失败，park 阻塞\\n                - 被唤醒后继续循环\\n                - 要点\\n                    - 不是一直自旋：会 park\\n                    - 唤醒不是广播，通常唤醒一个合适的后继节点，避免惊群\\n            - release\\n                - tryRelease() 修改 state（释放资源）\\n                - 如果释放后资源可用，唤醒队列中的后继节点\\n        - 为什么 AQS 用队列\\n            - 避免一堆线程同时自旋抢锁造成 CPU 爆炸\\n            - FIFO 队列提供基本公平性基础\\n            - park/unpark 做阻塞唤醒，减少上下文切换次数（相对 monitor 更加可控）\\n    - ReentrantLock\\n        - ReentrantLock 相比 synchronized 的能力点\\n            - 可中断：lockInterruptibly()\\n            - 可超时：tryLock(timeout)\\n            - 可选择公平/非公平\\n            - 多 Condition（多个等待队列）\\n            - 缺点：必须手动释放锁，代码更啰嗦\\n        - 公平 vs 非公平\\n            - 公平锁：大致按照队列先来先服务，吞吐更低\\n            - 非公平锁：允许插队，先 CAS 抢一把，吞吐更高，可能造成某些线程等待更久\\n        - 可中断锁为什么重要\\n            - 线程在等锁时被取消/超时，希望立即退出而不是继续卡死\\n            - lock()：等待锁期间不响应 interrupt\\n            - lockInterruptibly()：能响应 interrupt，抛 interruptedException\\n    - Condition：两个队列（同步队列+条件队列）\\n        - Condition 的语义\\n            - await()：释放锁+当前线程进入条件队列+park\\n            - signal()：把条件队列头部线程转移到同步队列\\n            - 线程真正执行\\n                - 被 signal 转移到同步队列\\n                - 重新竞争锁成功 (acquire)\\n                - await 返回继续跑\\n        - 常见同步工具类\\n            - CountDownLatch（一次性门闩）\\n                - state = count\\n                - await()：共享获取，直到 count == 0 全部放行\\n                - countDown()：释放，count--，到 0 唤醒所有等待者\\n                - 适用场景\\n                    - 主线程等待多个子任务完成\\n                    - 服务启动前等待依赖就绪\\n                - count 到 0 后不能重置\\n            - Semaphore（信号量：限流/资源池）\\n                - state = permits\\n                - acquire()：permits--，不够则排队阻塞\\n                - release()：permits++，唤醒等待者\\n                - 适用场景\\n                    - 限制并发数\\n                    - 连接池/令牌桶\\n            - CyclicBarrier（客服用栅栏，非 AQS 典型）\\n                - 让一组线程在栅栏处互相等待，达到数量后一起继续\\n                - 可复用\\n                - 用于并行计算分段后汇总\""</script><script>(function(){if(typeof MindElixir=="undefined"){console.error("MindElixir not loaded. Check your CDN script tag.");return}const n="me_2";let e=JSON.parse(document.getElementById(n+"_src").textContent);function s(){return"n_"+Math.random().toString(16).slice(2)+Date.now().toString(16)}function a(e){const o=e.split(/\n/).map(e=>e.replace(/\s+$/g,"")).filter(e=>e.trim().length>0);console.log(o);const t=[];let n=null;for(const u of o){const r=u.match(/^(\s*)([-*+])\s+(.*)$/);if(!r)continue;const h=r[1].replace(/\t/g,"  ").length,d=Math.floor(h/2);let e=r[3].trim(),c=null;const l=e.match(/^(.*?)(?:\s*->\s*)(https?:\/\/\S+)\s*$/);l&&(e=l[1].trim(),c=l[2].trim());const i={id:s(),topic:e,children:[]},a=e.match(/!\[\]\(\s*([^,\]]+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)\s*$/i);if(a){const t=a[1].trim(),n=Number(a[2]),s=Number(a[3]);e=e.replace(a[0],"").trim(),i.topic="",i.image={url:t,width:n,height:s}}if(c&&(i.hyperLink=c),!n){n=i,t.push({level:0,node:n});continue}for(;t.length&&t[t.length-1].level>=d;)t.pop();const m=t.length?t[t.length-1].node:n;m.children.push(i),t.push({level:d,node:i})}return n||{id:s(),topic:"Empty",children:[]}}e=JSON.parse(e),console.log(e);const t=a(e);console.log(t);const o={nodeData:{id:t.id,topic:t.topic,root:!0,children:t.children||[]},arrows:[],summaries:[],direction:2};console.log(o);const i=window.MindElixir?.default??window.MindElixir;if(typeof i!="function"){console.error("MindElixir loaded but not a constructor. window.MindElixir =",window.MindElixir);return}const r=new i({el:"#"+n});r.init(o)})()</script><h1 id=线程池与并发工程实战>线程池与并发工程实战<a hidden class=anchor aria-hidden=true href=#线程池与并发工程实战>#</a></h1><div id=me_3 class=mindelixir-container style=height:560px;width:100%></div><script type=application/json id=me_3_src>"\"- 线程池与并发工程实战\\n    - 不用线程池的问题\\n        - 线程创建/销毁成本高（栈、TLAB、调度）\\n        - 不可控：并发暴涨会把机器压垮\\n        - 缺乏治理能力：无法统一命名，监控、拒绝、限流、隔离\\n    - ThreadPoolExecutor\\n        - 七大参数\\n            - corePoolSize（核心线程数）\\n                - 默认不会受\\n                - 任务来时优先创建核心线程直到达到 core\\n            - maximumPoolSize（最大线程数）\\n                - 队列慢后，才会创建非核心线程，直到 max\\n                - 超过 max 再来任务 -\\u003e 触发拒绝策略\\n            - keepAliveTime（空闲存活时间）\\n                - 非核心线程空闲超时会回收\\n                - 若允许核心线程超时，则核心线程也会回收\\n            - workQueue （任务队列）\\n                - 决定任务是排队还是扩线程的关键\\n            - threadFactory（线程工厂）\\n                - 线程命名，daemon、优先级、UncaughtExceptionHandler\\n                - 工程强制：必须设置可读名称\\n            - handler（拒绝策略）\\n                - 线程数到 max 且队列满-\\u003e触发拒绝\\n            - unit（时间单位）\\n        - 线程池执行流程\\n            - 若 workerCount \\u003c corePoolSize\\n                - 创建核心线程执行 task\\n            - 否则尝试入队 workQueue.offer(task)\\n                - 入队成功：等待线程从队列取任务\\n            - 入队失败，且 workerCount \\u003c maximumPoolSize\\n                - 创建非核心线程执行 task\\n            - 否则，拒绝策略 handler.rejectExecution(task, executor)\\n        - workQueue 选型\\n            - LinkedBlockingQueue(无界/大容量队列)\\n                - 特点\\n                    - 极容易入队成功，导致线程数通常停在 core，不会扩到 max\\n                    - 如果队列无界：任务堆积 -\\u003e 内存膨胀/延迟飙升，最终 OOM 或雪崩\\n                - 适用：任务流量可控，任务执行稳定，且能接受排队延迟\\n            - ArrayBlockingQueue(有界队列)\\n                - 特点\\n                    - 队列有界，能把系统压力显式化\\n                    - 延迟更可控，便于做背压与降级\\n                - 线上服务强烈推荐：有界队列+明确拒绝策略\\n            - SynchronousQueue(不存任务，直接提交)\\n                - 特点\\n                    - 没容量，offer 必须被 worker 立即 take 才算成功\\n                    - 适合快速扩线程，直到 max，然后拒绝\\n                    - newCachedThreadPool 就是它，风险是线程数可能飙升\\n    - 拒绝策略\\n        - 四种内置策略\\n            - AbortPolicy（默认）：抛 RejectedExecutionException\\n                - 适合你希望调用方显式失败，触发降级/重试逻辑\\n            - CallerRunsPolicy：调用方自己执行任务\\n                - 适合给上游施加背压（请求线程被拖慢，QPS 自然下降）\\n            - DiscardPolicy：静默丢弃\\n                - 适合：允许丢数据的场景（采样、非关键日志）\\n            - DiscardOldestPolicy：丢弃队列最老任务，再尝试入队\\n                - 适合：追求新任务更重要的场景\\n        - 工程化拒绝策略（建议自定义 handler）\\n            - 记录指标（reject count、queue size、active count）\\n            - 打点日志\\n            - 触发降级\\n            - 投递到补偿通道\\n    - Executors 工厂的问题\\n        - newFixedThreadPool\\n            - 默认用无界 LinkedBlockingQueue：堆积导致 OOM/延迟失控\\n        - newCachedThreadPool\\n            - 默认 SynchronousQueue + max=IntegerMAX_VALUE：线程数可以无限膨胀\\n        - newSingleThreadExecutor\\n            - 无界队列，同样堆积危险\\n        - 生产环境建议显式 new ThreadPoolExecutor：有界队列、合理 max、明确拒绝策略、线程命名与监控\\n    - 线程数怎么配置\\n        - CPU 密集型\\n            - 线程数 = CPU 核心数\\n            - 目标：减少上下文切换\\n        - IO 密集型\\n            - 线程数 = 核心数 * (1+等待时间/计算时间)\\n            - 工程上推荐压测（不同线程数）-\\u003e 看吞吐/延迟/CPU/上下文切换-\\u003e找拐点\\n    - CompletableFuture\\n        - 解决的问题\\n            - 传统 Future 的痛点\\n                - 只能 get() 阻塞拿结果，组合多个异步任务很痛苦\\n                - 异常处理分散，超时与取消不优雅\\n                - 任务依赖关系需要手写线程/回调\\n            - CompletableFuture 的定位\\n                - 提供声明式的异步流水线\\n                - 支持任务依赖、并行、聚合、异常处理、完成回调\\n        - 核心心智模型\\n            - Stage（阶段）\\n                - 每个 thenXX 都是在构建一个新阶段\\n                - 上一个阶段完成后触发下一个阶段\\n                - 每个阶段都可能\\n                    - 产出一个值\\n                    - 抛异常\\n                    - 被取消\\n            - Completion（完成态）\\n                - Completable 可能以三种方式结束\\n                    - 正常完成（有结果）\\n                    - 异常完成（exceptionally completed）\\n                    - 被取消（cancelled）\\n            - Executor\\n                - 必须管理在哪个线程执行阶段\\n        - 线程池与执行线程\\n            - 默认线程池\\n                - supplyAsync/runAsync：不传 executor 时，默认走 ForkJoinPool.commonPool\\n                - commonPool 是全局共享池：你的业务、第三方库、框架都可能在用\\n                - 工程风险\\n                    - 隔离性差\\n                    - 阻塞任务不友好\\n                    - 排障难\\n            - thenApply vs thenApplyAsync\\n                - thenApply(fn)：默认在完成上游阶段的线程里执行\\n                - thenApplyAsync(fn)：异步执行\\n                    - 不传 executor：用 commonPool\\n                    - 传 executor：用指定的线程池\\n        - 常用 API 分组\\n            - 创建与启动\\n                - completableFuture(value)：已完成（同步值包装）\\n                - runAsync(Runnable, executor?)：无返回值任务\\n                - supplyAsync(Supplier\\u003cT\\u003e, executor?)：有返回值任务\\n                - new CompletableFuture\\u003c\\u003e() + complete/completeExceptionally：手动控制完成\\n            - 转换 map 与消费 consume\\n                - thenApply(fn): T-\\u003eU\\n                - thenAccept(consume): 消费结果（无返回）\\n                - thenRun(runnable)：不关心结果，只做后续动作\\n            - 串联\\n                - thenCompose(fn): T-\\u003eCompletableFuture\\u003cU\\u003e，扁平化\\n                    - 用于上一个异步结果决定下一个异步请求\\n            - 并行组合\\n                - thenCombine(other, (a,b)-\\u003ec)：两个都完成后合并\\n                - allOf(f1,f2,...)：全部完成\\n                - anyOf(f1,f2,...)：任意一个完成\\n                - applyToEither(other, fn)：谁先完成用谁的结果\\n                - acceptEither：谁先完成就消费\\n            - 异常处理\\n                - exceptionally(ex -\\u003e fallback)：异常时给兜底值\\n                - handle((res, ex) -\\u003e ...)：无论成功失败都处理\\n                - whenComplete((res, ex) -\\u003e ...)：做副作用，不改变结果\\n            - 最佳实践\\n                - 主链用 handler 或 exceptionally 做兜底\\n                - whenComplete 做日志与 metrics\""</script><script>(function(){if(typeof MindElixir=="undefined"){console.error("MindElixir not loaded. Check your CDN script tag.");return}const n="me_3";let e=JSON.parse(document.getElementById(n+"_src").textContent);function s(){return"n_"+Math.random().toString(16).slice(2)+Date.now().toString(16)}function a(e){const o=e.split(/\n/).map(e=>e.replace(/\s+$/g,"")).filter(e=>e.trim ashtable：方法级 sychornized，所有操作串行\\n            - CHM：更细粒度控制\\n                - 大部分读操作无锁\\n                - 写操作只锁定桶/节点，并结合 CAS\\n        - CHM 的核心结构\\n            - 底层是 Node\\u003cK,V\\u003e[] table（桶数组）\\n            - 桶内结构：链表(node)或红黑树\\n            - 当链表过长且 table 足够大时，会树化降级查找复杂度\\n        - put 的并发控制逻辑\\n            - table 未初始化：先初始化\\n            - 根据 hash 找桶下标 i\\n            - 如果桶为空：尝试 CAS 放入新 Node\\n            - 若桶非空\\n                - 若桶是迁移中：帮助扩容\\n                - 否则对桶头做 synchronzied 局部锁，在桶内插入/更新\\n            - 插入后可能触发 size 技术更新与扩容检查\\n    - CopyOnWriteArrayList(COW)：读多写少\\n        - 核心机制\\n            - 写操作会\\n                - 加锁\\n                - 复制底层数组\\n                - 在新数组上修改\\n                - 用引用替换发布新数组\\n            - 读操作直接读数组快照，无损\\n        - 适用与不适用\\n            - 适用\\n                - 读远多于写\\n            - 不适用\\n                - 写频繁\\n                - 数组很大\\n    - 并发队列：非阻塞 vs 阻塞\\n        - ConcurrentLinkedQueue(CLQ)：非阻塞队列\\n            - 基于 CAS 的链表队列\\n            - 适合：高并发无界、低延迟、允许忙等/自旋语义的场景\\n            - 特点\\n                - offer/poll 非阻塞\\n                - size() 可能是线性复杂度\\n        - BlockingQueue：核心语义\\n            - BlockingQueue 的关键是两种阻塞语义\\n                - 当队列为空：take() 阻塞直到有元素\\n                - 当队列满：put() 阻塞直到有空间\\n                - offer/poll 返回特殊值\\n    - 三大常用阻塞队列\\n        - ArrayBlockingQueue(ABQ)-有界数组队列\\n            - 底层数组环形缓冲区\\n            - 一般用一把锁 + 两个 condition\\n            - 特点\\n                - 有界：最重要的工程优势\\n                - 内存局部性好\\n                - 吞吐稳定，适合线程池工作队列\\n            - 生成服务最常用的稳健默认\\n        - LinkedBlockingQueue(LBQ)-链表队列(可无界/大容量)\\n            - 链表节点存储，内存分配频繁（节点对象）\\n            - 常见实现会用两把锁来提高并行度\\n            - 风险：堆积导致 OOM 与延迟失控\\n        - SynchronousQueue(SQ)-不存储元素的移交队列\\n            - 容量为 0，put 必须等待 take 直接接手\\n            - 特点：几乎不用排队，延迟低\\n    - DelayQueue/PriorityBlockingQueue：定时与优先级\\n        - DelayQueue 延时队列\\n            - 元素实现 Delayed，按到期时间排序\\n            - take() 会阻塞直到最近到期元
