                   - 企业发行的债券叫做企业债\\n                    - 债券内容包含债券面值(本金)，票面利率(利息)，偿还日期和发行人名称(债务人)。\\n            - 股票基金(股票投资)\\n                - 80% 的钱都用于投资股票，收益高，风险大。\\n                - 指数基金也是股票基金的一种，股票指数涨，指数基金就涨\\n                - 股票基金的收益高于债券基金、货币基金，从长期来开，股票基金可以跑赢通货膨胀，而货币基金基本跑不赢通货膨胀\\n            - 混合基金(混合投资)\\n                - 投资股票、债券、货币等市场的投资组合比较丰富的基金\\n                - 根据股票和债券的投资比例，混合型基金可以细分为偏股混合型基金、偏债混合基金、平衡混合型基金、灵活配置混合型基金\\n            - 其他分类\\n                - 募资类型\\n                    - 公募基金\\n                        - 向社会公开募集资金的基金，投资门槛低，适合大众投资\\n                        - 以非公开的方式，向特定投资者募集的基金，要求投资者具备相应的风险识别能力和风险承担能力，私募基金投资门槛较高，至少要投资 100 万元。\\n                - 运作方式\\n                    - 开放式基金\\n                        - 随时可以买、随时可以卖，资金流动性高，现在的基金基本是开放型基金。\\n                    - 封闭式基金\\n                        - 不允许随便买卖的基金\\n    - 基金定投\\n        - 是什么\\n            - 分批、定时地买基金\\n        - 为什么定投\\n            - 一次性买进，很难判断高点和低点，容易错失投资机会。\\n            - 定投选择一个固定的时间来分批投资，可以分散风险。\\n            - 平摊成本，基金净值下跌的时候，价格便宜，500 元可以购买更多的基金份额\\n            - 微笑曲线\\n                - 基金净值先跌后涨，走势曲线像一个微笑，被称为微笑曲线。\\n                - 波动大的基金更加适合定投。\\n            - 定投的秘诀是趁低价获得更多的份额，定投波动大的基金有更多的机会获得低成本筹码。\\n        - 智能定投\\n            - 根据市场行情，涨则少买，跌则多买。\\n            - 策略\\n                - 均线策略\\n                    - 选择沪深 300 指数的 500 日均线作为参考线，沪深 300 指数的收盘价高于 500 日均线，就少买，反之，则多买。\\n                    - 当前一天的收盘价高于均线，就少买，否则多买。\\n                    - 行情持续上涨时，盈利的金额比普通定投少。\\n                - 估值策略\\n                    - 根据指数的估值来确定是否买进该基金。\\n                    - 指数处于低谷就买进，高估就不买。\\n                    - 行情持续上涨，指数处于高估状态，会错过好行情。\\n    - 基金选择技巧\\n        - 手续费用\\n            - A 类基金手续费用\\n                - 申购费 1.5% (优惠的是海鸥低至 0.15%)\\n                - 赎回费 0.5% (30 天后赎回)\\n                - 管理费 1.5% 一年，按日收费\\n                - 托管费 0.25% 一年，按日收费（托管费给银行）\\n                - 总共 = 2.4%\\n            - C 类基金手续费费用\\n                - C 类基金没有申购费，持有满 30 天后免赎回费，但是一年要收 0.5% 的服务费。\\n            - 基金的命名规则\\n                - 基金公司 + 投资方向 + 基金类别 + 收费类型\\n                - 基金名称后面带字母 A 的是 A 类基金，带字母 C 的是 C 类基金\\n                - A 类基金和 C 类基金没有什么差别，只是收费不同。\\n                - 一般建议短期买 C 类，长期买 A 类\\n        - 股市行情\\n            - 股市不好的时候（熊市），股价下跌，买股票基金就亏钱，这个时候债券基金比较合适，股市好的时候（牛市），股票基金收益可观。\\n            - 可以总结牛市的历史规律，一般 A 股平均每 5 年就有一次牛市。\\n            - 建议分批定投股票基金，一次买进债券基金。\\n            - 指数基金\\n                - 指数\\n                    - 股票指数简称指数，为了直观反映整个股票市场的走势，一些金融服务机构选出了一部分具有代表性的股票，通过某种方式计算出这些代表股票的综合价格数据，这个数据就是指数。\\n                    - 沪深 300 指数就是选取了 300 只具有代表性的股票算出来的，这个指数反映了国内股票市场的整体走势。\\n                    - 大盘一般指的是上证指数。\\n                - 指数基金指的是投资该指数成分股的基金。\\n                - 当身边没有人谈论股票的时候，一般意味着股市冷淡，处于熊市，这个时候开始定投指数基金，并长期持有。\\n                - 由于不知道股票的底在哪里，而指数的底在哪里相对明显，长期来看，指数是稳定上涨的，由于要长期持有，所以建议买 A 类基金。\\n        - 基金评级和风险评估\\n            - 基金评级\\n                - 由基金评级机构收集某一基金的有关信息，通过科学分析得出的对该基金的评价。\\n                - 常用的基金评级机构有晨星 -\\u003e https://www.morningstar.cn/\\n                - 怎么看\\n                    - 基金的等级（有几颗星）\\n                        - 等级分为一星和五星\\n                    - 基金能否跑赢大盘\\n                        - 对比红线走势和绿线走势，看看能否跑赢大盘\\n                    - 能否完成其既定收益目标\\n                    - 风险评估\\n                        - 标准差\\n                            - 反映波动幅度\\n                            - 指在过去一段时间内，基金的收益率相对于预期收益率的偏差幅度。\\n                            - 基金回报率的波动幅度。\\n                            - 标准差数值越大，说明这只基金的收益率波动越大。\\n                            - 例如标准差为 14%，说明基金在未来一年可能上涨 14%，也可能下跌 14%。\\n                            - 标准差反映了收益率的波动幅度，一般被用来衡量投资风险。\\n                            - 在预期收益率相同的情况下，标准差大，表示收益率波动幅度大，不稳定，风险也大。\\n                            - 标准差小，说明收益率波动幅度小，较为稳定，风险也小。\\n                        - 夏普比率\\n                            - 夏普比率 = (预期收益率 - 无风险收益率) / 标准差\\n                            - 无风险收益率指的是不存在违约风险的收益率，例如国债的收益率，货币基金的收益率。\\n                            - 夏普比可以简单理解为投资收益和投资风险的比值。\\n                            - 代表每承担一个风险可以拿到的超额收益。\\n                            - 夏普比率越高说明该基金性价比越高。\\n                        - β系数\\n                            - 可以衡量一只基金相对于整体市场的波动情况。\\n                            - β系数越高，说明基金相对于整体市场的波动越大。\\n                            - β系数为 1，整体市场上涨/下跌 10%，该基金也会上涨/下跌 10%。\\n                            - β系数为 1.2，整体市场上涨/下跌 10%，该基金会上涨/下跌 12%\\n                            - 标准差衡量的是自身的波动，β系数衡量的是相对于整体市场的波动，是相对值。\\n                            - β系数受于业绩评价基准的影响，如果选取的业绩评价标准相关度低，那么β系数没有意义。\\n                        - α系数\\n                            - 是基金的超额收益和期望收益之间的差值。\\n                            - α系数越高，代表该基金的盈利能力越强。\\n                            - α系数反映的是基金经理的能力\\n                            - α系数 = 实际收益率 - 无风险收益率 - β系数*市场收益率\\n        - 基金业绩和基金经理\\n            - 一些基金业绩好是由于出现了巨额赎回，巨额赎回产生的手续费会增加基金财产，导致收益率暴涨。\\n            - 基金排行榜的流动性高，今年入榜的基金，明年一般排不上榜。\\n            - 选择基金，需要选择未来收益率高的基金，不是选择历史收益率高的，排行榜的参考价值有限。\\n            - 如果一只基金更换了基金经理，那么就算历史业绩再好，也需要警惕。\\n            - 基金经理如果过于频繁更换，说明基金公司的管理出现了问题，需要加倍小心。\\n            - 考察基金经理的要点\\n                - 长期绩效的稳定性，业绩好，更具有说服力。\\n                - 基金管理的专注度，同时管理太多基金会分散注意力。\\n                - 基金管理的协作性，有的基金由多个基金经理管理，相比单经理制，更有利于维持基金的稳定性。\\n            - 一只基金由多少钱就是基金的规模\\n            - 如果基金规模太小，那么运营这只基金所赚到的手续费就少，基金公司可能会亏本，导致基金清盘。\\n            - 基金清盘会预留时间给投资者赎回，到了清盘的时候，基金公司会按照一定的净值强制赎回，把钱还给我们。\\n            - 货币基金、债券基金，规模越大越好。\\n            - 指数基金完全跟踪指数的波动型基金，规模越大越好。\\n            - 主动型基金的最优规模有多种说法，一般是 20 亿 - 100 亿。\\n            - 指数基金不需要基金经理主动操作，所以叫被动基金，需要基金经理主动操作的叫做主动基金。\\n            - 选择知名的基金公司，知名的基金公司有完善是管理指定、优秀的投研团队、良好的信誉和服务。\\n            - 知名的基金公司有：天弘、易方达、南方、华夏、招商、嘉实、中银、广发、博时、工银瑞信、华安、汇添富、国泰、富国。\\n    - 指数基金\\n        - 巴菲特十年赌约\\n            - 07 年底，巴菲特认为指数基金能够跑赢其他大多数基金，发起 10 年赌约，赌注 50w 美金，对赌的是一家对冲基金公司，2017 年底，公司认输。\\n        - 为什么选指数基金\\n            - 指数基金只需要跟踪、复制指数的涨跌、保持最小的跟踪误差，不做积极管理，称为被动型基金。\\n            - 其他普通基金，需要基金经理通过研究、分析来组合投资、以争取超额收益，所以称为主动型基金。\\n            - 和主动性基金相比的优势\\n                - 时间越长，指数型基金的优势越明显\\n                - 市场涨幅越大，指数基金越有优势\\n                - 市场波动越大，指数基金越有优势\\n                - 指数基金的管理费相对更低\\n            - 指数分类\\n                - 行业指数\\n                    - 代表一个行业的走势，也就窄基指数\\n                    - 例如消费行业指数、白酒行业指数、医药行业指数、金融行业指数等。\\n                - 宽基指数\\n                    - 包含多个行业，覆盖面广，例如上证指数、沪深指数、中证指数、创业板指数。\\n            - 选择指数定投\\n                - 沪深 300 选择的是蓝筹股，规模大，交易活跃\\n                - 中证 500 指数选择的股票市值小，波动大，成长性高，在牛市时有更高的收益。\\n                - 行业指数基金的风险稍高，除了要了解估值，还要考虑行业的特性和发展周期。\\n                - 在众多行业里面，有两个行业有天然优势，分别是消费和医药，特点是设计刚需。\\n            - 什么时候买入指数基金\\n                - 在指数的盈利收益率大于 10% 的时候，开始定投买入，也就是在指数的低估值区域开始定投买入。\\n                - 市盈率 = 公司市值 / 公司盈利\\n                - 盈利收益率 = 公司盈利 / 公司市值\\n                - 盈利收益率是市盈率的倒数\\n                - 市盈率可以理解为：为了赚到 1 元钱，需要投入多少钱。\\n                - 如果市盈率是 50，那么需要投入 5 元才能赚到 1 元钱，市盈率低才值得投资。\\n            - 指数基金的估值\\n                - 指数是由一篮子股票算出来的，用这一篮子股票的数据算出一个平均值，就可以得到该指数的估值指标。\\n                - 只有指数型基金才有估值，而其他股票基金的持仓不固定，股票经常切换，无法算出估值。\\n            - 什么时候卖出指数基金\\n                - 当找到比手里这只指数基金风险更低、收益更高的产品，就可以卖出这只基金了。\\n                - 当债券基金的收益高于指数基金时，就可以卖出指数基金，买入债券基金了。\\n                - 国内债券的长期平均收益率大概是 6.4%，如果指数基金的盈利收益率低于 6.4%，就可以暂停定投，开始卖出。\\n            - 定投策略\\n                - 盈利收益率 \\u003e 10%，开始定投\\n                - 当 6.4% \\u003c 盈利收益率 \\u003c= 10%，不买不卖\\n                - 当盈利收益率 \\u003c= 6.4%，开始卖出\\n                - 价值投资策略\\n                    - 选择低市盈率、高盈利收益率、高股息的指数基金或股票进行投资\\n            - 指数红绿灯\\n                - 支付宝-理财-基金s-指数红绿灯，绿灯就是低估值，红灯就是高估值。\\n            - 指数增强\\n                - 指数基金的任务是跟踪、复制指数的走势，它还设定了跟踪偏离度，偏离度越低，跟踪误差越小。\\n                - 存在一种指数增强型的指数基金，名字一般是 xx 指数增强。\\n                - 指数增强型基金在跟踪指数的基础上，允许基金经理根据股市行情做一些主动操作，来提高投资回报。\\n            - 指数基金定投是持久战\\n                - 指数基金定投要以年为单位，长期定投。\\n                - 不要做波段操作，浪费手续费。\\n                - 不要预测市场，不要盲目加仓，用闲钱投资就行。\\n                - 不要想一夜暴富。\\n                - 一般 3-6 年，跨越完整牛熊周期。\\n    - 分析基金\\n        - 看看这是只什么基金\\n            - 一般从基金的名字就可以分辨出来\\n                - 小盘成长混合（混合基金）\\n                - 互联科技股票（股票基金）\\n                - 收益宝货币（货币基金）    \\n            - 了解基本信息（基金公司、成立时间、资产规模、行业、持仓）\\n            - 看看要交多少手续费（交易规则）\\n            - 看历史业绩和基金经理\\n                - 看近三年的历史业绩，对比该基金和同类基金以及沪深 300 指数的走势。\\n                - 基金经理，什么时候上任，管理多少基金，这些基金的收益都如何。\\n            - 看基金评级和风险评估\\n                - 夏普比例 = 0.49，表示每承担一份风险，预期会有多少的超额收益。\\n                - 最大回撤 = -11.7%，这只基金跌的最多的一次是跌多少。\\n                - 收益回撤比 = -10.09，最高收益除以最大回撤，绝对值越大越好。\\n            - 大概了解下股市\\n                - 股市走向有两种趋势：上升趋势和下降趋势，可以查看沪深 300 指数，标记各个波段高点，连成趋势线。\\n    - 止盈\\n        - 基础概念\\n            - 止盈就是在达到盈利目标的时候卖出基金，让收益落袋为安。\\n            - 止损就是在发生亏损的时候，为了防止更大的亏损而卖出基金。\\n        - 为什么止盈能提高收益\\n            - 止盈就是卖出、赎回前期买入的基金，让目前的收益落袋为安。\\n        - 什么时候止盈\\n            - 一般在定投扣款 10 次以后开始止盈。\\n        - 止盈方法\\n            - 指数估值法：针对指数基金，根据指数估值来止盈，低估值买，高估值卖。\\n            - 技术指标法：通过分析股市的各种技术指标来判断卖出时机，也就是根据历史数据来判断股市走向。但是有一定滞后性，且对投资者要求较高。\\n            - 目标收益法：达到收益目标后就止盈，适合波动大的基金。\\n            - 市场情绪法：大家都在讨论股票的时候，股票可能就要跌了，这个时候就要卖出股票基金。\\n        - 目标收益率\\n            - 一般设置收益率为 15%~20%，基金的年收益目标应该大于 8%。\\n        - 达到目标怎么卖\\n            - 对应目标估值法，全部卖出。\\n            - 对应指数估值法，分批卖出。\\n        - 止盈后，是否要继续定投\\n            - 复利效应，把止盈后赚到的钱分成多份，加上原来的定投金额，作为新的定投金额，继续坚持定投，达到收益目标后，再止盈，再定投。\\n        - 自动止盈\\n            - 目标止盈：通过支付宝设置自动止盈，达到收益率目标后，自动止盈，适合股票型基金。\\n            - 移动止盈：达到收益率目标，如果继续上涨，那么就继续持有，如果出现回撤，那么就止盈卖出，适合单边上涨行情，定投大盘指数可以考虑移动止盈。\\n    - 货币基金\\n        - 货币基金≠存钱\\n            - 货币基金除了存钱到银行，也会投资短期债务、央行票据等低风险产品。\\n            - 货币基金风险低，流动性高。\\n            - 货币基金每天赚到的钱，都会以红利再投资的方式转换为基金份额，拥有多少基金份额就拥有多少资产，货币基金的净值一般是 1 元。\\n        - 余额宝\\n            - 余额宝本质是货币基金，货币基金的赎回一般是要到第二个工作日才能完成，之所以能快速转出余额宝，是由于他们先垫钱了。\\n        - 货币基金不保本\\n            - 如果货币基金遇到了巨额赎回，又没有足够的现金储备，就要不计成本地卖债券来凑钱，从而出现短期亏损。\\n        - 7 日年化收益率\\n            - 7 日年化收益率是根据最近 7 天的收益情况来算出未来一年的收益率。\\n            - 7 日年化收益率 = 7 日总收益率 / 7 * 365\\n        - 万份收益\\n            - 指投资 1 万元买货币基金，一天能取得的收益，这个收益每天都不同。\\n        - 不能完全信任 7 日年化\\n            - 货币基金可能会卖掉一些债券或者大额存单到期了，导致 7 日年化收益上升。\\n        - 货币基金如何选\\n            - 选择规模大的基金，至少 100 亿元以上。\\n            - 选择万份收益稳定的基金。\\n            - 选择流动性好的基金。\\n    - 债券\\n        -\""</script><script>(function(){if(typeof MindElixir=="undefined"){console.error("MindElixir not loaded. Check your CDN script tag.");return}const n="me_0";let e=JSON.parse(document.getElementById(n+"_src").textContent);function s(){return"n_"+Math.random().toString(16).slice(2)+Date.now().toString(16)}function a(e){const o=e.split(/\n/).map(e=>e.replace(/\s+$/g,"")).filter(e=>e.trim().length>0);console.log(o);const t=[];let n=null;for(const u of o){const r=u.match(/^(\s*)([-*+])\s+(.*)$/);if(!r)continue;const h=r[1].replace(/\t/g,"  ").length,d=Math.floor(h/2);let e=r[3].trim(),c=null;const l=e.match(/^(.*?)(?:\s*->\s*)(https?:\/\/\S+)\s*$/);l&&(e=l[1].trim(),c=l[2].trim());const i={id:s(),topic:e,children:[]},a=e.match(/!\[\]\(\s*([^,\]]+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)\s*$/i);if(a){const t=a[1].trim(),n=Number(a[2]),s=Number(a[3]);e=e.replace(a[0],"").trim(),i.topic="",i.image={url:t,width:n,height:s}}if(c&&(i.hyperLink=c),!n){n=i,t.push({level:0,node:n});continue}for(;t.length&&t[t.length-1].level>=d;)t.pop();const m=t.length?t[t.length-1].node:n;m.children.push(i),t.push({level:d,node:i})}return n||{id:s(),topic:"Empty",children:[]}}e=JSON.parse(e),console.log(e);const t=a(e);console.log(t);const o={nodeData:{id:t.id,topic:t.topic,root:!0,children:t.children||[]},arrows:[],summaries:[],direction:2};console.log(o);const i=window.MindElixir?.default??window.MindElixir;if(typeof i!="function"){console.error("MindElixir loaded but not a constructor. window.MindElixir =",window.MindElixir);return}const r=new i({el:"#"+n});r.init(o)})()</script></div><footer class=post-footer><ul class=post-tags></ul></footer></article></main><footer class=footer><span>©
