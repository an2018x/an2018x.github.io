- 基金
    - 基础知识
        - 是什么
            - 把钱交给专业机构(基金公司)，让他们帮我们进行投资
            - 基金公司会收取管理费
        - 基金分类
            - 货币基金(存款到银行)
                - 大部分钱存进银行，且不能投资于股票市场
                - 主要收入是银行的利息
                - 货币基金由于资产规模大，可以和银行谈判利率，因此比自己存钱利率要高
                - 银行通过贷款给别人来赚取利息
                - 银行没有钱贷出去(“钱荒“)，银行收入会下降，所以银行希望人们都能存钱
            - 债券基金(借钱给别人)
                - 80% 的钱都要投资于债券的基金
                - 主要收益来自于债券的利息和买卖债券的差价
                - 收益稳定，风险较低
                - 债券
                    - 政府、金融机构、企业在缺乏资金的时候，向社会大众借钱
                    - 借钱的欠条就是债券，上面标注了借款利息和还款时间
                    - 国家发行的债券叫做国债
                    - 金融机构发行的债券叫做金融债
                    - 企业发行的债券叫做企业债
                    - 债券内容包含债券面值(本金)，票面利率(利息)，偿还日期和发行人名称(债务人)。
            - 股票基金(股票投资)
                - 80% 的钱都用于投资股票，收益高，风险大。
                - 指数基金也是股票基金的一种，股票指数涨，指数基金就涨
                - 股票基金的收益高于债券基金、货币基金，从长期来开，股票基金可以跑赢通货膨胀，而货币基金基本跑不赢通货膨胀
            - 混合基金(混合投资)
                - 投资股票、债券、货币等市场的投资组合比较丰富的基金
                - 根据股票和债券的投资比例，混合型基金可以细分为偏股混合型基金、偏债混合基金、平衡混合型基金、灵活配置混合型基金
            - 其他分类
                - 募资类型
                    - 公募基金
                        - 向社会公开募集资金的基金，投资门槛低，适合大众投资
                        - 以非公开的方式，向特定投资者募集的基金，要求投资者具备相应的风险识别能力和风险承担能力，私募基金投资门槛较高，至少要投资 100 万元。
                - 运作方式
                    - 开放式基金
                        - 随时可以买、随时可以卖，资金流动性高，现在的基金基本是开放型基金。
                    - 封闭式基金
                        - 不允许随便买卖的基金
    - 基金定投
        - 是什么
            - 分批、定时地买基金
        - 为什么定投
            - 一次性买进，很难判断高点和低点，容易错失投资机会。
            - 定投选择一个固定的时间来分批投资，可以分散风险。
            - 平摊成本，基金净值下跌的时候，价格便宜，500 元可以购买更多的基金份额
            - 微笑曲线
                - 基金净值先跌后涨，走势曲线像一个微笑，被称为微笑曲线。
                - 波动大的基金更加适合定投。
            - 定投的秘诀是趁低价获得更多的份额，定投波动大的基金有更多的机会获得低成本筹码。
        - 智能定投
            - 根据市场行情，涨则少买，跌则多买。
            - 策略
                - 均线策略
                    - 选择沪深 300 指数的 500 日均线作为参考线，沪深 300 指数的收盘价高于 500 日均线，就少买，反之，则多买。
                    - 当前一天的收盘价高于均线，就少买，否则多买。
                    - 行情持续上涨时，盈利的金额比普通定投少。
                - 估值策略
                    - 根据指数的估值来确定是否买进该基金。
                    - 指数处于低谷就买进，高估就不买。
                    - 行情持续上涨，指数处于高估状态，会错过好行情。
    - 基金选择技巧
        - 手续费用
            - A 类基金手续费用
                - 申购费 1.5% (优惠的是海鸥低至 0.15%)
                - 赎回费 0.5% (30 天后赎回)
                - 管理费 1.5% 一年，按日收费
                - 托管费 0.25% 一年，按日收费（托管费给银行）
                - 总共 = 2.4%
            - C 类基金手续费费用
                - C 类基金没有申购费，持有满 30 天后免赎回费，但是一年要收 0.5% 的服务费。
            - 基金的命名规则
                - 基金公司 &#43; 投资方向 &#43; 基金类别 &#43; 收费类型
                - 基金名称后面带字母 A 的是 A 类基金，带字母 C 的是 C 类基金
                - A 类基金和 C 类基金没有什么差别，只是收费不同。
                - 一般建议短期买 C 类，长期买 A 类
        - 股市行情
            - 股市不好的时候（熊市），股价下跌，买股票基金就亏钱，这个时候债券基金比较合适，股市好的时候（牛市），股票基金收益可观。
            - 可以总结牛市的历史规律，一般 A 股平均每 5 年就有一次牛市。
            - 建议分批定投股票基金，一次买进债券基金。
            - 指数基金
                - 指数
                    - 股票指数简称指数，为了直观反映整个股票市场的走势，一些金融服务机构选出了一部分具有代表性的股票，通过某种方式计算出这些代表股票的综合价格数据，这个数据就是指数。
                    - 沪深 300 指数就是选取了 300 只具有代表性的股票算出来的，这个指数反映了国内股票市场的整体走势。
                    - 大盘一般指的是上证指数。
                - 指数基金指的是投资该指数成分股的基金。
                - 当身边没有人谈论股票的时候，一般意味着股市冷淡，处于熊市，这个时候开始定投指数基金，并长期持有。
                - 由于不知道股票的底在哪里，而指数的底在哪里相对明显，长期来看，指数是稳定上涨的，由于要长期持有，所以建议买 A 类基金。
        - 基金评级和风险评估
            - 基金评级
                - 由基金评级机构收集某一基金的有关信息，通过科学分析得出的对该基金的评价。
                - 常用的基金评级机构有晨星 -&gt; https://www.morningstar.cn/
                - 怎么看
                    - 基金的等级（有几颗星）
                        - 等级分为一星和五星
                    - 基金能否跑赢大盘
                        - 对比红线走势和绿线走势，看看能否跑赢大盘
                    - 能否完成其既定收益目标
                    - 风险评估
                        - 标准差
                            - 反映波动幅度
                            - 指在过去一段时间内，基金的收益率相对于预期收益率的偏差幅度。
                            - 基金回报率的波动幅度。
                            - 标准差数值越大，说明这只基金的收益率波动越大。
                            - 例如标准差为 14%，说明基金在未来一年可能上涨 14%，也可能下跌 14%。
                            - 标准差反映了收益率的波动幅度，一般被用来衡量投资风险。
                            - 在预期收益率相同的情况下，标准差大，表示收益率波动幅度大，不稳定，风险也大。
                            - 标准差小，说明收益率波动幅度小，较为稳定，风险也小。
                        - 夏普比率
                            - 夏普比率 = (预期收益率 - 无风险收益率) / 标准差
                            - 无风险收益率指的是不存在违约风险的收益率，例如国债的收益率，货币基金的收益率。
                            - 夏普比可以简单理解为投资收益和投资风险的比值。
                            - 代表每承担一个风险可以拿到的超额收益。
                            - 夏普比率越高说明该基金性价比越高。
                        - β系数
                            - 可以衡量一只基金相对于整体市场的波动情况。
                            - β系数越高，说明基金相对于整体市场的波动越大。
                            - β系数为 1，整体市场上涨/下跌 10%，该基金也会上涨/下跌 10%。
                            - β系数为 1.2，整体市场上涨/下跌 10%，该基金会上涨/下跌 12%
                            - 标准差衡量的是自身的波动，β系数衡量的是相对于整体市场的波动，是相对值。
                            - β系数受于业绩评价基准的影响，如果选取的业绩评价标准相关度低，那么β系数没有意义。
                        - α系数
                            - 是基金的超额收益和期望收益之间的差值。
                            - α系数越高，代表该基金的盈利能力越强。
                            - α系数反映的是基金经理的能力
                            - α系数 = 实际收益率 - 无风险收益率 - β系数*市场收益率
        - 基金业绩和基金经理
            - 一些基金业绩好是由于出现了巨额赎回，巨额赎回产生的手续费会增加基金财产，导致收益率暴涨。
            - 基金排行榜的流动性高，今年入榜的基金，明年一般排不上榜。
            - 选择基金，需要选择未来收益率高的基金，不是选择历史收益率高的，排行榜的参考价值有限。
            - 如果一只基金更换了基金经理，那么就算历史业绩再好，也需要警惕。
            - 基金经理如果过于频繁更换，说明基金公司的管理出现了问题，需要加倍小心。
            - 考察基金经理的要点
                - 长期绩效的稳定性，业绩好，更具有说服力。
                - 基金管理的专注度，同时管理太多基金会分散注意力。
                - 基金管理的协作性，有的基金由多个基金经理管理，相比单经理制，更有利于维持基金的稳定性。
            - 一只基金由多少钱就是基金的规模
            - 如果基金规模太小，那么运营这只基金所赚到的手续费就少，基金公司可能会亏本，导致基金清盘。
            - 基金清盘会预留时间给投资者赎回，到了清盘的时候，基金公司会按照一定的净值强制赎回，把钱还给我们。
            - 货币基金、债券基金，规模越大越好。
            - 指数基金完全跟踪指数的波动型基金，规模越大越好。
            - 主动型基金的最优规模有多种说法，一般是 20 亿 - 100 亿。
            - 指数基金不需要基金经理主动操作，所以叫被动基金，需要基金经理主动操作的叫做主动基金。
            - 选择知名的基金公司，知名的基金公司有完善是管理指定、优秀的投研团队、良好的信誉和服务。
            - 知名的基金公司有：天弘、易方达、南方、华夏、招商、嘉实、中银、广发、博时、工银瑞信、华安、汇添富、国泰、富国。
    - 指数基金
        - 巴菲特十年赌约
            - 07 年底，巴菲特认为指数基金能够跑赢其他大多数基金，发起 10 年赌约，赌注 50w 美金，对赌的是一家对冲基金公司，2017 年底，公司认输。
        - 为什么选指数基金
            - 指数基金只需要跟踪、复制指数的涨跌、保持最小的跟踪误差，不做积极管理，称为被动型基金。
            - 其他普通基金，需要基金经理通过研究、分析来组合投资、以争取超额收益，所以称为主动型基金。
            - 和主动性基金相比的优势
                - 时间越长，指数型基金的优势越明显
                - 市场涨幅越大，指数基金越有优势
                - 市场波动越大，指数基金越有优势
                - 指数基金的管理费相对更低
            - 指数分类
                - 行业指数
                    - 代表一个行业的走势，也就窄基指数
                    - 例如消费行业指数、白酒行业指数、医药行业指数、金融行业指数等。
                - 宽基指数
                    - 包含多个行业，覆盖面广，例如上证指数、沪深指数、中证指数、创业板指数。
            - 选择指数定投
                - 沪深 300 选择的是蓝筹股，规模大，交易活跃
                - 中证 500 指数选择的股票市值小，波动大，成长性高，在牛市时有更高的收益。
                - 行业指数基金的风险稍高，除了要了解估值，还要考虑行业的特性和发展周期。
                - 在众多行业里面，有两个行业有天然优势，分别是消费和医药，特点是设计刚需。
            - 什么时候买入指数基金
                - 在指数的盈利收益率大于 10% 的时候，开始定投买入，也就是在指数的低估值区域开始定投买入。
                - 市盈率 = 公司市值 / 公司盈利
                - 盈利收益率 = 公司盈利 / 公司市值
                - 盈利收益率是市盈率的倒数
                - 市盈率可以理解为：为了赚到 1 元钱，需要投入多少钱。
                - 如果市盈率是 50，那么需要投入 5 元才能赚到 1 元钱，市盈率低才值得投资。
            - 指数基金的估值
                - 指数是由一篮子股票算出来的，用这一篮子股票的数据算出一个平均值，就可以得到该指数的估值指标。
                - 只有指数型基金才有估值，而其他股票基金的持仓不固定，股票经常切换，无法算出估值。
            - 什么时候卖出指数基金
                - 当找到比手里这只指数基金风险更低、收益更高的产品，就可以卖出这只基金了。
                - 当债券基金的收益高于指数基金时，就可以卖出指数基金，买入债券基金了。
                - 国内债券的长期平均收益率大概是 6.4%，如果指数基金的盈利收益率低于 6.4%，就可以暂停定投，开始卖出。
            - 定投策略
                - 盈利收益率 &gt; 10%，开始定投
                - 当 6.4% &lt; 盈利收益率 &lt;= 10%，不买不卖
                - 当盈利收益率 &lt;= 6.4%，开始卖出
                - 价值投资策略
                    - 选择低市盈率、高盈利收益率、高股息的指数基金或股票进行投资
            - 指数红绿灯
                - 支付宝-理财-基金s-指数红绿灯，绿灯就是低估值，红灯就是高估值。
            - 指数增强
                - 指数基金的任务是跟踪、复制指数的走势，它还设定了跟踪偏离度，偏离度越低，跟踪误差越小。
                - 存在一种指数增强型的指数基金，名字一般是 xx 指数增强。
                - 指数增强型基金在跟踪指数的基础上，允许基金经理根据股市行情做一些主动操作，来提高投资回报。
            - 指数基金定投是持久战
                - 指数基金定投要以年为单位，长期定投。
                - 不要做波段操作，浪费手续费。
                - 不要预测市场，不要盲目加仓，用闲钱投资就行。
                - 不要想一夜暴富。
                - 一般 3-6 年，跨越完整牛熊周期。
    - 分析基金
        - 看看这是只什么基金
            - 一般从基金的名字就可以分辨出来
                - 小盘成长混合（混合基金）
                - 互联科技股票（股票基金）
                - 收益宝货币（货币基金）    
            - 了解基本信息（基金公司、成立时间、资产规模、行业、持仓）
            - 看看要交多少手续费（交易规则）
            - 看历史业绩和基金经理
                - 看近三年的历史业绩，对比该基金和同类基金以及沪深 300 指数的走势。
                - 基金经理，什么时候上任，管理多少基金，这些基金的收益都如何。
            - 看基金评级和风险评估
                - 夏普比例 = 0.49，表示每承担一份风险，预期会有多少的超额收益。
                - 最大回撤 = -11.7%，这只基金跌的最多的一次是跌多少。
                - 收益回撤比 = -10.09，最高收益除以最大回撤，绝对值越大越好。
            - 大概了解下股市
                - 股市走向有两种趋势：上升趋势和下降趋势，可以查看沪深 300 指数，标记各个波段高点，连成趋势线。
    - 止盈
        - 基础概念
            - 止盈就是在达到盈利目标的时候卖出基金，让收益落袋为安。
            - 止损就是在发生亏损的时候，为了防止更大的亏损而卖出基金。
        - 为什么止盈能提高收益
            - 止盈就是卖出、赎回前期买入的基金，让目前的收益落袋为安。
        - 什么时候止盈
            - 一般在定投扣款 10 次以后开始止盈。
        - 止盈方法
            - 指数估值法：针对指数基金，根据指数估值来止盈，低估值买，高估值卖。
            - 技术指标法：通过分析股市的各种技术指标来判断卖出时机，也就是根据历史数据来判断股市走向。但是有一定滞后性，且对投资者要求较高。
            - 目标收益法：达到收益目标后就止盈，适合波动大的基金。
            - 市场情绪法：大家都在讨论股票的时候，股票可能就要跌了，这个时候就要卖出股票基金。
        - 目标收益率
            - 一般设置收益率为 15%~20%，基金的年收益目标应该大于 8%。
        - 达到目标怎么卖
            - 对应目标估值法，全部卖出。
            - 对应指数估值法，分批卖出。
        - 止盈后，是否要继续定投
            - 复利效应，把止盈后赚到的钱分成多份，加上原来的定投金额，作为新的定投金额，继续坚持定投，达到收益目标后，再止盈，再定投。
        - 自动止盈
            - 目标止盈：通过支付宝设置自动止盈，达到收益率目标后，自动止盈，适合股票型基金。
            - 移动止盈：达到收益率目标，如果继续上涨，那么就继续持有，如果出现回撤，那么就止盈卖出，适合单边上涨行情，定投大盘指数可以考虑移动止盈。
    - 货币基金
        - 货币基金≠存钱
            - 货币基金除了存钱到银行，也会投资短期债务、央行票据等低风险产品。
            - 货币基金风险低，流动性高。
            - 货币基金每天赚到的钱，都会以红利再投资的方式转换为基金份额，拥有多少基金份额就拥有多少资产，货币基金的净值一般是 1 元。
        - 余额宝
            - 余额宝本质是货币基金，货币基金的赎回一般是要到第二个工作日才能完成，之所以能快速转出余额宝，是由于他们先垫钱了。
        - 货币基金不保本
            - 如果货币基金遇到了巨额赎回，又没有足够的现金储备，就要不计成本地卖债券来凑钱，从而出现短期亏损。
        - 7 日年化收益率
            - 7 日年化收益率是根据最近 7 天的收益情况来算出未来一年的收益率。
            - 7 日年化收益率 = 7 日总收益率 / 7 * 365
        - 万份收益
            - 指投资 1 万元买货币基金，一天能取得的收益，这个收益每天都不同。
        - 不能完全信任 7 日年化
            - 货币基金可能会卖掉一些债券或者大额存单到期了，导致 7 日年化收益上升。
        - 货币基金如何选
            - 选择规模大的基金，至少 100 亿元以上。
            - 选择万份收益稳定的基金。
            - 选择流动性好的基金。
    - 债券
        - 债券本质上是政府、金融机构、企业的欠条。
        - 分类
            - 纯债基金
                - 只在债券市场混，不打新股，不买股票，风险最小。
            - 一级债券基金
                - 除了投资债券，也参与打新股来赚额外收入，但是国家目前不允许打新股了，所以目前和纯债基金没有区别。
            - 二级债券基金
                - 除了投资债券，还会投资股票，风险会高
            - 可转债券基金
                - 投资可转换债券，股市好的时候，就转债为股票，股市不好的时候，一直等到之前到期。
                - 可转债是上市公司发行的一种债券，买了该债券后，可以持有到到期，等待还本付息，也可以在期限内把债券转换成该公司的股票。
        - 债券公司如何赚钱
            - 收利息
                - 债券本质就是欠条，借钱给别人需要收取利息。
            - 赚差价
                - 债券也是证券，会有价格波动，根据债券的价格波动，低买高卖，就可以赚差价。
            - 投资股票
                - 二级债券基金可以投资一点股票，在股市上赚钱。
        - 债券价格如何波动
            - 如果债券价格从 100 跌到了 90，不代表最终到期后只会还你 90，只是现在你可以用 90 买到 100 块钱的债券
            - 债券的价格会跌，主要是由于银行利率上涨，如果银行的存款收益比债券收益还高，人们会贱卖债券，把钱存到银行，换取高一点的利息
        - 久期
            - 久期是债券专用名词，是资金回款的加权平均时长，可以理解为收回全部本金和利息的平均时间。
            - 久期越长的债券，越害怕银行加息，导致债券价格下跌。
        - 国债收益率
            - 国债也是债券，是国家以政府信用为担保的债券，可以把国债理解为无风险资产。
            - 国债收益率是买了国债并持有到到期的年平均收益率。
            - 经济不好时，人们会倾向于购买国债，国债价格会上涨，导致收益率下降。
        - 什么时候买债券基金
            - 债券基金对银行利率比较敏感，加息周期，利率上升，债券基金的表现不好。降息周期，债券基金的成绩就不错。
        - 建议购买纯债基金
            - 买债券基金是由于其收益稳健，可以有效规避股市风险。
            - 如果想要追求高收益，可以用一部分钱定投股票基金或者混合型基金。
        - 可转债
            - 可转债是可以转换成股票的债务
            - 发行可转债是上市公司融资的一种手段
            - 每张可转债都对应着一家上市公司的股票
            - 由于转股价是定好的，将来可以换持的股票也是固定的
            - 股票涨了，一张可转债可以换到更值钱的股票
            - 股票跌了，只要公司不破产违约，可转债也能控制价格
            - 可转债赚钱
                - 打新债。相对于打新股要求更低，中签率更高。
                - 低买高卖，赚取差价。
                - 等待牛市。
            - 可转债的利息相比普通债券较低，加上债主一般会转换成股票，所以上市公司为了不还钱，发行可转债。
    - 混合型基金
        - 仓位灵活
            - 混合型基金仓位更加灵活，可以轮流赚取股债收益。
        - 更依赖基金经理
            - 混合型股票更依赖基金经理的择时能力和管理模式
    - 分散投资
        - 多元分散
            - 时间分散：定投
            - 市场分散：分散投资不同种类、不同行业、相关性低的资产。
        - 每单位风险收益率
            - 每单位风险收益率 = 总收益率 / 总风险
        - 指数基金 &#43; 债券基金
            - 股票市场和债券市场规模巨大，且相关性低，风险和回报也不同，收益率水平呈现负相关，同时投资股票和债券市场，可以有效分散风险。
            - 以指数基金为主，债券基金为辅
            - 沪深 300 &#43; 中证 500
                - 沪深 300 是大盘指数，价值性高
                - 中证 500 是小盘指数，成长性高，两者成分股不重叠，行业权重不同，相关性低。
            - 宽基指数 &#43; 行业指数
        - 不同人生阶段配置不同资产
            - 越年轻，越选用进取型资产
        - 美林投资时钟理论
            - 由美林证券提出，把宏观经济周期与资产配置、行业轮动联系起来
            - 根据经济发展趋势与通货膨胀，把经济周期划分为 4 个阶段：复苏阶段、过热阶段、滞涨阶段和衰退阶段
            - ![](https://an-img.oss-cn-hangzhou.aliyuncs.com/2026/01/29/20260129124341548.png,180,120)
            - GDP 国内生产总值，CPI 居民消费价格指数。
            - ![](https://an-img.oss-cn-hangzhou.aliyuncs.com/2026/01/29/20260129124640364.png,360,120)
            - 可以根据 CPI、GDP 等宏观经济指标大概判断将要到来的经济周期。
        - 定期再平衡
            - 由于投资组合的涨跌幅不一致，导致资产比例不一致，可以卖掉一部分涨的高的，买进一部分涨的少的，这就是定期再平衡。
            - 一般一年或者半年进行一次定期再平衡。
    - 制定定投计划
        - 明确自身的风险承受能力
        - 明确投资目的
        - 选择投资组合
        - 计算定投金额
            - 定投金额 &lt; (每月收入 - 每月支出) / 2
            - 不要借贷来定投
        - 做好止盈，定期优化
    - 财务自由
        - 是什么
            - 财务自由 = 被动收入 &gt; 日常支出
            - 被动收入是不需要工作就能获得的收入，例如理财收益、股票分红、租金收入、专利版权收入
        - 需要多少钱
            - 假设月支出 4500 元，一年共花费 7 万
            - 也就是有 175 万元就能实现简单的财富自由
        - 跑赢 CPI、跑赢 GDP、跑赢 M2
            - CPI 就是居民消费价格指数
            - CPI 反映的是市场上生活消费品的价格增长率，CPI 增长了 3%，就是说物价上涨了 3%
            - CPI 通常被作为观察通货膨胀水平的重要指标，追上 CPI 就相当于追上了通货膨胀。
            - 实际收益率 = 年化收益率 - CPI 增长率
            - GDP 是国内生产总值
            - GDP 指的是一定时期内在一个国家或地区生产出来的所有最终产品或服务的总价。
            - M2 是一个货币供应量的指标，可以理解为流通中的现金 &#43; 存款，反映了现实的购买力和潜在的购买力。
            - 如果追上了 M2 的增长率，相当于追上了国家印刷钞票的速度。
        - 劳动收入和投资收入
            - 劳动收入呈对数增长，前期增长快，后期增长慢，甚至下滑
            - 投资收入有复利效果，呈现指数增长，前期增长慢，后期增长快。
    - 其他基金
        - 保本基金
            - CPPI 恒定比例投资组合保险策略
                - 控制好无风险资产和风险资产的比例
            - 保本基金保本周期一般为 2、3、5 年，需要在募集期买入，并持有到到期，才可以保本。
        - 打新基金
            - 打新就是，打新股，申购新股
            - 新股申购中签的话，会有很高的收益
            - 和个人投资者相比，基金机构打新股更容易中签
            - 打新基金是专门靠打新博取高收益的基金，他们一般是灵活配置混合型基金或者是偏债混合型基金。
            - 打新基金就相当于是增强的债券基金
        - QDII 基金
            - 资本自由流动
                - 指无需政府批准，个人或机构可以根据汇率自由兑换本币与外币，自由地把钱汇出国外或者把钱转入到国内。
                - 会影响货币政策的独立性，破坏汇率的稳定。
                - 为了保证货币政策的独立性和汇率的稳定性，我国实行的是有管制的自由流动，每个公民一年只有 5 万美元的外汇额度。
            - QDII 制度
                - 全称 Qualified Domestic Institutional Investor，即合格境内机构投资者。
                - 持有 QDII 通行证的机构投资者可以投资境外证券市场。
                - QDII 基金就是可以投资境外市场的基金。
                - 通过 QDII 基金，可以配置海外资产，进一步分散风险。
                - 常见的基金有标普 500 指数基金。
    - 其他问题
        - 基金亏损，不要停止定投，再等开始上升时再买进。
        - 基金定投的意义就是平摊成本，降低风险，在低位积累筹码，高位卖出，跑出微笑曲线。
        - 对于宽基指数，越跌越买。
        - 基金赚了一点，也不急卖出，而是坚持定投，等到满足止盈条件后再卖出。
        - 定投时间不是越长越好，要做好止盈。
        - 由于我们无法判断行情的准确走势，而行情往往是波动的，所以基金定投比一次性买入要好点。
        - 债券基金由于波动小，定投的意义不大，不如一次性买入
        - 现金分红
            - 把基金赚到的钱，按时自动发到账户中，然后继续用本金投资。
            - 红利再投资，把赚到的钱直接转换为该基金的持有份额
        - 定投日大涨，可以继续定投，如果停止了，反而会失去低成本的筹码
        - 基金净值
            - 同基金单位净值，每份基金的价格，基金公司在每天收市后会公布当天的基金净值。
            - 下午 3 点钱申购的基金，会以当天的净值买入，否则会以第二天的静值买入。
        - 基金定投越早越好
