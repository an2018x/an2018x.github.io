<img loading="lazy" decoding="async" src="https://an-img.oss-cn-hangzhou.aliyuncs.com/2025%2F10%2F0420251004165716.png" alt></button></figure></p><h1 id="数据范围">数据范围</h1><p><figure class="post-image"><button class="image-open" type="button" aria-label="查看大图">

<img loading="lazy" decoding="async" src="https://an-img.oss-cn-hangzhou.aliyuncs.com/2025%2F10%2F0420251004165924.png" alt></button></figure></p><p>7 个字符可以满足所有的 URL 需求。</p><h1 id="哈希转换">哈希转换</h1><p><figure class="post-image"><button class="image-open" type="button" aria-label="查看大图">
<img loading="lazy" decoding="async" src="https://an-img.oss-cn-hangzhou.aliyuncs.com/2025%2F10%2F0420251004170017.png" alt></button></figure></p><p>问题：</p><p>使用 MD5-HASH 得到的字符串仍然过长：</p><p><figure class="post-image"><button class="image-open" type="button" aria-label="查看大图">
<img loading="lazy" decoding="async" src="https://an-img.oss-cn-hangzhou.aliyuncs.com/2025%2F10%2F0420251004170134.png" alt></button></figure></p><p>如果只取前几位的话，有很大的概率会冲突，这就需要查询之前生成过的 url。</p><h1 id="顺序计数">顺序计数</h1><p><figure class="post-image"><button class="image-open" type="button" aria-label="查看大图">
