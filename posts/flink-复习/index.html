nction(){checkTocPosition()},!1),window.addEventListener("scroll",()=>{const e=window.pageYOffset||document.documentElement.scrollTop;if(e===0)return;elements&&elements.length>0&&(activeElement=Array.from(elements).find(t=>{if(getOffsetTop(t)-e>0&&getOffsetTop(t)-e<window.innerHeight/2)return t})||activeElement,elements.forEach(e=>{const n=encodeURI(e.getAttribute("id")).toLowerCase(),t=document.querySelector(`.inner ul li a[href="#${n}"]`);if(e===activeElement){t.classList.add("active");const e=document.querySelector(".toc .inner"),n=t.offsetTop,s=e.clientHeight,o=t.clientHeight,i=n-s/2+o/2;e.scrollTo({top:i,behavior:"smooth"})}else t.classList.remove("active")}))},!1);const main=parseInt(getComputedStyle(document.body).getPropertyValue("--article-width"),10),toc=parseInt(getComputedStyle(document.body).getPropertyValue("--toc-width"),10),gap=parseInt(getComputedStyle(document.body).getPropertyValue("--gap"),10);function checkTocPosition(){const e=document.body.scrollWidth;e-main-toc*2-gap*4>0?document.getElementById("toc-container").classList.add("wide"):document.getElementById("toc-container").classList.remove("wide")}function getOffsetTop(e){if(!e.getClientRects().length)return 0;let t=e.getBoundingClientRect(),n=e.ownerDocument.defaultView;return t.top+n.pageYOffset}</script><div class=post-content><h1 id=flink-整体认知>Flink 整体认知<a hidden class=anchor aria-hidden=true href=#flink-整体认知>#</a></h1><div id=me_0 class=mindelixir-container style=height:860px;width:100%></div><script type=application/json id=me_0_src>"\"- Flink 整体认知\\n    - 认识 Flink\\n        - Flink 是什么\\n            - Flink 是一个对于有界和无界数据流进行有状态计算的框架和分布式处理引擎\\n            - 框架：Flink 不是一个单独的软件命令，而是一套开发 + 运行的系统\\n        - Flink 和 Hadoop/Spark/Storm 的区别\\n            - 基本定义\\n                - Hadoop 是什么\\n                    - 大数据基础设施体系\\n                    - HDFS：分布式存储\\n                    - MapReduce：离线批处理计算\\n                    - YARN：资源管理\\n                    - 早期大数据时代的“存储+资源管理+离线计算“基础平台\\n                - Spark 是什么\\n                    - 通用的大数据计算引擎\\n                    - 流处理主要通过 Structured Streaming\\n                    - 更偏通用分析平台，批处理很强，流处理也能做\\n                - Storm 是什么\\n                    - 是一个分布式实时计算系统\\n                    - 较早一代的纯流式处理框架，比 Flink 早\\n            - 比较维度\\n                - 主要定位\\n                    - Hadoop\\n                        - 海量数据存储\\n                        - 离线批处理\\n                        - 高吞吐，不强调低延迟\\n                    - Spark\\n                        - 通用大数据引擎\\n                        - 强批处理\\n                        - 可扩展到 SQL、ML、Streaming\\n                    - Flink\\n                        - 有状态流处理\\n                        - 事件时间\\n                        - 流批统一\\n                        - 更强实时计算语义\\n                - 处理模型\\n                    - Hadoop: Batch\\n                        - 读一批数据-\\u003emap-\\u003eshuffle-\\u003ereduce-\\u003e输出结果\\n                    - Spark: Batch + Micro-batch\\n                    - Flink: Native Streaming，批流统一\\n                - 延迟特征\\n                    - Hadoop\\n                        - 延迟高，通常分钟级甚至更长\\n                    - Spark\\n                        - micor-batch 延迟比原生流高一点\\n                    - Flink\\n                        - 低延迟实时计算\\n                - 状态能力\\n                    - Hadoop\\n                        - 不擅长生命周期有状态流计算\\n                    - Spark\\n                        - 能做状态处理，但不是以 stateful streaming 为核心\\n                    - Flink\\n                        - stateful computations over data streams\\n                        - exactly-once state consistency\\n        - 什么是批处理、流处理、实时计算\\n            - 批处理\\n                - 定义：先把一段时间内的数据收集起来，等数据攒够一批后，再统一进行计算\\n                - 特点：先到齐，再处理、延迟高、吞吐高、程序有结束点\\n            - 流处理\\n                - 定义：把数据看成一个持续到来的事件流，数据一到，系统就持续处理\\n                - 特点：连续不断、持续进行、低延迟、要处理历史记忆\\n            - 实时计算\\n                - 定义：从数据产生，到计算结果可用，时间尽可能短\\n                - 实时计算不是来了就必须零延迟，而是在业务可接受的时间范围内尽快给出结果\\n        - Flink 的应用场景\\n            - 事件驱动应用\\n                - 系统不是定时查数据库，而是收到事件才触发计算、状态更新或外部动作\\n                - 典型业务\\n                    - 欺诈检测\\n                    - 异常检测\\n                    - 规则告警\\n                    - 业务流程监控\\n            - 数据分析应用\\n                - 从原始数据中提取信息和洞察\\n                - 典型业务\\n                    - 每分钟订单量\\n                    - 热门榜单\\n                    - 实时数仓\\n                    - 离线 + 实时一体分析\\n            - 数据管道与 ETF\\n                - 从上游系统读数据，做清洗、转换、补全、标准化、过滤、路由，再写到下游系统\\n                - 典型业务\\n                    - Kafka 到 Kafka\\n                    - Kafka 到数据库/搜索引擎/湖仓\\n                    - CDC + 实时同步\\n    - Flink 基本架构\\n        - JobManager、TaskManager\\n            - 最小 Flink 集群\\n                - ![](https://an-img.oss-cn-hangzhou.aliyuncs.com/2026/03/24/20260324174529584.png,474,301)\\n                - 在本地或某台机器上提交作业\\n                - JobManager 接收这个作业，分析要怎么跑\\n                - 把真正要执行的子任务分发给多个 TaskManager\\n                - TaskManager 在各自机器上并行处理数据\\n            - 什么是 JobManager\\n                - 是 Flink 集群的控制中心\\n                - 负责接收/解析/调度/监控/作业、协调故障恢复、管理元信息\\n            - 什么是 TaskManager\\n                - 是 Flink 集群里真正干活的 worker\\n                - 主要负责执行子任务/占用和提供计算资源/与其他 TaskManger 传输数据/向 JobManager 汇报状态\\n        - Slot 是什么\\n            - 定义\\n                - Flink 用 Slot 告诉调度器：这台 TaskManager 最多能接多少份执行任务\\n            - 为什么需要 Slot\\n                - 控制一个 TaskManager 能接多少任务\\n                - 做资源切分\\n                - 在隔离与利用率之间做平衡\\n            - Slot 和 TaskManager 的关系\\n                - 一个 TaskManager 可以有多个 Slot\\n                - Slot 是 TaskManager 提供给集群调度的执行容量\\n                - Slot 是资源申请和任务放置的基本单位之一\\n            - Slot 和并行度的关系\\n                - 并行度指的是一个算子会拆成多少个并行子任务\\n                - 执行这些子任务需要 Slot\\n                - 在默认 slot sharing 开启时，作业大致需要的 slot 数 = 该作业的最高并行度\\n        - JobGraph、ExecutionGraph\\n            - 什么是 JobGraph\\n                - Flink 作业的逻辑图/逻辑执行计划\\n                - JobGraph 里面的点，叫做 JobVertex，它是一个逻辑阶段/一个逻辑算子节点\\n                - JobGraph 不强调每个并行子任务\\n            - 什么是 ExecutionGraph\\n                - 是 JobGraph 经过并行展开后的实际执行拓扑\\n                - ExecutionGraph 的核心点是 ExecutionVertex\\n        - 并行度是什么\\n            - 本质\\n                - Flink 算子可以想象成一个类似读 Kafka/做 map 转换/做窗口聚合的工作\\n                - 并行度决定一个算子会被拆分成几个 subtask 一起做\\n            - 为什么需要并行度\\n                - 一份工作只让一个实例做，处理能力有限\\n                - 提高并行度，本质就是把工作拆开，让多个 subtask 同时处理\\n        - 一个 flink 作业如何运行起来\\n            - 总流程\\n                - 写 Flink 程序，调用 execute()\\n                - Client 负责提交作业\\n                - 程序先形成逻辑数据流图\\n                - JobManager 接收作业\\n                - JobManager 把 JobGraph 转成 ExecutionGraph\\n                - 调度器根据并行度和可用 slot 做任务部署\\n                - TaskManager 真正执行 subtask\\n                - 运行中持续监控、处理状态、必要时恢复故障\\n            - 编写代码时，发生了什么\\n                - 写的是逻辑处理链路，不是真正的分布式执行指令\\n                - 调用 execute() 后，作业才真正进入提交流程\\n            - Client 做了什么\\n                - Client 是提交入口，负责将应用提交到集群\\n                - Client 不是主要计算节点\\n            - JobGraph 在什么时候出现\\n                - 代码先被整理为数据流图，也就是 JobGraph\\n                - JobGraph 偏逻辑层，还没有真正展开成每个 subtask，不是最终的并发执行形态\\n            - JobManager 接手后做什么\\n                - 接收作业\\n                - 管理作业生命周期\\n                - 把逻辑图变成执行图\\n                - 协调资源和任务部署\\n            - Execution Graph 怎么来的\\n                - ExecutionGraph 是 JobGraph 的并行化版本\\n                - 并行度在这里真正展开\\n                - 运行状态也在这里变得具体\\n            - 调度阶段发生什么\\n                - 要跑多少个 subtask\\n                - 这些 subtask 放到哪些地方跑\\n                - 数据怎么在它们之间流动\\n            - slot 发挥什么作用\\n                - TaskManager 提供 slots\\n                - 调度器找空闲 slot\\n                - 默认 slot sharing 会影响所需 slot 数\\n            - TaskManager 真正干活时发生了什么\\n                - TaskManager 执行 subtask\\n                - 每个 subtask 处理自己那部分的输入数据\\n                - 上下游 subtask 之间可能发生网络传输\\n                - 状态、窗口、定时器等能力都在这里真正运作\\n            - 作业运行中，JobManager 还在做什么\\n                - 跟踪任务状态\\n                - 监控资源与任务健康情况\\n                - 失败时触发恢复\\n            - 作业失败了会怎样\\n                - JobManager 感知失败\\n                - 调度器决定如何恢复\\n                - TaskManager 上的任务可能被重新部署\""</script><script>(function(){if(typeof MindElixir=="undefined"){console.error("MindElixir not loaded. Check your CDN script tag.");return}const n="me_0";let e=JSON.parse(document.getElementById(n+"_src").textContent);function s(){return"n_"+Math.random().toString(16).slice(2)+Date.now().toString(16)}function a(e){const o=e.split(/\n/).map(e=>e.replace(/\s+$/g,"")).filter(e=>e.trim().length>0);console.log(o);const t=[];let n=null;for(const u of o){const r=u.match(/^(\s*)([-*+])\s+(.*)$/);if(!r)continue;const h=r[1].replace(/\t/g,"  ").length,d=Math.floor(h/2);let e=r[3].trim(),c=null;const l=e.match(/^(.*?)(?:\s*->\s*)(https?:\/\/\S+)\s*$/);l&&(e=l[1].trim(),c=l[2].trim());const i={id:s(),topic:e,children:[]},a=e.match(/!\[\]\(\s*([^,\]]+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)\s*$/i);if(a){const t=a[1].trim(),n=Number(a[2]),s=Number(a[3]);e=e.replace(a[0],"").trim(),i.topic="",i.image={url:t,width:n,height:s}}if(c&&(i.hyperLink=c),!n){n=i,t.push({level:0,node:n});continue}for(;t.length&&t[t.length-1].level>=d;)t.pop();const m=t.length?t[t.length-1].node:n;m.children.push(i),t.push({level:d,node:i})}return n||{id:s(),topic:"Empty",children:[]}}e=JSON.parse(e),console.log(e);const t=a(e);console.log(t);const o={nodeData:{id:t.id,topic:t.topic,root:!0,children:t.children||[]},arrows:[],summaries:[],direction:2};console.log(o);const i=window.MindElixir?.default??window.MindElixir;if(typeof i!="function"){console.error("MindElixir loaded but not a constructor. window.MindElixir =",window.MindElixir);return}const r=new i({el:"#"+n});r.init(o)})()</script></div><footer class=post-footer><ul class=post-tags></ul></footer></article></main><footer class=footer><span>
