baseURL: https://blog.ans20xx.com
title: 安橙的博客
defaultContentLanguage: zh

pagination:
  pagerSize: 10

menus:
  main:
    - {name: 博文, url: /posts/, weight: 1}
    - {name: 标签, url: /tags/, weight: 2}
    - {name: 搜索, url: /search/, weight: 3}

markup:
  highlight:
    codeFences: false
  tableOfContents:
    startLevel: 1
    endLevel: 4
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]']]
          inline: [['\(', '\)']]
    renderer:
      unsafe: true

params:
  description: 👋 欢迎来到我的博客

outputs:
  home: [HTML, RSS]
  section: [HTML]
  taxonomy: [HTML]
  term: [HTML]
